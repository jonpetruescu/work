<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: this page may not load anything over the network or send anything anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeroom tracker</title>
<style>
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
  --ink:#1C2433; --muted:#566074; --faint:#626B7D; --rule:#A3ACBA; --bar:#24324D;
  --ok:#1D6F47; --ok-bg:#DFF1E7; --fin:#11636C; --fin-bg:#D8EFF1;
  --instr:#C9DAF8; --support:#FFF2CC;
  --loss-before:#CB7E6B; --loss-out:#5346A7; --loss-after:#837120; --loss-absent:#8E3642;
  --late:#8F4B00; --late-bg:#FBE8D2;
  --bad:#A8231A; --bad-bg:#FADFDB;
  --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Five text sizes: notes, small text, body, headings, page titles */
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem;
  /* The Overview's colors: the teacher's own */
  --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-none:#E3E5E8; --ov-ink:#1C2433;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;   /* the browser's own boxes, lists and scroll bars are dark too */
    --paper:#121822; --surface:#19212E; --line:#2B3546; --grid:#222B39;
    --ink:#E5E9F1; --muted:#A4AEBF; --faint:#8C96A8; --rule:#4E5A6E; --bar:#A9C2F5;
    --instr:#2C3D61; --support:#4A4123;
    --loss-before:#A05B11; --loss-out:#6863B1; --loss-after:#A19500; --loss-absent:#D1717A;
    --ok:#74D3A2; --ok-bg:#163428; --fin:#7FD3DB; --fin-bg:#14363A; --late:#F2B36B; --late-bg:#3D2A12;
    --bad:#F28B82; --bad-bg:#40201D;
    --focus:#7FA8FF; --btn:#A9C2F5; --btn-ink:#121822;
    --ov-engaged:#5E8F4B; --ov-excused:#4C78C4; --ov-idle:#C2A23A; --ov-away:#97577A; --ov-absent:#B44A4A; --ov-none:#262F3D; --ov-ink:#10151E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header: the name and privacy line on the left, the folder on the right, the tabs below */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 0 4px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;flex:none;max-width:100%}
.brand h1{font-size:var(--fs-lg);line-height:1.2;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.folder #reopen{min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder{margin-left:auto;display:flex;flex:1 1 0;min-width:0;justify-content:flex-end;flex-wrap:nowrap;align-items:center;gap:12px;white-space:nowrap}
.folder .where{color:var(--muted);font-size:var(--fs-sm);margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder .where b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:var(--fs-md)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:3px 9px;font-size:var(--fs-sm);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.folder .btn{height:32px;padding:0 14px;font-size:.875rem}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{flex:none;background:none;border:0;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-md);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
.savebar{font-size:var(--fs-sm);color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.savebar .linkish{color:var(--muted)}
.savebar .saved{color:var(--ok)}
.savebar .btn.warn{background:var(--late);border-color:var(--late);color:var(--surface)}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}
.helpbtn{align-self:center;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);cursor:pointer}
.helpbtn:hover{border-color:var(--muted)}
.helpbtn b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bar);color:var(--btn-ink);font-size:.75rem}

main.wrap{padding:22px 20px 60px}
.notice{border:1px solid var(--line);border-left:4px solid var(--late);background:var(--surface);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:var(--fs-md)}
.notice.info{border-left-color:var(--bar)}
.notice ul{margin:6px 0 0;padding-left:20px}
/* Messages float over the bottom corner, so nothing on the page moves when one comes or goes. */
#status{position:fixed;right:24px;bottom:24px;z-index:25;max-width:420px}
#status .notice{display:flex;align-items:baseline;gap:12px;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#status .linkish{margin-left:auto;flex:none}
#status .notice .linkish + .linkish{margin-left:12px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}

/* Start screen and set-up steps */
.start{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px;max-width:760px;margin-bottom:16px}
.start h2{font-size:var(--fs-xl);margin-bottom:6px}
.start ol{padding-left:22px;margin:14px 0 18px}
.start li{margin:8px 0}
.start .lead{font-size:var(--fs-md);margin:0 0 16px}
.start h3{font-size:var(--fs-md);font-family:var(--sans);margin:20px 0 0}
.start .actions{margin-top:0}
.startsetup{margin-top:18px}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps > li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--grid)}
.steps > li:first-child{border-top:0}
.steps .stepn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:var(--fs-sm);color:var(--muted)}
.steps > li.done .stepn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps > li.now .stepn{border-color:var(--bar);color:var(--ink)}
.steps > li.later{color:var(--muted)}
.steps details ol{margin:6px 0 0;padding-left:20px;font-size:var(--fs-sm)}
.steps details li{margin:3px 0}
.steps p{margin:2px 0 0;font-size:var(--fs-sm)}
.steps .actions{margin-top:8px}
.steps details{margin-top:8px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.demo-bar .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:auto}

/* Toolbar: one even 32px strip with one text size. Controls inside a popover keep their own sizes. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar > *{flex:none}
.toolbar .grow{flex:1 1 0}
.toolbar .tbend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;max-width:100%}
.toolbar :is(.search,.btn,summary.btn,select):not(.pop *){height:32px;font-size:var(--fs-sm)}
.toolbar :is(.btn,summary.btn):not(.pop *){display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 12px;cursor:pointer;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;min-width:220px}
.toolbar .search{width:200px;min-width:0;padding:0 10px}
.sortby{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sortby select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}
.listinfo{font-size:var(--fs-sm);color:var(--muted);margin:0 0 10px}

/* Date range: three presets and a "Custom dates…" menu in one segmented control, which never changes size. */
.seg.range{overflow:visible;flex-wrap:wrap;max-width:100%}
.seg.range > :first-child{border-radius:6px 0 0 6px}
.rangemenu > summary{display:block;width:10.5em;height:30px;line-height:30px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-sm);border-radius:0 6px 6px 0}
.rangemenu > summary.on{background:var(--bar);color:var(--btn-ink)}
.seg.range .pop{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.range label{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.range input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}

/* Small menus that open over the page, so nothing under them moves */
.menu{position:relative;display:inline-block}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column;gap:2px}
.menu .pop p{margin:0}
.dropline{display:flex;align-items:center;gap:8px;white-space:nowrap}
.menu input[type=date],.menu input[type=text]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.menu.formmenu .pop{width:460px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.formmenu label{display:grid;gap:3px;font-weight:600}
.formmenu label input{font-weight:400}
.menumsg{min-height:1.4em;color:var(--bad)}

/* Tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tablewrap.schwrap{overflow:visible}
table.sum{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
table.sum th{font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.sum tr:last-child td{border-bottom:0}
table.sum .num{text-align:right;white-space:nowrap}
table.sum .zero{color:var(--faint)}
table.sum .sub{display:block;font-size:var(--fs-sm);color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
.meter .fill{display:block;height:100%;background:var(--bar)}
.meter b{font-weight:600;min-width:38px;text-align:right}
.chip{display:inline-block;font-size:var(--fs-xs);font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap;vertical-align:1px}
.chip.due{background:var(--bad-bg);color:var(--bad)}
.chip.left{background:var(--grid);color:var(--muted)}
.chip.need{background:var(--late-bg);color:var(--late)}
.name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--ink)}
.nmline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.linkish{position:relative;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:var(--fs-sm)}
.linkish:hover{color:var(--ink)}
.linkish:disabled{color:var(--faint);cursor:default;text-decoration:none}
/* Text links get a hit area of at least 24px, so they're as easy to click as buttons, without moving anything. */
.linkish::after{content:"";position:absolute;inset:-5px -3px}
.subhead{font-family:var(--serif);font-size:var(--fs-lg);margin:22px 0 8px}

/* Panels (Setup, Study hall) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.panel h2{font-size:var(--fs-lg);margin-bottom:6px}
.panel > p{margin:0 0 10px}
.stack > * + *{margin-top:16px}
.two{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.1fr);gap:24px;align-items:start}
.set{display:grid;grid-template-columns:minmax(0,max-content) 64px minmax(0,max-content);gap:10px;align-items:center}
.set input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:64px}
.set .unit{color:var(--muted);font-size:var(--fs-sm)}
.setgrid{display:grid;grid-template-columns:max-content max-content;gap:10px 14px;align-items:center}
.setgrid input,.setgrid select,.settext input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;height:34px}
.setgrid input[type=time],.setgrid select{width:9.5em}
.settext{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 14px;align-items:center;max-width:620px}
.settext input{width:100%}
.wdays{display:flex;gap:14px;flex-wrap:wrap;border:0;margin:0;padding:0}
.wdays legend{padding:0;margin-bottom:4px;font-size:var(--fs-sm);color:var(--muted)}
.wdays label{display:inline-flex;gap:6px;align-items:center}
.psub{font-family:var(--sans);font-size:var(--fs-sm);font-weight:600;margin:12px 0 0}
.psub:first-child{margin-top:0}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-md);min-height:36px}
.list li > span:first-child{flex:1;min-width:0}
.list .when{color:var(--muted);font-size:var(--fs-sm);margin-left:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px;font-size:var(--fs-sm);line-height:1.4;resize:vertical}
textarea.stupaste{min-height:190px}
.lbl{display:block;font-weight:600;font-size:var(--fs-sm);margin-bottom:4px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.inl{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-sm)}
.inl input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font-size:var(--fs-sm)}
.formmsg{height:3em;overflow:hidden;margin:6px 0 0;font-size:var(--fs-sm)}
.formmsg.bad{color:var(--bad)}

/* Log a meeting: one row, always there, so nothing moves when it's used */
.logform{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-end}
.logform label{display:grid;gap:3px;font-size:var(--fs-sm);font-weight:600}
.logform label.grow{flex:1;min-width:0}
.logform select,.logform input{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 7px;font-size:var(--fs-sm);font-weight:400}
.logform select{width:13em}
.logform .btn{height:30px;flex:none}
.logform.na{visibility:hidden}
.logpanel{margin-bottom:16px;padding:16px 20px 10px}
.logpanel h2{margin-bottom:2px}
.logpanel > p{margin:0 0 10px}

/* Meetings list */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:5.2em minmax(9em,max-content) minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.mlist li:last-child{border-bottom:0}
.mlist li.none{display:block;color:var(--muted)}
.mlist .when{color:var(--ink);font-weight:600}
.mlist .how{color:var(--muted)}
.mlist .txt{min-width:0;overflow-wrap:anywhere}

/* Study hall switch: a menu that asks for the date, opening over the page */
.shgrid th.shc,.shgrid td.shc{text-align:center;padding-left:4px;padding-right:4px;min-width:52px}
.shgrid th.shc{font-size:var(--fs-xs);line-height:1.25}
.shgrid th.shc span{display:block;color:var(--muted);font-weight:500}
.shgrid th.shc .shn{color:var(--ink);font-weight:700;margin-top:2px}
.shgrid .shc.next{background:var(--paper)}
.shgrid th.shc.next{color:var(--focus)}
.shgrid .shbox{display:inline-flex;align-items:center;justify-content:center;width:30px;height:24px;border-radius:4px;cursor:pointer}
.shgrid .shbox input{width:16px;height:16px;margin:0;accent-color:var(--focus);cursor:pointer}
.shmenu > summary{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 2px;cursor:pointer;border-radius:999px;font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.shmenu > summary:hover .swt{box-shadow:0 0 0 3px var(--grid)}
.swt{position:relative;display:inline-block;width:36px;height:20px;border-radius:999px;background:var(--rule);flex:none}
.swt::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.shmenu.on .swt{background:var(--ok)}
.shmenu.on .swt::after{left:18px}
.swl{display:inline-block;width:2em}
.shmenu .pop{width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.plist{list-style:none;margin:6px 0 0;padding:0}
.plist li{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm);min-height:40px}
.plist input,.paddrow input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.plist label,.paddrow label{display:inline-flex;gap:6px;align-items:center}
.paddrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:var(--fs-sm)}

/* Student page */
.sreport{max-width:960px}
.rbar [data-studentback]{min-width:9em}
.rbar .pn{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.rbar .pn > span{min-width:4.5em;text-align:center}
.toolbar.rbar .pn .btn{display:block;width:130px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .pnx{width:130px}
.rhead,.rsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rhead h2{font-size:var(--fs-xl);margin:0}
.rhead h2:focus{outline:none}
.rhead p{margin:2px 0;font-size:var(--fs-md)}
.rsec h3{font-size:var(--fs-lg);margin-bottom:10px}
.rsec h3 .small{font-family:var(--sans);font-weight:400}
.rsec h3.psub{font-family:var(--sans);font-size:var(--fs-md);margin:18px 0 0}
.rsec > p{margin:0 0 8px}
.rtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .l{font-size:.82rem;color:var(--muted)}
.tile .n{font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:proportional-nums}
.tile .s{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.tile.due .n{color:var(--bad)}
.dstrip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 6px}
.dstrip li{display:grid;justify-items:center;gap:2px;width:46px;font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.dstrip i{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:24px;border-radius:4px;font-style:normal;font-weight:700;color:var(--ov-ink)}
.dstrip .wd{font-size:.68rem}
.legend-line{font-size:var(--fs-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0}
.legend-line > span{display:inline-flex;gap:5px;align-items:center}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.notes li:last-child{border-bottom:0}
.notes .when{min-width:12em;color:var(--muted)}
.printonly{display:none}

/* Overview grid: the teacher's colors */
.c-engaged{background:var(--ov-engaged)} .c-excused{background:var(--ov-excused)} .c-idle{background:var(--ov-idle)}
.c-away{background:var(--ov-away)} .c-absent{background:var(--ov-absent)}
.c-none,.c-extra{background:var(--ov-none)}
.c-noclass{background:var(--surface);color:var(--muted)} .c-missing{background:var(--surface);color:var(--late)} .c-later{background:var(--surface)}
.c-none,.c-extra,.c-noclass,.c-missing,.c-later{--ov-ink:var(--ink)}
.c-noclass .ovb{color:inherit}
.dstrip i.c-noclass{border:1px dashed var(--line);color:var(--muted)}
.nc1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}   /* one date with no report: the sentence, then its select and button on the same line */
.nclist{list-style:none;margin:6px 0 0;padding:0}
.nclist li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 0}
.nclist li > span:first-child{min-width:8.5em}
.nclist select,.nc1 select,.ovdpop select,.extraform select,.extraform input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm);color:var(--ink)}
.extraform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}   /* marks on these days use the page ink, so they show in dark mode too */
.dstrip i.c-missing,.dstrip i.c-later{box-shadow:inset 0 0 0 1px var(--line)}
.dstrip i.c-missing{color:var(--late)}
.dstrip i.c-extra::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--ink);border-radius:2px}
/* The key above the grid: three labeled rows, always 86px, so the grid never moves. */
.ovkey{height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 10px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.ovkrow{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 14px;min-height:24px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.ovkrow > span{display:inline-flex;align-items:center;gap:5px}
.ovkey b{color:var(--ink)}
.ovkh{min-width:4.6em;color:var(--ink);font-weight:600}
.ovkend{margin-left:auto}
/* Quick mark: the key turns into the marks to pick from, in the same three rows, so the grid doesn't move */
.ovkey.marking{border-left:4px solid var(--focus);padding-left:7px}
.ovkey.marking .ovkrow{gap:2px 6px}
.ovkey.marking .ovchip{width:auto}
.ovkh2{margin-left:8px;color:var(--ink);font-weight:600}
.ovkey .qmsg{color:var(--late);font-weight:600}
.ovwrap.marking .ovb[data-ovcell]{cursor:copy}
.ovwrap.marking .ovb[data-ovcell]:hover{box-shadow:inset 0 0 0 2px var(--focus)}
.ovdropped{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:500;color:var(--muted);margin-bottom:10px;cursor:pointer}
.ovmarkbtn{min-width:9em}   /* fits "Done marking" too, so the button keeps its width */
#tab-overview .toolbar .search{width:150px}   /* room for Quick mark and Print on the same line */
.ovsw{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:2px;font-style:normal;font-size:var(--fs-xs);border:1px solid var(--line);position:relative}
.ovsw.ovnote-k{background:linear-gradient(225deg,var(--ink) 0 4px,var(--surface) 4px)}
.ovsw.c-extra::after{content:"";position:absolute;inset:1px;border:1.5px dashed var(--ink);border-radius:1px}
.ovsw.c-missing{color:var(--late);font-weight:700}
.ovwrap{position:relative;margin-top:8px}
.ovblock{position:relative;width:fit-content;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
.ovblock::-webkit-scrollbar{height:10px}
.ovblock::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.ovblock::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.ovt th.ovmo span{position:sticky;left:calc(var(--ovnamew, 170px) + 6px)}
table.ovt{border-collapse:separate;border-spacing:0;font-size:var(--fs-xs)}
.ovt th,.ovt td{padding:0;border-right:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.ovt thead th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--ink);font-weight:600;text-align:center;white-space:nowrap;padding:2px 1px;font-size:var(--fs-xs);font-variant-numeric:proportional-nums;line-height:1.25}
.ovt thead tr:nth-child(2) th{top:22px}
.ovt th.ovmo{text-align:left;color:var(--ink);padding-left:6px;height:22px;font-size:var(--fs-sm);line-height:17px}
.ovt th.today,.ovt th.today .ovwd{color:var(--focus)}
.ovwd{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--muted)}
.ovkind{display:block;font-size:.625rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.ovkind.sh{color:var(--ink)}
.ovt .wk{border-left:2px solid var(--rule)}
.ovt th.ovname{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 10px 0 8px;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);border-right:1px solid var(--line);font-size:var(--fs-md)}
.ovt th.ovname .name-btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration-color:transparent}
.ovt th.ovname .name-btn:hover{text-decoration-color:var(--ink)}
.ovleft{display:block;font-size:var(--fs-xs);font-weight:500;color:var(--muted);line-height:1.1}
.ovt thead th.ovcorner{z-index:4;vertical-align:bottom;padding-bottom:4px;color:var(--muted)}
.ovt thead th.ov1h{z-index:4;position:sticky;right:0;vertical-align:bottom;padding:0 10px 4px;text-align:left;color:var(--muted);border-left:1px solid var(--line)}
.ovt tbody tr:hover th.ovname{background:var(--paper)}
.ovc{width:38px;min-width:38px;height:26px}
.ovb{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;gap:1px;width:100%;height:26px;cursor:pointer;color:var(--ov-ink);font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em}
.ovb:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
/* Two-tone ring (ink outside, page color inside), so the focused or open day shows on every color in both themes */
.ovb:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:inset 0 0 0 4px var(--surface)}
.ovc.sel .ovb,.ov1c.sel .ovb{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 5px var(--surface)}
.c-extra .ovb::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--ov-ink);border-radius:2px;pointer-events:none}
.c-missing .ovb,.c-later .ovb{color:inherit}
.ovm{font-size:var(--fs-xs);color:var(--ov-ink)}
.ovb .ovm{position:absolute;right:2px;bottom:1px;line-height:1;font-size:.66rem}
.ovkey .ovm{color:var(--ink)}
.ovmsg{display:flex;align-items:center;height:26px;margin:10px 0 0;padding:0 6px;gap:7px;font-size:var(--fs-sm)}
.ovmsg input{width:14px;height:14px;margin:0;accent-color:var(--focus)}
@media (prefers-color-scheme: dark){ .ovmsg input{color-scheme:dark} }   /* a dark box, like the letters' boxes beside it */
.ovn,.dstrip .dn{position:absolute;top:0;right:0;width:0;height:0;border-top:7px solid var(--ov-ink);border-left:7px solid transparent}
.ovt td.ov1c{position:sticky;right:0;z-index:1;background:var(--surface);border-left:1px solid var(--line);width:136px;min-width:136px}
.ov1c .ovb{justify-content:flex-start;padding:0 10px;color:var(--ink);font-weight:500;white-space:nowrap}
.ov1c .ovb:hover{box-shadow:inset 0 0 0 2px var(--line)}
.ov1c.due .ovb{color:var(--bad);font-weight:700}
.ov1c.none .ovb{font-weight:700}
.ov1c.left .ovb{color:var(--muted)}
/* The day editor and the 1-on-1 box: every part is there on every day (one that doesn't apply is turned off, not
   left out), so the box is the same size on every day and when anything in it is pressed. */
.ovpop{position:absolute;z-index:10;width:480px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;font-size:var(--fs-sm)}
.ovpop-h{display:flex;flex-wrap:nowrap;align-items:baseline;gap:4px 10px;white-space:nowrap;min-width:0}
.ovpop-h b{font-size:var(--fs-md)}
.ovpop-h .muted{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ovx{margin-left:auto}
.ovfacts{min-height:1.5em;margin:6px 0 10px}
.ovcols{display:grid;grid-template-columns:230px 1fr;gap:0 20px}
.ovgrp{display:flex;flex-direction:column}
.ovchip,.ovlet{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:5px;padding:0 6px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);width:100%;height:26px;justify-content:flex-start}
.ovchip[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ovchip:hover:not(:disabled),.ovlet:hover:not(:disabled){background:var(--grid)}
.ovchip:disabled,.ovlet:disabled{color:var(--faint);cursor:default}
.ovlet .tbox{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ovlet[aria-pressed="true"] .tbox{background:var(--focus);border-color:var(--focus)}
.ovlet[aria-pressed="true"] .tbox::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ovset{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:2px}
.ovset.on{background:var(--focus)}
.ovnoteb{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;margin:10px 0 6px}
.ovnoteb input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:var(--fs-sm)}
.ovpop-f{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.ov1pop{width:720px}
.ov1facts{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;min-height:2.2em;margin:6px 0 4px}
.ov1list{min-height:236px;border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);margin-bottom:10px}
/* One 1-on-1 in a list: date, time, what's known about it, then Held / Missed / Canceled and Edit */
.occlist{list-style:none;margin:0;padding:0}
.occlist li{display:grid;grid-template-columns:7.4em 5.6em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:4px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm);min-height:37px}
.occlist.named li{grid-template-columns:minmax(8em,11em) 7.4em 5.6em minmax(0,1fr) auto}
.occlist li:last-child{border-bottom:0}
.occlist li.none{display:block;color:var(--muted);min-height:0;padding:8px 0}
.occlist .when{font-weight:600}
.occlist .what{min-width:0;color:var(--muted);overflow-wrap:anywhere}
.occlist .acts{display:grid;grid-template-columns:auto 5.6em 2.6em;align-items:center;gap:12px;justify-items:start}
.occlist li.st-canceled .when,.occlist li.st-canceled .tm{color:var(--muted);text-decoration:line-through}
.chip.held{background:var(--ok-bg);color:var(--ok)}
.chip.missed{background:var(--bad-bg);color:var(--bad)}
.chip.canceled{background:var(--grid);color:var(--muted)}
.chip.unmarked{background:var(--late-bg);color:var(--late)}
.chip.today{background:var(--grid);color:var(--ink)}
.markseg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.markseg button{border:0;background:none;height:26px;padding:0 9px;font-size:var(--fs-xs);font-weight:600;color:var(--muted);cursor:pointer}
.markseg button + button{border-left:1px solid var(--line)}
.markseg button:hover:not(:disabled){background:var(--grid);color:var(--ink)}
.markseg button:disabled{color:var(--faint);opacity:.45;cursor:default}
.markseg button[aria-pressed="true"].v-held{background:var(--ok-bg);color:var(--ok)}
.markseg button[aria-pressed="true"].v-missed{background:var(--bad-bg);color:var(--bad)}
.markseg button[aria-pressed="true"].v-canceled{background:var(--grid);color:var(--ink)}
.menu.occmenu .pop,.menu.schmenu .pop{left:auto;right:0;width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.occmenu .row3,.schmenu .row3{display:flex;gap:10px;align-items:flex-end}
.occmenu label,.schmenu label{display:grid;gap:3px;font-weight:600}
.occmenu input,.occmenu select,.schmenu input,.schmenu select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-weight:400;height:30px}
.occmenu .grow{flex:1}
.menumsg:empty{display:none}
.menumsg{color:var(--bad);font-weight:600}
.daygrp{font-size:var(--fs-sm);font-weight:700;margin:12px 0 2px;color:var(--ink)}
.daygrp:first-child{margin-top:0}
.markpanel{border-left:4px solid var(--late)}
.markpanel .acts-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.schtxt{font-weight:600}
.chip.moved{background:var(--grid);color:var(--ink)}
.rsquick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rsquick .btn{font-weight:500}
.occmenu .pop p.lead{margin:0;color:var(--ink);font-weight:600}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.day > summary{list-style:none;cursor:pointer;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
/* On a desktop screen a closed day is one line in three columns: the date, who came and when, and the counts. Dates on
   days with no class line up under the other dates. Printed pages and narrow windows keep the wrapping line. */
@media screen and (min-width: 821px){ details.day > summary{display:grid;grid-template-columns:10px minmax(0,1fr) max-content;grid-template-areas:"a t c" "a s c";gap:2px 16px}
  details.day > summary::before{grid-area:a} details.day > summary h2{grid-area:t} details.day > summary .sub{grid-area:s} details.day > summary .counts{grid-area:c}
  details.day .counts{flex-wrap:nowrap} details.day .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
details.day > summary::-webkit-details-marker{display:none}
details.day > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);align-self:center;margin-right:2px;transition:transform .15s}
details.day[open] > summary::before{transform:rotate(45deg)}
.day h2{font-size:var(--fs-lg)}
.day .sub{color:var(--muted);font-size:var(--fs-sm)}
.counts{display:flex;flex-wrap:wrap;gap:6px;width:auto;padding-left:0}
.count{font-size:var(--fs-sm);font-weight:600;border-radius:999px;padding:2px 10px}
/* The day boxes keep one width each, so they line up from day to day; a box with 0 is faded. */
.counts .count{box-sizing:border-box;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .k-full{width:7.4em} .counts .k-fin{width:9.2em} .counts .k-late{width:5.4em} .counts .k-early{width:8.2em} .counts .k-drop{width:9.6em} .counts .k-absent{width:6.8em}
.counts .count.zero{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--grid)}
.day-body{padding:0 20px 18px}
.k-full{background:var(--ok-bg);color:var(--ok)}
.s-in{background:var(--bar)} .s-before{background:var(--loss-before)} .s-out{background:var(--loss-out)}
.k-fin{background:var(--fin-bg);color:var(--fin)}
.k-late{background:var(--late-bg);color:var(--late)}
.k-missed,.k-early{background:var(--bad-bg);color:var(--bad)}
.k-soft{background:var(--soft-bg);color:var(--soft)}
.k-drop{background:var(--drop-bg);color:var(--drop)}
.k-absent{background:var(--bad);color:var(--surface)}
.k-extra{background:var(--grid);color:var(--muted)}
.k-exc{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.note-txt{display:block;font-size:.8rem;color:var(--ink);font-style:italic;line-height:1.35;margin-top:2px}
input.note{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:.82rem;width:100%;margin-top:4px}
.grid-head,.row{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:0 14px;align-items:center}
.grid-head{font-size:var(--fs-xs);color:var(--muted);padding:6px 0 6px;border-bottom:1px solid var(--line);font-weight:600}
.row{padding:8px 0;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.who b{font-weight:600}
.who .meta{display:block;font-size:var(--fs-sm);color:var(--muted);line-height:1.35}
.time{font-size:var(--fs-md)}
.time.none{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .acts{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;flex-basis:100%}
.row > .chips{align-self:start}
.chip{font-size:var(--fs-sm);font-weight:600;border-radius:5px;padding:2px 8px;white-space:nowrap}
.quiet{font-size:var(--fs-sm);color:var(--muted)}   /* "Present full time" on a day's row, so the exceptions are what stand out */
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:var(--fs-sm)}
.linkish:hover{color:var(--ink)}

/* Timeline: the class block drawn like a strip of graph paper */
.axis{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.tl{position:relative;height:22px;border-radius:4px;background:var(--paper);border:1px solid var(--grid);overflow:hidden}
.tl .band{position:absolute;top:0;bottom:0}
.tl .band.instruction{background:var(--instr)}
.tl .band.support{background:var(--support)}
.tl .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
.tl .tick.half{opacity:.45}
.tl .bar{position:absolute;top:7px;height:8px;border-radius:2px;background:var(--bar)}

.subhead{font-family:var(--serif);font-size:var(--fs-lg);margin:20px 0 6px}
.mini{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:6px 14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.mini:last-child{border-bottom:0}
.mini > :nth-child(3){grid-column:3 / -1}
.mini .act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:210px;font-size:.84rem}
.files{font-size:var(--fs-sm);color:var(--faint);margin-top:12px}
.tgl{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;font:inherit;font-size:.86rem;color:var(--ink);cursor:pointer}
:is(.tgl,.ovlet) .tbox{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
:is(.tgl,.ovlet)[aria-pressed="true"] .tbox{background:var(--focus);border-color:var(--focus)}
:is(.tgl,.ovlet)[aria-pressed="true"] .tbox::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tgl:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
:root{--viz-1:#2a78d6;--viz-2:#eb6834}
@media (prefers-color-scheme: dark){ :root{--viz-1:#3987e5;--viz-2:#d95926} }
.rptpick{margin-bottom:14px;padding:12px 18px}
.rptrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.rptlab{font-weight:600;font-size:var(--fs-sm)}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.rt-l{font-size:var(--fs-sm);color:var(--muted)}
.rt-v{font-size:var(--fs-xl);font-weight:600;line-height:1.3}

<script>

/* ------------------------------------------------------------------

   ------------------------------------------------------------------ */
const DATA_FILE = 'homeroom-tracker-data.json';
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WEEKDAYS = [1, 2, 3, 4, 5];
const HAS_FSA = typeof window.showDirectoryPicker === 'function';
const KIND = { hr: 'Homeroom', sh: 'Study hall' };
// The Overview's colors, in the teacher's own words (the intervention tracker's). Engagement is marked by hand: a day in Zoom
// starts as "Present and engaged".
const CAT = { engaged: 'Present and engaged', excused: 'Excusable absence', idle: 'Likely present but not engaging',
  away: 'Likely not actually present', absent: 'Did not attend' };
const PRESENT = new Set(['engaged', 'idle', 'away']);   // the three colors that count as attending
const OV_LET = { L: 'Late or left early', C: 'Camera off' };
const NOCLASS_REASONS = { holiday:'School holiday', testing:'Testing', canceled:'Class canceled', other:'Other' };
const FU_HOW = { call:'Called home', message:'Emailed or texted home', student:'Talked with the student', meeting:'Meeting (team or family)', other:'Other' };
// What a day on the grid shows, in plain words.
const CELL = { ...CAT, none: 'Not required', extra: 'Came, not required', noclass: 'No class',
  missing: 'No Zoom report yet', later: 'Not yet' };
const MAX_GROUP = 3;   // a Zoom meeting with up to this many students can be a 1-on-1
// Kinds of cheating for the cheating log, in the order the list shows them (the same as the intervention tracker's).
const CHEAT_TYPES = { ai: 'Used AI (like ChatGPT)', app: 'Answer app or website (like Photomath)', copy: 'Copied another student', share: 'Shared answers',
  notes: 'Phone or notes during a test or quiz', someone: 'Someone else did the work', other: 'Other' };
const ONE_ST = { held: 'Held', missed: 'Missed', canceled: 'Canceled' };
const EVERY = { 1: 'Every week', 2: 'Every other week', 3: 'Every 3 weeks', 4: 'Every 4 weeks' };
const ONE_AHEAD = 28;   // scheduled 1-on-1s are listed up to four weeks ahead

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const mins = ms => Math.round(ms / 60000);
// Formatting dates is slow when every call builds a new formatter, so each format is built once.
const DTF = {};

const fmt = t => t == null ? '—' : dtf({ hour: 'numeric', minute: '2-digit' }).format(t);
const fmtMin = m => { m = Math.round(m); let h = Math.floor(m / 60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(mi)} ${ap}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtRange = (a, b) => { const A = fmtMin(a), B = fmtMin(b); return (A.slice(-2) === B.slice(-2) ? A.slice(0, -3) : A) + '–' + B; };
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pct = (n, d) => d ? Math.round(n / d * 100) : null;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const todayDk = () => dkOf(new Date());
const parseDk = dk => { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate() + n); return dkOf(d); };
const weekKey = dk => { const d = parseDk(dk); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkOf(d); };
const daysBetween = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 864e5);
const asDate = d => typeof d === 'string' ? parseDk(d) : d;
const shortDate = d => dtf({ weekday: 'short', month: 'short', day: 'numeric' }).format(asDate(d));
const monDay = d => dtf({ month: 'short', day: 'numeric' }).format(asDate(d));
const longDate = d => dtf({ weekday: 'long', month: 'long', day: 'numeric' }).format(asDate(d));
const isDk = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDk(v)) && dkOf(parseDk(v)) === v;
const isHm = v => typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
const hmMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const own = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// First name, for short labels. Handles "Diaz, Ana" too.
function firstName(name){
  const s = String(name).replace(/^[^\p{L}]+/u, ''), m = s.match(/^([^,]+),\s*([^\s,]+)/);
  return (m ? m[2] : s.split(/\s+/)[0]) || String(name);
}
function listJoin(items, max = 4){
  const xs = items.length === max + 1 ? items : items.slice(0, max), more = items.length - xs.length;
  if (more > 0) return `${xs.join(', ')} and ${more} more`;
  return xs.length < 2 ? (xs[0] || '') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
function fmtPeriod(p){
  const a = parseDk(p.from), b = parseDk(p.to), o = { month: 'short', day: 'numeric' };
  if (a.getFullYear() !== b.getFullYear()) return `${dtf({ ...o, year: 'numeric' }).format(a)} – ${dtf({ ...o, year: 'numeric' }).format(b)}`;
  return `${dtf(o).format(a)} – ${dtf(o).format(b)}, ${b.getFullYear()}`;
}
const daysText = ws => ws.length ? listJoin(ws.map(w => cap(DAYS[w]) + 's'), 5) : 'no days';

/* ---------------- The data file ---------------- */
function defaultData(){
  return { version: 1,
    settings: { homeroomDay: 1, homeroomStart: '08:30', homeroomEnd: '09:00', studyDays: [2, 4], studyStart: '14:00', studyEnd: '15:00',
      lateGrace: 5, leaveGrace: 5, oneOnOneMin: 5, teacherName: '', contactLine: '' },
    students: [],    // [{ key, name, added, removed }]: on the list from added, until the day before removed
    shDays: {},      // { studentKey: ['YYYY-MM-DD', …] } the study hall sessions a student is assigned to
    oneSched: {},    // { studentKey: [{ from, time, every } | { from, stop: true }] } the standing 1-on-1: on from's weekday at time,
                     //   every `every` weeks starting on `from`, until the next entry's `from` (a stop entry ends it)
    oneMarks: {},    // { 'studentKey|YYYY-MM-DD': { st, to, at, note } } one scheduled 1-on-1 (by its scheduled date): held, missed
                     //   or canceled, and moved to another date (to) or time (at)
    meetings: {},    // { studentKey: [{ id, date, time, st, note, makeup }] } extra 1-on-1s added by hand (st '' = not marked yet;
                     //   makeup: the date of the missed meeting it makes up for)
    status: {},      // { 'YYYY-MM-DD|hr|studentKey': { cat, L, note } } a day set by hand (kind hr: homeroom, sh: study hall)
    aliases: {},     // { zoomNameKey: studentKey }
    ignored: [],     // Zoom names that aren't students
    cheating: {},    // { studentKey: [{ id, date, type, note }] } times a student was caught cheating (type: a CHEAT_TYPES key)
    followUps: {},   // { studentKey: [{ id, date, how, text, day }] } (day: the class day a message was about)
    plans: {},       // { studentKey: { type: 'iep' | '504', acc } } an IEP or 504 plan, and its accommodations one per line
    ml: {},          // { studentKey: { status: 'ml' | 'rfep', level, sup } } a multilingual learner (with their ELD level) or a
                     // student reclassified fluent English proficient (RFEP), and supports one per line
    deletedDays: {},     // { 'YYYY-MM-DD': { date } } dates taken off every tab
    noClass: {},     // { 'YYYY-MM-DD': { reason } } no homeroom or study hall that date (a holiday, testing…), so it isn't counted
    extraDays: {} }; // { 'YYYY-MM-DD': { kinds: ['hr' | 'sh'] } } homeroom or study hall added by hand on a date that doesn't usually have it   // { 'YYYY-MM-DD': { date } } dates taken off every tab: no homeroom or study hall, that time in Zoom set aside
}
const NUM_SETTINGS = { lateGrace: [0, 60], leaveGrace: [0, 60], oneOnOneMin: [1, 60] };
// Everything read from the data file is checked here, so a damaged or hand-edited file can't break the page.
// Fields this page doesn't know are dropped, and so are bad dates.
function withDefaults(d){
  d = obj(d);
  const base = defaultData(), set = obj(d.settings), S = { ...base.settings, studyDays: [...base.settings.studyDays] };
  for (const [k, [lo, hi]] of Object.entries(NUM_SETTINGS)){ const v = Number(set[k]); if (set[k] !== '' && set[k] !== null && Number.isFinite(v)) S[k] = Math.min(hi, Math.max(lo, Math.round(v))); }
  if (WEEKDAYS.includes(Number(set.homeroomDay))) S.homeroomDay = Number(set.homeroomDay);
  if (Array.isArray(set.studyDays)) S.studyDays = [...new Set(set.studyDays.map(Number).filter(w => WEEKDAYS.includes(w)))].sort();
  for (const [a, b] of [['homeroomStart', 'homeroomEnd'], ['studyStart', 'studyEnd']]) if (isHm(set[a]) && isHm(set[b]) && set[a] < set[b]){ S[a] = set[a]; S[b] = set[b]; }
  if (typeof set.teacherName === 'string') S.teacherName = set.teacherName.trim().slice(0, 120);
  if (typeof set.contactLine === 'string') S.contactLine = set.contactLine.trim().slice(0, 200);
  const out = { version: 1, settings: S, students: [], shDays: {}, meetings: {}, status: {}, aliases: {}, ignored: [], deletedDays: {}, noClass: {}, extraDays: {}, oneSched: {}, oneMarks: {}, cheating: {}, followUps: {}, plans: {}, ml: {} }, seen = new Set();
  for (const x of Array.isArray(d.students) ? d.students : []){
    const s = obj(x), name = typeof s.name === 'string' ? s.name.replace(/\s+/g, ' ').trim().slice(0, 120) : '', key = normKey(typeof s.key === 'string' && s.key ? s.key : name);
    if (!name || !key || seen.has(key)) continue;
    seen.add(key);
    const st = { key, name };
    if (isDk(s.added)) st.added = s.added;
    if (isDk(s.removed)) st.removed = s.removed;
    out.students.push(st);
  }
  for (const [k, v] of Object.entries(obj(d.shDays))) if (k && Array.isArray(v)){
    const ds = [...new Set(v.filter(isDk))].sort(); if (ds.length) out.shDays[k] = ds;
  }
  // From before sessions were assigned one by one: "needs study hall from … to …" becomes each study hall day in those dates
  // (an open-ended one, through the end of this week).
  for (const [k, v] of Object.entries(obj(d.studyHall))) if (k && Array.isArray(v) && !out.shDays[k]){
    const ds = [], end = addDays(weekKey(todayDk()), 6);
    for (const per of v.map(obj).filter(x => isDk(x.from))){
      const to = isDk(per.to) ? addDays(per.to, -1) : end;
      for (let dk = per.from, i = 0; dk <= to && i < 1500; dk = addDays(dk, 1), i++) if (S.studyDays.includes(parseDk(dk).getDay())) ds.push(dk);
    }
    if (ds.length) out.shDays[k] = [...new Set(ds)].sort();
  }
  for (const [k, v] of Object.entries(obj(d.meetings))) if (k && Array.isArray(v)){
    // A meeting from before 1-on-1s had schedules has no st: it was logged because it happened.
    const ms = v.map(obj).filter(m => isDk(m.date)).map(m => ({ id: String(m.id || uid()).slice(0, 40), date: m.date, time: isHm(m.time) ? m.time : '',
      st: own(ONE_ST, m.st) ? m.st : m.st === '' ? '' : 'held', note: String(m.note || '').slice(0, 300), ...(isDk(m.makeup) ? { makeup: m.makeup } : {}) }));
    if (ms.length) out.meetings[k] = ms;
  }
  for (const [k, v] of Object.entries(obj(d.status))){
    const [dk, kind, ...rest] = k.split('|'), key = rest.join('|'), x = obj(v), o = {};
    if (!isDk(dk) || !own(KIND, kind) || !key) continue;
    if (own(CAT, x.cat)) o.cat = x.cat; else if (x.cat === 'present') o.cat = 'engaged';   // "Present", from before the engagement colors
    if (typeof x.L === 'boolean') o.L = x.L;
    if (x.C === true) o.C = true;
    if (x.fin === true) o.fin = true;
    if (typeof x.note === 'string' && x.note.trim()) o.note = x.note.trim().slice(0, 300);
    if (Object.keys(o).length) out.status[`${dk}|${kind}|${key}`] = o;
  }
  for (const [k, v] of Object.entries(obj(d.aliases))) if (k && typeof v === 'string' && v) out.aliases[k] = v;
  for (const [k, v] of Object.entries(obj(d.followUps))) if (Array.isArray(v)){
    const xs = v.filter(f => f && isDk(f.date)).map(f => ({ id: String(f.id || uid()), date: f.date, how: f.how in FU_HOW ? f.how : 'other', text: String(f.text || '').slice(0, 300), ...(isDk(f.day) ? { day: f.day } : {}), ...(isDk(f.day) && f.kind === 'sh' ? { kind: 'sh' } : {}) }));
    if (xs.length) out.followUps[k] = xs;
  }
  for (const [k, v] of Object.entries(obj(d.plans))){ const t = obj(v).type; if (k && (t === 'iep' || t === '504')) out.plans[k] = { type: t, acc: String(obj(v).acc || '').slice(0, 4000) }; }
  for (const [k, v] of Object.entries(obj(d.ml))) if (k) out.ml[k] = { status: obj(v).status === 'rfep' ? 'rfep' : 'ml', level: String(obj(v).level || '').trim().slice(0, 40), sup: String(obj(v).sup || '').slice(0, 4000) };
  for (const [k, v] of Object.entries(obj(d.cheating))) if (k && Array.isArray(v)){
    const xs = v.map(obj).filter(x => isDk(x.date)).map(x => ({ id: String(x.id || uid()).slice(0, 40), date: x.date, type: own(CHEAT_TYPES, x.type) ? x.type : 'other', note: String(x.note || '').slice(0, 300) }));
    if (xs.length) out.cheating[k] = xs;
  }
  for (const [k, v] of Object.entries(obj(d.oneSched))) if (k && Array.isArray(v)){
    const es = v.map(obj).filter(e => isDk(e.from) && (e.stop === true || isHm(e.time)))
      .map(e => e.stop === true ? { from: e.from, stop: true } : { from: e.from, time: e.time, every: [1, 2, 3, 4].includes(Number(e.every)) ? Number(e.every) : 2 })
      .sort((a, b) => a.from.localeCompare(b.from)).filter((e, i, a) => !a[i + 1] || a[i + 1].from !== e.from);
    if (es.length) out.oneSched[k] = es;
  }
  for (const [k, v] of Object.entries(obj(d.oneMarks))){
    const x = obj(v), o = {}, i = k.lastIndexOf('|');
    if (i < 1 || !isDk(k.slice(i + 1))) continue;
    if (own(ONE_ST, x.st)) o.st = x.st;
    if (isDk(x.to)) o.to = x.to;
    if (isHm(x.at)) o.at = x.at;
    if (typeof x.note === 'string' && x.note.trim()) o.note = x.note.trim().slice(0, 300);
    if (Object.keys(o).length) out.oneMarks[k] = o;
  }
  for (const [k, v] of Object.entries(obj(d.noClass))) if (isDk(k)) out.noClass[k] = { reason: obj(v).reason in NOCLASS_REASONS ? obj(v).reason : 'other' };
  for (const [k, v] of Object.entries(obj(d.extraDays))) if (isDk(k)){ const ks = (Array.isArray(obj(v).kinds) ? obj(v).kinds : []).filter(x => own(KIND, x)); if (ks.length) out.extraDays[k] = { kinds: [...new Set(ks)] }; }
  for (const [k, v] of Object.entries(obj(d.deletedDays))) if (isDk(k)) out.deletedDays[k] = { date: isDk(obj(v).date) ? v.date : '' };
  out.ignored = [...new Set((Array.isArray(d.ignored) ? d.ignored : []).filter(x => typeof x === 'string' && x))];
  return out;
}

const state = {

  include: { table: true, log: true, notes: false, plan: false, cheat: false }, fuEdit: null, fuEditDraft: null, fuPrefill: null, familyDraft: {}, familyOpen: false, familyCopied: null, ovScroll: null, ovPrintAll: false,
  logKey: '', logMsg: null, demo: false, undo: [], redo: [], snap: null, saveFailed: false, lastAnalysis: null

/* ---------------- Text helpers ---------------- */
function normKey(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

/* ---------------- Zoom reports ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseZoomTime(s){
  if (!s) return null; s = String(s).trim(); if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}T[\d:.]+(Z|[+-]\d\d:?\d\d)$/i.test(s)){ const t = Date.parse(s); if (!isNaN(t)) return new Date(t); }   // a time with its zone
  let y, mo, d, h, mi, se, ap, m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else { const t = /\d{1,2}:\d{2}/.test(s) ? Date.parse(s) : NaN; return isNaN(t) ? null : new Date(t); }   // other formats need a time of day: "8" isn't a date
  if (ap){ ap = ap.toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0; }
  return new Date(y, mo - 1, d, h, mi, se);
}
function parseZoomFile(name, text){
  const rows = parseCSV(String(text).replace(/^﻿/, ''));
  const hi = rows.findIndex(r => r.some(c => /^join time/i.test(c.trim())) && r.some(c => /^leave time/i.test(c.trim())));
  if (hi < 0){
    const looksUnique = rows.some(r => r.some(c => /duration/i.test(c)) && r.some(c => /name/i.test(c)));
    return { error: looksUnique
      ? 'This file has no join or leave times. It was probably exported with “Show unique users” checked. Export it again with that box unchecked.'
      : 'This doesn’t look like a Zoom participant report (no “Join Time” column).' };
  }
  const h = rows[hi].map(c => c.trim().toLowerCase());
  let nameIdx = h.findIndex(c => c.startsWith('name') || c.includes('participant'));
  if (nameIdx < 0) nameIdx = 0;
  const joinIdx = h.findIndex(c => c.startsWith('join time'));
  const leaveIdx = h.findIndex(c => c.startsWith('leave time'));
  const waitIdx = h.findIndex(c => c.includes('waiting'));
  let emailIdx = h.findIndex((c, i) => c.includes('email') && i > nameIdx);
  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (r[nameIdx] || '').trim();
    const join = parseZoomTime(r[joinIdx]), leave = parseZoomTime(r[leaveIdx]);
    if (!nm || !join || !leave || leave <= join) continue;
    if (waitIdx >= 0 && /^y/i.test((r[waitIdx] || '').trim())) continue;   // time in the waiting room isn't time in the meeting
    out.push({ name: nm, email: emailIdx >= 0 ? (r[emailIdx] || '').trim() : '', join, leave });
  }
  if (!out.length) return { error: 'No participant rows with join and leave times were found in this file.' };
  // Exported with the meeting's details, the file starts with a row like "Meeting ID, Topic, Start Time, …" and its values.
  let topic = '';
  for (let i = 0; i < hi - 1 && !topic; i++){ const ti = rows[i].findIndex(c => /^topic$/i.test(c.trim())); if (ti >= 0) topic = (rows[i + 1][ti] || '').trim(); }
  return { rows: out, topic };
}
function parsedFile(f){ return f.parsed || (f.parsed = parseZoomFile(f.name, f.text)); }

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));
  const steps = [
    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []
  ];
  return (raw, email) => {
    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

// The student a meeting's topic is about ("1-on-1 with Ben Whitfield"), when the report has its topic: their first and last
// name, or else a first name only one student has. Null when it names no one, or more than one student.
function namedIn(title, students){
  const t = ' ' + normKey(String(title || '').replace(/\.csv$/i, '')).replace(/\b\d+\b/g, ' ').replace(/\s+/g, ' ') + ' ';
  const has = w => !!w && t.includes(' ' + w + ' '), toks = st => st.key.split(' ');
  const full = students.filter(st => toks(st).length > 1 && has(toks(st)[0]) && has(toks(st)[toks(st).length - 1]));
  if (full.length) return full.length === 1 ? full[0] : null;
  const firsts = students.filter(st => has(toks(st)[0]));
  return firsts.length === 1 && students.filter(x => toks(x)[0] === toks(firsts[0])[0]).length === 1 ? firsts[0] : null;
}

/* ---------------- Attendance math ---------------- */
function mergeIntervals(list){
  const s = list.map(x => [x[0], x[1]]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s){ const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push(iv); }
  return out;
}
const overlap = (list, A, B) => list.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, B) - Math.max(a, A)), 0);
const sumIv = list => list.reduce((t, [a, b]) => t + b - a, 0);

const settings = () => state.data.settings;
const winOf = kind => { const S = settings(); return kind === 'hr' ? [hmMin(S.homeroomStart), hmMin(S.homeroomEnd)] : [hmMin(S.studyStart), hmMin(S.studyEnd)]; };
const winText = kind => fmtRange(...winOf(kind));
const kindOnDk = (kind, dk) => kindOn(kind, parseDk(dk).getDay()) || ((state.data.extraDays[dk] || {}).kinds || []).includes(kind);
const kindOn = (kind, wd) => kind === 'hr' ? wd === settings().homeroomDay : settings().studyDays.includes(wd);
const roster = () => [...state.data.students].sort((a, b) => a.name.localeCompare(b.name));
// A student is on the list from the day they were added until the day before they left.
const onList = (s, dk) => (!s.added || s.added <= dk) && (!s.removed || dk < s.removed);
const isCurrent = s => !s.removed || s.removed > todayDk();
const shDaysOf = key => state.data.shDays[key] || [];
const needsSH = (key, dk) => shDaysOf(key).includes(dk);
// The next study hall day (today, if there's study hall today), and a student's next session.
function nextStudyDay(){ let dk = todayDk(); for (let i = 0; i < 21; i++, dk = addDays(dk, 1)) if (kindOnDk('sh', dk) && !state.data.deletedDays[dk] && !state.data.noClass[dk]) return dk; return null; }
const nextSH = key => shDaysOf(key).find(dk => dk >= todayDk()) || null;

/* Reads every Zoom report and sorts each person's time in it by the clock:
   - in the homeroom time on the homeroom day: homeroom that day;
   - in the study hall time on a study hall day: study hall that day;
   - anything else: the rest of that file's rows on that date are one meeting. With 1 to 3 students in it, each student who
     was in it at least the minimum minutes had a 1-on-1 that day. */
function analyze(){
  const D = state.data, S = D.settings, W = { hr: winOf('hr'), sh: winOf('sh') };
  const students = roster(), byKey = new Map(students.map(s => [s.key, s]));
  const match = buildMatcher(students, D.aliases), ignored = new Set(D.ignored), teacher = normKey(S.teacherName);
  const isTeacher = raw => !!teacher && [normKey(raw), ...zoomCandidates(raw).map(normKey)].includes(teacher);
  const fileErrors = [], classes = new Map(), others = new Map();
  let nZoom = 0;
  for (const f of state.files){
    const z = parsedFile(f);
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    nZoom++;
    for (const r of z.rows){
      const j = r.join, dk = dkOf(j), wd = j.getDay(), a = j.getTime(), b = r.leave.getTime();
      // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
      const at = m => new Date(j.getFullYear(), j.getMonth(), j.getDate(), 0, m).getTime();
      // A row in both times (homeroom and study hall back to back on the same day) counts for both.
      const kinds = ['hr', 'sh'].filter(k => kindOnDk(k, dk) && a < at(W[k][1]) && b > at(W[k][0]));
      if (kinds.length && D.deletedDays[dk]) continue;   // a deleted day had no homeroom or study hall: its time in Zoom is set aside
      const skip = isTeacher(r.name) || ignored.has(normKey(r.name)), m = skip ? null : match(r.name, r.email), rk = normKey(r.name);
      for (const kind of kinds.length ? kinds : [null]){
        const id = kind ? `${dk}|${kind}` : `${f.name}|${dk}`, bag = kind ? classes : others;
        if (!bag.has(id)) bag.set(id, { id, dk, kind, files: new Set(), win: kind ? [at(W[kind][0]), at(W[kind][1])] : null, byKey: new Map(), unmatched: new Map(), start: a, end: b, title: z.topic || '' });
        const g = bag.get(id); g.files.add(f.name); g.start = Math.min(g.start, a); g.end = Math.max(g.end, b);
        if (skip) continue;   // the teacher's own rows still show the class met
        if (m){
          if (!g.byKey.has(m.key)) g.byKey.set(m.key, { key: m.key, intervals: [], names: new Set() });
          const e = g.byKey.get(m.key); e.intervals.push([a, b]); e.names.add(r.name);
        } else if (rk && !g.unmatched.has(rk)) g.unmatched.set(rk, { rk, raw: r.name, email: r.email });
      }
    }
  }
  // Homeroom and study hall: present when in Zoom at least a minute during the time; L when late or left early.
  const G = S.lateGrace * 60000, L = S.leaveGrace * 60000;
  for (const g of classes.values()){
    const [A0, B0] = g.win; g.res = new Map();
    for (const e of g.byKey.values()){
      const merged = mergeIntervals(e.intervals), inWin = merged.filter(([a, b]) => b > A0 && a < B0), ms = overlap(merged, A0, B0);
      const first = inWin.length ? inWin[0][0] : null, last = inWin.length ? inWin[inWin.length - 1][1] : null;
      const present = ms >= 60000, late = present && first > A0 + G, early = present && last < B0 - L;
      g.res.set(e.key, { present, late, early, L: late || early, first, last, min: mins(ms), inZoom: ms > 0,
        lateMin: late ? mins(first - A0) : 0, earlyMin: early ? mins(B0 - last) : 0, names: [...e.names] });
    }
  }
  // 1-on-1s from Zoom. A meeting is a student's 1-on-1 when it starts within half an hour of their scheduled time (or its
  // topic names them): held when they were in it at least the minimum minutes, a no-show when they weren't. Every meeting
  // with 3 students or fewer also counts for each student in it, so a 1-on-1 held another day or time is found too. One per
  // student per date and kind (two reports the same day count once, with the longer time).
  const slots = new Map(), NEAR = 30 * 60000;   // each date's scheduled 1-on-1s, where they are now (moved ones included)
  for (const st of students) for (const o of meetingsOf(st, null)) if (!o.extra && o.time && o.st !== 'canceled'){
    if (!slots.has(o.date)) slots.set(o.date, []); slots.get(o.date).push({ key: st.key, at: atMs(o.date, o.time) });
  }
  const zoomMeet = new Map(), unmatched = [], noShows = [];
  const addMeet = (key, g, x) => {
    const list = zoomMeet.get(key) || [], same = list.find(y => y.date === g.dk && !!y.noShow === !!x.noShow);
    if (same){ same.minutes = Math.max(same.minutes, x.minutes); same.files = [...new Set([...same.files, ...g.files])]; same.with = [...new Set([...same.with, ...x.with])]; }
    else list.push({ id: `z-${g.dk}`, date: g.dk, files: [...g.files], source: 'zoom', ...x });
    zoomMeet.set(key, list);
  };
  for (const g of others.values()){
    const keys = [...g.byKey.keys()], named = namedIn(g.title, students);
    const time = e => { const merged = mergeIntervals(e.intervals); return { m: mins(sumIv(merged)), at: merged[0][0] }; };
    const small = keys.length <= MAX_GROUP && g.unmatched.size <= MAX_GROUP;   // not a staff meeting or a class
    const expected = new Set(named ? [named.key] : small ? (slots.get(g.dk) || []).filter(x => Math.abs(g.start - x.at) <= NEAR).map(x => x.key) : []);
    // A no-show only from a meeting no student was in (a meeting someone else was in was theirs), and only when the student
    // wasn't in another meeting near their time either (checked once every report is read).
    const anyone = keys.some(k => time(g.byKey.get(k)).m >= S.oneOnOneMin);
    for (const k of expected){
      const st = byKey.get(k), e = g.byKey.get(k), t = e && time(e);
      if (t && t.m >= S.oneOnOneMin) addMeet(k, g, { minutes: t.m, at: t.at, with: keys.filter(x => x !== k).map(x => (byKey.get(x) || {}).name || x) });
      else if (st && onList(st, g.dk) && !anyone) noShows.push({ k, g, m: t ? t.m : 0, slot: named ? g.start : (slots.get(g.dk) || []).find(x => x.key === k && Math.abs(g.start - x.at) <= NEAR).at });
    }
    if (!named && keys.length >= 1 && keys.length <= MAX_GROUP) for (const e of g.byKey.values()){
      if (expected.has(e.key)) continue;
      const t = time(e); if (t.m < S.oneOnOneMin) continue;
      addMeet(e.key, g, { minutes: t.m, at: t.at, with: keys.filter(k => k !== e.key).map(k => (byKey.get(k) || {}).name || k) });
    }
    // Names nobody knows, from a meeting small enough to be a 1-on-1 (a staff meeting's names aren't listed)
    if (keys.length + g.unmatched.size <= MAX_GROUP) for (const u of g.unmatched.values()) unmatched.push({ ...u, dk: g.dk, when: `${shortDate(g.dk)}, meeting at ${fmt(g.start)}` });
  }
  for (const x of noShows){
    const met = (zoomMeet.get(x.k) || []).some(y => !y.noShow && y.date === x.g.dk && Math.abs(y.at - x.slot) <= NEAR);
    if (!met) addMeet(x.k, x.g, { minutes: x.m, at: x.g.start, with: [], noShow: true });
  }
  for (const g of classes.values()) for (const u of g.unmatched.values()) unmatched.push({ ...u, dk: g.dk, when: `${shortDate(g.dk)}, ${KIND[g.kind].toLowerCase()}` });
  const dks = [...classes.values()].map(g => g.dk).concat(Object.keys(D.status).map(k => k.slice(0, 10))).sort();
  return { students, byKey, classes, zoomMeet, unmatched, fileErrors, nZoom, oldest: dks[0] || null };
}

/* ---------------- Date range (Overview, Students, 1-on-1s) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
const inRange = dk => { const b = rangeBounds(); return (!b.from || dk >= b.from) && (!b.to || dk <= b.to); };
// The dates a person reads: an open start becomes the first day with a report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const from = b.from || (A.oldest && A.oldest < today ? A.oldest : weekKey(today)), to = b.to || today;
  return { from, to: to < from ? from : to, open: !b.to || b.to >= today };
}
// Every homeroom and study hall day in the dates shown. An open range runs to the end of this week ("not yet").
function classDays(period){
  const out = [], end = period.open ? addDays(weekKey(todayDk()), 6) : period.to;
  for (let dk = period.from, i = 0; dk <= end && i < 1500; dk = addDays(dk, 1), i++){
    const wd = parseDk(dk).getDay();
    if (state.data.deletedDays[dk]) continue;
    if (kindOnDk('hr', dk)) out.push({ dk, kind: 'hr' });
    if (kindOnDk('sh', dk)) out.push({ dk, kind: 'sh' });
  }
  return out;
}
function rangeBar(){
  const p = state.range.preset, b = rangeBounds(), on = p === 'custom' && !!(b.from || b.to);
  const shown = !on ? 'Custom dates…' : b.from && b.to ? `${monDay(b.from)} – ${monDay(b.to)}` : b.from ? `From ${monDay(b.from)}` : `Until ${monDay(b.to)}`;
  const said = !on ? 'Custom dates' : `Custom dates, ${b.from && b.to ? `${monDay(b.from)} to ${monDay(b.to)}` : b.from ? `from ${monDay(b.from)}` : `until ${monDay(b.to)}`}`;
  return `<div class="seg range" role="group" aria-label="Dates"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
    <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
    <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button>
    <details class="menu rangemenu" data-rangemenu${state.rangeMenu ? ' open' : ''}><summary${on ? ` class="on" title="${esc(shown)}"` : ''} aria-label="${esc(said)}">${esc(shown)}</summary>
      <div class="pop" role="group" aria-label="Custom dates"><label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
        <label>to <input type="date" data-rto value="${esc(b.to)}"></label></div></details></div>`;
}
function stamp(){ const { from, to } = rangeBounds(); return from || to ? `${from || 'start'}_to_${to || 'latest'}` : 'all-dates'; }

/* ---------------- One student's day ---------------- */
// Homeroom: everyone on the list that day is expected. Study hall: only students who need it that day.
function cellState(A, s, dk, kind){
  const key = s.key, xk = `${dk}|${kind}|${key}`, ov = state.data.status[xk] || {}, today = todayDk();
  const g = A.classes.get(`${dk}|${kind}`), rec = g ? g.res.get(key) || null : null;
  // Dismissed early: they came and were let go before the end, so leaving isn't counted as leaving early, and even a
  // minute or less in Zoom counts as present. It can be marked when Zoom shows they left early (or were in for under a minute).
  const canFin = !!(rec && rec.inZoom && (rec.early || !rec.present)), fin = !!ov.fin && canFin, came = !!(rec && (rec.present || fin));
  const listed = onList(s, dk), req = listed && (kind === 'hr' || needsSH(key, dk));
  const base = !req ? (came ? 'extra' : 'none') : g ? (came ? 'engaged' : 'absent') : state.data.noClass[dk] ? 'noclass' : dk > today ? 'later' : 'missing';
  const cat = req && own(CAT, ov.cat) ? ov.cat : base, autoL = !!(rec && rec.present && (fin ? rec.late : rec.L));
  const inn = PRESENT.has(cat), L = inn && (typeof ov.L === 'boolean' ? ov.L : autoL), F = fin && inn, C = inn && ov.C === true;
  return { dk, kind, key, xk, s, g, rec, came, listed, req, base, cat, ov, autoL, L, C, canFin, fin: F, msg: hasMsg(key, `${dk}|${kind}`), note: ov.note || '',
    auto: { L: autoL, C: false }, hand: req && (!!ov.cat || typeof ov.L === 'boolean' || !!ov.fin || !!ov.C) };
}
const cellWords = c => [CELL[c.cat], c.L ? 'late or left early' : '', c.C ? 'camera off' : '', c.fin ? 'dismissed early' : '', c.msg ? 'message sent home' : '', c.hand ? 'set by you' : '', c.note ? `note: ${c.note}` : ''].filter(Boolean).join(', ');
// Days counted: present and absent days so far. Excused days and days with no report aren't counted.
function statsOf(cells){
  const today = todayDk(); let n = 0, att = 0, eng = 0, exc = 0, L = 0, noRep = 0, fin = 0;
  for (const c of cells){
    if (!c.req || c.dk > today) continue;
    if (c.cat === 'excused') exc++;
    else if (PRESENT.has(c.cat)){ n++; att++; if (c.cat === 'engaged') eng++; if (c.L) L++; if (c.fin) fin++; }
    else if (c.cat === 'absent') n++;
    else if (c.cat === 'missing') noRep++;
  }
  return { n, att, eng, exc, L, fin, noRep, abs: n - att, pct: pct(att, n), engPct: pct(eng, n) };
}
/* ---------------- 1-on-1s ----------------
   Each student has a standing 1-on-1: a weekday and time every so many weeks. Every meeting on that schedule is listed,
   whether or not it happened, so one that didn't happen can't slip by unnoticed. A Zoom report for a meeting marks it held
   by itself and shows whether the student was late; without one, you mark it held, missed or canceled. Any meeting can be
   moved to another day or time. Extra meetings are added by hand, or found in Zoom. */
const hmText = hm => hm ? fmtMin(hmMin(hm)) : '';
const hmOf = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const wdName = dk => cap(DAYS[parseDk(dk).getDay()]);
// The schedule in use on a date: null when there's none yet, or it was stopped.
function schedOn(key, dk){ let cur = null; for (const e of state.data.oneSched[key] || []) if (e.from <= dk) cur = e; return cur && !cur.stop ? cur : null; }
// The schedule to show now: the one in use today, or else one that starts later.
function schedCur(key){
  const today = todayDk(), now = schedOn(key, today); if (now) return now;
  const later = (state.data.oneSched[key] || []).find(e => e.from > today && !e.stop);
  return later ? { ...later, later: true } : null;
}
const schedText = e => e ? `${EVERY[e.every]}, ${wdName(e.from)}s at ${hmText(e.time)}` : 'No schedule';
const occId = o => `${o.key}|${o.extra ? 'x' : 's'}|${o.id}`;   // a Zoom-only meeting is kept by its date, like a scheduled one
// What a meeting is now: its mark (yours, or held from Zoom), or else whether it's still to come, today, or past and not marked yet.
function occ(o){ const today = todayDk(); o.st = o.st || (o.zoom ? (o.zoom.noShow ? 'missed' : 'held') : ''); o.auto = !o.mark && !!o.zoom; o.state = o.st || (o.date > today ? 'later' : o.date === today ? 'today' : 'unmarked'); return o; }
const atMs = (dk, hm) => { const d = parseDk(dk); d.setMinutes(hmMin(hm)); return d.getTime(); };
// Every 1-on-1 for a student, oldest first: each one on their schedule (to four weeks ahead), each extra one, and each
// Zoom meeting on a day with none of those (found in Zoom, not on the schedule). A Zoom meeting goes with the meeting that day.
function meetingsOf(s, A = state.lastAnalysis){
  const key = s.key, list = state.data.oneSched[key] || [], marks = state.data.oneMarks, out = [], end = addDays(todayDk(), ONE_AHEAD);
  list.forEach((e, i) => {
    if (e.stop) return;
    const until = list[i + 1] ? list[i + 1].from : null;
    for (let dk = e.from, n = 0; n < 600 && dk <= end && (!until || dk < until); dk = addDays(dk, 7 * e.every), n++){
      if (!onList(s, dk)) continue;
      const m = marks[`${key}|${dk}`] || {};
      out.push({ key, id: dk, sched: dk, date: m.to || dk, time: m.at || e.time, baseTime: e.time, st: m.st || '', mark: !!m.st, note: m.note || '', moved: !!(m.to || m.at) });
    }
  });
  for (const m of state.data.meetings[key] || []) out.push({ key, id: m.id, sched: null, date: m.date, time: m.time || '', st: m.st || '', mark: !!m.st, note: m.note || '', extra: true, makeup: m.makeup || '' });
  // A make-up and the missed meeting it's for point at each other.
  for (const x of out) if (x.makeup){ const was = out.find(y => !y.extra && y.date === x.makeup) || out.find(y => y !== x && y.date === x.makeup); if (was){ was.madeUp = x; x.makeupFor = was; } }
  const G = settings().lateGrace * 60000, zs = [...((A && A.zoomMeet.get(key)) || [])].sort((a, b) => a.at - b.at), left = [];
  const late = (o, z) => { if (!z.noShow && o.time && z.at > atMs(o.date, o.time) + G) o.lateMin = mins(z.at - atMs(o.date, o.time)); };

    if (o){ o.zoom = z; late(o, z); } else left.push(z);
