  // meeting moved to that day (when it hasn't happened, isn't marked, and has no report of its own).
  for (const z of left){
    let o = null;
    if (!z.noShow){
      const wk = weekKey(z.date), pool = out.filter(x => !x.extra && weekKey(x.date) === wk && x.st !== 'canceled');
      const ns = pool.find(x => x.zoom && x.zoom.noShow && !x.mark && !x.madeUp);

// A pasted list: one name per line (a column copied from a spreadsheet works too). Headers and blank lines are skipped.
function addStudents(text, from){
  const D = state.data, have = new Map(D.students.map(s => [s.key, s])), added = [], back = [], skipped = [];
  for (const line of String(text).split(/\r?\n/)){
    const name = line.split('\t').map(x => x.trim()).find(Boolean)?.replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 120) || '';
    const key = normKey(name);
    if (!key || /^(student( full)?( name)?|names?|full name)$/.test(key)) continue;
    const s = have.get(key);
    if (s){ if (!isCurrent(s)){ delete s.removed; back.push(s.name); } else if (!added.includes(s.name)) skipped.push(s.name); continue; }
    const st = { key, name, added: from };
    D.students.push(st); have.set(key, st); added.push(name);
  }
  if (added.length || back.length) changed();
  return { added, back, skipped };
}
// A new spelling moves the student's marks, notes, study hall dates and meetings with them, and the old spelling stays
// linked to them, so Zoom names that matched it still do (it's listed under Zoom names on Setup, where it can be unlinked).
function renameKey(oldK, newK){
  const D = state.data;
  if (!D.aliases[oldK]) D.aliases[oldK] = newK;
  for (const k of Object.keys(D.status)){ const [dk, kind, ...rest] = k.split('|'); if (rest.join('|') === oldK){ const nk = `${dk}|${kind}|${newK}`; if (!D.status[nk]) D.status[nk] = D.status[k]; delete D.status[k]; } }
  if (D.shDays[oldK]){ D.shDays[newK] = [...new Set([...(D.shDays[newK] || []), ...D.shDays[oldK]])].sort(); delete D.shDays[oldK]; }
  if (D.meetings[oldK]){ D.meetings[newK] = [...(D.meetings[newK] || []), ...D.meetings[oldK]]; delete D.meetings[oldK]; }
  for (const x of ['plans', 'ml']) if (D[x][oldK]){ if (!D[x][newK]) D[x][newK] = D[x][oldK]; delete D[x][oldK]; }
  if (D.cheating[oldK]){ D.cheating[newK] = [...(D.cheating[newK] || []), ...D.cheating[oldK]]; delete D.cheating[oldK]; }
  if (D.oneSched[oldK]){ if (!D.oneSched[newK]) D.oneSched[newK] = D.oneSched[oldK]; delete D.oneSched[oldK]; }
  for (const k of Object.keys(D.oneMarks)){ const i = k.lastIndexOf('|'); if (k.slice(0, i) === oldK){ const nk = `${newK}|${k.slice(i + 1)}`; if (!D.oneMarks[nk]) D.oneMarks[nk] = D.oneMarks[k]; delete D.oneMarks[k]; } }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}

  const zt = (dk, m) => { const [y, mo, d] = dk.split('-'), h = Math.floor(m / 60); return `${mo}/${d}/${y} ${pad(h % 12 || 12)}:${pad(m % 60)}:00 ${h >= 12 ? 'PM' : 'AM'}`; };

  mons.forEach((dk, i) => {

      if (!listed(n, dk)) continue;
      let iv = [[8 * 60 + 30 - int(0, 3), 9 * 60 + int(0, 1)]], zn = n;

function csvCell(v){
  let s = String(v ?? '');
  if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   // keep spreadsheets from treating names as formulas
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
function downloadFile(name, text, type, note = ' Look for it in your Downloads folder.'){
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus(`Downloaded ${name}.${note}`, 'info');
}

/* ---------------- Folder access and saving ---------------- */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('homeroom-tracker', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e){ return null; } }
async function idbSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e){ /* remembering the folder is a convenience */ } }
// Asked only when switching to a different folder would drop changes that never reached the old one.
function okToSwitch(folderName){
  return !(state.loaded && state.dirty && !state.demo && folderName !== state.folderName)
    || confirm('Some changes aren’t saved in the folder yet. Click Cancel, then “Download my data” on the Setup tab to keep them. Or click OK to open this folder without them.');
}
async function pickFolder(){
  if (!HAS_FSA){ $('#folderInput').value = ''; $('#folderInput').click(); return; }
  try {
    const h = await window.showDirectoryPicker({ id: 'homeroom', mode: 'readwrite' });
    if (!okToSwitch(h.name)) return;
    state.dirHandle = h; state.savedHandle = h; await idbSet('dir', h);
    await loadFromHandle();
  } catch (e){ if (e && e.name !== 'AbortError') setStatus(folderError(e)); }
}
function folderError(e){
  return e && /Security|NotAllowed/.test(e.name) ? 'Your browser won’t open that folder, because it keeps some folders (like Desktop or Downloads itself) off-limits. Make a folder inside one of them, like “Homeroom” in Documents, and choose that.'
    : `That folder couldn’t be opened. Try choosing it again. If it keeps happening, close the tab and open this file again.${e && e.message ? ` (${e.message})` : ''}`;
}
async function reopen(){
  const h = state.dirHandle || state.savedHandle; if (!h) return pickFolder();
  try {
    let p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted'){
      const r = await h.requestPermission({ mode: 'read' });
      if (r !== 'granted'){ setStatus('Access to the folder wasn’t allowed. Click “Open homeroom folder” to try again.'); return; }
    }
    state.dirHandle = h; await loadFromHandle();
  } catch (e){ setStatus(`Your folder from last time couldn’t be opened. It may have been moved or renamed. Click “Open homeroom folder” and choose it again.${e && e.message ? ` (${e.message})` : ''}`); state.savedHandle = null; renderFolderBar(); if (!state.loaded) renderCurrent(); }
}
async function loadFromHandle(){
  const h = state.dirHandle, files = []; let dataText = null;
  setStatus(`Reading ${h.name}…`, 'info');
  for await (const [name, entry] of h.entries()){
    if (entry.kind !== 'file') continue;
    const low = name.toLowerCase();
    if (low === DATA_FILE) dataText = await (await entry.getFile()).text();
    else if (low.endsWith('.csv')){ const file = await entry.getFile(); files.push({ name, text: await file.text(), modified: file.lastModified }); }
  }
  state.canWrite = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
  ingest(files, dataText, h.name);
}
async function loadFromInput(list){
  const files = []; let dataText = null, folder = '';
  for (const f of list){
    const low = f.name.toLowerCase();
    if (!folder && f.webkitRelativePath) folder = f.webkitRelativePath.split('/')[0];
    if (f.webkitRelativePath && f.webkitRelativePath.split('/').length > 2) continue;   // files in folders inside it aren't read
    if (low === DATA_FILE) dataText = await f.text();
    else if (low.endsWith('.csv')) files.push({ name: f.name, text: await f.text(), modified: f.lastModified });
  }
  if (!okToSwitch(folder)) return;
  state.dirHandle = null; state.canWrite = false;
  ingest(files, dataText, folder);
}
function ingest(files, dataText, folderName, demo = false){
  let msg = null, info = false;
  const same = state.loaded && !state.demo && !demo && folderName === state.folderName, had = new Set(state.files.map(f => f.name));
  // Refreshing the same folder keeps changes that haven't reached the folder yet, instead of reloading the older file.
  const keep = same && state.dirty;
  if (keep){ msg = 'Your changes that aren’t saved in the folder yet were kept.'; info = true; }
  else if (dataText){
    try { state.data = withDefaults(JSON.parse(dataText)); }
    catch (e){
      // Nothing is saved over a file that couldn't be read, until the teacher allows it.
      state.data = defaultData(); state.canWrite = false;
      msg = `${DATA_FILE} couldn’t be read, so your students and settings weren’t loaded. Nothing will be saved over it unless you allow saving.`;
    }
  }
  else if (!same) state.data = defaultData();   // a different folder with no data file starts empty
  state.files = files.sort((a, b) => a.name.localeCompare(b.name));
  if (same && !msg){ const fresh = state.files.filter(f => !had.has(f.name)); msg = fresh.length ? `Found ${plural(fresh.length, 'new file')}: ${listJoin(fresh.map(f => f.name), 3)}.` : 'Up to date. No new files in the folder.'; info = true; }
  state.demo = demo; if (demo){ state.dirHandle = null; state.canWrite = false; }   // the sample is never saved into a folder
  if (!same){ state.undo = []; state.redo = []; state.student = null; state.ovSel = null; state.ov1 = null; state.ovDay = null; state.dropEdit = null; state.ovMark = null; state.ovScroll = null; state.logMsg = null; state.logKey = ''; }
  state.snap = JSON.stringify(state.data); state.saveFailed = false;
  state.folderName = folderName; state.loaded = true; state.dirty = keep;
  state.status = null;
  render(); navReplace(); setStatus(msg, info ? 'info' : undefined);
  if (keep && state.dirHandle && state.canWrite) changed();
}
let saveTimer = null, undoOpen = false;
// Every change keeps the data as it was before, for Undo. The changes one click makes are one step.
function changed(){
  const now = JSON.stringify(state.data);
  if (state.snap !== null && now !== state.snap && !undoOpen){
    state.undo.push(state.snap); if (state.undo.length > 100) state.undo.shift();
    state.redo = []; undoOpen = true; setTimeout(() => { undoOpen = false; });
  }
  state.snap = now;

}

  if (e.key === 'Escape') document.querySelectorAll('details.menu[open]').forEach(m => {
    const inside = m.contains(document.activeElement); closeMenu(m); if (inside) m.querySelector('summary').focus();
  });
});
// Arrow keys move around the Overview grid (one Tab stop for the whole grid); Enter opens a day, Escape closes it.
function overviewKey(e, t){
  const r = +t.dataset.r, c = +t.dataset.c, at = (rr, cc) => $(`#tab-overview .ovb[data-r="${rr}"][data-c="${cc}"]`);
  const all = [...document.querySelectorAll('#tab-overview .ovb')];
  let to = null;
  if (e.key === 'Escape' && state.ovMark && !state.ovSel && !state.ov1){ state.ovMark = null; renderOverview(); focusOvCell(cellSel(t.dataset.ovcell || '')); e.preventDefault(); return; }
  if (e.key === 'Escape' && (state.ovSel || state.ov1)){ const was = state.ovSel ? cellSel(state.ovSel) : oneSel(state.ov1); state.ovSel = null; state.ov1 = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') to = at(r, c + 1);
  else if (e.key === 'ArrowLeft') to = at(r, c - 1);
  else if (e.key === 'ArrowDown') to = at(r + 1, c);
  else if (e.key === 'ArrowUp') to = at(r - 1, c);
  else if (e.key === 'Home' || e.key === 'End'){
    const pool = (e.ctrlKey ? all : all.filter(b => +b.dataset.r === r)).sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.c - +y.dataset.c));
    to = e.key === 'Home' ? pool[0] : pool[pool.length - 1];
  }
  else return;
  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus({ preventScroll: true }); to.scrollIntoView({ block: 'nearest', inline: 'nearest' }); revealOvCell(to);
}
document.addEventListener('toggle', e => {
  const el = e.target;
  // A day on the Days tab draws its rows when it's opened.
  if (el.matches && el.matches('details.day')){
    const id = el.dataset.dayid; if (el.open) state.openDays.add(id); else state.openDays.delete(id);
    const body = el.querySelector(':scope > .day-body'), A = state.lastAnalysis, g = A && A.classes.get(id);
    if (el.open && body && g && !body.childElementCount) body.innerHTML = dayBody(A, g, normKey(state.query));
    return;
  }
  if (el.matches && el.matches('[data-familybox]')){ state.familyOpen = el.open; return; }
  if (!el.classList || !el.classList.contains('menu')) return;
  if ('rangemenu' in el.dataset) state.rangeMenu = el.open;
  if ('dropmenu' in el.dataset) state.dropEdit = el.open ? el.dataset.dropmenu : null;
  if ('planmenu' in el.dataset){ state.planEdit = el.open ? el.dataset.planmenu : null; if (el.open){ const r = el.querySelector('[data-plantype]:checked'); if (r) r.focus(); return; } }
  if (!el.open) return;
  // A menu opens rightward unless that would run off the window; its first box gets focus.
  const pop = el.querySelector('.pop'); pop.style.left = '0'; pop.style.right = 'auto';
  if (pop.getBoundingClientRect().right > Math.min(innerWidth, (document.querySelector('main') || document.body).getBoundingClientRect().right) - 8){ pop.style.left = 'auto'; pop.style.right = '0'; }
  if (!('rangemenu' in el.dataset)){ const i = pop.querySelector('input'); if (i) i.focus(); }
}, true);
// Scrolling the grid sideways: remember where it is, and keep an open box beside its day.
document.addEventListener('scroll', e => {
  if (!e.target.classList || !e.target.classList.contains('ovblock') || state.ovPrintAll) return;
  state.ovScroll = e.target.scrollLeft; pinMonths(e.target); placeOvPop(); placeOvDay();
}, true);
// Charts: the week-by-week crosshair follows the pointer (or the arrow keys); a bar or row shows its numbers on hover or focus.
document.addEventListener('pointermove', e => {
  const svg = e.target.closest && e.target.closest('svg.vline');
  if (svg){ const D = vizData.get(svg.dataset.vizid), r = svg.getBoundingClientRect(); if (!D) return;
    const vx = (e.clientX - r.left) / r.width * svg.viewBox.baseVal.width; let best = 0; D.x.forEach((x, i) => { if (Math.abs(x - vx) < Math.abs(D.x[best] - vx)) best = i; });
    return vizLineAt(svg, best); }
  const m = e.target.closest && e.target.closest('.vmark, .vrows li');
  if (m) vizTip(m.dataset.tip.split('\n'), e.clientX, e.clientY);
});
document.addEventListener('pointerout', e => {
  const svg = e.target.closest && e.target.closest('svg.vline'); if (svg && !svg.contains(e.relatedTarget)) vizLineOff(svg);
  const m = e.target.closest && e.target.closest('.vmark, .vrows li'); if (m && !m.contains(e.relatedTarget)) vizTip(null);
});
function vizFocus(t){
  if (t.matches('svg.vline')) return vizLineAt(t, t.dataset.at ? +t.dataset.at : vizData.get(t.dataset.vizid).W.length - 1);
  if (t.matches('.vmark, .vrows li')){ const r = t.getBoundingClientRect(); vizTip(t.dataset.tip.split('\n'), r.left + r.width / 2, r.top); }
}
document.addEventListener('focusin', e => { if (e.target.matches) vizFocus(e.target); });
// On scroll, a box for a chart part picked with the keyboard moves with it; one from the pointer closes (pointing again shows it).
addEventListener('scroll', () => {
  if ($('#vizTip').hidden) return;
  const t = document.activeElement;
  if (t && t.matches && t.matches(':focus-visible') && t.matches('svg.vline, .vmark, .vrows li')) return vizFocus(t);
  document.querySelectorAll('svg.vline').forEach(vizLineOff); vizTip(null);
}, { passive: true });
document.addEventListener('focusout', e => { const t = e.target; if (t.matches && t.matches('svg.vline')) vizLineOff(t); else if (t.matches && t.matches('.vmark, .vrows li')) vizTip(null); });
window.addEventListener('resize', () => { placeOvPop(); placeOvDay(); });
document.querySelectorAll('dialog.dlg').forEach(dl => dl.addEventListener('click', e => {
  const r = dl.getBoundingClientRect();
  if (e.target === dl && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dl.close();
}));
$('.skip').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
window.addEventListener('popstate', e => {
  const s = e.state || {}, leaving = state.student;
  navSeq = s.seq || 0;
  state.tab = s.tab || 'overview'; state.student = s.student || null; state.studentTab = s.via || null; state.ovSel = null; state.ov1 = null; state.ovDay = null; state.dropEdit = null; state.logMsg = null;
  render();
  if (state.student){ const h = $('#tab-students h2[tabindex]'); if (h) h.focus({ preventScroll: true }); }
  else if (leaving) focusStudentLink(leaving);
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
window.addEventListener('beforeprint', () => {
  // The Overview prints in landscape, every day shown, in blocks that fit the page.
  if (state.tab === 'overview' && state.loaded){
    let ps = $('#ovPage'); if (!ps){ ps = document.createElement('style'); ps.id = 'ovPage'; document.head.append(ps); }
    ps.textContent = '@page{size:landscape;margin:.4in}';
    document.body.classList.add('print-ov'); state.ovPrintAll = true; renderOverview();
  }
});
window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-reports');
  if (state.ovPrintAll){ state.ovPrintAll = false; renderOverview(); }
  const ps = $('#ovPage'); if (ps) ps.remove();
  document.body.classList.remove('print-ov');
});
window.addEventListener('beforeunload', e => { if (state.dirty && !state.demo && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; render();   // the start screen now offers this folder
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){ /* the start screen offers it */ }
})();
</script>
</body>
