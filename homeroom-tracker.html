  } catch (e){
    state.canWrite = false;
    if (!state.saveFailed) setStatus('Your changes couldn’t be saved in the folder. They’re still here on the page. Click “Allow saving” to try again.', undefined, { label: 'Allow saving', act: 'grantsave' });
    state.saveFailed = true;
  }
  state.saving = false; renderSaveState();
}
async function grantSave(){
  try {
    if (state.dirHandle && (await state.dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted'){ state.canWrite = true; await save(); setStatus(state.dirty ? null : 'Saved.', 'info'); renderCurrent(); return; }
  } catch (err){ /* said below */ }
  setStatus('Saving is still off. You can download the data file instead and put it in your folder.', undefined, { label: 'Download data file', act: 'download' });
}
function downloadData(){
  downloadFile(DATA_FILE, JSON.stringify(state.data, null, 2), 'application/json', state.dirHandle && state.canWrite ? undefined : ` Move it into ${state.folderName || 'your homeroom folder'}, replacing the old one.`);
}

document.addEventListener('keydown', e => {
  const t = e.target, d = t.dataset || {};
  const hadMenu = !!document.querySelector('details.menu[open]');

  if ((!typing || t.tagName === 'SELECT') && !dlg && (e.ctrlKey || e.metaKey) && !e.altKey && /^[zy]$/i.test(e.key)){ e.preventDefault(); undo(e.key.toLowerCase() === 'y' || e.shiftKey); return; }   // a list box has no undo of its own
  if (!typing && !dlg && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.key === '?'){ e.preventDefault(); openHelp(); return; }
    if (e.key === '/'){ const s0 = visible(`#tab-${state.tab} [data-search]`); if (s0){ e.preventDefault(); s0.focus(); s0.select(); } return; }
  }
  // The tabs: the arrow keys move between them (and open them), Home and End go to the first and last.
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)){
    const tabs = [...document.querySelectorAll('nav.tabs [role=tab]')], i = tabs.indexOf(t);
    const to = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1] : tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    e.preventDefault(); to.click(); to.focus(); return;
  }
  if (t.classList && (t.classList.contains('ovb') || t.classList.contains('ovdh')) && !e.altKey && !e.metaKey && !(e.key === 'Escape' && hadMenu)) return overviewKey(e, t);
  if (t.classList && t.classList.contains('mgi') && !e.altKey && !e.metaKey && !(e.key === 'Escape' && hadMenu)) return meetGridKey(e, t);
  if (e.key === 'Escape' && (state.ovSel || state.ov1) && t.closest && t.closest('.ovpop')){
    if (d.ovnote !== undefined) t.blur();   // saves the note first, so the redrawn day shows its note mark

// Arrow keys move around the Overview grid (one Tab stop for the whole grid); Enter opens a day, Escape closes it.
function overviewKey(e, t){
  const r = +t.dataset.r, c = +t.dataset.c, at = (rr, cc) => $(`#tab-overview :is(.ovb,.ovdh)[data-r="${rr}"][data-c="${cc}"]`);
  const all = [...document.querySelectorAll('#tab-overview .ovb, #tab-overview .ovdh')];
  let to = null;
  if (e.key === 'Escape' && (state.ovSel || state.ov1 || state.ovDay)){
    const was = state.ovSel ? cellSel(state.ovSel) : state.ov1 ? oneSel(state.ov1) : `[data-ovdh="${CSS.escape(state.ovDay)}"]`;
    state.ovSel = null; state.ov1 = null; state.ovDay = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') to = at(r, c + 1);
  else if (e.key === 'ArrowLeft') to = at(r, c - 1);
  else if (e.key === 'ArrowDown') to = at(r + 1, c);
  else if (e.key === 'ArrowUp') to = at(r - 1, c);
  else if (e.key === 'Home' || e.key === 'End'){
    const pool = (e.ctrlKey ? all : all.filter(b => +b.dataset.r === r)).sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.c - +y.dataset.c));
    to = e.key === 'Home' ? pool[0] : pool[pool.length - 1];
  }

  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus({ preventScroll: true }); to.scrollIntoView({ block: 'nearest', inline: 'nearest' }); revealOvCell(to);

// Arrow keys move around the 1-on-1s calendar (one Tab stop for all of it): left and right through a row's schedule line,

function meetGridKey(e, t){
  if (e.key === 'Escape' && state.mSel){ e.preventDefault(); closeMPopTo(); return; }
  const all = [...document.querySelectorAll('#tab-meetings .mgi')], r = +t.dataset.r, c = +t.dataset.c, row = all.filter(b => +b.dataset.r === r), i = row.indexOf(t);
  let to = null;

  else if (e.key === 'ArrowLeft') to = row[i - 1];
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const next = all.filter(b => +b.dataset.r === r + (e.key === 'ArrowDown' ? 1 : -1));
    to = next.find(b => +b.dataset.c === c) || next.reduce((best, b) => !best || Math.abs(+b.dataset.c - c) < Math.abs(+best.dataset.c - c) ? b : best, null);
  } else if (e.key === 'Home' || e.key === 'End'){ const pool = e.ctrlKey ? all : row; to = e.key === 'Home' ? pool[0] : pool[pool.length - 1]; }

  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
