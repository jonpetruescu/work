<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: this page may not load anything over the network or send anything anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeroom tracker</title>
<style>
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
  --ink:#1C2433; --muted:#566074; --faint:#626B7D; --rule:#A3ACBA; --bar:#24324D;
  --ok:#1D6F47; --ok-bg:#DFF1E7; --fin:#11636C; --fin-bg:#D8EFF1;
  --late:#8F4B00; --late-bg:#FBE8D2;
  --bad:#A8231A; --bad-bg:#FADFDB;
  --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Five text sizes: notes, small text, body, headings, page titles */
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem;
  /* The Overview's colors: the teacher's own */
  --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-none:#E3E5E8; --ov-ink:#1C2433;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;   /* the browser's own boxes, lists and scroll bars are dark too */
    --paper:#121822; --surface:#19212E; --line:#2B3546; --grid:#222B39;
    --ink:#E5E9F1; --muted:#A4AEBF; --faint:#8C96A8; --rule:#4E5A6E; --bar:#A9C2F5;
    --ok:#74D3A2; --ok-bg:#163428; --fin:#7FD3DB; --fin-bg:#14363A; --late:#F2B36B; --late-bg:#3D2A12;
    --bad:#F28B82; --bad-bg:#40201D;
    --focus:#7FA8FF; --btn:#A9C2F5; --btn-ink:#121822;
    --ov-engaged:#5E8F4B; --ov-excused:#4C78C4; --ov-idle:#C2A23A; --ov-away:#97577A; --ov-absent:#B44A4A; --ov-none:#262F3D; --ov-ink:#10151E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header: the name and privacy line on the left, the folder on the right, the tabs below */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 0 4px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;flex:none;max-width:100%}
.brand h1{font-size:var(--fs-lg);line-height:1.2;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.folder #reopen{min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder{margin-left:auto;display:flex;flex:1 1 0;min-width:0;justify-content:flex-end;flex-wrap:nowrap;align-items:center;gap:12px;white-space:nowrap}
.folder .where{color:var(--muted);font-size:var(--fs-sm);margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder .where b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:var(--fs-md)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:3px 9px;font-size:var(--fs-sm);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.folder .btn{height:32px;padding:0 14px;font-size:.875rem}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{flex:none;background:none;border:0;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-md);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
.savebar{font-size:var(--fs-sm);color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.savebar .linkish{color:var(--muted)}
.savebar .saved{color:var(--ok)}
.savebar .btn.warn{background:var(--late);border-color:var(--late);color:var(--surface)}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}
.helpbtn{align-self:center;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);cursor:pointer}
.helpbtn:hover{border-color:var(--muted)}
.helpbtn b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bar);color:var(--btn-ink);font-size:.75rem}

main.wrap{padding:22px 20px 60px}
.notice{border:1px solid var(--line);border-left:4px solid var(--late);background:var(--surface);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:var(--fs-md)}
.notice.info{border-left-color:var(--bar)}
.notice ul{margin:6px 0 0;padding-left:20px}
/* Messages float over the bottom corner, so nothing on the page moves when one comes or goes. */
#status{position:fixed;right:24px;bottom:24px;z-index:25;max-width:420px}
#status .notice{display:flex;align-items:baseline;gap:12px;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#status .linkish{margin-left:auto;flex:none}
#status .notice .linkish + .linkish{margin-left:12px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}

/* Start screen and set-up steps */
.start{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px;max-width:760px;margin-bottom:16px}
.start h2{font-size:var(--fs-xl);margin-bottom:6px}
.start ol{padding-left:22px;margin:14px 0 18px}
.start li{margin:8px 0}
.start .lead{font-size:var(--fs-md);margin:0 0 16px}
.start h3{font-size:var(--fs-md);font-family:var(--sans);margin:20px 0 0}
.start .actions{margin-top:0}
.startsetup{margin-top:18px}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps > li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--grid)}
.steps > li:first-child{border-top:0}
.steps .stepn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:var(--fs-sm);color:var(--muted)}
.steps > li.done .stepn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps > li.now .stepn{border-color:var(--bar);color:var(--ink)}
.steps > li.later{color:var(--muted)}
.steps details ol{margin:6px 0 0;padding-left:20px;font-size:var(--fs-sm)}
.steps details li{margin:3px 0}
.steps p{margin:2px 0 0;font-size:var(--fs-sm)}
.steps .actions{margin-top:8px}
.steps details{margin-top:8px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.demo-bar .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:auto}

/* Toolbar: one even 32px strip with one text size. Controls inside a popover keep their own sizes. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar > *{flex:none}
.toolbar .grow{flex:1 1 0}
.toolbar .tbend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;max-width:100%}
.toolbar :is(.search,.btn,summary.btn,select):not(.pop *){height:32px;font-size:var(--fs-sm)}
.toolbar :is(.btn,summary.btn):not(.pop *){display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 12px;cursor:pointer;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;min-width:220px}
.toolbar .search{width:200px;min-width:0;padding:0 10px}
.sortby{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sortby select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}
.listinfo{font-size:var(--fs-sm);color:var(--muted);margin:0 0 10px}

/* Date range: three presets and a "Custom dates…" menu in one segmented control, which never changes size. */
.seg.range{overflow:visible;flex-wrap:wrap;max-width:100%}
.seg.range > :first-child{border-radius:6px 0 0 6px}
.rangemenu > summary{display:block;width:10.5em;height:30px;line-height:30px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-sm);border-radius:0 6px 6px 0}
.rangemenu > summary.on{background:var(--bar);color:var(--btn-ink)}
.seg.range .pop{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.range label{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.range input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}

/* Small menus that open over the page, so nothing under them moves */
.menu{position:relative;display:inline-block}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column;gap:2px}
.menu .pop p{margin:0}
.dropline{display:flex;align-items:center;gap:8px;white-space:nowrap}
.menu input[type=date],.menu input[type=text]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.menu.formmenu .pop{width:460px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.formmenu label{display:grid;gap:3px;font-weight:600}
.formmenu label input{font-weight:400}
.menumsg{min-height:1.4em;color:var(--bad)}

/* Tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tablewrap.schwrap{overflow:visible}
table.sum{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
table.sum th{font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.sum tr:last-child td{border-bottom:0}
table.sum .num{text-align:right;white-space:nowrap}
table.sum .zero{color:var(--faint)}
table.sum .sub{display:block;font-size:var(--fs-sm);color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
.meter .fill{display:block;height:100%;background:var(--bar)}
.meter b{font-weight:600;min-width:38px;text-align:right}
.chip{display:inline-block;font-size:var(--fs-xs);font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap;vertical-align:1px}
.chip.due{background:var(--bad-bg);color:var(--bad)}
.chip.left{background:var(--grid);color:var(--muted)}
.chip.need{background:var(--late-bg);color:var(--late)}
.name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--ink)}
.nmline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.linkish{position:relative;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:var(--fs-sm)}
.linkish:hover{color:var(--ink)}
.linkish:disabled{color:var(--faint);cursor:default;text-decoration:none}
/* Text links get a hit area of at least 24px, so they're as easy to click as buttons, without moving anything. */
.linkish::after{content:"";position:absolute;inset:-5px -3px}
.subhead{font-family:var(--serif);font-size:var(--fs-lg);margin:22px 0 8px}

/* Panels (Setup, Study hall) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.panel h2{font-size:var(--fs-lg);margin-bottom:6px}
.panel > p{margin:0 0 10px}
.stack > * + *{margin-top:16px}
.two{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.1fr);gap:24px;align-items:start}
.set{display:grid;grid-template-columns:minmax(0,max-content) 64px minmax(0,max-content);gap:10px;align-items:center}
.set input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:64px}
.set .unit{color:var(--muted);font-size:var(--fs-sm)}
.setgrid{display:grid;grid-template-columns:max-content max-content;gap:10px 14px;align-items:center}
.setgrid input,.setgrid select,.settext input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;height:34px}
.setgrid input[type=time],.setgrid select{width:9.5em}
.settext{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 14px;align-items:center;max-width:620px}
.settext input{width:100%}
.wdays{display:flex;gap:14px;flex-wrap:wrap;border:0;margin:0;padding:0}
.wdays legend{padding:0;margin-bottom:4px;font-size:var(--fs-sm);color:var(--muted)}
.wdays label{display:inline-flex;gap:6px;align-items:center}
.psub{font-family:var(--sans);font-size:var(--fs-sm);font-weight:600;margin:12px 0 0}
.psub:first-child{margin-top:0}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-md);min-height:36px}
.list li > span:first-child{flex:1;min-width:0}
.list .when{color:var(--muted);font-size:var(--fs-sm);margin-left:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px;font-size:var(--fs-sm);line-height:1.4;resize:vertical}
textarea.stupaste{min-height:190px}
.lbl{display:block;font-weight:600;font-size:var(--fs-sm);margin-bottom:4px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.inl{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-sm)}
.inl input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font-size:var(--fs-sm)}
.formmsg{height:3em;overflow:hidden;margin:6px 0 0;font-size:var(--fs-sm)}
.formmsg.bad{color:var(--bad)}

/* Log a meeting: one row, always there, so nothing moves when it's used */
.logform{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-end}
.logform label{display:grid;gap:3px;font-size:var(--fs-sm);font-weight:600}
.logform label.grow{flex:1;min-width:0}
.logform select,.logform input{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 7px;font-size:var(--fs-sm);font-weight:400}
.logform select{width:13em}
.logform .btn{height:30px;flex:none}
.logform.na{visibility:hidden}
.logpanel{margin-bottom:16px;padding:16px 20px 10px}
.logpanel h2{margin-bottom:2px}
.logpanel > p{margin:0 0 10px}

/* Meetings list */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:5.2em minmax(9em,max-content) minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.mlist li:last-child{border-bottom:0}
.mlist li.none{display:block;color:var(--muted)}
.mlist .when{color:var(--ink);font-weight:600}
.mlist .how{color:var(--muted)}
.mlist .txt{min-width:0;overflow-wrap:anywhere}

/* Study hall switch: a menu that asks for the date, opening over the page */
.shmenu > summary{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 2px;cursor:pointer;border-radius:999px;font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.shmenu > summary:hover .swt{box-shadow:0 0 0 3px var(--grid)}
.swt{position:relative;display:inline-block;width:36px;height:20px;border-radius:999px;background:var(--rule);flex:none}
.swt::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.shmenu.on .swt{background:var(--ok)}
.shmenu.on .swt::after{left:18px}
.swl{display:inline-block;width:2em}
.shmenu .pop{width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.plist{list-style:none;margin:6px 0 0;padding:0}
.plist li{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm);min-height:40px}
.plist input,.paddrow input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.plist label,.paddrow label{display:inline-flex;gap:6px;align-items:center}
.paddrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:var(--fs-sm)}

/* Student page */
.sreport{max-width:960px}
.rbar [data-studentback]{min-width:9em}
.rbar .pn{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.rbar .pn > span{min-width:4.5em;text-align:center}
.toolbar.rbar .pn .btn{display:block;width:130px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .pnx{width:130px}
.rhead,.rsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rhead h2{font-size:var(--fs-xl);margin:0}
.rhead h2:focus{outline:none}
.rhead p{margin:2px 0;font-size:var(--fs-md)}
.rsec h3{font-size:var(--fs-lg);margin-bottom:10px}
.rsec h3 .small{font-family:var(--sans);font-weight:400}
.rsec h3.psub{font-family:var(--sans);font-size:var(--fs-md);margin:18px 0 0}
.rsec > p{margin:0 0 8px}
.rtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .l{font-size:.82rem;color:var(--muted)}
.tile .n{font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:proportional-nums}
.tile .s{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.tile.due .n{color:var(--bad)}
.dstrip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 6px}
.dstrip li{display:grid;justify-items:center;gap:2px;width:46px;font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.dstrip i{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:24px;border-radius:4px;font-style:normal;font-weight:700;color:var(--ov-ink)}
.dstrip .wd{font-size:.68rem}
.legend-line{font-size:var(--fs-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0}
.legend-line > span{display:inline-flex;gap:5px;align-items:center}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.notes li:last-child{border-bottom:0}
.notes .when{min-width:12em;color:var(--muted)}
.printonly{display:none}

/* Overview grid: the teacher's colors */
.c-engaged{background:var(--ov-engaged)} .c-excused{background:var(--ov-excused)} .c-idle{background:var(--ov-idle)}
.c-away{background:var(--ov-away)} .c-absent{background:var(--ov-absent)}
.c-none,.c-extra{background:var(--ov-none)}
.c-missing{background:var(--surface);color:var(--late)} .c-later{background:var(--surface)}
.c-none,.c-extra,.c-missing,.c-later{--ov-ink:var(--ink)}   /* marks on these days use the page ink, so they show in dark mode too */
.dstrip i.c-missing,.dstrip i.c-later{box-shadow:inset 0 0 0 1px var(--line)}
.dstrip i.c-missing{color:var(--late)}
.dstrip i.c-extra::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--ink);border-radius:2px}
/* The key above the grid: three labeled rows, always 86px, so the grid never moves. */
.ovkey{height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 10px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.ovkrow{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 14px;min-height:24px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.ovkrow > span{display:inline-flex;align-items:center;gap:5px}
.ovkey b{color:var(--ink)}
.ovkh{min-width:4.6em;color:var(--ink);font-weight:600}
.ovkend{margin-left:auto}
/* Quick mark: the key turns into the marks to pick from, in the same three rows, so the grid doesn't move */
.ovkey.marking{border-left:4px solid var(--focus);padding-left:7px}
.ovkey.marking .ovkrow{gap:2px 6px}
.ovkey.marking .ovchip{width:auto}
.ovkh2{margin-left:8px;color:var(--ink);font-weight:600}
.ovkey .qmsg{color:var(--late);font-weight:600}
.ovwrap.marking .ovb[data-ovcell]{cursor:copy}
.ovwrap.marking .ovb[data-ovcell]:hover{box-shadow:inset 0 0 0 2px var(--focus)}
.ovdropped{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:500;color:var(--muted);margin-bottom:10px;cursor:pointer}
.ovmarkbtn{min-width:9em}   /* fits "Done marking" too, so the button keeps its width */
#tab-overview .toolbar .search{width:150px}   /* room for Quick mark and Print on the same line */
.ovsw{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:2px;font-style:normal;font-size:var(--fs-xs);border:1px solid var(--line);position:relative}
.ovsw.ovnote-k{background:linear-gradient(225deg,var(--ink) 0 4px,var(--surface) 4px)}
.ovsw.c-extra::after{content:"";position:absolute;inset:1px;border:1.5px dashed var(--ink);border-radius:1px}
.ovsw.c-missing{color:var(--late);font-weight:700}
.ovwrap{position:relative;margin-top:8px}
.ovblock{position:relative;width:fit-content;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
.ovblock::-webkit-scrollbar{height:10px}
.ovblock::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.ovblock::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.ovt th.ovmo span{position:sticky;left:calc(var(--ovnamew, 170px) + 6px)}
table.ovt{border-collapse:separate;border-spacing:0;font-size:var(--fs-xs)}
.ovt th,.ovt td{padding:0;border-right:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.ovt thead th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--ink);font-weight:600;text-align:center;white-space:nowrap;padding:2px 1px;font-size:var(--fs-xs);font-variant-numeric:proportional-nums;line-height:1.25}
.ovt thead tr:nth-child(2) th{top:22px}
.ovt th.ovmo{text-align:left;color:var(--ink);padding-left:6px;height:22px;font-size:var(--fs-sm);line-height:17px}
.ovt th.today,.ovt th.today .ovwd{color:var(--focus)}
.ovwd{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--muted)}
.ovkind{display:block;font-size:.625rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.ovkind.sh{color:var(--ink)}
.ovt .wk{border-left:2px solid var(--rule)}
.ovt th.ovname{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 10px 0 8px;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);border-right:1px solid var(--line);font-size:var(--fs-md)}
.ovt th.ovname .name-btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration-color:transparent}
.ovt th.ovname .name-btn:hover{text-decoration-color:var(--ink)}
.ovleft{display:block;font-size:var(--fs-xs);font-weight:500;color:var(--muted);line-height:1.1}
.ovt thead th.ovcorner{z-index:4;vertical-align:bottom;padding-bottom:4px;color:var(--muted)}
.ovt thead th.ov1h{z-index:4;position:sticky;right:0;vertical-align:bottom;padding:0 10px 4px;text-align:left;color:var(--muted);border-left:1px solid var(--line)}
.ovt tbody tr:hover th.ovname{background:var(--paper)}
.ovc{width:38px;min-width:38px;height:26px}
.ovb{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;gap:1px;width:100%;height:26px;cursor:pointer;color:var(--ov-ink);font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em}
.ovb:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
/* Two-tone ring (ink outside, page color inside), so the focused or open day shows on every color in both themes */
.ovb:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:inset 0 0 0 4px var(--surface)}
.ovc.sel .ovb,.ov1c.sel .ovb{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 5px var(--surface)}
.c-extra .ovb::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--ov-ink);border-radius:2px;pointer-events:none}
.c-missing .ovb,.c-later .ovb{color:inherit}
.ovm{font-size:var(--fs-xs);color:var(--ov-ink)}
.ovb .ovm{position:absolute;right:2px;bottom:1px;line-height:1;font-size:.66rem}
.ovkey .ovm{color:var(--ink)}
.ovmsg{display:flex;align-items:center;height:26px;margin:10px 0 0;padding:0 6px;gap:7px;font-size:var(--fs-sm)}
.ovmsg input{width:14px;height:14px;margin:0;accent-color:var(--focus)}
@media (prefers-color-scheme: dark){ .ovmsg input{color-scheme:dark} }   /* a dark box, like the letters' boxes beside it */
.ovn,.dstrip .dn{position:absolute;top:0;right:0;width:0;height:0;border-top:7px solid var(--ov-ink);border-left:7px solid transparent}
.ovt td.ov1c{position:sticky;right:0;z-index:1;background:var(--surface);border-left:1px solid var(--line);width:136px;min-width:136px}
.ov1c .ovb{justify-content:flex-start;padding:0 10px;color:var(--ink);font-weight:500;white-space:nowrap}
.ov1c .ovb:hover{box-shadow:inset 0 0 0 2px var(--line)}
.ov1c.due .ovb{color:var(--bad);font-weight:700}
.ov1c.none .ovb{font-weight:700}
.ov1c.left .ovb{color:var(--muted)}
/* The day editor and the 1-on-1 box: every part is there on every day (one that doesn't apply is turned off, not
   left out), so the box is the same size on every day and when anything in it is pressed. */
.ovpop{position:absolute;z-index:10;width:480px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;font-size:var(--fs-sm)}
.ovpop-h{display:flex;flex-wrap:nowrap;align-items:baseline;gap:4px 10px;white-space:nowrap;min-width:0}
.ovpop-h b{font-size:var(--fs-md)}
.ovpop-h .muted{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ovx{margin-left:auto}
.ovfacts{min-height:1.5em;margin:6px 0 10px}
.ovcols{display:grid;grid-template-columns:230px 1fr;gap:0 20px}
.ovgrp{display:flex;flex-direction:column}
.ovchip,.ovlet{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:5px;padding:0 6px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink);width:100%;height:26px;justify-content:flex-start}
.ovchip[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ovchip:hover:not(:disabled),.ovlet:hover:not(:disabled){background:var(--grid)}
.ovchip:disabled,.ovlet:disabled{color:var(--faint);cursor:default}
.ovlet .tbox{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ovlet[aria-pressed="true"] .tbox{background:var(--focus);border-color:var(--focus)}
.ovlet[aria-pressed="true"] .tbox::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ovset{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:2px}
.ovset.on{background:var(--focus)}
.ovnoteb{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;margin:10px 0 6px}
.ovnoteb input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:var(--fs-sm)}
.ovpop-f{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.ov1pop{width:720px}
.ov1facts{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;min-height:2.2em;margin:6px 0 4px}
.ov1list{min-height:236px;border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);margin-bottom:10px}
/* One 1-on-1 in a list: date, time, what's known about it, then Held / Missed / Canceled and Edit */
.occlist{list-style:none;margin:0;padding:0}
.occlist li{display:grid;grid-template-columns:7.4em 5.6em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:4px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm);min-height:37px}
.occlist.named li{grid-template-columns:minmax(8em,11em) 7.4em 5.6em minmax(0,1fr) auto}
.occlist li:last-child{border-bottom:0}
.occlist li.none{display:block;color:var(--muted);min-height:0;padding:8px 0}
.occlist .when{font-weight:600}
.occlist .what{min-width:0;color:var(--muted);overflow-wrap:anywhere}
.occlist .acts{display:grid;grid-template-columns:auto 5.6em 2.6em;align-items:center;gap:12px;justify-items:start}
.occlist li.st-canceled .when,.occlist li.st-canceled .tm{color:var(--muted);text-decoration:line-through}
.chip.held{background:var(--ok-bg);color:var(--ok)}
.chip.missed{background:var(--bad-bg);color:var(--bad)}
.chip.canceled{background:var(--grid);color:var(--muted)}
.chip.unmarked{background:var(--late-bg);color:var(--late)}
.chip.today{background:var(--grid);color:var(--ink)}
.markseg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.markseg button{border:0;background:none;height:26px;padding:0 9px;font-size:var(--fs-xs);font-weight:600;color:var(--muted);cursor:pointer}
.markseg button + button{border-left:1px solid var(--line)}
.markseg button:hover:not(:disabled){background:var(--grid);color:var(--ink)}
.markseg button:disabled{color:var(--faint);opacity:.45;cursor:default}
.markseg button[aria-pressed="true"].v-held{background:var(--ok-bg);color:var(--ok)}
.markseg button[aria-pressed="true"].v-missed{background:var(--bad-bg);color:var(--bad)}
.markseg button[aria-pressed="true"].v-canceled{background:var(--grid);color:var(--ink)}
.menu.occmenu .pop,.menu.schmenu .pop{left:auto;right:0;width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.occmenu .row3,.schmenu .row3{display:flex;gap:10px;align-items:flex-end}
.occmenu label,.schmenu label{display:grid;gap:3px;font-weight:600}
.occmenu input,.occmenu select,.schmenu input,.schmenu select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-weight:400;height:30px}
.occmenu .grow{flex:1}
.menumsg:empty{display:none}
.menumsg{color:var(--bad);font-weight:600}
.daygrp{font-size:var(--fs-sm);font-weight:700;margin:12px 0 2px;color:var(--ink)}
.daygrp:first-child{margin-top:0}
.markpanel{border-left:4px solid var(--late)}
.markpanel .acts-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.schtxt{font-weight:600}
.chip.moved{background:var(--grid);color:var(--ink)}
.rsquick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rsquick .btn{font-weight:500}
.occmenu .pop p.lead{margin:0;color:var(--ink);font-weight:600}
/* IEP, 504, ML and caught-cheating tags by the student's name, their box, and the editor (from the intervention tracker) */
.plantag{display:inline-block;flex:none;font-size:var(--fs-xs);font-weight:700;line-height:1;padding:2px 4px;border-radius:4px;border:1px solid currentColor;color:var(--bar);vertical-align:1px;white-space:nowrap}
.ovnm{display:flex;align-items:center;gap:6px;min-width:0}
.plantag.mltag{color:var(--fin)}
button.plantag{background:none;font-family:inherit;cursor:pointer;margin:0}
button.plantag:hover,button.plantag[aria-expanded="true"]{background:color-mix(in srgb, currentColor 14%, transparent)}
.tagpop{position:absolute;z-index:30;width:320px;max-height:60vh;overflow:auto;box-sizing:border-box;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 14px 12px;font-size:var(--fs-sm)}
.tagpop[hidden]{display:none}
.tagpop-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.tagpop-h .linkish{margin-left:auto}
.tagpop-s{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.tagpop-s .plantag{margin-top:1px}
.tagpop ul{margin:2px 0 0;padding-left:18px}
.tagpop p{margin:2px 0 0}
.plantag.cheattag{color:var(--bad)}
.ovt th.ovname .ovnm .name-btn{min-width:0}
.ovt th.ovname .ovnm{max-width:202px}   /* a long name shortens with … so its tags still show */
.nmtag{display:inline-flex;align-items:center;gap:6px;min-width:0}
.planbox{display:grid;gap:6px}
.planrow{display:flex;gap:10px;align-items:flex-start}
.planset{border:1px solid var(--line);border-radius:6px;margin:0;padding:6px 10px 10px;display:grid;gap:8px}
.planset legend{font-weight:600;padding:0 4px}
.mlrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.mlrow label{display:inline-flex;gap:6px;align-items:center}
.mlrow input[type=text]{width:9em;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 7px}
.showmenu > summary{display:block;width:10.5em;height:30px;line-height:30px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-sm);border:1px solid var(--line);border-radius:6px;background:var(--surface);box-sizing:border-box}
.showmenu > summary.on{background:var(--bar);border-color:var(--bar);color:var(--btn-ink)}
.showmenu .pop{width:430px;padding:12px 14px;display:grid;gap:10px;font-size:var(--fs-sm)}
.shrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.shrow b{width:100%}
.shrow label,.shunder{display:inline-flex;gap:6px;align-items:center}
.shunder input[type=number]{width:56px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 6px}
.nmtag{display:inline-flex;align-items:center;gap:6px;min-width:0}
.ovpop-h .plantag{align-self:center}
.planbox{margin:8px 0 2px;font-size:var(--fs-sm)}
.planbox .plantag{margin-top:2px}
.planacc{margin:2px 0 0;padding-left:18px;columns:2;column-gap:32px}
.planacc li{break-inside:avoid}
.menu.planmenu .pop{left:auto;right:0;width:440px;padding:12px 14px;display:grid;gap:8px;font-size:var(--fs-sm)}
.planradios{display:flex;gap:18px}
.planradios label{display:inline-flex;gap:6px;align-items:center}
.planacclabel{display:grid;gap:4px;font-weight:600}
.planform textarea{min-height:130px;font-weight:400}
.planmsg{margin:0;min-height:1.4em;color:var(--bad)}
.fu{list-style:none;margin:0;padding:0}
.fu li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.fu .when{font-weight:600;min-width:4.6em}
.fu .txt{flex:1;min-width:8em;color:var(--muted);overflow-wrap:anywhere}
.fuform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fuform input,.fuform select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 7px;font-size:var(--fs-sm)}
.fuform input[data-chnote]{flex:1;min-width:14em}
/* The box for a whole day, opened from its date at the top of the grid */
.ovdh{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;border-radius:3px}
.ovdh:hover{background:var(--paper)}
.ovdh:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
.ovt th.dsel .ovdh{box-shadow:inset 0 0 0 2px var(--focus)}
.ovdpop{position:absolute;z-index:10;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:var(--fs-sm)}
.ovdpop p{margin:6px 0}
.ovdpop .actions{margin-top:8px}
/* The student page's name row: the name, then "Dropped from homeroom?" and "Delete student" at its right end */
.rname{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.dropbtns{margin-left:auto;display:inline-flex;align-items:baseline;gap:16px}
.menu.dropmenu .pop{left:auto;right:0;width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.rhead .dropmenu .pop p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.dropnote{margin:2px 0 6px;font-size:var(--fs-sm) !important;color:var(--late);font-weight:600}
.dropnote .linkish{font-weight:400}

.ov1pop .logform select{width:11em}
.logform input[type=time]{width:8.5em}
.ov1pop .logmsg{height:1.4em;margin:4px 0 0}
.ovlink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.ovlink select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:210px;font-size:var(--fs-sm)}
.logmsg{height:1.5em;margin:6px 0 0;font-size:var(--fs-sm);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.logmsg.bad{color:var(--bad)}

/* Help (a native dialog: Esc closes it, and focus stays inside) */
dialog.dlg{border:1px solid var(--line);border-radius:12px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--ink);box-shadow:0 16px 48px rgba(0,0,0,.28)}
dialog.dlg::backdrop{background:rgba(15,20,30,.45)}
.dlg-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:var(--fs-xl)}
.dlg-head .btn{margin-left:auto}
.dlg-body{padding:6px 22px 22px}
.dlg-body h3{font-size:var(--fs-lg);margin:20px 0 6px}
.dlg-body p,.dlg-body li{font-size:var(--fs-md);line-height:1.55}
.dlg-body ul,.dlg-body ol{padding-left:22px;margin:6px 0}
.dlg-body li{margin:3px 0}
.dlg-body .keyrow{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:6px 16px;align-items:baseline;margin:6px 0}
kbd{display:inline-block;min-width:1.6em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--paper);font:600 var(--fs-sm) var(--sans);text-align:center}
.helpkey{list-style:none;padding:0 !important;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px}
.helpkey li{display:flex;align-items:center;gap:8px;margin:0}
.faq dt{font-weight:600;margin-top:10px}
.faq dd{margin:2px 0 0;color:var(--ink)}
.skip{position:absolute;left:12px;top:-60px;z-index:40;background:var(--surface);color:var(--ink);border:2px solid var(--focus);border-radius:6px;padding:8px 12px;font-weight:600}
.skip:focus{top:8px}
main:focus{outline:none}

@media print{
  :root{
    --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
    --ink:#1C2433; --muted:#566074; --faint:#8790A0; --rule:#A3ACBA; --bar:#24324D;
    --ok:#1D6F47; --ok-bg:#DFF1E7; --fin:#11636C; --fin-bg:#D8EFF1; --late:#8F4B00; --late-bg:#FBE8D2; --bad:#A8231A; --bad-bg:#FADFDB;
    --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
    --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-none:#E3E5E8; --ov-ink:#1C2433;
  }
  @page{margin:.5in}
  body{background:#fff}

<script>

const pct = (n, d) => d ? Math.round(n / d * 100) : null;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;

// First name, for short labels. Handles "Diaz, Ana" too.

/* ---------------- The data file ---------------- */
function defaultData(){

  }

function parseCSV(text){

  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));

  for (const r of rows.slice(hi + 1)){

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));
  const steps = [
    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []
  ];
  return (raw, email) => {
    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

function namedIn(title, students){

  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  const A = analyze(); state.lastAnalysis = A;
  if (!A.students.length){ el.innerHTML = setupCard(A); return; }
  const today = todayDk(), all = A.students.map(s => ({ s, o: oneStats(s) })), cur = all.filter(x => isCurrent(x.s));
  const sub = t => `<span class="small muted" style="font-family:var(--sans);font-weight:400">· ${t}</span>`;
  let h = `<div class="toolbar">${rangeBar()}<span class="grow"></span><button class="btn small ghost" data-printlist>Print</button></div>
    <h2 class="printonly ptitle">1-on-1s · printed ${esc(monDay(today))}, ${new Date().getFullYear()}</h2>`;
  // To mark: every past meeting that isn't marked yet, oldest first.
  const toMark = all.flatMap(x => x.o.toMark.map(o => ({ o, name: x.s.name }))).sort((a, b) => a.o.date.localeCompare(b.o.date) || (a.o.time || '').localeCompare(b.o.time || '') || a.name.localeCompare(b.name));
  if (toMark.length) h += `<div class="panel markpanel noprint" style="margin-bottom:16px"><div class="acts-top"><h2>To mark</h2><span class="small muted">${plural(toMark.length, 'meeting')} that already happened, or should have</span><span class="grow"></span>
      <button class="btn small ghost" data-markallheld>Mark all as held</button></div>
    <ul class="occlist named">${toMark.map(x => occLi(x.o, x.name)).join('')}</ul></div>`;
  // Coming up: the next two weeks, by day.
  const up = cur.flatMap(x => x.o.all.filter(o => o.date >= today && o.date <= addDays(today, 13) && !(o.state === 'unmarked')).map(o => ({ o, name: x.s.name })))
    .sort((a, b) => a.o.date.localeCompare(b.o.date) || (a.o.time || '').localeCompare(b.o.time || '') || a.name.localeCompare(b.name));
  const byDay = []; for (const x of up){ if (!byDay.length || byDay[byDay.length - 1].dk !== x.o.date) byDay.push({ dk: x.o.date, list: [] }); byDay[byDay.length - 1].list.push(x); }
  h += `<h2 class="subhead">Coming up ${sub('the next two weeks')}</h2><div class="panel">${byDay.length ? byDay.map(d => `<div class="daygrp">${esc(d.dk === today ? `Today, ${monDay(d.dk)}` : longDate(d.dk))}</div>
    <ul class="occlist named">${d.list.map(x => occLi(x.o, x.name)).join('')}</ul>`).join('') : '<p class="small muted" style="margin:0">No 1-on-1s in the next two weeks.</p>'}</div>`;
  // Schedules: one row per student on the list.
  const order = { none: 0, mark: 1, missed: 2, ok: 3 };
  cur.sort((a, b) => order[a.o.status] - order[b.o.status] || a.s.name.localeCompare(b.s.name));
  h += `<h2 class="subhead">Schedules ${sub('each student’s standing 1-on-1')}</h2>
    <div class="tablewrap schwrap"><table class="sum"><thead><tr><th>Student</th><th>Schedule</th><th>Next</th><th>Held in these dates</th><th>Last held</th><th class="noprint"><span class="sr">Change</span></th></tr></thead><tbody>
    ${cur.map(({ s, o }) => `<tr><td><button class="name-btn" data-openstudent="${esc(s.key)}">${esc(s.name)}</button></td>
      <td>${o.sched ? `${esc(schedText(o.sched))}${o.sched.later ? `<span class="sub">starting ${esc(monDay(o.sched.from))}</span>` : ''}` : '<span class="chip due">No schedule</span>'}</td>
      <td>${o.next ? `${esc(occWhen(o.next))}${o.next.moved ? '<span class="sub">moved</span>' : ''}` : '<span class="zero">—</span>'}</td>
      <td>${o.pct !== null || o.canceled ? `${meter(o.pct)}<span class="sub">${esc(oneText(o))}</span>` : '<span class="zero">—</span>'} ${oneChip(o)}</td>
      <td>${o.lastHeld ? esc(shortDate(o.lastHeld.date)) : '<span class="zero">—</span>'}</td>
      <td class="noprint">${schedMenu(s)}</td></tr>`).join('')}
    </tbody></table></div>`;
  h += `<div class="panel logpanel noprint" style="margin-top:16px"><h2>Add a meeting</h2><p class="small muted">An extra 1-on-1 off the schedule, like a phone call or a talk after class. To move a scheduled one, use <b>Reschedule</b> on it instead.</p>
    ${logForm('')}${logMsgHTML('tab')}</div>`;
  // Every meeting in the dates shown, newest first.
  const past = all.flatMap(x => x.o.all.filter(o => o.date <= today && inRange(o.date) && o.state !== 'unmarked').map(o => ({ o, name: x.s.name })))
    .sort((a, b) => b.o.date.localeCompare(a.o.date) || (b.o.time || '').localeCompare(a.o.time || '') || a.name.localeCompare(b.name));
  h += `<h2 class="subhead">Meetings in these dates ${sub(plural(past.length, 'meeting'))}</h2>`;
  h += past.length ? `<div class="panel"><ul class="occlist named">${past.map(x => occLi(x.o, x.name)).join('')}</ul></div>`
    : `<p class="muted">No 1-on-1s in these dates.${state.range.preset !== 'all' ? ' <button class="linkish" data-range="all">Show all dates</button>' : ''}</p>`;
  h += `<p class="small muted" style="margin-top:10px">Held in these dates: meetings held out of those held or missed. Canceled meetings, and a missed meeting that was made up, aren’t counted. A Zoom report within half an hour of a meeting’s time marks it held (showing how late the student joined) or a no-show; a meeting with them on another day that week is the make-up, or the meeting moved.</p>`;
  el.innerHTML = h;
}

function shTurnOn(key, from){
  state.data.studyHall[key] = normPeriods([...shPeriods(key), { from }]); changed();
}
function shTurnOff(key, to){
  const p = openPeriod(key); if (!p) return;
  const list = shPeriods(key).filter(x => x !== p);
  if (to > p.from) list.push({ from: p.from, to });
  if (list.length) state.data.studyHall[key] = normPeriods(list); else delete state.data.studyHall[key];
  changed();
}

// A pasted list: one name per line (a column copied from a spreadsheet works too). Headers and blank lines are skipped.
function addStudents(text, from){
  const D = state.data, have = new Map(D.students.map(s => [s.key, s])), added = [], back = [], skipped = [];
  for (const line of String(text).split(/\r?\n/)){
    const name = line.split('\t').map(x => x.trim()).find(Boolean)?.replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 120) || '';
    const key = normKey(name);
    if (!key || /^(student( full)?( name)?|names?|full name)$/.test(key)) continue;
    const s = have.get(key);
    if (s){ if (!isCurrent(s)){ delete s.removed; back.push(s.name); } else if (!added.includes(s.name)) skipped.push(s.name); continue; }
    const st = { key, name, added: from };
    D.students.push(st); have.set(key, st); added.push(name);
  }
  if (added.length || back.length) changed();
  return { added, back, skipped };
}
// A new spelling moves the student's marks, notes, study hall dates and meetings with them, and the old spelling stays
// linked to them, so Zoom names that matched it still do (it's listed under Zoom names on Setup, where it can be unlinked).
function renameKey(oldK, newK){
  const D = state.data;
  if (!D.aliases[oldK]) D.aliases[oldK] = newK;
  for (const k of Object.keys(D.status)){ const [dk, kind, ...rest] = k.split('|'); if (rest.join('|') === oldK){ const nk = `${dk}|${kind}|${newK}`; if (!D.status[nk]) D.status[nk] = D.status[k]; delete D.status[k]; } }
  if (D.studyHall[oldK]){ D.studyHall[newK] = normPeriods([...(D.studyHall[newK] || []), ...D.studyHall[oldK]]); delete D.studyHall[oldK]; }
  if (D.meetings[oldK]){ D.meetings[newK] = [...(D.meetings[newK] || []), ...D.meetings[oldK]]; delete D.meetings[oldK]; }
  for (const x of ['plans', 'ml']) if (D[x][oldK]){ if (!D[x][newK]) D[x][newK] = D[x][oldK]; delete D[x][oldK]; }
  if (D.cheating[oldK]){ D.cheating[newK] = [...(D.cheating[newK] || []), ...D.cheating[oldK]]; delete D.cheating[oldK]; }
  if (D.oneSched[oldK]){ if (!D.oneSched[newK]) D.oneSched[newK] = D.oneSched[oldK]; delete D.oneSched[oldK]; }
  for (const k of Object.keys(D.oneMarks)){ const i = k.lastIndexOf('|'); if (k.slice(0, i) === oldK){ const nk = `${newK}|${k.slice(i + 1)}`; if (!D.oneMarks[nk]) D.oneMarks[nk] = D.oneMarks[k]; delete D.oneMarks[k]; } }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}

/* The sample class: made-up students, kept in memory only and never saved. Four weeks of homeroom Mondays and study hall

function sampleFolder(){
  let seed = 2026;   // the same sample every time

  const today = todayDk(), wk = weekKey(today), mon0 = addDays(wk, wk < today ? -21 : -28), mons = [0, 1, 2, 3].map(i => addDays(mon0, 7 * i));
  const teacher = 'Jordan Rivera';
  const names = ['Amara Okafor', 'Ben Whitfield', 'Carmen Reyes', 'Dev Patel', 'Elif Demir', 'Felix Wagner', 'Grace Lin', 'Hugo Martins', 'Isabel Cruz', 'Jonah Brooks'];
  const students = names.map(n => ({ key: normKey(n), name: n, added: n === 'Jonah Brooks' ? mons[1] : mon0, ...(n === 'Felix Wagner' ? { removed: mons[3] } : {}) }));
  const studyHall = { 'carmen reyes': [{ from: mon0 }], 'dev patel': [{ from: mon0, to: mons[2] }], 'isabel cruz': [{ from: mons[2] }], 'hugo martins': [{ from: mons[3] }] };
  const zt = (dk, m) => { const [y, mo, d] = dk.split('-'), h = Math.floor(m / 60); return `${mo}/${d}/${y} ${pad(h % 12 || 12)}:${pad(m % 60)}:00 ${h >= 12 ? 'PM' : 'AM'}`; };
  const mdY = dk => { const [y, m, d] = dk.split('-'); return `${m}-${d}-${y}`; };
  const files = [], listed = (n, dk) => onList(students.find(s => s.name === n), dk);
  const file = (name, dk, rows, topic) => files.push({ name, modified: Date.now(), text: (topic ? `Meeting ID,Topic,Start Time,End Time,User Email,Duration (Minutes),Participants\n812 3456 7890,${csvCell(topic)},${zt(dk, rows[0][1])},${zt(dk, rows[0][2])},,${rows[0][2] - rows[0][1]},${rows.length}\n\n` : '')
    + 'Name (Original Name),User Email,Join Time,Leave Time,Duration (Minutes),Guest,In Waiting Room\n'
    + rows.map(([n, a, b]) => [csvCell(n), '', zt(dk, a), zt(dk, b), b - a, 'No', 'No'].join(',')).join('\n') + '\n' });

      if (n === 'Isabel Cruz' && i === 2) iv = [[8 * 60 + 29, 8 * 60 + 40], [8 * 60 + 44, 9 * 60]];

  let j = 0;

    for (const n of names){
      const k = normKey(n); if (!listed(n, dk)) continue;
      const c = need(k, dk) ? (count[k] = (count[k] || 0) + 1) - 1 : -1;   // which of the student's required days this is
      let iv = [];

        if (n === 'Carmen Reyes' && c === 4) iv = [[14 * 60 + 12, 15 * 60]];
        if (n === 'Dev Patel' && c === 1) iv = [];

  // late once). Ben didn't show up for his first one (the meeting's report has only the teacher) and met the next day
  // instead; Amara's second one happened a day later than scheduled; Dev's was canceled; Carmen's first one was moved to
  // Friday by hand; Grace's was a phone call; the latest ones with Hugo and Isabel have no report yet (to mark); and Jonah
  // has no schedule yet.
  const sched = { 'Amara Okafor': [2, '15:30', 2], 'Ben Whitfield': [3, '15:30', 2], 'Carmen Reyes': [9, '16:00', 2], 'Dev Patel': [0, '15:30', 2],
    'Elif Demir': [4, '10:00', 1], 'Felix Wagner': [1, '15:30', 2], 'Grace Lin': [10, '16:00', 2], 'Hugo Martins': [7, '16:00', 2], 'Isabel Cruz': [11, '15:30', 2] };
  const special = { 'Ben Whitfield': { 0: { noShow: 1 }, 1: { late: 9 } }, 'Amara Okafor': { 1: { metOn: 1 } },

      if (x.zoom === false || (['Hugo Martins', 'Isabel Cruz'].includes(n) && dk >= addDays(today, -12))) continue;

  const club = back(2);   // five students: not a 1-on-1
  file(`zoom-chess-club-${mdY(club)}.csv`, club, [[teacher, 15 * 60 + 28, 16 * 60 + 18], ...['Amara Okafor', 'Ben Whitfield', 'Dev Patel', 'Elif Demir', 'Hugo Martins'].map(n => [n, 15 * 60 + 30, 16 * 60 + 15])]);
  const data = { version: 1, settings: { ...defaultData().settings, teacherName: teacher }, students, studyHall, aliases: {}, ignored: [], oneSched, oneMarks,

  return { files, dataText: JSON.stringify(data) };
}

function csvCell(v){
  let s = String(v ?? '');
  if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   // keep spreadsheets from treating names as formulas
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
function downloadFile(name, text, type, note = ' Look for it in your Downloads folder.'){
  const blob = new Blob([text], { type });

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

}

function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('homeroom-tracker', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e){ return null; } }
async function idbSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e){ /* remembering the folder is a convenience */ } }

function okToSwitch(folderName){
  return !(state.loaded && state.dirty && !state.demo && folderName !== state.folderName)
    || confirm('Some changes aren’t saved in the folder yet. Click Cancel, then “Download my data” on the Setup tab to keep them. Or click OK to open this folder without them.');
}
async function pickFolder(){
  if (!HAS_FSA){ $('#folderInput').value = ''; $('#folderInput').click(); return; }
  try {
    const h = await window.showDirectoryPicker({ id: 'homeroom', mode: 'readwrite' });
    if (!okToSwitch(h.name)) return;
    state.dirHandle = h; state.savedHandle = h; await idbSet('dir', h);
    await loadFromHandle();
  } catch (e){ if (e && e.name !== 'AbortError') setStatus(folderError(e)); }
}
function folderError(e){
  return e && /Security|NotAllowed/.test(e.name) ? 'Your browser won’t open that folder, because it keeps some folders (like Desktop or Downloads itself) off-limits. Make a folder inside one of them, like “Homeroom” in Documents, and choose that.'
    : `That folder couldn’t be opened. Try choosing it again. If it keeps happening, close the tab and open this file again.${e && e.message ? ` (${e.message})` : ''}`;
}
async function reopen(){
  const h = state.dirHandle || state.savedHandle; if (!h) return pickFolder();
  try {
    let p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted'){
      const r = await h.requestPermission({ mode: 'read' });
      if (r !== 'granted'){ setStatus('Access to the folder wasn’t allowed. Click “Open homeroom folder” to try again.'); return; }
    }
    state.dirHandle = h; await loadFromHandle();
  } catch (e){ setStatus(`Your folder from last time couldn’t be opened. It may have been moved or renamed. Click “Open homeroom folder” and choose it again.${e && e.message ? ` (${e.message})` : ''}`); state.savedHandle = null; renderFolderBar(); if (!state.loaded) renderCurrent(); }
}
async function loadFromHandle(){
  const h = state.dirHandle, files = []; let dataText = null;
  setStatus(`Reading ${h.name}…`, 'info');
  for await (const [name, entry] of h.entries()){
    if (entry.kind !== 'file') continue;
    const low = name.toLowerCase();
    if (low === DATA_FILE) dataText = await (await entry.getFile()).text();
    else if (low.endsWith('.csv')){ const file = await entry.getFile(); files.push({ name, text: await file.text(), modified: file.lastModified }); }
  }
  state.canWrite = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
  ingest(files, dataText, h.name);
}
async function loadFromInput(list){
  const files = []; let dataText = null, folder = '';
  for (const f of list){
    const low = f.name.toLowerCase();
    if (!folder && f.webkitRelativePath) folder = f.webkitRelativePath.split('/')[0];
    if (f.webkitRelativePath && f.webkitRelativePath.split('/').length > 2) continue;   // files in folders inside it aren't read
    if (low === DATA_FILE) dataText = await f.text();
    else if (low.endsWith('.csv')) files.push({ name: f.name, text: await f.text(), modified: f.lastModified });
  }
  if (!okToSwitch(folder)) return;
  state.dirHandle = null; state.canWrite = false;
  ingest(files, dataText, folder);
}
function ingest(files, dataText, folderName, demo = false){
  let msg = null, info = false;
  const same = state.loaded && !state.demo && !demo && folderName === state.folderName, had = new Set(state.files.map(f => f.name));
  // Refreshing the same folder keeps changes that haven't reached the folder yet, instead of reloading the older file.
  const keep = same && state.dirty;
  if (keep){ msg = 'Your changes that aren’t saved in the folder yet were kept.'; info = true; }
  else if (dataText){
    try { state.data = withDefaults(JSON.parse(dataText)); }
    catch (e){
      // Nothing is saved over a file that couldn't be read, until the teacher allows it.
      state.data = defaultData(); state.canWrite = false;
      msg = `${DATA_FILE} couldn’t be read, so your students and settings weren’t loaded. Nothing will be saved over it unless you allow saving.`;
    }
  }
  else if (!same) state.data = defaultData();   // a different folder with no data file starts empty
  state.files = files.sort((a, b) => a.name.localeCompare(b.name));
  if (same && !msg){ const fresh = state.files.filter(f => !had.has(f.name)); msg = fresh.length ? `Found ${plural(fresh.length, 'new file')}: ${listJoin(fresh.map(f => f.name), 3)}.` : 'Up to date. No new files in the folder.'; info = true; }
  state.demo = demo; if (demo){ state.dirHandle = null; state.canWrite = false; }   // the sample is never saved into a folder
  if (!same){ state.undo = []; state.redo = []; state.student = null; state.ovSel = null; state.ov1 = null; state.ovDay = null; state.dropEdit = null; state.ovMark = null; state.ovScroll = null; state.logMsg = null; state.logKey = ''; }
  state.snap = JSON.stringify(state.data); state.saveFailed = false;
  state.folderName = folderName; state.loaded = true; state.dirty = keep;
  state.status = null;
  render(); navReplace(); setStatus(msg, info ? 'info' : undefined);
  if (keep && state.dirHandle && state.canWrite) changed();
}
let saveTimer = null, undoOpen = false;
// Every change keeps the data as it was before, for Undo. The changes one click makes are one step.
function changed(){
  const now = JSON.stringify(state.data);
  if (state.snap !== null && now !== state.snap && !undoOpen){
    state.undo.push(state.snap); if (state.undo.length > 100) state.undo.shift();
    state.redo = []; undoOpen = true; setTimeout(() => { undoOpen = false; });
  }
  state.snap = now;
  state.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); renderSaveState();
}
// Undo (or Redo) puts the data back as it was, saves it, and redraws. Boxes open on something that may be gone close.
function undo(redo){
  const from = redo ? state.redo : state.undo, to = redo ? state.undo : state.redo;
  if (!state.loaded || !from.length) return;
  to.push(state.snap); state.data = withDefaults(JSON.parse(from.pop())); state.snap = JSON.stringify(state.data);
  Object.assign(state, { ovSel: null, ov1: null, ovDay: null, dropEdit: null, chEdit: null, planEdit: null, logMsg: null });
  if (state.student && !state.data.students.some(s => s.key === state.student)) state.student = null;
  state.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 300);
  render();
  setStatus(redo ? 'Put the change back.' : 'Undid your last change.', 'info', redo ? (state.undo.length ? { label: 'Undo', act: 'undo' } : null) : { label: 'Redo', act: 'redo' });
}
async function save(){
  if (state.demo || !(state.dirHandle && state.canWrite)){ renderSaveState(); return; }
  state.saving = true; renderSaveState();
  try {
    const fh = await state.dirHandle.getFileHandle(DATA_FILE, { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(state.data, null, 2)); await w.close();
    state.dirty = false; state.saveFailed = false;
  } catch (e){
    state.canWrite = false;
    if (!state.saveFailed) setStatus('Your changes couldn’t be saved in the folder. They’re still here on the page. Click “Allow saving” to try again.', undefined, { label: 'Allow saving', act: 'grantsave' });
    state.saveFailed = true;
  }
  state.saving = false; renderSaveState();
}
async function grantSave(){
  try {
    if (state.dirHandle && (await state.dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted'){ state.canWrite = true; await save(); setStatus(state.dirty ? null : 'Saved.', 'info'); renderCurrent(); return; }
  } catch (err){ /* said below */ }
  setStatus('Saving is still off. You can download the data file instead and put it in your folder.', undefined, { label: 'Download data file', act: 'download' });
}
function downloadData(){
  downloadFile(DATA_FILE, JSON.stringify(state.data, null, 2), 'application/json', state.dirHandle && state.canWrite ? undefined : ` Move it into ${state.folderName || 'your homeroom folder'}, replacing the old one.`);
}

/* ---------------- Moving between screens ----------------
   Each student page is a browser history entry (the address never changes), so the browser's Back button goes back a
   screen instead of leaving the page. */
let navSeq = 0;
const NAV_LOAD = String(Date.now() + Math.random());
const navSnap = () => ({ load: NAV_LOAD, seq: navSeq, tab: state.tab, student: state.student, via: state.studentTab || null });
function navReplace(){ try { history.replaceState(navSnap(), ''); } catch (e){ /* not available in every frame */ } }
function navPush(){ navSeq++; try { history.pushState(navSnap(), ''); } catch (e){ /* not available in every frame */ } }
const navCanGoBack = () => !!(history.state && history.state.seq > 0 && history.state.load === NAV_LOAD);
function openStudent(key){
  navReplace();
  state.studentTab = state.tab === 'students' ? null : state.tab; state.tab = 'students'; state.student = key; state.chEdit = null; state.ovSel = null; state.ov1 = null; state.ovDay = null; state.logMsg = null;
  navPush(); render(); window.scrollTo(0, 0);

}
function studentBack(){

  state.tab = state.studentTab || 'students'; state.student = null; render(); navReplace(); focusStudentLink(key);

const visible = sel => [...document.querySelectorAll(sel)].find(el => el.offsetParent !== null);

const cellSel = xk => `[data-ovcell="${CSS.escape(xk)}"]`, oneSel = key => `[data-ov1="${CSS.escape(key)}"]`;
function revealOvCell(b){

function logMeeting(form, where){
  const key = form.dataset.logform || (form.querySelector('[data-logkey]') || {}).value || '', date = form.querySelector('[data-logdate]').value, time = form.querySelector('[data-logtime]').value.slice(0, 5), note = form.querySelector('[data-lognote]').value.trim().slice(0, 300);
  const say = (text, bad) => { state.logMsg = { where, text, bad }; const p = form.parentElement.querySelector('.logmsg'); if (p){ p.textContent = text; p.classList.toggle('bad', !!bad); } };
  if (!key){ say('Choose a student first.', true); form.querySelector('[data-logkey]').focus(); return; }
  if (!isDk(date)){ say('Choose a date.', true); form.querySelector('[data-logdate]').focus(); return; }
  const s = state.data.students.find(x => x.key === key); if (!s) return;
  const past = date < todayDk();
  state.data.meetings[key] = [...(state.data.meetings[key] || []), { id: uid(), date, time: isHm(time) ? time : '', st: past ? 'held' : '', note }];
  state.logKey = form.dataset.logform ? state.logKey : key;
  state.logMsg = { where, text: past ? `Added a 1-on-1 with ${s.name} on ${shortDate(date)}, marked held.` : `Added a 1-on-1 with ${s.name} on ${shortDate(date)}.` };
  changed(); renderCurrent();
}
// A meeting's id: "studentKey|s|scheduled date" for one on the schedule, "studentKey|x|id" for an extra one.
function occParse(id){ const p = id.split('|'), ref = p.pop(), kind = p.pop(); return { key: p.join('|'), kind, ref }; }
function occPatch(id, patch){
  const { key, kind, ref } = occParse(id), D = state.data;
  if (kind === 's'){
    const k = `${key}|${ref}`, m = { ...(D.oneMarks[k] || {}), ...patch };
    for (const x of Object.keys(m)) if (m[x] === undefined || m[x] === '') delete m[x];
    if (Object.keys(m).length) D.oneMarks[k] = m; else delete D.oneMarks[k];
  } else {
    const m = (D.meetings[key] || []).find(x => x.id === ref); if (!m) return;
    Object.assign(m, patch); for (const x of ['st', 'time', 'note']) if (m[x] === undefined) m[x] = '';
  }
}
function occFind(id){ const { key } = occParse(id), s = state.data.students.find(x => x.key === key); return s ? meetingsOf(s).find(o => occId(o) === id) : null; }
function addPeriodFromRow(li){
  const [key, i] = li.dataset.period.split('|'), from = li.querySelector('[data-shfrom]').value, to = li.querySelector('[data-shto]').value, ps = [...shPeriods(key)];
  const say = text => { state.logMsg = { where: 'sh', text, bad: true }; renderCurrent(); };
  if (!isDk(from)) return say('Each “Starting” needs a date.');
  if (to && (!isDk(to) || to <= from)) return say('“Done starting” has to be after “Starting”.');
  ps[+i] = to ? { from, to } : { from };
  state.data.studyHall[key] = normPeriods(ps); state.logMsg = null; changed(); renderCurrent();
}

  if (e.key === 'Escape' && (state.ovSel || state.ov1)){ const was = state.ovSel ? cellSel(state.ovSel) : oneSel(state.ov1); state.ovSel = null; state.ov1 = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') to = at(r, c + 1);
  else if (e.key === 'ArrowLeft') to = at(r, c - 1);
  else if (e.key === 'ArrowDown') to = at(r + 1, c);
  else if (e.key === 'ArrowUp') to = at(r - 1, c);
  else if (e.key === 'Home' || e.key === 'End'){
    const pool = (e.ctrlKey ? all : all.filter(b => +b.dataset.r === r)).sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.c - +y.dataset.c));
    to = e.key === 'Home' ? pool[0] : pool[pool.length - 1];
  }
  else return;
  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus({ preventScroll: true }); to.scrollIntoView({ block: 'nearest', inline: 'nearest' }); revealOvCell(to);
}
document.addEventListener('toggle', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('menu')) return;
  if ('rangemenu' in el.dataset) state.rangeMenu = el.open;
  if ('dropmenu' in el.dataset) state.dropEdit = el.open ? el.dataset.dropmenu : null;
  if ('planmenu' in el.dataset){ state.planEdit = el.open ? el.dataset.planmenu : null; if (el.open){ const r = el.querySelector('[data-plantype]:checked'); if (r) r.focus(); return; } }
  if (!el.open) return;
  // A menu opens rightward unless that would run off the window; its first box gets focus.
  const pop = el.querySelector('.pop'); pop.style.left = '0'; pop.style.right = 'auto';
  if (pop.getBoundingClientRect().right > Math.min(innerWidth, (document.querySelector('main') || document.body).getBoundingClientRect().right) - 8){ pop.style.left = 'auto'; pop.style.right = '0'; }
  if (!('rangemenu' in el.dataset)){ const i = pop.querySelector('input'); if (i) i.focus(); }
}, true);
// Scrolling the grid sideways: remember where it is, and keep an open box beside its day.
document.addEventListener('scroll', e => {
  if (!e.target.classList || !e.target.classList.contains('ovblock') || state.ovPrintAll) return;
  state.ovScroll = e.target.scrollLeft; pinMonths(e.target); placeOvPop(); placeOvDay();
}, true);
window.addEventListener('resize', () => { placeOvPop(); placeOvDay(); });
document.querySelectorAll('dialog.dlg').forEach(dl => dl.addEventListener('click', e => {
  const r = dl.getBoundingClientRect();
  if (e.target === dl && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dl.close();
}));
$('.skip').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
window.addEventListener('popstate', e => {
  const s = e.state || {}, leaving = state.student;
  navSeq = s.seq || 0;
  state.tab = s.tab || 'overview'; state.student = s.student || null; state.studentTab = s.via || null; state.ovSel = null; state.ov1 = null; state.ovDay = null; state.dropEdit = null; state.logMsg = null;
  render();
  if (state.student){ const h = $('#tab-students h2[tabindex]'); if (h) h.focus({ preventScroll: true }); }
  else if (leaving) focusStudentLink(leaving);
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
window.addEventListener('beforeprint', () => {
  // The Overview prints in landscape, every day shown, in blocks that fit the page.
  if (state.tab === 'overview' && state.loaded){
    let ps = $('#ovPage'); if (!ps){ ps = document.createElement('style'); ps.id = 'ovPage'; document.head.append(ps); }
    ps.textContent = '@page{size:landscape;margin:.4in}';
    document.body.classList.add('print-ov'); state.ovPrintAll = true; renderOverview();
  }
});
window.addEventListener('afterprint', () => {
  if (state.ovPrintAll){ state.ovPrintAll = false; renderOverview(); }
  const ps = $('#ovPage'); if (ps) ps.remove();
  document.body.classList.remove('print-ov');
});
window.addEventListener('beforeunload', e => { if (state.dirty && !state.demo && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; render();   // the start screen now offers this folder
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){ /* the start screen offers it */ }
})();
</script>
