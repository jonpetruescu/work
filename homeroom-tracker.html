<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: this page may not load anything over the network or send anything anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeroom tracker</title>
<style>
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
  --ink:#1C2433; --muted:#566074; --faint:#626B7D; --rule:#A3ACBA; --bar:#24324D;
  --ok:#1D6F47; --ok-bg:#DFF1E7;
  --late:#8F4B00; --late-bg:#FBE8D2;
  --bad:#A8231A; --bad-bg:#FADFDB;
  --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Five text sizes: notes, small text, body, headings, page titles */
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem;
  /* The Overview's colors: the teacher's own */
  --ov-present:#93C47D; --ov-excused:#6D9EEB; --ov-absent:#E06666; --ov-none:#E3E5E8; --ov-ink:#1C2433;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;   /* the browser's own boxes, lists and scroll bars are dark too */
    --paper:#121822; --surface:#19212E; --line:#2B3546; --grid:#222B39;
    --ink:#E5E9F1; --muted:#A4AEBF; --faint:#8C96A8; --rule:#4E5A6E; --bar:#A9C2F5;
    --ok:#74D3A2; --ok-bg:#163428; --late:#F2B36B; --late-bg:#3D2A12;
    --bad:#F28B82; --bad-bg:#40201D;
    --focus:#7FA8FF; --btn:#A9C2F5; --btn-ink:#121822;
    --ov-present:#5E8F4B; --ov-excused:#4C78C4; --ov-absent:#B44A4A; --ov-none:#262F3D; --ov-ink:#10151E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header: the name and privacy line on the left, the folder on the right, the tabs below */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 0 4px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;flex:none;max-width:100%}
.brand h1{font-size:var(--fs-lg);line-height:1.2;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.folder #reopen{min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder{margin-left:auto;display:flex;flex:1 1 0;min-width:0;justify-content:flex-end;flex-wrap:nowrap;align-items:center;gap:12px;white-space:nowrap}
.folder .where{color:var(--muted);font-size:var(--fs-sm);margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder .where b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:var(--fs-md)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:3px 9px;font-size:var(--fs-sm);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.folder .btn{height:32px;padding:0 14px;font-size:.875rem}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{flex:none;background:none;border:0;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-md);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
.savebar{font-size:var(--fs-sm);color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.savebar .linkish{color:var(--muted)}
.savebar .saved{color:var(--ok)}
.savebar .btn.warn{background:var(--late);border-color:var(--late);color:var(--surface)}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}
.helpbtn{align-self:center;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);cursor:pointer}
.helpbtn:hover{border-color:var(--muted)}
.helpbtn b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bar);color:var(--btn-ink);font-size:.75rem}

main.wrap{padding:22px 20px 60px}
.notice{border:1px solid var(--line);border-left:4px solid var(--late);background:var(--surface);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:var(--fs-md)}
.notice.info{border-left-color:var(--bar)}
.notice ul{margin:6px 0 0;padding-left:20px}
/* Messages float over the bottom corner, so nothing on the page moves when one comes or goes. */
#status{position:fixed;right:24px;bottom:24px;z-index:25;max-width:420px}
#status .notice{display:flex;align-items:baseline;gap:12px;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#status .linkish{margin-left:auto;flex:none}
#status .notice .linkish + .linkish{margin-left:12px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}

/* Start screen and set-up steps */
.start{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px;max-width:760px;margin-bottom:16px}
.start h2{font-size:var(--fs-xl);margin-bottom:6px}
.start ol{padding-left:22px;margin:14px 0 18px}
.start li{margin:8px 0}
.start .lead{font-size:var(--fs-md);margin:0 0 16px}
.start h3{font-size:var(--fs-md);font-family:var(--sans);margin:20px 0 0}
.start .actions{margin-top:0}
.startsetup{margin-top:18px}
.steps{list-style:none;margin:14px 0 0;padding:0}
.steps > li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--grid)}
.steps > li:first-child{border-top:0}
.steps .stepn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:var(--fs-sm);color:var(--muted)}
.steps > li.done .stepn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps > li.now .stepn{border-color:var(--bar);color:var(--ink)}
.steps > li.later{color:var(--muted)}
.steps details ol{margin:6px 0 0;padding-left:20px;font-size:var(--fs-sm)}
.steps details li{margin:3px 0}
.steps p{margin:2px 0 0;font-size:var(--fs-sm)}
.steps .actions{margin-top:8px}
.steps details{margin-top:8px}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.demo-bar .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:auto}

/* Toolbar: one even 32px strip with one text size. Controls inside a popover keep their own sizes. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar > *{flex:none}
.toolbar .grow{flex:1 1 0}
.toolbar .tbend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;max-width:100%}
.toolbar :is(.search,.btn,summary.btn,select):not(.pop *){height:32px;font-size:var(--fs-sm)}
.toolbar :is(.btn,summary.btn):not(.pop *){display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 12px;cursor:pointer;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;min-width:220px}
.toolbar .search{width:200px;min-width:0;padding:0 10px}
.sortby{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sortby select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}
.listinfo{font-size:var(--fs-sm);color:var(--muted);margin:0 0 10px}

/* Date range: three presets and a "Custom dates…" menu in one segmented control, which never changes size. */
.seg.range{overflow:visible;flex-wrap:wrap;max-width:100%}
.seg.range > :first-child{border-radius:6px 0 0 6px}
.rangemenu > summary{display:block;width:10.5em;height:30px;line-height:30px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-sm);border-radius:0 6px 6px 0}
.rangemenu > summary.on{background:var(--bar);color:var(--btn-ink)}
.seg.range .pop{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.range label{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.range input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}

/* Small menus that open over the page, so nothing under them moves */
.menu{position:relative;display:inline-block}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column;gap:2px}
.menu .pop p{margin:0}
.dropline{display:flex;align-items:center;gap:8px;white-space:nowrap}
.menu input[type=date],.menu input[type=text]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.menu.formmenu .pop{width:460px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.formmenu label{display:grid;gap:3px;font-weight:600}
.formmenu label input{font-weight:400}
.menumsg{height:1.5em;line-height:1.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--bad)}

/* Tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.sum{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
table.sum th{font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.sum tr:last-child td{border-bottom:0}
table.sum .num{text-align:right;white-space:nowrap}
table.sum .zero{color:var(--faint)}
table.sum .sub{display:block;font-size:var(--fs-sm);color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
.meter .fill{display:block;height:100%;background:var(--bar)}
.meter b{font-weight:600;min-width:38px;text-align:right}
.chip{display:inline-block;font-size:var(--fs-xs);font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap;vertical-align:1px}
.chip.due{background:var(--bad-bg);color:var(--bad)}
.chip.left{background:var(--grid);color:var(--muted)}
.chip.need{background:var(--late-bg);color:var(--late)}
.name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--ink)}
.nmline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.linkish{position:relative;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:var(--fs-sm)}
.linkish:hover{color:var(--ink)}
.linkish:disabled{color:var(--faint);cursor:default;text-decoration:none}
/* Text links get a hit area of at least 24px, so they're as easy to click as buttons, without moving anything. */
.linkish::after{content:"";position:absolute;inset:-5px -3px}
.subhead{font-family:var(--serif);font-size:var(--fs-lg);margin:22px 0 8px}

/* Panels (Setup, Study hall) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.panel h2{font-size:var(--fs-lg);margin-bottom:6px}
.panel > p{margin:0 0 10px}
.stack > * + *{margin-top:16px}
.two{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.1fr);gap:24px;align-items:start}
.set{display:grid;grid-template-columns:minmax(0,max-content) 64px minmax(0,max-content);gap:10px;align-items:center}
.set input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:64px}
.set .unit{color:var(--muted);font-size:var(--fs-sm)}
.setgrid{display:grid;grid-template-columns:max-content max-content;gap:10px 14px;align-items:center}
.setgrid input,.setgrid select,.settext input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;height:34px}
.setgrid input[type=time],.setgrid select{width:9.5em}
.settext{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 14px;align-items:center;max-width:620px}
.settext input{width:100%}
.wdays{display:flex;gap:14px;flex-wrap:wrap;border:0;margin:0;padding:0}
.wdays legend{padding:0;margin-bottom:4px;font-size:var(--fs-sm);color:var(--muted)}
.wdays label{display:inline-flex;gap:6px;align-items:center}
.psub{font-family:var(--sans);font-size:var(--fs-sm);font-weight:600;margin:12px 0 0}
.psub:first-child{margin-top:0}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-md);min-height:36px}
.list li > span:first-child{flex:1;min-width:0}
.list .when{color:var(--muted);font-size:var(--fs-sm);margin-left:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px;font-size:var(--fs-sm);line-height:1.4;resize:vertical}
textarea.stupaste{min-height:190px}
.lbl{display:block;font-weight:600;font-size:var(--fs-sm);margin-bottom:4px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.inl{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-sm)}
.inl input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font-size:var(--fs-sm)}
.formmsg{height:3em;overflow:hidden;margin:6px 0 0;font-size:var(--fs-sm)}
.formmsg.bad{color:var(--bad)}

/* Log a meeting: one row, always there, so nothing moves when it's used */
.logform{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-end}
.logform label{display:grid;gap:3px;font-size:var(--fs-sm);font-weight:600}
.logform label.grow{flex:1;min-width:0}
.logform select,.logform input{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:0 7px;font-size:var(--fs-sm);font-weight:400}
.logform select{width:13em}
.logform .btn{height:30px;flex:none}
.logform.na{visibility:hidden}
.logpanel{margin-bottom:16px;padding:16px 20px 10px}
.logpanel h2{margin-bottom:2px}
.logpanel > p{margin:0 0 10px}

/* Meetings list */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:5.2em minmax(9em,max-content) minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.mlist li:last-child{border-bottom:0}
.mlist li.none{display:block;color:var(--muted)}
.mlist .when{color:var(--ink);font-weight:600}
.mlist .how{color:var(--muted)}
.mlist .txt{min-width:0;overflow-wrap:anywhere}

/* Study hall switch: a menu that asks for the date, opening over the page */
.shmenu > summary{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 2px;cursor:pointer;border-radius:999px;font-size:var(--fs-sm);font-weight:600;color:var(--ink)}
.shmenu > summary:hover .swt{box-shadow:0 0 0 3px var(--grid)}
.swt{position:relative;display:inline-block;width:36px;height:20px;border-radius:999px;background:var(--rule);flex:none}
.swt::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.shmenu.on .swt{background:var(--ok)}
.shmenu.on .swt::after{left:18px}
.swl{display:inline-block;width:2em}
.shmenu .pop{width:470px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.plist{list-style:none;margin:6px 0 0;padding:0}
.plist li{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm);min-height:40px}
.plist input,.paddrow input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:var(--fs-sm)}
.plist label,.paddrow label{display:inline-flex;gap:6px;align-items:center}
.paddrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px;font-size:var(--fs-sm)}

/* Student page */
.sreport{max-width:960px}
.rbar [data-studentback]{min-width:9em}
.rbar .pn{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.rbar .pn > span{min-width:4.5em;text-align:center}
.toolbar.rbar .pn .btn{display:block;width:130px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .pnx{width:130px}
.rhead,.rsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rhead h2{font-size:var(--fs-xl);margin:0}
.rhead h2:focus{outline:none}
.rhead p{margin:2px 0;font-size:var(--fs-md)}
.rsec h3{font-size:var(--fs-lg);margin-bottom:10px}
.rsec h3 .small{font-family:var(--sans);font-weight:400}
.rsec h3.psub{font-family:var(--sans);font-size:var(--fs-md);margin:18px 0 0}
.rsec > p{margin:0 0 8px}
.rtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .l{font-size:.82rem;color:var(--muted)}
.tile .n{font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:proportional-nums}
.tile .s{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.tile.due .n{color:var(--bad)}
.dstrip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 6px}
.dstrip li{display:grid;justify-items:center;gap:2px;width:46px;font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.dstrip i{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:24px;border-radius:4px;font-style:normal;font-weight:700;color:var(--ov-ink)}
.dstrip .wd{font-size:.68rem}
.legend-line{font-size:var(--fs-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0}
.legend-line > span{display:inline-flex;gap:5px;align-items:center}
.notes{list-style:none;margin:0;padding:0}
.notes li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-sm)}
.notes li:last-child{border-bottom:0}
.notes .when{min-width:12em;color:var(--muted)}
.printonly{display:none}

/* Overview grid: the teacher's colors */
.c-present{background:var(--ov-present)} .c-excused{background:var(--ov-excused)} .c-absent{background:var(--ov-absent)}
.c-none,.c-extra{background:var(--ov-none)}
.c-missing{background:var(--surface);color:var(--late)} .c-later{background:var(--surface)}
.c-none,.c-extra,.c-missing,.c-later{--ov-ink:var(--ink)}   /* marks on these days use the page ink, so they show in dark mode too */
.dstrip i.c-missing,.dstrip i.c-later{box-shadow:inset 0 0 0 1px var(--line)}
.dstrip i.c-missing{color:var(--late)}

.ovt th.ovname .name-btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration-color:transparent}

.ovc{width:38px;min-width:38px;height:26px}

.ovn,.dstrip .dn{position:absolute;top:0;right:0;width:0;height:0;border-top:7px solid var(--ov-ink);border-left:7px solid transparent}

.ovpop{position:absolute;z-index:10;width:500px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;font-size:var(--fs-sm)}

<script>
'use strict';
/* ------------------------------------------------------------------
   Everything below runs on this computer. The Content-Security-Policy above blocks every network request.
   Data written: one file, homeroom-tracker-data.json, inside the folder you choose (students, study hall
   dates, 1-on-1s logged by hand, marks and notes, settings, linked Zoom names). Zoom reports are only read.
   ------------------------------------------------------------------ */
const DATA_FILE = 'homeroom-tracker-data.json';
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const WEEKDAYS = [1, 2, 3, 4, 5];
const HAS_FSA = typeof window.showDirectoryPicker === 'function';
const KIND = { hr: 'Homeroom', sh: 'Study hall' };
const CAT = { present: 'Present', absent: 'Absent', excused: 'Excused' };
// What a day on the grid shows, in plain words.
const CELL = { present: 'Present', absent: 'Absent', excused: 'Excused', none: 'Not required', extra: 'Came, not required',
  missing: 'No Zoom report yet', later: 'Not yet' };
const MAX_GROUP = 3;   // a Zoom meeting with up to this many students can be a 1-on-1
const NEAR = 15;      // minutes before or after class time that still belong to that class in its own report

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const mins = ms => Math.round(ms / 60000);
// Formatting dates is slow when every call builds a new formatter, so each format is built once.
const DTF = {};
const dtf = o => { const k = JSON.stringify(o); return DTF[k] || (DTF[k] = new Intl.DateTimeFormat([], o)); };
const fmt = t => t == null ? '—' : dtf({ hour: 'numeric', minute: '2-digit' }).format(t);
const fmtMin = m => { m = Math.round(m); let h = Math.floor(m / 60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(mi)} ${ap}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtRange = (a, b) => { const A = fmtMin(a), B = fmtMin(b); return (A.slice(-2) === B.slice(-2) ? A.slice(0, -3) : A) + '–' + B; };
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pct = (n, d) => d ? Math.round(n / d * 100) : null;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const todayDk = () => dkOf(new Date());
const parseDk = dk => { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate() + n); return dkOf(d); };
const weekKey = dk => { const d = parseDk(dk); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkOf(d); };
const daysBetween = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 864e5);
const asDate = d => typeof d === 'string' ? parseDk(d) : d;
const shortDate = d => dtf({ weekday: 'short', month: 'short', day: 'numeric' }).format(asDate(d));
const monDay = d => dtf({ month: 'short', day: 'numeric' }).format(asDate(d));
const longDate = d => dtf({ weekday: 'long', month: 'long', day: 'numeric' }).format(asDate(d));
const isDk = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDk(v)) && dkOf(parseDk(v)) === v;
const isHm = v => typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
const hmMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const own = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// First name, for short labels. Handles "Diaz, Ana" too.
function firstName(name){
  const s = String(name).replace(/^[^\p{L}]+/u, ''), m = s.match(/^([^,]+),\s*([^\s,]+)/);
  return (m ? m[2] : s.split(/\s+/)[0]) || String(name);
}
function listJoin(items, max = 4){
  const xs = items.length === max + 1 ? items : items.slice(0, max), more = items.length - xs.length;
  if (more > 0) return `${xs.join(', ')} and ${more} more`;
  return xs.length < 2 ? (xs[0] || '') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
function fmtPeriod(p){
  const a = parseDk(p.from), b = parseDk(p.to), o = { month: 'short', day: 'numeric' };
  if (a.getFullYear() !== b.getFullYear()) return `${dtf({ ...o, year: 'numeric' }).format(a)} – ${dtf({ ...o, year: 'numeric' }).format(b)}`;
  return `${dtf(o).format(a)} – ${dtf(o).format(b)}, ${b.getFullYear()}`;
}
const sinceText = n => n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`;
const daysText = ws => ws.length ? listJoin(ws.map(w => cap(DAYS[w]) + 's'), 5) : 'no days';

/* ---------------- The data file ---------------- */
function defaultData(){
  return { version: 1,
    settings: { homeroomDay: 1, homeroomStart: '08:30', homeroomEnd: '09:00', studyDays: [2, 4], studyStart: '14:00', studyEnd: '15:00',
      lateGrace: 5, leaveGrace: 5, oneOnOneDays: 14, oneOnOneMin: 5, teacherName: '' },
    students: [],    // [{ key, name, added, removed }]: on the list from added, until the day before removed
    studyHall: {},   // { studentKey: [{ from, to }] } needs study hall from `from`; `to` is the first day they don't ("done starting")
    meetings: {},    // { studentKey: [{ id, date, note }] } 1-on-1s logged by hand
    status: {},      // { 'YYYY-MM-DD|hr|studentKey': { cat, L, note } } a day set by hand (kind hr: homeroom, sh: study hall)
    aliases: {},     // { zoomNameKey: studentKey }
    ignored: [] };   // Zoom names that aren't students
}
const NUM_SETTINGS = { lateGrace: [0, 60], leaveGrace: [0, 60], oneOnOneDays: [1, 90], oneOnOneMin: [1, 60] };
// Study hall dates in order, with dates that overlap joined into one.
function normPeriods(list){
  const s = [...list].sort((a, b) => a.from.localeCompare(b.from)), out = [];
  for (const p of s){
    const last = out[out.length - 1];
    if (last && (!last.to || p.from <= last.to)){ if (!p.to || !last.to) delete last.to; else if (p.to > last.to) last.to = p.to; }
    else out.push(p.to ? { from: p.from, to: p.to } : { from: p.from });
  }
  return out;
}
// Everything read from the data file is checked here, so a damaged or hand-edited file can't break the page.
// Fields this page doesn't know are dropped, and so are bad dates.
function withDefaults(d){
  d = obj(d);
  const base = defaultData(), set = obj(d.settings), S = { ...base.settings, studyDays: [...base.settings.studyDays] };
  for (const [k, [lo, hi]] of Object.entries(NUM_SETTINGS)){ const v = Number(set[k]); if (set[k] !== '' && set[k] !== null && Number.isFinite(v)) S[k] = Math.min(hi, Math.max(lo, Math.round(v))); }
  if (WEEKDAYS.includes(Number(set.homeroomDay))) S.homeroomDay = Number(set.homeroomDay);
  if (Array.isArray(set.studyDays)) S.studyDays = [...new Set(set.studyDays.map(Number).filter(w => WEEKDAYS.includes(w)))].sort();
  for (const [a, b] of [['homeroomStart', 'homeroomEnd'], ['studyStart', 'studyEnd']]) if (isHm(set[a]) && isHm(set[b]) && set[a] < set[b]){ S[a] = set[a]; S[b] = set[b]; }
  if (typeof set.teacherName === 'string') S.teacherName = set.teacherName.trim().slice(0, 120);
  const out = { version: 1, settings: S, students: [], studyHall: {}, meetings: {}, status: {}, aliases: {}, ignored: [] }, seen = new Set();
  for (const x of Array.isArray(d.students) ? d.students : []){
    const s = obj(x), name = typeof s.name === 'string' ? s.name.replace(/\s+/g, ' ').trim().slice(0, 120) : '', key = normKey(typeof s.key === 'string' && s.key ? s.key : name);
    if (!name || !key || seen.has(key)) continue;
    seen.add(key);
    const st = { key, name };
    if (isDk(s.added)) st.added = s.added;
    if (isDk(s.removed)) st.removed = s.removed;
    out.students.push(st);
  }
  for (const [k, v] of Object.entries(obj(d.studyHall))) if (k && Array.isArray(v)){
    const ps = normPeriods(v.map(obj).filter(p => isDk(p.from) && !(isDk(p.to) && p.to <= p.from)).map(p => isDk(p.to) ? { from: p.from, to: p.to } : { from: p.from }));
    if (ps.length) out.studyHall[k] = ps;
  }
  for (const [k, v] of Object.entries(obj(d.meetings))) if (k && Array.isArray(v)){
    const ms = v.map(obj).filter(m => isDk(m.date)).map(m => ({ id: String(m.id || uid()).slice(0, 40), date: m.date, note: String(m.note || '').slice(0, 300) }));
    if (ms.length) out.meetings[k] = ms;
  }
  for (const [k, v] of Object.entries(obj(d.status))){
    const [dk, kind, ...rest] = k.split('|'), key = rest.join('|'), x = obj(v), o = {};
    if (!isDk(dk) || !own(KIND, kind) || !key) continue;
    if (own(CAT, x.cat)) o.cat = x.cat;
    if (typeof x.L === 'boolean') o.L = x.L;
    if (typeof x.note === 'string' && x.note.trim()) o.note = x.note.trim().slice(0, 300);
    if (Object.keys(o).length) out.status[`${dk}|${kind}|${key}`] = o;
  }
  for (const [k, v] of Object.entries(obj(d.aliases))) if (k && typeof v === 'string' && v) out.aliases[k] = v;
  out.ignored = [...new Set((Array.isArray(d.ignored) ? d.ignored : []).filter(x => typeof x === 'string' && x))];
  return out;
}

/* ---------------- Text helpers ---------------- */
function normKey(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

/* ---------------- Zoom reports ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseZoomTime(s){
  if (!s) return null; s = String(s).trim(); if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}T[\d:.]+(Z|[+-]\d\d:?\d\d)$/i.test(s)){ const t = Date.parse(s); if (!isNaN(t)) return new Date(t); }   // a time with its zone
  let y, mo, d, h, mi, se, ap, m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else { const t = /\d{1,2}:\d{2}/.test(s) ? Date.parse(s) : NaN; return isNaN(t) ? null : new Date(t); }   // other formats need a time of day: "8" isn't a date
  if (ap){ ap = ap.toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0; }
  return new Date(y, mo - 1, d, h, mi, se);
}
function parseZoomFile(name, text){
  const rows = parseCSV(String(text).replace(/^﻿/, ''));
  const hi = rows.findIndex(r => r.some(c => /^join time/i.test(c.trim())) && r.some(c => /^leave time/i.test(c.trim())));
  if (hi < 0){
    const looksUnique = rows.some(r => r.some(c => /duration/i.test(c)) && r.some(c => /name/i.test(c)));
    return { error: looksUnique
      ? 'This file has no join or leave times. It was probably exported with “Show unique users” checked. Export it again with that box unchecked.'
      : 'This doesn’t look like a Zoom participant report (no “Join Time” column).' };
  }
  const h = rows[hi].map(c => c.trim().toLowerCase());
  let nameIdx = h.findIndex(c => c.startsWith('name') || c.includes('participant'));
  if (nameIdx < 0) nameIdx = 0;
  const joinIdx = h.findIndex(c => c.startsWith('join time'));
  const leaveIdx = h.findIndex(c => c.startsWith('leave time'));
  const waitIdx = h.findIndex(c => c.includes('waiting'));
  let emailIdx = h.findIndex((c, i) => c.includes('email') && i > nameIdx);
  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (r[nameIdx] || '').trim();
    const join = parseZoomTime(r[joinIdx]), leave = parseZoomTime(r[leaveIdx]);
    if (!nm || !join || !leave || leave <= join) continue;
    if (waitIdx >= 0 && /^y/i.test((r[waitIdx] || '').trim())) continue;   // time in the waiting room isn't time in the meeting
    out.push({ name: nm, email: emailIdx >= 0 ? (r[emailIdx] || '').trim() : '', join, leave });
  }
  if (!out.length) return { error: 'No participant rows with join and leave times were found in this file.' };
  return { rows: out };
}
function parsedFile(f){ return f.parsed || (f.parsed = parseZoomFile(f.name, f.text)); }

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));
  const steps = [
    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []
  ];
  return (raw, email) => {
    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

/* ---------------- Attendance math ---------------- */
function mergeIntervals(list){
  const s = list.map(x => [x[0], x[1]]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s){ const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push(iv); }
  return out;
}
const overlap = (list, A, B) => list.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, B) - Math.max(a, A)), 0);
const sumIv = list => list.reduce((t, [a, b]) => t + b - a, 0);

const settings = () => state.data.settings;
const winOf = kind => { const S = settings(); return kind === 'hr' ? [hmMin(S.homeroomStart), hmMin(S.homeroomEnd)] : [hmMin(S.studyStart), hmMin(S.studyEnd)]; };
const winText = kind => fmtRange(...winOf(kind));
const kindOn = (kind, wd) => kind === 'hr' ? wd === settings().homeroomDay : settings().studyDays.includes(wd);
const roster = () => [...state.data.students].sort((a, b) => a.name.localeCompare(b.name));
// A student is on the list from the day they were added until the day before they left.
const onList = (s, dk) => (!s.added || s.added <= dk) && (!s.removed || dk < s.removed);
const isCurrent = s => !s.removed || s.removed > todayDk();
const shPeriods = key => state.data.studyHall[key] || [];
const needsSH = (key, dk) => shPeriods(key).some(p => p.from <= dk && (!p.to || dk < p.to));
// The study hall dates going on now, or else the next ones still to come (what the switch on the Study hall tab shows).
const openPeriod = key => { const t = todayDk(), ps = shPeriods(key); return ps.find(p => p.from <= t && (!p.to || t < p.to)) || ps.find(p => p.from > t) || null; };

/* Reads every Zoom report and sorts each person's time in it by the clock:
   - in the homeroom time on the homeroom day: homeroom that day;
   - in the study hall time on a study hall day: study hall that day;
   - anything else: the rest of that file's rows on that date are one meeting. With 1 to 3 students in it, each student who
     was in it at least the minimum minutes had a 1-on-1 that day. */
function analyze(){
  const D = state.data, S = D.settings, W = { hr: winOf('hr'), sh: winOf('sh') };
  const students = roster(), byKey = new Map(students.map(s => [s.key, s]));
  const match = buildMatcher(students, D.aliases), ignored = new Set(D.ignored), teacher = normKey(S.teacherName);
  const isTeacher = raw => !!teacher && [normKey(raw), ...zoomCandidates(raw).map(normKey)].includes(teacher);
  const fileErrors = [], classes = new Map(), others = new Map();
  let nZoom = 0;
  for (const f of state.files){
    const z = parsedFile(f);
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    nZoom++;
    const rows = z.rows.map(r => {
      const j = r.join, dk = dkOf(j), wd = j.getDay(), a = j.getTime(), b = r.leave.getTime();
      // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
      const at = m => new Date(j.getFullYear(), j.getMonth(), j.getDate(), 0, m).getTime();
      // A row in both times (homeroom and study hall back to back on the same day) counts for both.
      return { r, dk, wd, a, b, at, kinds: ['hr', 'sh'].filter(k => kindOn(k, wd) && a < at(W[k][1]) && b > at(W[k][0])) };
    });
    // In a homeroom or study hall report, someone who drops off and rejoins just before or after the class time is
    // part of that class, not in a 1-on-1 (within NEAR minutes of the class time, in the same report, the same day).
    const classIn = new Set(rows.flatMap(x => x.kinds.map(k => `${x.dk}|${k}`)));
    const nearClass = x => ['hr', 'sh'].some(k => classIn.has(`${x.dk}|${k}`) && x.a < x.at(W[k][1] + NEAR) && x.b > x.at(W[k][0] - NEAR));
    for (const x of rows){
      const { r, dk, a, b, at, kinds } = x;
      if (!kinds.length && nearClass(x)) continue;
      const skip = isTeacher(r.name) || ignored.has(normKey(r.name)), m = skip ? null : match(r.name, r.email), rk = normKey(r.name);
      for (const kind of kinds.length ? kinds : [null]){
        const id = kind ? `${dk}|${kind}` : `${f.name}|${dk}`, bag = kind ? classes : others;
        if (!bag.has(id)) bag.set(id, { id, dk, kind, files: new Set(), win: kind ? [at(W[kind][0]), at(W[kind][1])] : null, byKey: new Map(), unmatched: new Map(), start: a });
        const g = bag.get(id); g.files.add(f.name); g.start = Math.min(g.start, a);
        if (skip) continue;   // the teacher's own rows still show the class met
        if (m){
          if (!g.byKey.has(m.key)) g.byKey.set(m.key, { key: m.key, intervals: [], names: new Set() });
          const e = g.byKey.get(m.key); e.intervals.push([a, b]); e.names.add(r.name);
        } else if (rk && !g.unmatched.has(rk)) g.unmatched.set(rk, { rk, raw: r.name, email: r.email });
      }
    }
  }
  // Homeroom and study hall: present when in Zoom at least a minute during the time; L when late or left early.
  const G = S.lateGrace * 60000, L = S.leaveGrace * 60000;
  for (const g of classes.values()){
    const [A0, B0] = g.win; g.res = new Map();
    for (const e of g.byKey.values()){
      const merged = mergeIntervals(e.intervals), inWin = merged.filter(([a, b]) => b > A0 && a < B0), ms = overlap(merged, A0, B0);
      const first = inWin.length ? inWin[0][0] : null, last = inWin.length ? inWin[inWin.length - 1][1] : null;
      const present = ms >= 60000, late = present && first > A0 + G, early = present && last < B0 - L;
      g.res.set(e.key, { present, late, early, L: late || early, first, last, min: mins(ms),
        lateMin: late ? mins(first - A0) : 0, earlyMin: early ? mins(B0 - last) : 0, names: [...e.names] });
    }
  }
  // 1-on-1s from Zoom: one per student per date (two reports the same day count once, with the longer time).
  const zoomMeet = new Map(), unmatched = [];
  for (const g of others.values()){
    const keys = [...g.byKey.keys()];
    if (keys.length >= 1 && keys.length <= MAX_GROUP) for (const e of g.byKey.values()){
      const merged = mergeIntervals(e.intervals), m = mins(sumIv(merged));
      if (m < S.oneOnOneMin) continue;
      const list = zoomMeet.get(e.key) || [], same = list.find(x => x.date === g.dk);
      const others2 = keys.filter(k => k !== e.key).map(k => (byKey.get(k) || {}).name || k);
      if (same){ same.minutes = Math.max(same.minutes, m); same.files = [...new Set([...same.files, ...g.files])]; same.with = [...new Set([...same.with, ...others2])]; }
      else list.push({ id: `z-${g.dk}`, date: g.dk, minutes: m, at: merged[0][0], files: [...g.files], with: others2, source: 'zoom' });
      zoomMeet.set(e.key, list);
    }
    // Names nobody knows, from a meeting small enough to be a 1-on-1 (a staff meeting's names aren't listed)
    if (keys.length + g.unmatched.size <= MAX_GROUP) for (const u of g.unmatched.values()) unmatched.push({ ...u, dk: g.dk, when: `${shortDate(g.dk)}, meeting at ${fmt(g.start)}` });
  }
  for (const g of classes.values()) for (const u of g.unmatched.values()) unmatched.push({ ...u, dk: g.dk, when: `${shortDate(g.dk)}, ${KIND[g.kind].toLowerCase()}` });
  const dks = [...classes.values()].map(g => g.dk).concat(Object.keys(D.status).map(k => k.slice(0, 10))).sort();
  return { students, byKey, classes, zoomMeet, unmatched, fileErrors, nZoom, oldest: dks[0] || null };
}

/* ---------------- Date range (Overview, Students, 1-on-1s) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
const inRange = dk => { const b = rangeBounds(); return (!b.from || dk >= b.from) && (!b.to || dk <= b.to); };
// The dates a person reads: an open start becomes the first day with a report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const from = b.from || (A.oldest && A.oldest < today ? A.oldest : weekKey(today)), to = b.to || today;
  return { from, to: to < from ? from : to, open: !b.to || b.to >= today };
}
// Every homeroom and study hall day in the dates shown. An open range runs to the end of this week ("not yet").
function classDays(period){
  const out = [], end = period.open ? addDays(weekKey(todayDk()), 6) : period.to;
  for (let dk = period.from, i = 0; dk <= end && i < 1500; dk = addDays(dk, 1), i++){
    const wd = parseDk(dk).getDay();
    if (kindOn('hr', wd)) out.push({ dk, kind: 'hr' });
    if (kindOn('sh', wd)) out.push({ dk, kind: 'sh' });
  }
  return out;
}
function rangeBar(){
  const p = state.range.preset, b = rangeBounds(), on = p === 'custom' && !!(b.from || b.to);
  const shown = !on ? 'Custom dates…' : b.from && b.to ? `${monDay(b.from)} – ${monDay(b.to)}` : b.from ? `From ${monDay(b.from)}` : `Until ${monDay(b.to)}`;
  const said = !on ? 'Custom dates' : `Custom dates, ${b.from && b.to ? `${monDay(b.from)} to ${monDay(b.to)}` : b.from ? `from ${monDay(b.from)}` : `until ${monDay(b.to)}`}`;
  return `<div class="seg range" role="group" aria-label="Dates"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
    <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
    <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button>
    <details class="menu rangemenu" data-rangemenu${state.rangeMenu ? ' open' : ''}><summary${on ? ` class="on" title="${esc(shown)}"` : ''} aria-label="${esc(said)}">${esc(shown)}</summary>
      <div class="pop" role="group" aria-label="Custom dates"><label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
        <label>to <input type="date" data-rto value="${esc(b.to)}"></label></div></details></div>`;
}
function stamp(){ const { from, to } = rangeBounds(); return from || to ? `${from || 'start'}_to_${to || 'latest'}` : 'all-dates'; }

/* ---------------- One student's day ---------------- */
// Homeroom: everyone on the list that day is expected. Study hall: only students who need it that day.
function cellState(A, s, dk, kind){
  const key = s.key, xk = `${dk}|${kind}|${key}`, ov = state.data.status[xk] || {}, today = todayDk();
  const g = A.classes.get(`${dk}|${kind}`), rec = g ? g.res.get(key) || null : null, came = !!(rec && rec.present);
  const listed = onList(s, dk), req = listed && (kind === 'hr' || needsSH(key, dk));
  const base = !req ? (came ? 'extra' : 'none') : g ? (came ? 'present' : 'absent') : dk > today ? 'later' : 'missing';
  const cat = req && own(CAT, ov.cat) ? ov.cat : base, autoL = !!(rec && rec.present && rec.L);
  const L = cat === 'present' && (typeof ov.L === 'boolean' ? ov.L : autoL);
  return { dk, kind, key, xk, s, g, rec, came, listed, req, base, cat, ov, autoL, L, note: ov.note || '', hand: req && (!!ov.cat || typeof ov.L === 'boolean') };
}
const cellWords = c => [CELL[c.cat], c.L ? 'late or left early' : '', c.hand ? 'set by you' : '', c.note ? `note: ${c.note}` : ''].filter(Boolean).join(', ');
// Days counted: present and absent days so far. Excused days and days with no report aren't counted.
function statsOf(cells){
  const today = todayDk(); let n = 0, att = 0, exc = 0, L = 0, noRep = 0;
  for (const c of cells){
    if (!c.req || c.dk > today) continue;
    if (c.cat === 'excused') exc++;
    else if (c.cat === 'present'){ n++; att++; if (c.L) L++; }
    else if (c.cat === 'absent') n++;
    else if (c.cat === 'missing') noRep++;
  }
  return { n, att, exc, L, noRep, abs: n - att, pct: pct(att, n) };
}
// Every 1-on-1, from Zoom and logged by hand, newest first.
function meetingsOf(A, key){
  const z = A.zoomMeet.get(key) || [], h = (state.data.meetings[key] || []).map(m => ({ ...m, source: 'hand' }));
  return [...z, ...h].sort((a, b) => b.date.localeCompare(a.date) || (a.source === 'zoom' ? -1 : 1));
}
// Days since the last 1-on-1, and whether the next one is due (the due days have passed).
function oneOnOne(A, s){
  const N = settings().oneOnOneDays, today = todayDk(), past = meetingsOf(A, s.key).filter(m => m.date <= today);
  const last = past.length ? past[0].date : null, since = last ? daysBetween(last, today) : null;
  if (!isCurrent(s)) return { status: 'left', last, since };

  const p = openPeriod(key); if (!p) return;

// A pasted list: one name per line (a column copied from a spreadsheet works too). Headers and blank lines are skipped.
function addStudents(text, from){
  const D = state.data, have = new Map(D.students.map(s => [s.key, s])), added = [], back = [], skipped = [];
  for (const line of String(text).split(/\r?\n/)){
    const name = line.split('\t').map(x => x.trim()).find(Boolean)?.replace(/^["']+|["']+$/g, '').replace(/\s+/g, ' ').trim().slice(0, 120) || '';
    const key = normKey(name);
    if (!key || /^(student( full)?( name)?|names?|full name)$/.test(key)) continue;
    const s = have.get(key);
    if (s){ if (!isCurrent(s)){ delete s.removed; back.push(s.name); } else if (!added.includes(s.name)) skipped.push(s.name); continue; }
    const st = { key, name, added: from };
    D.students.push(st); have.set(key, st); added.push(name);
  }
  if (added.length || back.length) changed();
  return { added, back, skipped };
}
// A new spelling moves the student's marks, notes, study hall dates and meetings with them, and the old spelling stays
// linked to them, so Zoom names that matched it still do (it's listed under Zoom names on Setup, where it can be unlinked).
function renameKey(oldK, newK){
  const D = state.data;
  if (!D.aliases[oldK]) D.aliases[oldK] = newK;
  for (const k of Object.keys(D.status)){ const [dk, kind, ...rest] = k.split('|'); if (rest.join('|') === oldK){ const nk = `${dk}|${kind}|${newK}`; if (!D.status[nk]) D.status[nk] = D.status[k]; delete D.status[k]; } }
  if (D.studyHall[oldK]){ D.studyHall[newK] = normPeriods([...(D.studyHall[newK] || []), ...D.studyHall[oldK]]); delete D.studyHall[oldK]; }
  if (D.meetings[oldK]){ D.meetings[newK] = [...(D.meetings[newK] || []), ...D.meetings[oldK]]; delete D.meetings[oldK]; }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}

/* The sample class: made-up students, kept in memory only and never saved. Four weeks of homeroom Mondays and study hall
   Tuesdays and Thursdays up to yesterday, and Zoom 1-on-1s: some students are due, one has never had one, a meeting
   with five students (a club) and one only 3 minutes long don't count, and one meeting was logged by hand. */
function sampleFolder(){
  let seed = 2026;   // the same sample every time
  const rnd = () => (seed = seed * 48271 % 2147483647) / 2147483647, int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const today = todayDk(), wk = weekKey(today), mon0 = addDays(wk, wk < today ? -21 : -28), mons = [0, 1, 2, 3].map(i => addDays(mon0, 7 * i));
  const teacher = 'Jordan Rivera';
  const names = ['Amara Okafor', 'Ben Whitfield', 'Carmen Reyes', 'Dev Patel', 'Elif Demir', 'Felix Wagner', 'Grace Lin', 'Hugo Martins', 'Isabel Cruz', 'Jonah Brooks'];
  const students = names.map(n => ({ key: normKey(n), name: n, added: n === 'Jonah Brooks' ? mons[1] : mon0, ...(n === 'Felix Wagner' ? { removed: mons[3] } : {}) }));
  const studyHall = { 'carmen reyes': [{ from: mon0 }], 'dev patel': [{ from: mon0, to: mons[2] }], 'isabel cruz': [{ from: mons[2] }], 'hugo martins': [{ from: mons[3] }] };
  const zt = (dk, m) => { const [y, mo, d] = dk.split('-'), h = Math.floor(m / 60); return `${mo}/${d}/${y} ${pad(h % 12 || 12)}:${pad(m % 60)}:00 ${h >= 12 ? 'PM' : 'AM'}`; };
  const mdY = dk => { const [y, m, d] = dk.split('-'); return `${m}-${d}-${y}`; };
  const files = [], listed = (n, dk) => onList(students.find(s => s.name === n), dk);
  const file = (name, dk, rows) => files.push({ name, modified: Date.now(), text: 'Name (Original Name),User Email,Join Time,Leave Time,Duration (Minutes),Guest,In Waiting Room\n'
    + rows.map(([n, a, b]) => [csvCell(n), '', zt(dk, a), zt(dk, b), b - a, 'No', 'No'].join(',')).join('\n') + '\n' });
  // Homeroom, Mondays 8:30–9:00. Ben is late twice, Dev misses two (one excused), Elif leaves early once,
  // Grace joins from her phone, and Hugo's first Monday is on a family iPad (a name to link).
  mons.forEach((dk, i) => {
    const rows = [[teacher, 8 * 60 + 20, 9 * 60 + 4]];
    for (const n of names){
      if (!listed(n, dk)) continue;
      let iv = [[8 * 60 + 30 - int(0, 3), 9 * 60 + int(0, 1)]], zn = n;
      if (n === 'Ben Whitfield' && (i === 1 || i === 3)) iv = [[8 * 60 + 41, 9 * 60]];
      if (n === 'Dev Patel' && (i === 1 || i === 3)) iv = [];
      if (n === 'Elif Demir' && i === 2) iv = [[8 * 60 + 29, 8 * 60 + 46]];
      if (n === 'Isabel Cruz' && i === 2) iv = [[8 * 60 + 29, 8 * 60 + 40], [8 * 60 + 44, 9 * 60]];
      if (n === 'Grace Lin') zn = 'Grace’s iPhone';
      if (n === 'Hugo Martins' && i === 0) zn = 'Mom’s iPad';
      for (const [a, b] of iv) rows.push([zn, a, b]);
    }
    file(`zoom-homeroom-${mdY(dk)}.csv`, dk, rows);
  });
  // Study hall, Tuesdays and Thursdays 2–3 PM: the students who need it, and Amara, who comes twice without needing to.
  const need = (k, dk) => (studyHall[k] || []).some(p => p.from <= dk && (!p.to || dk < p.to)), count = {};
  let j = 0;
  for (let dk = mon0; dk < today; dk = addDays(dk, 1)){
    if (![2, 4].includes(parseDk(dk).getDay())) continue;
    const rows = [[teacher, 13 * 60 + 55, 15 * 60 + 2]];
    for (const n of names){
      const k = normKey(n); if (!listed(n, dk)) continue;
      const c = need(k, dk) ? (count[k] = (count[k] || 0) + 1) - 1 : -1;   // which of the student's required days this is
      let iv = [];
      if (c >= 0){
        iv = [[14 * 60 - int(0, 2), 15 * 60 + int(0, 1)]];
        if (n === 'Carmen Reyes' && c === 2) iv = [];
        if (n === 'Carmen Reyes' && c === 4) iv = [[14 * 60 + 12, 15 * 60]];
        if (n === 'Dev Patel' && c === 1) iv = [];
        if (n === 'Isabel Cruz' && c === 1) iv = [[14 * 60, 14 * 60 + 40]];
      } else if (n === 'Amara Okafor' && (j === 1 || j === 3)) iv = [[14 * 60 + 1, 14 * 60 + 50]];
      for (const [a, b] of iv) rows.push([n, a, b]);
    }
    file(`zoom-study-hall-${mdY(dk)}.csv`, dk, rows);
    j++;
  }
  // 1-on-1s, after school or mid-morning (outside homeroom and study hall), on the nearest weekday.
  const back = n => { const dk = addDays(today, -n), w = parseDk(dk).getDay(); return w === 6 ? addDays(dk, -1) : w === 0 ? addDays(dk, -2) : dk; };
  const meet = (n, who, start, len, label) => { const dk = back(n); file(`zoom-${label}-${mdY(dk)}.csv`, dk, [[teacher, start - 2, start + len + 3], ...who.map(w => [w, start, start + len])]); };
  meet(3, ['Amara Okafor'], 15 * 60 + 30, 20, '1on1-amara');
  meet(16, ['Ben Whitfield'], 15 * 60 + 30, 15, '1on1-ben');
  meet(5, ['Ben Whitfield'], 10 * 60, 3, 'check-in-ben');   // only 3 minutes: not a 1-on-1
  meet(9, ['Carmen Reyes', 'Isabel Cruz'], 15 * 60 + 30, 25, '1on1-carmen-isabel');
  meet(20, ['Dev Patel'], 15 * 60 + 30, 18, '1on1-dev');
  meet(19, ['Elif Demir'], 15 * 60 + 30, 15, '1on1-elif');
  meet(6, ['Elif Demir'], 10 * 60, 20, '1on1-elif-2');
  meet(15, ['Felix Wagner'], 10 * 60, 15, '1on1-felix');
  meet(12, ['Hugo Martins'], 15 * 60 + 30, 20, '1on1-hugo');
  meet(2, ['Amara Okafor', 'Ben Whitfield', 'Dev Patel', 'Elif Demir', 'Hugo Martins'], 15 * 60 + 30, 45, 'chess-club');   // five students: not a 1-on-1
  const data = { version: 1, settings: { ...defaultData().settings, teacherName: teacher }, students, studyHall, aliases: {}, ignored: [],
    meetings: { 'grace lin': [{ id: 'sample1', date: back(8), note: 'Phone call (her Zoom wasn’t working)' }] },
    status: { [`${mons[3]}|hr|dev patel`]: { cat: 'excused', note: 'Doctor’s appointment' }, [`${mons[1]}|hr|ben whitfield`]: { note: 'Wi‑Fi trouble at home' } } };
  return { files, dataText: JSON.stringify(data) };
}

  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

async function loadFromHandle(){

async function loadFromInput(list){

    const low = f.name.toLowerCase();
    if (!folder && f.webkitRelativePath) folder = f.webkitRelativePath.split('/')[0];
    if (f.webkitRelativePath && f.webkitRelativePath.split('/').length > 2) continue;   // files in folders inside it aren't read
    if (low === DATA_FILE) dataText = await f.text();
    else if (low.endsWith('.csv')) files.push({ name: f.name, text: await f.text(), modified: f.lastModified });

function ingest(files, dataText, folderName, demo = false){
  let msg = null, info = false;

      state.data = defaultData(); state.canWrite = false;
      msg = `${DATA_FILE} couldn’t be read, so your students and settings weren’t loaded. Nothing will be saved over it unless you allow saving.`;
    }
  }
  else if (!same) state.data = defaultData();   // a different folder with no data file starts empty
  state.files = files.sort((a, b) => a.name.localeCompare(b.name));
  if (same && !msg){ const fresh = state.files.filter(f => !had.has(f.name)); msg = fresh.length ? `Found ${plural(fresh.length, 'new file')}: ${listJoin(fresh.map(f => f.name), 3)}.` : 'Up to date. No new files in the folder.'; info = true; }
  state.demo = demo; if (demo){ state.dirHandle = null; state.canWrite = false; }   // the sample is never saved into a folder

let saveTimer = null, undoOpen = false;

  }

    const [key, i] = d.shdel.split('|'), ps = shPeriods(key).filter((p, n) => n !== +i);
    if (ps.length) D.studyHall[key] = ps; else delete D.studyHall[key];
    state.logMsg = null; changed(); renderCurrent(); setStatus('Deleted those study hall dates.', 'info', { label: 'Undo', act: 'undo' }); return;
  }
  if (d.shadd){
    const v = t.closest('.paddrow').querySelector('[data-shnew]').value;
    if (!isDk(v)){ state.logMsg = { where: 'sh', text: 'Choose the first day they need study hall.', bad: true }; renderCurrent(); return; }
    state.logMsg = null; shTurnOn(d.shadd, v); renderCurrent(); return;
  }
  // Setup: students
  if (has('data-addstudents')){
    const ta = $('#stuPaste'), from = $('#tab-setup [data-stufrom]').value;
    if (!isDk(from)){ state.logMsg = { where: 'stu', text: 'Choose the date they’re on your list from.', bad: true }; renderSetup(); return; }
    const r = addStudents(ta.value, from);
    state.logMsg = { where: 'stu', bad: !r.added.length && !r.back.length, text: !ta.value.trim() ? 'Paste some names first.' : [r.added.length ? `Added ${plural(r.added.length, 'student')}.` : '',
      r.back.length ? `Brought back ${listJoin(r.back)}.` : '', r.skipped.length ? `Already on your list: ${listJoin(r.skipped, 3)}.` : '', !r.added.length && !r.back.length && !r.skipped.length ? 'No names found.' : ''].filter(Boolean).join(' ') };
    renderSetup(); if (r.added.length || r.back.length){ const n = $('#stuPaste'); if (n) n.value = ''; } $('#stuPaste').focus(); return;
  }
  if (d.stusave){
    const m = t.closest('details.menu'), name = m.querySelector('[data-stuname]').value.replace(/\s+/g, ' ').trim().slice(0, 120), added = m.querySelector('[data-stuadded]').value;
    const s = D.students.find(x => x.key === d.stusave), key = normKey(name), say = text => { m.querySelector('.menumsg').textContent = text; };
    if (!s) return;
    if (!key) return say('Type a name.');
    if (key !== s.key && D.students.some(x => x.key === key)) return say('There’s already a student with that name.');
    if (added && !isDk(added)) return say('Choose a date, or leave it empty.');
    if (added && s.removed && added >= s.removed) return say(`That’s after they left (${monDay(s.removed)}).`);
    if (key !== s.key){ renameKey(s.key, key); if (state.student === s.key) state.student = key; s.key = key; }
    s.name = name; if (added) s.added = added; else delete s.added;
    changed(); renderCurrent(); setStatus(`Saved ${name}.`, 'info', { label: 'Undo', act: 'undo' }); return;
  }
  if (d.sturemove){
    const m = t.closest('details.menu'), v = m.querySelector('[data-sturmdate]').value, s = D.students.find(x => x.key === d.sturemove);
    if (!s || !isDk(v)){ m.querySelector('[data-sturmdate]').focus(); return; }
    if (s.added && v <= s.added){ setStatus(`${s.name} is on your list starting ${shortDate(s.added)}. Choose a later day, or use “Delete” if they were added by mistake.`); m.querySelector('[data-sturmdate]').focus(); return; }
    s.removed = v; changed(); renderCurrent(); setStatus(`${s.name} isn’t in homeroom starting ${shortDate(v)}.`, 'info', { label: 'Undo', act: 'undo' }); return;
  }
  if (d.stuback){ const s = D.students.find(x => x.key === d.stuback); if (!s) return; delete s.removed; changed(); renderCurrent(); setStatus(`${s.name} is back on your list.`, 'info', { label: 'Undo', act: 'undo' }); return; }
  if (d.studelete){
    const k = d.studelete, s = D.students.find(x => x.key === k); if (!s) return;
    if (!confirm(`Delete ${s.name}?\n\nThey’ll be taken off every tab, with their marks, notes, study hall dates and meetings you logged. To keep their earlier days instead, use “Not in homeroom starting”.`)) return;
    D.students = D.students.filter(x => x.key !== k); delete D.studyHall[k]; delete D.meetings[k];
    for (const x of Object.keys(D.status)) if (x.split('|').slice(2).join('|') === k) delete D.status[x];
    for (const z of Object.keys(D.aliases)) if (D.aliases[z] === k) delete D.aliases[z];
    changed(); renderCurrent(); setStatus(`Deleted ${s.name}.`, 'info', { label: 'Undo', act: 'undo' }); return;
  }
}
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset || {};
  if ('search' in d){ state.query = t.value; const pos = t.selectionStart; renderCurrent(); const s = $(`#tab-${state.tab} [data-search]`); if (s){ s.focus(); s.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset || {}, S = state.data.settings;
  if (d.set){
    // An empty or out-of-range box never saves 0: the old value comes back, or the value is held to the allowed range.
    const [lo, hi] = NUM_SETTINGS[d.set];
    if (t.value.trim() === '' || !Number.isFinite(+t.value)){ t.value = S[d.set]; return; }
    const v = Math.min(hi, Math.max(lo, Math.round(+t.value)));
    t.value = v; if (v !== S[d.set]){ S[d.set] = v; changed(); }
    return;
  }
  if (d.settime){
    const pair = { homeroomStart: 'homeroomEnd', homeroomEnd: 'homeroomStart', studyStart: 'studyEnd', studyEnd: 'studyStart' }[d.settime], isStart = /Start$/.test(d.settime), v = t.value.slice(0, 5);
    if (!isHm(v) || (isStart ? v >= S[pair] : v <= S[pair])){ t.value = S[d.settime]; setStatus(isStart ? 'The start time has to be before the end time.' : 'The end time has to be after the start time.'); return; }
    if (v !== S[d.settime]){ S[d.settime] = v; changed(); }
    return;
  }
  if ('setday' in d){ S.homeroomDay = +t.value; changed(); return; }
  if (d.studyday){ const w = +d.studyday; S.studyDays = t.checked ? [...new Set([...S.studyDays, w])].sort() : S.studyDays.filter(x => x !== w); changed(); return; }
  if (d.settext){ S[d.settext] = t.value.trim().slice(0, 120); changed(); return; }
  if ('sortby' in d){ state.sort = t.value; renderStudents(); const s = $('#tab-students [data-sortby]'); if (s) s.focus(); return; }
  if ('rfrom' in d || 'rto' in d){
    const r = t.closest('.range');
    let f = r.querySelector('[data-rfrom]').value, to = r.querySelector('[data-rto]').value;
    // While a date is still being typed the browser can report year 0002; wait until it's a real date.
    const ok = v => !v || (isDk(v) && v >= '1990' && v < '2200');
    if (!ok(f) || !ok(to)) return;
    if (f && to && f > to) [f, to] = [to, f];
    state.range = f || to ? { preset: 'custom', from: f, to } : { preset: 'all', from: '', to: '' }; state.ovScroll = null; renderCurrent();
    const box = visible(`.range [data-${'rfrom' in d ? 'rfrom' : 'rto'}]`); if (box) box.focus({ preventScroll: true });
    return;
  }
  if ('shfrom' in d || 'shto' in d){ const li = t.closest('[data-period]'), sel = `[data-period="${CSS.escape(li.dataset.period)}"] [data-${'shfrom' in d ? 'shfrom' : 'shto'}]`; addPeriodFromRow(li); const n = visible(sel); if (n) n.focus(); return; }
  if (d.ovnote){
    const v = t.value.trim();
    setOverride(d.ovnote, { note: v || undefined });
    // Show or hide the note mark in place, so nothing redraws while you type or tab away.
    const b = $(`#tab-overview .ovb[data-ovcell="${CSS.escape(d.ovnote)}"]`), c = ovCell(d.ovnote);
    if (b && c){
      const has = !!b.querySelector('.ovn'); if (v && !has) b.insertAdjacentHTML('beforeend', '<i class="ovn"></i>'); if (!v && has) b.querySelector('.ovn').remove();
      const words = `${c.s.name}, ${KIND[c.kind]}, ${longDate(c.dk)}: ${cellWords(c)}`; b.setAttribute('aria-label', words); b.title = words;
    }
  }
});
document.addEventListener('keydown', e => {
  const t = e.target, d = t.dataset || {};
  const hadMenu = !!document.querySelector('details.menu[open]');
  const typing = t.closest && t.closest('input:not([type=checkbox]):not([type=radio]), textarea, select, [contenteditable]'), dlg = document.querySelector('dialog[open]');
  // Shortcuts that work anywhere except while typing (where Ctrl+Z undoes the typing): Undo and Redo, ? for Help, / to find a student.
  if ((!typing || t.tagName === 'SELECT') && !dlg && (e.ctrlKey || e.metaKey) && !e.altKey && /^[zy]$/i.test(e.key)){ e.preventDefault(); undo(e.key.toLowerCase() === 'y' || e.shiftKey); return; }   // a list box has no undo of its own
  if (!typing && !dlg && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.key === '?'){ e.preventDefault(); openHelp(); return; }
    if (e.key === '/'){ const s0 = visible(`#tab-${state.tab} [data-search]`); if (s0){ e.preventDefault(); s0.focus(); s0.select(); } return; }
  }
  // The tabs: the arrow keys move between them (and open them), Home and End go to the first and last.
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)){
    const tabs = [...document.querySelectorAll('nav.tabs [role=tab]')], i = tabs.indexOf(t);
    const to = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1] : tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    e.preventDefault(); to.click(); to.focus(); return;
  }
  if (t.classList && t.classList.contains('ovb') && !e.altKey && !e.metaKey && !(e.key === 'Escape' && hadMenu)) return overviewKey(e, t);
  if (e.key === 'Escape' && (state.ovSel || state.ov1) && t.closest && t.closest('.ovpop')){
    if (d.ovnote !== undefined) t.blur();   // saves the note first, so the redrawn day shows its note mark
    const was = state.ovSel ? cellSel(state.ovSel) : oneSel(state.ov1); state.ovSel = null; state.ov1 = null; renderOverview(); focusOvCell(was); return;
  }
  if (e.key === 'Enter' && d.ovnote !== undefined){ e.preventDefault(); const was = cellSel(state.ovSel); t.blur(); focusOvCell(was); return; }
  if (e.key === 'Enter' && t.tagName === 'INPUT'){
    // Enter in a small form presses its button.
    const f = t.closest('[data-logform], details.menu, .paddrow, [data-period]'); const b = f && !t.matches('[data-shfrom],[data-shto]') && f.querySelector('[data-logadd],[data-shon],[data-shoff],[data-stusave],[data-sturemove],[data-shadd]');
    if (b){ e.preventDefault(); b.click(); return; }
  }
  if (e.key === 'Escape') document.querySelectorAll('details.menu[open]').forEach(m => {
    const inside = m.contains(document.activeElement); closeMenu(m); if (inside) m.querySelector('summary').focus();
  });
});
// Arrow keys move around the Overview grid (one Tab stop for the whole grid); Enter opens a day, Escape closes it.
function overviewKey(e, t){
  const r = +t.dataset.r, c = +t.dataset.c, at = (rr, cc) => $(`#tab-overview .ovb[data-r="${rr}"][data-c="${cc}"]`);
  const all = [...document.querySelectorAll('#tab-overview .ovb')];
  let to = null;
  if (e.key === 'Escape' && (state.ovSel || state.ov1)){ const was = state.ovSel ? cellSel(state.ovSel) : oneSel(state.ov1); state.ovSel = null; state.ov1 = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') to = at(r, c + 1);
  else if (e.key === 'ArrowLeft') to = at(r, c - 1);
  else if (e.key === 'ArrowDown') to = at(r + 1, c);
  else if (e.key === 'ArrowUp') to = at(r - 1, c);
  else if (e.key === 'Home' || e.key === 'End'){
    const pool = (e.ctrlKey ? all : all.filter(b => +b.dataset.r === r)).sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.c - +y.dataset.c));
    to = e.key === 'Home' ? pool[0] : pool[pool.length - 1];
  }
  else return;
  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus({ preventScroll: true }); to.scrollIntoView({ block: 'nearest', inline: 'nearest' }); revealOvCell(to);
}
document.addEventListener('toggle', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('menu')) return;
  if ('rangemenu' in el.dataset) state.rangeMenu = el.open;
  if (!el.open) return;
  // A menu opens rightward unless that would run off the window; its first box gets focus.
  const pop = el.querySelector('.pop'); pop.style.left = '0'; pop.style.right = 'auto';
  if (pop.getBoundingClientRect().right > Math.min(innerWidth, (document.querySelector('main') || document.body).getBoundingClientRect().right) - 8){ pop.style.left = 'auto'; pop.style.right = '0'; }
  if (!('rangemenu' in el.dataset)){ const i = pop.querySelector('input'); if (i) i.focus(); }
}, true);
// Scrolling the grid sideways: remember where it is, and keep an open box beside its day.
document.addEventListener('scroll', e => {
  if (!e.target.classList || !e.target.classList.contains('ovblock') || state.ovPrintAll) return;
  state.ovScroll = e.target.scrollLeft; pinMonths(e.target); placeOvPop();
}, true);
window.addEventListener('resize', () => placeOvPop());
document.querySelectorAll('dialog.dlg').forEach(dl => dl.addEventListener('click', e => {
  const r = dl.getBoundingClientRect();
  if (e.target === dl && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dl.close();
}));
$('.skip').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
window.addEventListener('popstate', e => {
  const s = e.state || {}, leaving = state.student;
  navSeq = s.seq || 0;
  state.tab = s.tab || 'overview'; state.student = s.student || null; state.studentTab = s.via || null; state.ovSel = null; state.ov1 = null; state.logMsg = null;
  render();
  if (state.student){ const h = $('#tab-students h2[tabindex]'); if (h) h.focus({ preventScroll: true }); }
  else if (leaving) focusStudentLink(leaving);
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
window.addEventListener('beforeprint', () => {
  // The Overview prints in landscape, every day shown, in blocks that fit the page.
  if (state.tab === 'overview' && state.loaded){
    let ps = $('#ovPage'); if (!ps){ ps = document.createElement('style'); ps.id = 'ovPage'; document.head.append(ps); }
    ps.textContent = '@page{size:landscape;margin:.4in}';
    document.body.classList.add('print-ov'); state.ovPrintAll = true; renderOverview();
  }
});
window.addEventListener('afterprint', () => {
  if (state.ovPrintAll){ state.ovPrintAll = false; renderOverview(); }
  const ps = $('#ovPage'); if (ps) ps.remove();
  document.body.classList.remove('print-ov');
});
window.addEventListener('beforeunload', e => { if (state.dirty && !state.demo && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; render();   // the start screen now offers this folder
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){ /* the start screen offers it */ }
})();
</script>
