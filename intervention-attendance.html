      const hl = state.highlight === s.xkey;
      h += `<div class="row${hl ? ' hl' : ''}" data-xkey="${esc(s.xkey)}">
        <div class="who"><button class="name-btn" data-openstudent="${esc(s.key)}" data-from="${day.dk}" title="Open ${esc(s.name)}’s student report">${esc(s.name)}</button>
          <span class="meta">${esc(meta.join(', '))}</span>
          ${hl && state.returnTo ? `<span class="meta">↳ from ${esc(state.returnTo.name)}’s report</span>` : ''}
          ${s.zoomNames.length ? `<span class="meta">In Zoom as ${s.zoomNames.map(z => `“${esc(z)}”`).join(', ')}</span>` : ''}
          ${noteBlock(s)}</div>
        <div class="tlc">${timeline(day, s.merged, s.secs)}</div>
        <div class="time${s.firstJoin ? '' : ' none'}" data-label="Joined">${esc(fmt(s.firstJoin))}</div>
        <div class="time${s.lastLeave ? '' : ' none'}" data-label="Left">${esc(fmt(s.lastLeave))}</div>
        <div class="chips">${s.flags.map(f => `<span class="chip k-${f.k}">${esc(f.label)}</span>`).join('')} ${rowActions(s)}</div>
      </div>`;
    }
  }
  const extras = day.extras.filter(e => !q || e.key.includes(q));
  if (extras.length){
    h += `<h3 class="subhead">${day.secs.length ? `Joined but not on the ${cap(day.dayName)} schedule` : 'Joined'}</h3>`;
    for (const e of extras) h += `<div class="mini"><div class="who"><b>${esc(e.name)}</b></div><div>${timeline(day, e.merged)}</div><div class="small muted">${esc(rangeText(e.merged))}</div></div>`;
  }
  if (day.unmatched.length){
    const opts = day.roster.map(r => `<option value="${esc(r.key)}">${esc(r.name)}</option>`).join('');
    h += `<h3 class="subhead">Zoom names that didn’t match a student</h3>
      <p class="small muted" style="margin:0 0 4px">Link a name once and it’s matched automatically from then on. Ignore names that aren’t students, like your own.</p>`;
    for (const u of day.unmatched) h += `<div class="mini" data-rk="${esc(u.rk)}">
      <div class="who"><b>${esc(u.raw)}</b>${u.email ? `<span class="meta">${esc(u.email)}</span>` : ''}</div>
      <div>${timeline(day, u.merged)}</div>
      <div class="act"><span class="small muted">${esc(rangeText(u.merged))}</span>

        <button class="btn small" data-link>Link</button>` : ''}

  }
  h += `<div class="files">From ${day.files.map(esc).join(', ')}</div>`;

}

/* ---------------- Students: computation ---------------- */
const hasFlag = (s, k) => s.flags.some(f => f.k === k);
const isWhole = s => !s.isAbsent && s.flags.every(f => f.k === 'full' || f.k === 'fin');
const worstFlag = s => s.flags.reduce((w, x) => SEVERITY[x.k] > SEVERITY[w.k] ? x : w);
const isExcused = s => s.flags[0].k === 'exc';
// Minutes a student left early after finishing their work. They come out of the "scheduled" total.
function finMinOf(s){
  if (!s.flags.some(x => x.k === 'fin')) return 0;
  // The support-hour minutes missed, less any missed before joining or mid-class, so the rounded minutes always add up.
  const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
  let other = 0;
  for (const g of segsOf(s)) if (g.k !== 'in' && g.k !== 'fin') other += (g.b - g.a) - overlap(iIv, g.a, g.b);
  return Math.max(0, Math.min(s.suppReqMin - s.suppMin - mins(other), s.reqMin - s.presentMin));
}

// A student's scheduled sections on one date, from the schedule version in effect that day
// (or, with `at`, from the version in effect on another date).
const planCache = new WeakMap();
function planFor(A, key, dk, at){
  const sched = A.schedFor(at || dk), w = DAYS[parseDk(dk).getDay()], len = state.data.settings.sectionLen;
  let m = planCache.get(sched); if (!m) planCache.set(sched, m = new Map());
  const ck = `${w}|${key}|${len}`;
  if (!m.has(ck)){
    const secs = (sched.days[w] || []).filter(s => s.students.some(n => normKey(n) === key))
      .map(s => ({ type: s.type, startMin: s.startMin, endMin: s.endMin ?? s.startMin + len })).sort((a, b) => a.startMin - b.startMin);
    if (!secs.length) m.set(ck, null);
    else {
      const iv = mergeIntervals(secs.map(s => [s.startMin, s.endMin]));
      const instrMin = sumIv(mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.startMin, s.endMin])));
      const minutes = sumIv(iv);
      m.set(ck, { secs, minutes, instrMin, suppMin: minutes - instrMin, startMin: iv[0][0], endMin: iv[iv.length - 1][1] });
    }
  }
  return m.get(ck);
}

// Every date in the period the student was scheduled, with what happened (oldest first).
function studentDates(A, key, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && i < 1500; dk = addDays(dk, 1), i++){
    const day = A.dayByDk.get(dk), rec = day ? day.students.find(s => s.key === key) : null;
    const plan = planFor(A, key, dk);
    if (!plan && !rec) continue;
    const status = rec ? 'held' : day ? 'off' : state.data.noClass[dk] ? 'noclass' : dk === today ? 'pending' : dk > today ? 'upcoming' : 'missing';
    if (status === 'off') continue;
    out.push({ dk, status, plan, rec, day });
  }
  return out;
}


/* Where each scheduled minute of a class day went: in Zoom, before joining, out of Zoom mid-class, after leaving,
   or a whole day absent. The report's bars and strips are drawn from this; the numbers on the page come from summarize(). */
const clockMinF = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };   // clock time, safe across daylight saving
const hm = t => fmt(t).replace(/\s?[AP]M$/, '');
const dayLetters = s => [...new Set(s.flags.map(f => f.k))].filter(k => k !== 'full').sort((a, b) => SEVERITY[b] - SEVERITY[a]).slice(0, 2);
// Spans in ms, inside the scheduled time only. Finished-work and excused time are their own kinds and aren't counted.
function segsOf(s){
  const R = mergeIntervals(s.secs.map(x => [x.a, x.b])), out = [];
  if (isExcused(s)) return R.map(([a, b]) => ({ k: 'exc', a, b }));
  if (s.isAbsent) return R.map(([a, b]) => ({ k: 'absent', a, b }));
  const fin = hasFlag(s, 'fin');
  const kind = (a, b) => b <= s.firstJoin ? 'before' : a >= s.lastLeave ? (fin ? 'fin' : 'after') : 'out';
  for (const [A, B] of R){
    let cur = A;
    for (const [a, b] of s.merged){
      if (b <= cur || a >= B) continue;
      if (a > cur) out.push({ k: kind(cur, a), a: cur, b: a });
      out.push({ k: 'in', a: Math.max(a, cur), b: Math.min(b, B) });
      cur = Math.min(b, B); if (cur >= B) break;
    }
    if (cur < B) out.push({ k: kind(cur, B), a: cur, b: B });
  }
  return out;
}
// Splits a whole-minute total by weights (largest remainder), so the parts always add up to the total.
function apportion(total, W){
  const K = ['before', 'out', 'after'], r = { before: 0, out: 0, after: 0 }, sum = K.reduce((t, k) => t + W[k], 0);
  if (total <= 0) return r;
  if (!sum){ r.after = total; return r; }   // a rounding minute with no gap to show it in
  const raw = K.map(k => total * W[k] / sum);
  K.forEach((k, i) => { r[k] = Math.floor(raw[i]); });
  let left = total - K.reduce((t, k) => t + r[k], 0);
  K.map((k, i) => [k, raw[i] - Math.floor(raw[i]), i]).sort((x, y) => y[1] - x[1] || x[2] - y[2])
    .forEach(([k]) => { if (left > 0){ r[k]++; left--; } });
  return r;
}
// One held, not-excused day in whole minutes, anchored to the day's own rounded numbers.
function dayParts(s){
  const fin = finMinOf(s), z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const P = { instruction: z(), support: z(), fin, clamped: 0 };
  P.instruction.in = s.instrMin; P.support.in = s.suppMin;
  if (s.isAbsent){
    const sa = s.suppReqMin - s.suppMin;
    P.instruction.absent = s.instrReqMin - s.instrMin; P.support.absent = Math.max(0, sa);
    if (sa < 0) P.clamped = -sa;
    return P;
  }
  const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
  const W = { instruction: { before: 0, out: 0, after: 0 }, support: { before: 0, out: 0, after: 0 } };
  for (const g of segsOf(s)){
    if (g.k === 'in') continue;
    const iMs = overlap(iIv, g.a, g.b), sMs = (g.b - g.a) - iMs;
    W.instruction[g.k === 'fin' ? 'after' : g.k] += iMs;
    if (g.k !== 'fin') W.support[g.k] += sMs;   // finished-work minutes aren't counted
  }
  let sT = s.suppReqMin - s.suppMin - fin;
  if (sT < 0){ P.clamped = -sT; sT = 0; }   // a rounding minute between presentMin and instrMin
  Object.assign(P.instruction, apportion(s.instrReqMin - s.instrMin, W.instruction));
  Object.assign(P.support, apportion(sT, W.support));
  return P;
}
function partTotals(ctx){
  const z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const T = { instruction: z(), support: z(), excDays: 0, excMin: 0, finDays: 0, finMin: 0, clamped: 0 };
  for (const d of ctx.dates){
    if (d.status !== 'held') continue;
    const s = d.rec;
    if (isExcused(s)){ T.excDays++; T.excMin += s.reqMin; continue; }
    const P = dayParts(s);
    for (const t of ['instruction', 'support']) for (const k in P[t]) T[t][k] += P[t][k];
    if (P.fin){ T.finDays++; T.finMin += P.fin; }
    T.clamped += P.clamped;
  }
  const sum = o => o.in + o.before + o.out + o.after + o.absent, p = ctx.p;
  if (p) console.assert(T.instruction.in === p.iPres && sum(T.instruction) === p.iReq && T.support.in === p.sPres
    && sum(T.support) - T.clamped === p.sReq && T.finMin === p.finMin, 'partTotals does not match summarize()', T, p);
  return T;
}

function studentSummary(days){
  const map = new Map();
  for (const day of [...days].reverse()) for (const s of day.students){   // oldest first
    if (!map.has(s.key)) map.set(s.key, { key: s.key, name: s.name, rec: [] });
    map.get(s.key).rec.push({ day, s });
  }
  return [...map.values()].map(summarize);
}
// Plain counts for one student. The page reports these; it doesn't judge them.
function summarize(p){
  const c = { sessions: 0, excused: 0, attended: 0, absent: 0, late: 0, missed: 0, early: 0, soft: 0, drop: 0, full: 0,
    pres: 0, req: 0, finMin: 0, iPres: 0, iReq: 0, sPres: 0, sReq: 0 };
  for (const { s } of p.rec){
    c.sessions++;
    if (isExcused(s)){ c.excused++; continue; }
    const fin = finMinOf(s);
    c.req += s.reqMin - fin; c.pres += s.presentMin; c.finMin += fin;
    c.iReq += s.instrReqMin; c.iPres += s.instrMin; c.sReq += s.suppReqMin - fin; c.sPres += s.suppMin;
    if (s.isAbsent) c.absent++; else c.attended++;
    if (hasFlag(s, 'late')) c.late++;
    if (hasFlag(s, 'missed')) c.missed++;
    if (hasFlag(s, 'early')) c.early++;
    if (hasFlag(s, 'soft')) c.soft++;
    if (hasFlag(s, 'drop')) c.drop++;
    if (isWhole(s)) c.full++;
  }
  const n = c.sessions - c.excused;
  let run = [];
  for (const { day, s } of p.rec){ if (isExcused(s)) continue; if (s.isAbsent) run.push(day.dk); else run = []; }
  return { ...p, ...c, n, rate: pct(c.attended, n), dose: pct(c.pres, c.req), instrDose: pct(c.iPres, c.iReq), suppDose: pct(c.sPres, c.sReq),
    streak: run.length, streakDates: run };
}
function sortStudents(list){
  const by = state.sort, v = x => x ?? 101, name = (a, b) => a.name.localeCompare(b.name);
  return list.sort((a, b) =>
    by === 'rate' ? v(a.rate) - v(b.rate) || name(a, b)
    : by === 'dose' ? v(a.dose) - v(b.dose) || name(a, b)
    : by === 'absent' ? b.absent - a.absent || name(a, b)
    : name(a, b));
}

// Weekly totals for the chart and the calendar rows. Upcoming days are left out, so this week is "so far".
function weekRows(dates, period, hasPlan = () => true){
  const map = new Map(), today = todayDk(), thisWeek = weekKey(today);
  // A week is complete when none of the student's scheduled days in it fall outside the period
  // (so a period ending on a Friday still counts its last week).
  const inside = wk => { for (let i = 0; i < 7; i++){ const dk = addDays(wk, i); if ((dk < period.from || dk > period.to) && hasPlan(dk)) return false; } return true; };
  for (const d of dates){
    const wk = weekKey(d.dk);
    if (!map.has(wk)) map.set(wk, { wk, received: 0, missed: 0, excFin: 0, notHeld: 0, noReport: 0, cameDays: 0, heldDays: 0,
      waiting: 0, iRec: 0, iReq: 0, absentDks: [], dates: [] });
    const w = map.get(wk); w.dates.push(d);
    if (d.status === 'held'){
      const s = d.rec;
      if (isExcused(s)){ w.excFin += s.reqMin; continue; }
      const fin = finMinOf(s);
      w.received += s.presentMin; w.missed += s.reqMin - s.presentMin - fin; w.excFin += fin;
      w.heldDays++; if (!s.isAbsent) w.cameDays++; else w.absentDks.push(d.dk);
      w.iRec += s.instrMin; w.iReq += s.instrReqMin;
    } else if (d.status === 'noclass') w.notHeld += d.plan.minutes;
    else if (d.status === 'missing') w.noReport += d.plan.minutes;
    else w.waiting++;
  }
  return [...map.values()].sort((a, b) => a.wk.localeCompare(b.wk)).map(w => ({ ...w,
    counted: w.received + w.missed,
    complete: !w.waiting && inside(w.wk),
    current: w.wk === thisWeek }));
}

// Whether a schedule version starting on `from` changed this student's days or times
// (the same weekday is compared the week before and the week of the change).
function planChanged(A, key, from){
  for (let i = 0; i < 7; i++) if (JSON.stringify(planFor(A, key, addDays(from, i - 7))) !== JSON.stringify(planFor(A, key, addDays(from, i)))) return true;
  return false;
}
// The student's weekly schedule as of the end of the period, e.g. "Mondays 2–4 PM (instruction 2–3, support hour 3–4)".
function scheduleInfo(A, key, period){
  // Every weekday is read from the one schedule in effect at the end of the period (for a dropped student, their last day).
  const end0 = isDk(period.to) ? period.to : todayDk(), drop = dropOf(key);
  const end = drop && drop <= end0 ? addDays(drop, -1) : end0, endW = parseDk(end).getDay(), byW = [];
  for (const w of [1, 2, 3, 4, 5, 6, 0]){
    const plan = planFor(A, key, addDays(end, -((endW - w + 7) % 7)), end);
    if (plan) byW.push({ w, plan });
  }
  const desc = plan => {
    const types = new Set(plan.secs.map(s => s.type));
    const span = shortRange(plan.startMin, plan.endMin);
    if (types.size === 2) return `${span} (${plan.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support hour'} ${shortRange(s.startMin, s.endMin).replace(/ [AP]M$/, '')}`).join(', ')})`;
    return `${span} (${types.has('instruction') ? 'instruction' : 'support hour'})`;
  };
  const groups = [];
  for (const x of byW){ const d = desc(x.plan), g = groups.find(y => y.d === d); if (g) g.ws.push(x.w); else groups.push({ d, ws: [x.w] }); }
  const line = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)} ${g.d}`).join(' · ');
  const weekMin = byW.reduce((t, x) => t + x.plan.minutes, 0);
  // Did this student's plan change inside the period? (The last change wins.)
  let changedOn = null;
  for (const v of A.versions) if (v.from && v.from > period.from && v.from <= period.to && planChanged(A, key, v.from)) changedOn = v.from;
  // The first schedule version with the student, and whether today's schedule has them.
  let firstFrom = null; const inLatest = A.schedFor(todayDk()).roster.some(r => r.key === key);
  for (const v of A.versions) if (v.sched.roster.some(r => r.key === key)){ firstFrom = v.from; break; }
  // Joining the schedule is reported on its own line, so it isn't also called a change.
  if (changedOn && changedOn === firstFrom) changedOn = null;
  return { byW, line, weekMin, changedOn, addedOn: firstFrom || null, inLatest };
}

/* ---------------- Overview: the attendance grid ----------------
   One row per student, one column per class day, filled in from the Zoom and Formative reports in the folder
   and colored the way the teacher's own spreadsheet was. Any cell can be changed by hand. */
// A student's Formative results for one class day, if there was a Formative export that day.
function formOf(A, key, dk){

/* ---------------- Support hour tab ----------------
   A quick check during a support hour: who was let go early this week for finishing their work
   (the days you marked "Finished work"). Always the current week. */
function supportWeek(A){
  const today = todayDk(), wk = weekKey(today), days = [], people = new Map();
  for (let i = 0; i < 7; i++){
    const dk = addDays(wk, i), secs = (A.schedFor(dk).days[DAYS[parseDk(dk).getDay()]] || []).filter(x => x.type === 'support' && x.students.length);
    if (!secs.length) continue;
    days.push(dk);
    const rep = A.dayByDk.get(dk);
    for (const x of secs) for (const n of x.students){
      const k = normKey(n); if (!k) continue;
      if (!people.has(k)) people.set(k, { key: k, name: A.nameOf[k] || n, days: [] });
      const P = people.get(k); if (P.days.some(e => e.dk === dk)) continue;
      const rec = rep ? rep.students.find(r => r.key === k) : null;
      const kind = rec ? (hasFlag(rec, 'fin') ? 'fin' : hasFlag(rec, 'soft') ? 'soft' : rec.isAbsent ? (isExcused(rec) ? 'exc' : 'absent') : hasFlag(rec, 'early') ? 'early' : 'full')
        : state.data.noClass[dk] ? 'noclass' : dk < today ? 'missing' : dk === today ? 'today' : 'later';
      P.days.push({ dk, kind, rec });
    }
  }
  return { today, wk, days, people: [...people.values()].sort((a, b) => a.name.localeCompare(b.name)) };
}

function cellKind(d){ return d.status === 'held' ? worstFlag(d.rec).k : d.status; }
function cellTitle(d){
  if (d.status === 'held') return `${shortDate(d.dk)}: ${d.rec.flags.map(f => f.label).join(', ')}`;
  if (d.status === 'noclass') return `${shortDate(d.dk)}: No class (${NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other'})`;
  if (d.status === 'missing') return `${shortDate(d.dk)}: No Zoom report`;
  return shortDate(d.dk);
}
const letterCell = (k, title) => `<span class="lc ${k === 'noclass' || k === 'missing' ? 'lc-' + k : 'k-' + k}" title="${esc(title)}" aria-hidden="true">${LETTER[k]}</span>`;
function lastTen(dates){
  const xs = dates.filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing').slice(-10);
  if (!xs.length) return '<span class="zero">—</span>';
  const counts = {}; for (const d of xs){ const k = cellKind(d); counts[k] = (counts[k] || 0) + 1; }
  const absentDks = xs.filter(d => cellKind(d) === 'absent').map(d => d.dk);
  const label = `Last ${plural(xs.length, 'class day')}: ` + LETTER_ORDER.filter(k => counts[k])
    .map(k => `${counts[k]} ${LETTER_TEAM[k]}${k === 'absent' ? ` (${listJoin(absentDks.map(monDay), 4)})` : ''}`).join(', ');
  return `<div class="last10" role="img" aria-label="${esc(label)}">${xs.map(d => letterCell(cellKind(d), cellTitle(d))).join('')}</div>`;
}
function letterLegend(kinds, words = LETTER_TEAM){
  const ks = LETTER_ORDER.filter(k => kinds.has(k) && words[k]);
  return ks.length ? `<div class="legend-line" aria-hidden="true">${ks.map(k => `<span>${letterCell(k, '')} ${esc(words[k])}</span>`).join('')}</div>` : '';
}
function studentList(A){
  const days = daysInRange(A.days), period = periodOf(A), q = normKey(state.query);
  const all = sortStudents(studentSummary(days)).filter(s => state.showDropped || !isDropped(s.key));
  const list = all.filter(s => !q || s.key.includes(q));
  return { days, period, all, list };
}
function printMenu(total){
  return `<details class="menu noprint"><summary class="btn small ghost">Print…</summary><div class="pop" role="group" aria-label="Print">
    <button class="item" data-printlist>This list</button>
    <button class="item" data-printreports="all">A report for every student (${total})</button>
    <div class="inc">Include on reports:${includeBoxes()}</div></div></details>`;
}
function includeBoxes(){
  const I = state.include;
  return `<label><input type="checkbox" data-include="table"${I.table ? ' checked' : ''}> Day-by-day table</label>
    <label><input type="checkbox" data-include="log"${I.log ? ' checked' : ''}> Follow-up log</label>
    <label><input type="checkbox" data-include="notes"${I.notes ? ' checked' : ''}> My day notes</label>`;
}

function renderStudents(){
  const el = $('#tab-students');
  const A = analyze();
  state.lastAnalysis = A;
  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  if (!A.days.length || !A.roster.length){
    el.innerHTML = `<div class="start"><h2>Nothing to total up yet</h2><p class="muted">This tab adds up each student’s attendance across every Zoom report. It needs ${!A.roster.length ? 'your class schedule on the <button class="linkish" data-goto="schedule">Schedule tab</button>' : 'at least one Zoom report in the folder'}.</p></div>`;
    return;
  }
  if (state.student){ renderStudentReport(A, el); return; }
  const { days, period, all, list } = studentList(A);
  let h = `<div class="toolbar">${rangeBar()}
    <input class="search" data-search type="search" placeholder="Find a student" value="${esc(state.query)}" aria-label="Find a student">
    <label class="sortby">Sort by <select data-sortby>${[['name', 'Name A–Z'], ['rate', 'Days attended, lowest first'],
      ['dose', 'Minutes received, lowest first'], ['absent', 'Most absences']]
      .map(([k, l]) => `<option value="${k}"${state.sort === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <button class="btn small ghost" id="exportSummary">Export CSV</button>
    ${printMenu(all.length)}${droppedToggle(A)}</div>`;
  h += missingNotice(A, period);
  if (!days.length){ el.innerHTML = h + `<div class="notice info">No Zoom reports fall in these dates. <button class="linkish" data-range="all">Show all dates</button></div>`; return; }
  h += `<p class="listinfo">${plural(days.length, 'class day')} with Zoom reports · ${plural(all.length, 'student')}<span class="printonly"> · ${esc(fmtPeriod(period))}${state.query ? ` · Search: “${esc(state.query)}”` : ''} · Printed ${esc(monDay(todayDk()))}, ${new Date().getFullYear()}</span></p>`;
  const datesOf = new Map(all.map(s => [s.key, studentDates(A, s.key, period)]));
  const kinds = new Set();
  for (const s of list) for (const d of datesOf.get(s.key).filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing').slice(-10)) kinds.add(cellKind(d));
  h += letterLegend(kinds);
  h += `<div class="tablewrap"><table class="sum"><thead><tr><th>Student</th><th>Days attended</th><th>Minutes received</th>
    <th class="num">Absent</th><th class="num">Late</th><th class="num">Left early</th><th>Last 10 class days</th></tr></thead><tbody>`;
  if (!list.length) h += `<tr><td colspan="7" class="muted">No students match that search.</td></tr>`;
  for (const s of list){
    const info = scheduleInfo(A, s.key, period);
    const chips = [];
    if (info.addedOn && info.addedOn > period.from) chips.push(`<span class="chip k-extra">Added to the schedule ${esc(monDay(info.addedOn))}</span>`);
    if (dropOf(s.key)) chips.push(`<span class="chip k-extra">Dropped ${esc(monDay(dropOf(s.key)))}</span>`);
    else if (!info.inLatest) chips.push(`<span class="chip k-extra">Not on the current schedule</span>`);
    const leftEarly = s.early + s.soft;
    h += `<tr>
      <td class="c-name"><button class="name-btn" data-openstudent="${esc(s.key)}">${esc(s.name)}</button>
        ${chips.length ? `<div class="chips" style="margin-top:3px">${chips.join('')}</div>` : ''}
        <span class="cardcounts">Absent ${s.absent} · Late ${s.late} · Left early ${leftEarly}</span></td>
      <td data-label="Days attended">${meter(s.rate)}<span class="small muted">${s.attended} of ${s.n}${s.excused ? ` · ${s.excused} excused` : ''}</span></td>
      <td data-label="Minutes received">${meter(s.dose)}<span class="small muted">${s.pres} of ${s.req} min</span></td>
      <td class="num">${cnt(s.absent)}</td><td class="num">${cnt(s.late)}</td><td class="num">${cnt(leftEarly)}</td>
      <td class="c-last" data-label="Last 10 class days">${lastTen(datesOf.get(s.key))}</td></tr>`;
  }
  h += `</tbody></table></div>
    <p class="small muted" style="margin-top:10px">Excused absences and finished-work time aren’t counted. “Minutes received” is time in Zoom during the student’s scheduled hours. Click a name for the student report.</p>`;
  el.innerHTML = h;
}

/* ---------------- Student report ---------------- */
function ctxFor(A, key, period, sums){
  const all = sums || studentSummary(daysInRange(A.days));
  const p = all.find(x => x.key === key) || null;
  const name = p ? p.name : (A.nameOf[key] || key);
  const dates = studentDates(A, key, period);
  return { A, period, key, name, first: firstName(name), p, dates, weeks: weekRows(dates, period, dk => !!planFor(A, key, dk)), info: scheduleInfo(A, key, period) };
}
function renderStudentReport(A, el){
  const period = periodOf(A), { list } = studentList(A);
  const ctx = ctxFor(A, state.student, period);
  el.innerHTML = studentReportHTML(ctx, { include: state.include, order: list.map(s => ({ key: s.key, name: s.name })) });
  focusNoteInput(el);
}
function studentReportHTML(ctx, o){
  if (o.family) return familyReportHTML(ctx, o);
  let h = `<article class="sreport" data-student="${esc(ctx.key)}">`;
  if (!o.print) h += reportBar(ctx, o);
  h += reportHeader(ctx);
  if (!ctx.p){
    h += `<section class="rsec"><p>No class days with Zoom reports for ${esc(ctx.name)} in these dates.${o.print ? '' : ` <button class="linkish" data-range="all">Show all dates</button>`}</p></section>`;
    if (!o.print) h += followUpSection(ctx, o);
    return h + '</article>';
  }
  // The calendar is the report: every class as a small bar on its own clock, each week's minutes at the end
  // of its row, and any day opens under its week with the full picture.
  h += `<section class="rsec"><h3>Calendar</h3>${stripCalendar(ctx, o)}</section>`;
  if (o.print && o.include.table) h += printDayTable(ctx, o);
  if (!o.print || o.include.log) h += followUpSection(ctx, o);
  if (!o.print) h += familySection(ctx);
  return h + footerSection(ctx, o) + '</article>';
}

function reportBar(ctx, o){
  const order = o.order || [], i = order.findIndex(x => x.key === ctx.key);
  const prev = i > 0 ? order[i - 1] : null, next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
  const back = state.studentFrom ? `← Back to ${longDate(state.studentFrom)}` : '← All students';
  return `<div class="rbar">
    <div class="r1"><button class="btn small ghost" data-studentback>${esc(back)}</button>
      ${i >= 0 && order.length > 1 ? `<nav class="pn" aria-label="Other students">${prev ? `<button class="btn small ghost" data-stepstudent="${esc(prev.key)}" title="Previous: ${esc(prev.name)}">‹ ${esc(prev.name)}</button>` : ''}
        <span>${i + 1} of ${order.length}</span>
        ${next ? `<button class="btn small ghost" data-stepstudent="${esc(next.key)}" title="Next: ${esc(next.name)}">${esc(next.name)} ›</button>` : ''}</nav>` : ''}</div>
    <div class="r2">${rangeBar()}
      <details class="menu"><summary class="btn small">Print or share</summary><div class="pop" role="group" aria-label="Print or share">
        <button class="item" data-printone>Print this report</button><button class="item" data-printfamily>Print family version</button>
        <button class="item" data-copysummary>Copy summary</button>
        <button class="item" data-exportstudent title="Saves a file with this student’s name to your Downloads folder.">Download CSV</button>
        <div class="inc">Include:${includeBoxes()}</div></div></details></div></div>`;
}

// Who, when, and the numbers, in one card.
function reportHeader(ctx){
  const { period, info, p } = ctx, S = state.data.settings;
  const nWeeks = Math.round((parseDk(weekKey(period.to)) - parseDk(weekKey(period.from))) / 6048e5) + 1;
  const drop = dropOf(ctx.key);
  const roster = [info.addedOn && info.addedOn > period.from ? `on the schedule since ${monDay(info.addedOn)}` : '', info.inLatest || drop ? '' : 'not on the current schedule'].filter(Boolean);
  // Dropped from the class: a line saying so (with Undo), or a small control to record it.
  const dropLine = drop ? `<p class="dropnote">Dropped from the class starting ${esc(longDate(drop))}. Days from then on aren’t counted.
      <button class="linkish noprint" data-undrop="${esc(ctx.key)}">Undo</button></p>`
    : state.dropEdit === ctx.key ? `<div class="dropform noprint" role="group" aria-label="Dropped from the class"><span>Not in the class starting</span>
      <input type="date" data-dropdate value="${esc(todayDk())}" aria-label="First day not in the class">
      <button class="btn small" data-dropsave="${esc(ctx.key)}">Save</button><button class="btn small ghost" data-dropcancel>Cancel</button>
      <span class="small muted">Days from then on aren’t counted, and ${esc(ctx.first)} is hidden from the lists. Earlier days stay on this report.</span></div>`
    : `<button class="linkish noprint dropbtn" data-dropstart="${esc(ctx.key)}">Dropped from the class?</button>`;
  return `<header class="rhead"><div class="eyebrow printonly">Intervention attendance report</div>
    <h2 tabindex="-1">${esc(ctx.name)}</h2>${dropLine}
    <p class="small muted">${esc(fmtPeriod(period))} · ${plural(nWeeks, 'week')} · ${plural(p ? p.sessions : 0, 'class day')} with Zoom reports${roster.length ? ` · ${esc(roster.join(', '))}` : ''}<span class="printonly"> · Printed ${esc(monDay(todayDk()))}, ${new Date().getFullYear()} · Prepared by ${esc(S.teacherName || '______')}</span></p>
    ${scheduleChart(info)}
    ${p ? minutesBlock(ctx) : ''}</header>`;
}
// The weekly schedule as a picture: one row per class day on a shared clock, with the instruction and
// support-hour blocks drawn where they fall. Screen readers get the same schedule as a sentence.
// Support time that overlaps instruction counts as instruction, so only the support pieces outside it are drawn.
// Each piece keeps its section's full times (startMin/endMin) for labels; a/b are what's drawn.
function drawnSecs(secs){
  const I = mergeIntervals(secs.filter(x => x.type === 'instruction').map(x => [x.startMin, x.endMin]));
  const out = secs.filter(x => x.type === 'instruction').map(x => ({ ...x, type: 'instruction', a: x.startMin, b: x.endMin }));
  for (const x of secs.filter(x => x.type !== 'instruction')){
    let cur = x.startMin;
    for (const [a, b] of I){ if (b <= cur || a >= x.endMin) continue; if (a > cur) out.push({ ...x, type: 'support', a: cur, b: a }); cur = Math.max(cur, b); }
    if (cur < x.endMin) out.push({ ...x, type: 'support', a: cur, b: x.endMin });
  }
  return out.sort((p, q) => p.a - q.a);
}
const secName = x => x.type === 'instruction' ? 'Instruction' : 'Support hour';
function secRange(x){ const r = shortRange(x.startMin, x.endMin); return /[AP]M.*[AP]M/.test(r) ? r : r.replace(/ [AP]M$/, ''); }
// The weekly schedule as a picture: one row per class day on a shared clock, with the instruction and
// support-hour blocks drawn where they fall. Screen readers get the same schedule as a sentence.
function scheduleChart(info){
  if (!info.byW.length) return '<p class="small">Not on the schedule at the end of these dates.</p>';
  const lo = Math.floor(Math.min(...info.byW.map(x => x.plan.startMin)) / 60) * 60;
  const hi = Math.ceil(Math.max(...info.byW.map(x => x.plan.endMin)) / 60) * 60;
  const span = Math.max(60, hi - lo), at = m => (m - lo) / span * 100, hours = [];
  for (let m = lo; m <= hi; m += 60) hours.push(m);
  const grid = hours.map(m => `<i class="ws-grid" style="left:${at(m).toFixed(2)}%"></i>`).join('');
  const types = new Set(info.byW.flatMap(x => x.plan.secs.map(s => s.type === 'instruction' ? 'instruction' : 'support')));
  // The track is about 520px wide; each block gets the longest label that fits inside it (the full text is in its title).
  const fit = (t, px) => t.length * 7 + 12 <= px;
  const rows = info.byW.map(({ w, plan }) => {
    const blocks = drawnSecs(plan.secs).map(x => {
      const px = (at(x.b) - at(x.a)) / 100 * 520, full = `${secName(x)} ${secRange(x)}`;
      const label = fit(full, px) ? full : fit(secName(x), px) ? secName(x) : '';
      return `<span class="ws-blk ${x.type}" title="${esc(`${cap(DAYS[w])}: ${secName(x)}, ${shortRange(x.startMin, x.endMin)}`)}"
        style="left:calc(${at(x.a).toFixed(2)}% + 1px);width:calc(${(at(x.b) - at(x.a)).toFixed(2)}% - 2px)">${esc(label)}</span>`;
    }).join('');
    return `<div class="ws-row"><span class="ws-day">${cap(DAYS[w]).slice(0, 3)}</span><span class="ws-track">${grid}${blocks}</span><span class="ws-min">${plan.minutes} min</span></div>`;
  }).join('');
  const axis = `<div class="ws-row ws-axis"><span></span><span class="ws-track">${hours.map(m => `<span style="left:${at(m).toFixed(2)}%">${esc(fmtMin(m).replace(':00', ''))}</span>`).join('')}</span><span></span></div>`;
  const sentence = `Schedule: ${info.line}. ${info.weekMin} minutes a week.`;
  return `<div class="wsched"><div class="ws-head"><span>Schedule</span><b>${info.weekMin} minutes a week</b>${info.changedOn ? `<span>· changed ${esc(monDay(info.changedOn))}, earlier days used the old schedule</span>` : ''}</div>
    <div role="img" aria-label="${esc(sentence)}">${axis}${rows}</div>
    <div class="ws-key" aria-hidden="true">${types.has('instruction') ? '<span><i class="ws-sw instruction"></i>Instruction</span>' : ''}${types.has('support') ? '<span><i class="ws-sw support"></i>Support hour</span>' : ''}</div></div>`;
}
// The numbers, and where every scheduled minute went: one bar per kind of class time on a shared scale,
// dark for minutes in Zoom, colored by where the other minutes went. Every value is also written out.
const nf = n => Number(n).toLocaleString('en-US');
const PART = { in: 'in Zoom', before: 'before joining', out: 'out of Zoom mid-class', after: 'after leaving', absent: 'absent days' };
function minutesBlock(ctx){
  const p = ctx.p, S = state.data.settings;
  if (!p.n) return `<p class="small muted mblock">No class days counted in these dates${p.excused ? ` (${plural(p.excused, 'excused day')})` : ''}.</p>`;
  const T = partTotals(ctx), sum = o => o.in + o.before + o.out + o.after + o.absent;
  const types = [['instruction', 'Instruction', p.iPres, p.iReq], ['support', 'Support hour', p.sPres, p.sReq]].filter(x => x[3] > 0);
  const maxC = Math.max(1, ...types.map(([t]) => sum(T[t])));
  const bars = types.map(([t, label, got, of]) => {
    const parts = Object.keys(PART).filter(k => T[t][k] > 0);
    const aria = `${label}: ${got} of ${of} minutes in Zoom; ` + ['before', 'out', 'after', 'absent'].map(k => `${T[t][k]} ${PART[k]}`).join('; ') + '.';
    return `<div class="lab"><b>${label}</b> <span>${nf(got)} of ${nf(of)}</span></div>
      <div class="mtrack"><div class="mbar" role="img" aria-label="${esc(aria)}" style="width:${(sum(T[t]) / maxC * 100).toFixed(2)}%">${parts.map(k =>
        `<i class="s-${k}" style="flex:${T[t][k]} 0 0" title="${esc(`${label} · ${PART[k]}: ${nf(T[t][k])} min`)}"></i>`).join('')}</div></div>`;
  }).join('');
  const tot = k => T.instruction[k] + T.support[k];
  const days = (k, n, words, tail = '') => n ? `<span class="kd"><span class="sep"> · </span>${letterCell(k, '')} ${esc(words)} ${plural(n, 'day')}${tail}</span>` : '';
  const item = (k, name, extra, title) => { const m = k === 'in' ? p.pres : tot(k);
    return `<li class="${m ? '' : 'zero'}"${title ? ` title="${esc(title)}"` : ''}><span class="ksw s-${k}" aria-hidden="true"></span><span class="kt"><b>${name}</b> <span class="v">${nf(m)} min</span>${extra}</span></li>`; };
  const key = [
    item('in', 'In Zoom', ''),
    item('before', 'Before joining', days('late', p.late, 'late'),
      `Counts every minute before the student joined. A day counts as late after ${S.lateGrace} minutes.`),
    item('out', 'Out of Zoom mid-class', days('drop', p.drop, 'out mid-class')),
    item('after', 'After leaving', days('soft', p.soft, 'left support hour early') + days('early', p.early, 'left early')),
    item('absent', 'Absent days', days('absent', p.absent, 'absent', p.streak >= 2 ? `, last ${p.streak} in a row` : ''))];
  const not = [T.excDays ? `${letterCell('exc', '')} ${plural(T.excDays, 'excused day')} (${nf(T.excMin)} min)` : '',
    T.finMin ? `${letterCell('fin', '')} finished work early, ${nf(T.finMin)} min on ${plural(T.finDays, 'day')}` : ''].filter(Boolean);
  return `<div class="mblock">
    <dl class="mfig"><div><dt>Days attended</dt><dd>${p.attended} of ${p.n}${p.rate === null ? '' : ` <span>${p.rate}%</span>`}</dd></div>
      <div><dt>Minutes received</dt><dd>${nf(p.pres)} of ${nf(p.req)}${p.dose === null ? '' : ` <span>${p.dose}%</span>`}</dd></div></dl>
    <div class="mbars">${bars}</div>
    <ul class="mkey">${key.join('')}</ul>
    ${p.missed ? `<p class="mnot">${letterCell('missed', '')} Missed instruction on ${plural(p.missed, 'day')}: in Zoom less than 5 minutes of the instruction time.</p>` : ''}
    ${not.length ? `<p class="mnot"><span class="ksw s-none" aria-hidden="true"></span>Not counted (light gray): ${not.join(' · ')}</p>` : ''}</div>`;
}

function weekTip(w){
  const parts = [`Week of ${monDay(w.wk)}${w.current && !w.complete ? ' (so far)' : ''}: ${w.received} of ${w.counted} expected minutes.`];
  if (w.missed) parts.push(`Missed ${w.missed}${w.absentDks.length ? ` (absent ${listJoin(w.absentDks.map(shortDate), 3)})` : ''}.`);
  if (w.excFin) parts.push(`${w.excFin} min excused or finished early, not counted.`);
  if (w.notHeld) parts.push(`${w.notHeld} min no class.`);
  if (w.noReport) parts.push(`${w.noReport} min with no Zoom report.`);
  return parts.join(' ');
}
/* The class-strip calendar: weeks down, weekdays across. Each class is a small bar on that weekday's own clock,
   from the start of class (left) to the end (right), colored like the header bars. */
// One class as a bar: the scheduled time is the track, colored by where each minute went.
function stripHTML(d, lo, hi){
  const X = m => (m - lo) / Math.max(1, hi - lo) * 100, f = n => n.toFixed(2);
  const held = d.status === 'held';
  const secs = held ? d.rec.secs.map(x => ({ type: x.type, a: clockMinF(x.a), b: clockMinF(x.b) }))
    : d.plan ? d.plan.secs.map(x => ({ type: x.type, a: x.startMin, b: x.endMin })) : [];
  const segs = held ? segsOf(d.rec).map(g => ({ k: g.k, a: clockMinF(g.a), b: clockMinF(g.b) })) : [];
  const sorted = [...secs].sort((x, y) => x.a - y.a);
  let h = '';
  for (const [A, B] of mergeIntervals(secs.map(x => [x.a, x.b]))){
    let inner = '';
    const mine = segs.filter(g => g.a >= A - 0.01 && g.b <= B + 0.01 && g.k !== 'fin' && g.k !== 'exc' && g.b > g.a);
    mine.forEach((g, n) => {
      const w = (g.b - g.a) / (B - A) * 100;
      inner += `<i class="s-${g.k}" style="left:${f((g.a - A) / (B - A) * 100)}%;width:${n === mine.length - 1 ? f(w) + '%' : `calc(${f(w)}% - 1px)`}"></i>`;
    });
    // A thin line where instruction turns into the support hour.
    for (let n = 1; n < sorted.length; n++) if (sorted[n].type !== sorted[n - 1].type && Math.abs(sorted[n].a - sorted[n - 1].b) < 0.5 && sorted[n].a > A && sorted[n].a < B)
      inner += `<b class="bd" style="left:${f((sorted[n].a - A) / (B - A) * 100)}%"></b>`;
    h += `<span class="tk${held ? '' : ' pend'}" style="left:${f(X(A))}%;width:${f(X(B) - X(A))}%">${inner}</span>`;
  }
  return `<span class="ds" aria-hidden="true">${h}</span>`;
}
const winOf = d => d.plan ? [d.plan.startMin, d.plan.endMin] : d.rec ? [clockMinF(d.rec.winStart), clockMinF(d.rec.winEnd)] : null;
const clockLabel = m => fmtMin(m).replace(/ [AP]M$/, '').replace(':00', '');
// The sentence a screen reader (and the hover title) gives for one day.

  if (d.status === 'missing') return `${longDate(d.dk)}: No Zoom report.`;

function stripCalendar(ctx, o){

  const cols = wds.map(wd => {
    const ds = dates.filter(d => parseDk(d.dk).getDay() === wd), wins = ds.map(winOf).filter(Boolean);
    const lo = Math.min(...wins.map(x => x[0])), hi = Math.max(...wins.map(x => x[1]));
    const last = [...ds].reverse().find(d => d.plan);
    return { wd, lo, hi, ribbon: last ? last.plan.secs : [], weight: Math.max(45, hi - lo) };
  });
  const W = cols.reduce((t, c) => t + c.weight, 0), showWk = weeks.length > 1;
  const roomy = !o.print && weeks.length <= 10, dprint = o.print && weeks.length > 22;
  const g2on = !dprint && wds.length <= 3 && dates.some(d => d.status === 'held' && dayLetters(d.rec).length === 2);
  const chg = A.versions.map(v => v.from).filter(f => f && f > period.from && f <= period.to && f !== ctx.info.addedOn && planChanged(A, ctx.key, f)).sort();
  const fusByWk = new Map();
  for (const f of state.data.followUps[ctx.key] || []) if (f.date >= period.from && f.date <= period.to){
    const k = weekKey(f.date); if (!fusByWk.has(k)) fusByWk.set(k, []); fusByWk.get(k).push(f);
  }
  const selD = !o.print && state.selDay ? dates.find(d => d.dk === state.selDay && ['held', 'noclass', 'missing'].includes(d.status)) : null;
  const clickable = dates.filter(d => ['held', 'noclass', 'missing'].includes(d.status));
  const focusDk = selD ? selD.dk : ([...clickable].reverse().find(d => d.status === 'held') || clickable[0] || {}).dk;
  const max = Math.max(1, ...weeks.map(w => w.counted)), nCols = 1 + wds.length + (showWk ? 1 : 0);
  // Header: weekday, its schedule as a thin ribbon, and the clock at each end.
  const head = cols.map(c => {
    const X = m => ((m - c.lo) / Math.max(1, c.hi - c.lo) * 100).toFixed(2);
    const px = c.weight / W * (showWk ? .69 : .93) * 720 - 40, lw = t => t.length * 6 + 6;
    const sL = clockLabel(c.lo), eL = clockLabel(c.hi), showE = lw(sL) + lw(eL) <= px;
    const mids = [];
    for (let m = Math.ceil((c.lo + 1) / 60) * 60; m < c.hi; m += 60){
      const x = (m - c.lo) / Math.max(1, c.hi - c.lo) * px, w2 = lw(clockLabel(m)) / 2;
      if (x - w2 >= lw(sL) && x + w2 <= px - (showE ? lw(eL) : 0)) mids.push(m);
    }
    return `<th scope="col" class="wdh">${cap(DAYS[c.wd]).slice(0, 3)}<span class="sr">, ${esc(shortRange(c.lo, c.hi))}</span>
      <div class="colaxis" aria-hidden="true"><div class="rib">${drawnSecs(c.ribbon).map(x => `<span class="${x.type}" style="left:${X(x.a)}%;width:${(X(x.b) - X(x.a)).toFixed(2)}%"></span>`).join('')}</div>
      <div class="ticks"><span class="s">${sL}</span>${mids.map(m => `<span class="mid" style="left:${X(m)}%">${clockLabel(m)}</span>`).join('')}${showE ? `<span class="e">${eL}</span>` : ''}</div></div></th>`;
  }).join('');

      if (d.status === 'pending' || d.status === 'upcoming'){

// The family version keeps the simple letter calendar.

    for (const wd of wds){

      } else if (d && (d.status === 'noclass' || d.status === 'missing')){
        kinds.add(d.status);
        body += cell(`c-${d.status}`, dk, `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER[d.status]}</span>`, cellTitle(d));
      } else if (d) body += `<td class="c-pending"><span class="dn">${num}</span><span class="sr">${esc(shortDate(dk))}: not yet</span></td>`;

// The day picked on the calendar, shown under its week: the class drawn large, the times, the note and the actions.
function dayDetail(ctx){

    return { x: Xm(x.a), w: wPct, type: x.type, text: full.length * 6.6 + 10 <= px ? full : shortRange(x.startMin, x.endMin).length * 6.6 + 10 <= px ? shortRange(x.startMin, x.endMin) : '' };

  if (!s.isAbsent && segs.some(g => g.k === 'after' || g.k === 'fin')) L.push({ x: X(s.lastLeave), text: 'left ' + hm(s.lastLeave) });

    for (const l of [...L].sort((a, b) => a.x - b.x)){
      const w = l.text.length * 6.4 + 6, px = l.x / 100 * Wpx;
      const a = l.align === 'start' ? px : l.align === 'end' ? px - w : px - w / 2, b = a + w;

    return kept; };

    : `${s.presentMin} of ${s.reqMin - fin} min${s.instrReqMin && s.suppReqMin ? ` · instruction ${s.instrMin} of ${s.instrReqMin} · support hour ${s.suppMin} of ${s.suppReqMin - fin}` : ''}${fin ? ` · ${fin} min finished work early, not counted` : ''}`;

      <span class="dd-links"><button class="linkish" data-goday="${d.dk}" data-xkey="${esc(s.xkey)}">Open on Reports</button>${close}${navs}</span></div>

      <div class="rib" aria-hidden="true">${ribbon.map(r => `<span class="${r.type}" style="left:${r.x.toFixed(2)}%;width:${r.w.toFixed(2)}%"></span>`).join('')}</div>
      ${stripHTML(d, lo, hi)}

// Every class day as a table: printed on request, and on screen under "Show every day as a table".

    ${rows.map(d => {
      if (d.status !== 'held') return `<tr><td>${esc(shortDate(d.dk))}</td><td>${d.status === 'noclass' ? `No class: ${esc(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other')}` : 'No Zoom report'}</td><td>—</td><td>—</td><td>—</td><td>—</td>${blank}</tr>`;
      const s = d.rec, ex = isExcused(s);

/* Note to the family: fixed, warm sentences with the student's numbers slotted in. Never notes, follow-ups or Zoom names. */
const draftKey = ctx => ctx.key;   // one draft per student; it remembers which dates it was written for
function familySchedule(ctx){
  const groups = [];
  for (const { w, plan } of ctx.info.byW){
    const g = groups.find(x => x.s === plan.startMin && x.e === plan.endMin);
    if (g) g.ws.push(w); else groups.push({ s: plan.startMin, e: plan.endMin, ws: [w] });
  }
  if (!groups.length) return '';
  const parts = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)}, ${fmtRange(g.s, g.e)}`);
  return `Class meets on ${parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(', ')}, and ${parts[parts.length - 1]}`}.`;
}
// A short, warm note with the student's numbers. You edit it before sending; it never includes notes or follow-ups.
function familyNote(ctx){
  const { p, period, first: F } = ctx, S = state.data.settings;
  const L = [`Hello, ${F}’s family,`, '', `This is an update on ${F}’s attendance in ${S.className || 'our intervention class'}.`,
    `It covers ${monthDay(period.from)} to ${monthDay(period.calcTo)}.`];
  if (!p || !p.n) L.push('There were no class days to count in this time.');
  else {
    const R = p.rec.filter(r => !isExcused(r.s)), n = p.n, x = p.attended, lastR = R[R.length - 1], prevR = R[R.length - 2];
    let saidAll = false;
    if (p.absent === 0){ saidAll = true; L.push(n >= 3 ? `${F} came to all ${n} classes. Thank you!` : n === 2 ? `${F} came to both classes. Thank you!` : `${F} came to class on ${longDate(R[0].day.dk)}. Thank you!`); }
    else if (x >= 1 && p.full === x) L.push(`When ${F} came to class, ${F} stayed the whole time.`);
    else if (prevR && !lastR.s.isAbsent && prevR.s.isAbsent) L.push(`It was great to see ${F} back in class on ${longDate(lastR.day.dk)}.`);
    else if (x >= 1) L.push(`${F} came to class on ${plural(x, 'day')}. We were glad to see ${F}.`);
    else L.push(`We miss ${F} in class. ${F} is always welcome.`);
    if (!saidAll && x > 0) L.push(`${F} came to ${x} of ${plural(n, 'class', 'classes')}.`);
    if (p.dose !== null && p.rate !== null && p.dose <= p.rate - 10) L.push(`${F} was in class for ${p.pres} of ${p.req} minutes.`);

}

function scheduleDiff(oldText, newText){

  const respelled = [];

  return { added, removed, respelled };
}

// A corrected spelling keeps the student's notes, marks and follow-ups.
function renameStudentKey(oldK, newK){
  if (!oldK || !newK || oldK === newK) return;
  const D = state.data;
  for (const bag of [D.notes, D.excused, D.excusedAbsent]) for (const k of Object.keys(bag)){
    const i = k.indexOf('|');
    if (k.slice(i + 1) === oldK){ const nk = k.slice(0, i + 1) + newK; if (!(nk in bag)) bag[nk] = bag[k]; delete bag[k]; }
  }
  if (D.followUps[oldK]){ D.followUps[newK] = [...(D.followUps[newK] || []), ...D.followUps[oldK]]; delete D.followUps[oldK]; }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}
const respellText = (text, a, b) => text.split('\n').map(r => r.split('\t').map(c => normKey(c) === normKey(a) ? b : c).join('\t')).join('\n');
function applySchedule(mode, from){
  const vs = state.data.scheduleVersions, text = state.draft;
  if (mode === 'start' && !schedStartOk({ mode, date: from })) return;
  if (mode === 'start'){
    const i = vs.findIndex(v => v.from === from);
    if (i >= 0) vs[i].text = text; else { vs.push({ from, text }); vs.sort((a, b) => a.from.localeCompare(b.from)); }
  } else {
    for (const [a, b] of scheduleDiff(state.data.scheduleText, text).respelled){
      for (const v of vs.slice(0, -1)) v.text = respellText(v.text, a, b);
      renameStudentKey(normKey(a), normKey(b));
    }
    vs[vs.length - 1].text = text;
  }
  vs[0].from = '';
  state.data.scheduleText = vs[vs.length - 1].text;
  state.draft = null; state.schedChange = null; state.viewVersion = null;
  changed(); renderSchedule();
}

function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('intervention-attendance', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e){ return null; } }
async function idbSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e){} }

// Asked once the chosen folder is known, and only when it's a different folder: switching would drop changes
// that never reached the old folder. (Refreshing the same folder keeps them; see ingest.)
function okToSwitch(folderName){
  return !(state.loaded && state.dirty && folderName !== state.folderName)
    || confirm('Some changes aren’t saved in the folder yet. Click Cancel, then “Download data file” to keep them. Or click OK to open this folder without them.');

async function pickFolder(){

    if (!okToSwitch(h.name)) return;

async function reopen(){
  const h = state.dirHandle || state.savedHandle; if (!h) return pickFolder();
  try {
    let p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted'){
      const r = await h.requestPermission({ mode: 'read' });
      if (r !== 'granted'){ setStatus('Access to the folder wasn’t allowed. Click “Open attendance folder” to try again.'); return; }
    }
    state.dirHandle = h; await loadFromHandle();
  } catch (e){ setStatus('The saved folder couldn’t be opened. Choose it again. (' + e.message + ')'); state.savedHandle = null; renderFolderBar(); }
}
async function loadFromHandle(){
  const h = state.dirHandle, files = []; let dataText = null;
  for await (const [name, entry] of h.entries()){
    if (entry.kind !== 'file') continue;
    const low = name.toLowerCase();
    if (low === DATA_FILE) dataText = await (await entry.getFile()).text();
    else if (low.endsWith('.csv')){ const file = await entry.getFile(); files.push({ name, text: await file.text(), modified: file.lastModified }); }
  }
  state.canWrite = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
  ingest(files, dataText, h.name);
}
async function loadFromInput(list){
  const files = []; let dataText = null, folder = '';
  for (const f of list){
    const low = f.name.toLowerCase();
    if (!folder && f.webkitRelativePath) folder = f.webkitRelativePath.split('/')[0];
    if (low === DATA_FILE) dataText = await f.text();
    else if (low.endsWith('.csv')) files.push({ name: f.name, text: await f.text(), modified: f.lastModified });
  }
  if (!okToSwitch(folder)) return;

}
function ingest(files, dataText, folderName){
  let msg = null, info = false;

  // Refreshing the same folder keeps changes that haven't reached the folder yet, instead of reloading the older file.
  const keep = same && state.dirty;
  if (keep){ msg = 'Your changes that aren’t saved in the folder yet were kept.'; info = true; }
  else if (dataText){
    try {
      const raw = JSON.parse(dataText);
      state.data = withDefaults(raw);
      if ((raw.version || 1) < 3 && Object.keys(raw.excused || {}).length){ msg = 'Finished-work time no longer counts as missed minutes on the Students tab.'; info = true; }
    } catch (e){ msg = `${DATA_FILE} couldn’t be read, so the schedule and settings weren’t loaded.`; }
  }
  // A different folder (another class) with no data file starts empty, so one class's notes never land in another's folder.
  else if (state.loaded && !same) state.data = defaultData();
  state.files = files.sort((a, b) => a.name.localeCompare(b.name));
  state.folderName = folderName; state.loaded = true; state.dirty = keep; state.draft = null; state.noteEdit = null;
  state.fuEdit = null; state.fuEditDraft = null; state.schedChange = null; state.viewVersion = null;
  if (!same){

    state.highlight = null; state.fuPrefill = null; state.familyDraft = {}; state.familyCopied = null;
    if (state.tab === 'students') state.tab = 'reports';

}
let saveTimer = null;
function changed(){ state.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); renderSaveState(); }
async function save(){
  if (!(state.dirHandle && state.canWrite)){ renderSaveState(); return; }
  state.saving = true; renderSaveState();
  try {
    const fh = await state.dirHandle.getFileHandle(DATA_FILE, { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(state.data, null, 2)); await w.close();

async function onClick(t){

    $('#printArea').innerHTML = studentReportHTML(ctxFor(A, state.student, periodOf(A)), { print: true, include: state.include });
    document.body.classList.add('print-reports');
  }
});
window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-reports');
  closedForPrint.forEach(d => { d.open = false; }); closedForPrint = [];
});
window.addEventListener('beforeunload', e => { if (state.dirty && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; renderFolderBar();
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){}
})();
</script>
</body>
</html>
