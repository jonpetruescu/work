<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: this page may not load or send anything over the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervention attendance</title>
<style>
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
  --ink:#1C2433; --muted:#566074; --faint:#6B7486; --rule:#A3ACBA;
  --instr:#C9DAF8; --support:#FFF2CC; --bar:#24324D;
  --ok:#1D6F47; --ok-bg:#DFF1E7;
  --late:#8F4B00; --late-bg:#FBE8D2;
  --bad:#A8231A; --bad-bg:#FADFDB;
  --soft:#6E5800; --soft-bg:#FBF0BF;
  --drop:#57409A; --drop-bg:#E9E3F7;
  --fin:#11636C; --fin-bg:#D8EFF1;
  --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
  /* Where a scheduled minute went, for the student report's bars and strips (checked for color-blind separation). */
  --loss-before:#CB7E6B; --loss-out:#5346A7; --loss-after:#837120; --loss-absent:#8E3642;
  --instr-edge:#8FAEE6; --support-edge:#D9B44A;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Five text sizes: notes, small text, body, headings, page titles */
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121822; --surface:#19212E; --line:#2B3546; --grid:#222B39;
    --ink:#E5E9F1; --muted:#A4AEBF; --faint:#8C96A8; --rule:#4E5A6E;
    --instr:#2C3D61; --support:#4A4123; --bar:#A9C2F5;
    --ok:#74D3A2; --ok-bg:#163428; --late:#F2B36B; --late-bg:#3D2A12;
    --bad:#F28B82; --bad-bg:#40201D; --soft:#E8D27A; --soft-bg:#3A3315;
    --drop:#C3B1F2; --drop-bg:#2C2445; --fin:#7FD3DB; --fin-bg:#14363A;
    --focus:#7FA8FF; --btn:#A9C2F5; --btn-ink:#121822;
    --loss-before:#A05B11; --loss-out:#6863B1; --loss-after:#A19500; --loss-absent:#D1717A;
    --instr-edge:#5577BB; --support-edge:#8C7A2E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
/* One title row: name and privacy line on the left, the folder on the right. The folder gets the space that's left
   (a zero basis, so it never wraps under the title on a computer), and a long folder name ends in "…". */
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:12px 0 4px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;flex:none;max-width:100%}
.brand h1{font-size:var(--fs-lg);line-height:1.2;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.folder #reopen{min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder{margin-left:auto;display:flex;flex:1 1 0;min-width:0;justify-content:flex-end;flex-wrap:nowrap;align-items:center;gap:12px;white-space:nowrap}
.folder .where{color:var(--muted);font-size:var(--fs-sm);margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.folder .where b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:var(--fs-md)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:3px 9px;font-size:var(--fs-sm);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.folder .btn{height:32px;padding:0 14px;font-size:.875rem}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{flex:none}
nav.tabs button{background:none;border:0;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-md);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
.savebar{font-size:var(--fs-sm);color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.savebar .linkish{color:var(--muted)}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}

main.wrap{padding:22px 20px 60px}
.notice{border:1px solid var(--line);border-left:4px solid var(--late);background:var(--surface);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:var(--fs-md)}
.notice.info{border-left-color:var(--bar)}
.notice ul{margin:6px 0 0;padding-left:20px}
.nc1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}   /* one date with no report: the sentence, then its select and button on the same line */
/* Messages float over the bottom corner, so nothing on the page moves when one comes or goes. */
#status{position:fixed;right:24px;bottom:24px;z-index:5;max-width:420px}
#status .notice{display:flex;align-items:baseline;gap:12px;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#status .linkish{margin-left:auto;flex:none}

/* Onboarding */
.start{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px;max-width:760px}
.start h2{font-size:var(--fs-xl);margin-bottom:6px}
.start ol{padding-left:22px;margin:14px 0 18px}
.start li{margin:8px 0}
.startsetup{margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}

/* Toolbar: one even 32px strip with one text size. Controls inside a popover keep their own sizes. */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar > *{flex:none}
.toolbar .grow{flex:1 1 0}
.toolbar .tbend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;max-width:100%}   /* the controls at the right end, kept together and at the right if the row wraps */
.toolbar :is(.search,.btn,summary.btn,select):not(.pop *){height:32px;font-size:var(--fs-sm)}
.toolbar :is(.btn,summary.btn):not(.pop *){display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:30px;padding:0 12px;cursor:pointer;font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;min-width:220px}
.toolbar .search{width:200px;min-width:0;padding:0 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:10px;border-radius:2px}
.sw.i{background:var(--instr)} .sw.s{background:var(--support)} .sw.p{background:var(--bar);height:6px}

/* Day */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.day > summary{list-style:none;cursor:pointer;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
/* On a desktop screen a closed day is one line in three columns: the date, who came and when, and the counts. Dates on
   days with no class line up under the other dates. Printed pages and narrow windows keep the wrapping line. */
@media screen and (min-width: 821px){ details.day > summary{display:grid;grid-template-columns:10px minmax(0,1fr) max-content;grid-template-areas:"a t c" "a s c";gap:2px 16px}
  details.day > summary::before{grid-area:a} details.day > summary h2{grid-area:t} details.day > summary .sub{grid-area:s} details.day > summary .counts{grid-area:c}
  details.day .counts{flex-wrap:nowrap} details.day .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
details.day > summary::-webkit-details-marker{display:none}
details.day > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);align-self:center;margin-right:2px;transition:transform .15s}
details.day[open] > summary::before{transform:rotate(45deg)}
.day h2{font-size:var(--fs-lg)}
.day .sub{color:var(--muted);font-size:var(--fs-sm)}
.counts{display:flex;flex-wrap:wrap;gap:6px;width:auto;padding-left:0}
.count{font-size:var(--fs-sm);font-weight:600;border-radius:999px;padding:2px 10px}
/* The day boxes keep one width each, so they line up from day to day; a box with 0 is faded. */
.counts .count{box-sizing:border-box;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .k-full{width:7.4em} .counts .k-fin{width:9.2em} .counts .k-late{width:5.4em} .counts .k-early{width:8.2em} .counts .k-drop{width:9.6em} .counts .k-absent{width:6.8em}
.counts .count.zero{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--grid)}
.day-body{padding:0 20px 18px}

/* Status colors */
.k-full{background:var(--ok-bg);color:var(--ok)}
.s-in{background:var(--bar)} .s-before{background:var(--loss-before)} .s-out{background:var(--loss-out)}
.s-after{background:var(--loss-after)} .s-absent{background:var(--loss-absent)} .s-none{background:var(--line)}
.k-fin{background:var(--fin-bg);color:var(--fin)}
.k-late{background:var(--late-bg);color:var(--late)}
.k-missed,.k-early{background:var(--bad-bg);color:var(--bad)}
.k-soft{background:var(--soft-bg);color:var(--soft)}
.k-drop{background:var(--drop-bg);color:var(--drop)}
.k-absent{background:var(--bad);color:var(--surface)}
.k-extra{background:var(--grid);color:var(--muted)}
.k-exc{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* Date range: three presets and a "Custom dates…" menu in one segmented control. The menu's label has a fixed
   width and shows the chosen dates, so the control never changes size. The popover may hang below it. */
.seg.range{overflow:visible;flex-wrap:wrap;max-width:100%}   /* wraps only in a window too narrow for it, instead of running off the page */
.seg.range > :first-child{border-radius:6px 0 0 6px}
.rangemenu > summary{display:block;width:10.5em;height:30px;line-height:30px;padding:0 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:var(--fs-sm);border-radius:0 6px 6px 0}
.rangemenu > summary.on{background:var(--bar);color:var(--btn-ink)}
.seg.range .pop{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.range label{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.range input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}
/* Day notes */
.note-txt{display:block;font-size:.8rem;color:var(--ink);font-style:italic;line-height:1.35;margin-top:2px}
input.note{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:.82rem;width:100%;margin-top:4px}

/* Students tab */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.tile .n{font-size:1.6rem;font-weight:600;line-height:1.15;font-variant-numeric:proportional-nums}
.tile .l{font-size:.82rem;color:var(--muted)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.sum{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
table.sum th{font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:10px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.sum .num{text-align:right;white-space:nowrap}
table.sum .zero{color:var(--faint)}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
.meter .fill{display:block;height:100%;background:var(--bar)}
.meter b{font-weight:600;min-width:38px;text-align:right}
.hist{width:100%;border-collapse:collapse;font-size:.84rem}
.hist td,.hist th{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
.hist th{font-size:.74rem;color:var(--muted);font-weight:600}

/* Table */
.grid-head,.row{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:0 14px;align-items:center}
.grid-head{font-size:var(--fs-xs);color:var(--muted);padding:6px 0 6px;border-bottom:1px solid var(--line);font-weight:600}
.row{padding:8px 0;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.who b{font-weight:600}
.who .meta{display:block;font-size:var(--fs-sm);color:var(--muted);line-height:1.35}
.time{font-size:var(--fs-md)}
.time.none{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .acts{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;flex-basis:100%}
.row > .chips{align-self:start}
.chip{font-size:var(--fs-sm);font-weight:600;border-radius:5px;padding:2px 8px;white-space:nowrap}
.quiet{font-size:var(--fs-sm);color:var(--muted)}   /* "Present full time" on a day's row, so the exceptions are what stand out */
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:var(--fs-sm)}
.linkish:hover{color:var(--ink)}

/* Timeline: the class block drawn like a strip of graph paper */
.axis{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.tl{position:relative;height:22px;border-radius:4px;background:var(--paper);border:1px solid var(--grid);overflow:hidden}
.tl .band{position:absolute;top:0;bottom:0}
.tl .band.instruction{background:var(--instr)}
.tl .band.support{background:var(--support)}
.tl .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
.tl .tick.half{opacity:.45}
.tl .bar{position:absolute;top:7px;height:8px;border-radius:2px;background:var(--bar)}

.subhead{font-family:var(--serif);font-size:var(--fs-lg);margin:20px 0 6px}
.mini{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:6px 14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.mini:last-child{border-bottom:0}
.mini > :nth-child(3){grid-column:3 / -1}
.mini .act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:210px;font-size:.84rem}
.files{font-size:var(--fs-sm);color:var(--faint);margin-top:12px}

/* Schedule tab */
.two{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.2fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.panel h2{font-size:var(--fs-lg);margin-bottom:6px}
textarea{width:100%;min-height:340px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px;font-size:var(--fs-sm);line-height:1.4;resize:vertical}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:10px}
.dcol h3{font-size:var(--fs-md);border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:8px}
.sec{border-radius:6px;padding:7px 9px;margin-bottom:8px;font-size:var(--fs-sm)}
.sec.instruction{background:var(--instr)} .sec.support{background:var(--support)}
.sec b{display:block;font-weight:600}
.sec details summary{cursor:pointer;color:var(--muted);font-size:.8rem}
.sec ul{margin:4px 0 0;padding-left:16px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* Settings */
.set{display:grid;grid-template-columns:max-content 64px max-content;gap:10px;align-items:center;max-width:none}   /* label, number, unit: the numbers line up */
.set input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:64px}
.set .unit{color:var(--muted);font-size:var(--fs-sm)}
.fswatch{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fswatch li{display:flex;align-items:center;gap:8px}
.psub{font-family:var(--sans);font-size:var(--fs-sm);font-weight:600;margin:12px 0 0}   /* the Zoom names panel's two lists */
.psub + p{margin:4px 0 0}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:var(--fs-md)}
.list li span{flex:1}
.stack > * + *{margin-top:16px}

/* Shared bits for student reports */
.name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--ink)}
.lc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:var(--fs-xs);font-weight:700;line-height:1;flex:none}
.lc-noclass{color:var(--muted);border:1px dashed var(--line)}
.lc-missing{color:var(--late);border:1px dashed var(--late)}
.last10{display:flex;gap:3px;flex-wrap:wrap}
.legend-line{font-size:var(--fs-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 8px}
.legend-line > span{display:inline-flex;gap:5px;align-items:center}
.nclist{list-style:none;margin:6px 0 0;padding:0}
.nclist li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 0}
.nclist li > span:first-child{min-width:8.5em}
.nclist select,.nc1 select,.rsec select,.rsec input[type=date],.rsec input[type=text],.sched-step input[type=date]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font-size:.86rem}
.noclasscard{border:1px dashed var(--line);border-radius:10px;padding:12px 20px 12px 46px;margin-bottom:8px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.noclasscard b{color:var(--ink);font-family:var(--serif);font-size:var(--fs-lg)}
.noclasscard span{font-size:var(--fs-sm)}   /* the same size as the other days' lines */
@media screen and (min-width: 821px){ .noclasscard{display:grid;grid-template-columns:minmax(0,1fr) max-content;grid-template-areas:"t u" "s u";gap:2px 16px}
  .noclasscard b{grid-area:t} .noclasscard span{grid-area:s} .noclasscard button{grid-area:u} }   /* laid out like the other days: date, then its line */
.backbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:var(--fs-md)}
.hl{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
.row.hl{background:var(--grid)}
.row.slim{grid-template-columns:minmax(170px,1.25fr) 1fr}
.tile .s{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.listinfo{font-size:var(--fs-sm);color:var(--muted);margin:0 0 10px}
.cardcounts{display:none}
.nmrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nmrow .btn{flex:none}
.sortby{font-size:var(--fs-sm);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sortby select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:var(--fs-sm)}

.dropnote{margin:2px 0 6px;font-size:.88rem;color:var(--late);font-weight:600}
.dropnote .linkish{font-weight:400}
/* The report's name row: the name, then "Dropped from the class?" and "Delete student" at its right end. Recording a drop
   opens in a small menu over the report (leftward, inside it), so nothing on the page moves. */
.rname{display:flex;align-items:baseline;gap:16px}
.rname .dropbtns{margin-left:auto}
.dropbtns{display:inline-flex;align-items:baseline;gap:16px}
.menu.dropmenu .pop{left:auto;right:0;width:490px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}
.dropline{display:flex;align-items:center;gap:8px;white-space:nowrap}
.rhead .dropform p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.dropform input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px}
.ovdrop{display:block;font-size:.66rem;font-weight:500;color:var(--late)}
/* Overview grid: the teacher's spreadsheet colors */
:root{ --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-nosched:#E3E5E8; --ov-ink:#1C2433 }
@media (prefers-color-scheme: dark){ :root{ --ov-engaged:#5E8F4B; --ov-excused:#4C78C4; --ov-idle:#C2A23A; --ov-away:#97577A; --ov-absent:#B44A4A; --ov-nosched:#262F3D; --ov-ink:#10151E } }
.c-engaged{background:var(--ov-engaged)} .c-excused{background:var(--ov-excused)} .c-idle{background:var(--ov-idle)}
.c-away{background:var(--ov-away)} .c-absent{background:var(--ov-absent)} .c-nosched{background:var(--ov-nosched)}
.c-noclass{background:var(--surface);color:var(--muted)} .c-missing{background:var(--surface);color:var(--late)} .c-later{background:var(--surface)}
.c-noclass,.c-missing,.c-later,.c-nosched{--ov-ink:var(--ink)}   /* marks on these days use the page ink, so they show in dark mode too */
/* The key above the grid: three labeled rows, 86px in all. Quick mark swaps its rows for the marks to pick from,
   in the same panel, so the grid below doesn't move. A row only wraps in a window too narrow for it (or on paper),
   so nothing in it is ever cut off. */
.ovkey{min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 10px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ovkey.marking{border-left:4px solid var(--focus);padding-left:7px}
.ovkrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;min-height:24px;font-size:var(--fs-sm);color:var(--muted);white-space:nowrap}
.ovkrow > span{display:inline-flex;align-items:center;gap:5px}
.ovkey b{color:var(--ink)}
.ovkh{min-width:4.2em;color:var(--ink);font-weight:600}
.ovkh2{margin-left:8px;color:var(--ink);font-weight:600}
.ovkey.marking .ovkrow{gap:2px 6px}
.ovkey .ovchip{height:24px;padding:0 7px}
.ovkend{margin-left:auto}
.ovsw{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:2px;font-style:normal;font-size:var(--fs-xs);border:1px solid var(--line)}
.ovsw.ovnote-k{background:linear-gradient(225deg,var(--ink) 0 4px,var(--surface) 4px)}
.ovwrap{position:relative;margin-top:8px}
.ovblock{position:relative;width:fit-content;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
@media print{ #tab-overview .ovblock{overflow:visible} }
/* While the grid scrolls, the month's name stays in view just right of the names, and the scroll bar always shows. */
.ovt th.ovmo span{position:sticky;left:calc(var(--ovnamew, 170px) + 6px)}
.ovblock::-webkit-scrollbar{height:10px}
.ovblock::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.ovblock::-webkit-scrollbar-thumb:hover{background:var(--muted)}
table.ovt{border-collapse:separate;border-spacing:0;font-size:var(--fs-xs)}
.ovt th,.ovt td{padding:0;border-right:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.ovt thead th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--ink);font-weight:600;text-align:center;white-space:nowrap;padding:2px 1px;font-size:var(--fs-xs);font-variant-numeric:proportional-nums}
.ovt thead tr:nth-child(2) th{top:22px}
.ovt th.ovmo{text-align:left;color:var(--ink);padding-left:6px;height:22px}
.ovt th.today,.ovt th.today .ovwd{color:var(--focus)}
.ovwd{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--muted)}
.ovt .wk{border-left:2px solid var(--rule)}
.ovt th.ovname{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 10px 0 8px;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);border-right:1px solid var(--line)}
.ovt th.ovname .name-btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* a long name ends in "…" */
.ovt .name-btn{text-decoration-color:transparent}   /* underlined only under the pointer */
.ovt .name-btn:hover{text-decoration-color:var(--ink)}
.ovt thead th.ovcorner{z-index:4;vertical-align:bottom;padding-bottom:4px;color:var(--muted)}
.ovt tbody tr:hover th.ovname{background:var(--paper)}
.ovc{width:38px;min-width:38px;height:26px}
.ovb{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;gap:1px;width:100%;height:26px;cursor:pointer;color:var(--ov-ink);font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em}
.ovb:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
/* Two-tone ring (ink outside, page color inside), so the focused or open day shows on every color in both themes */
.ovb:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:inset 0 0 0 4px var(--surface)}
.ovc.unsched .ovb::after{content:"";position:absolute;inset:3px;border:1.5px dashed var(--ov-ink);border-radius:2px;pointer-events:none}
.ovsw.ovus-k{border:1.5px dashed var(--ink)}
.ovc.sel .ovb{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 5px var(--surface)}
.c-noclass .ovb,.c-missing .ovb,.c-later .ovb{color:inherit}
.ovm{font-size:var(--fs-xs);color:var(--ov-ink)}
.ovb .ovm{position:absolute;right:2px;bottom:1px;line-height:1;font-size:.66rem}
.ovkey .ovm{color:var(--ink)}
.ovkey .ovxd{color:var(--focus)}
.ovn{position:absolute;top:0;right:0;width:0;height:0;border-top:6px solid var(--ov-ink);border-left:6px solid transparent}
/* Bigger names, months and note corners on screen; on paper the print block's sizes stay as they were. */
@media screen{
  .ovt th.ovmo{font-size:var(--fs-sm);line-height:17px}   /* keeps the month row 22px tall, where the row of dates sticks */
  .ovt th.ovname{font-size:var(--fs-md)}
  .ovdrop{font-size:var(--fs-xs)}
  .ovn{border-top-width:7px;border-left-width:7px}
}
.ovwrap.marking .ovb{cursor:copy}
.ovwrap.marking .ovb:hover{box-shadow:inset 0 0 0 2px var(--focus)}
/* The day editor: the facts, then colors and letters side by side. Every part is there on every day (one that doesn't
   apply is hidden, not left out), so the box is the same size on every day and when anything in it is pressed. */
.ovpop{position:absolute;z-index:10;width:540px;max-height:calc(100vh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;font-size:var(--fs-sm)}
.ovpop-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.ovpop-h b{font-size:var(--fs-md)}
.ovx{margin-left:auto}
.ovgrp{display:flex;flex-direction:column}
.tgl{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;font:inherit;font-size:.86rem;color:var(--ink);cursor:pointer}
:is(.tgl,.ovlet) .tbox{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
:is(.tgl,.ovlet)[aria-pressed="true"] .tbox{background:var(--focus);border-color:var(--focus)}
:is(.tgl,.ovlet)[aria-pressed="true"] .tbox::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tgl:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.ddact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:8px}
.ddnote{display:flex;align-items:center;gap:8px;flex:1;min-width:260px}
.ddnote input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 8px;font-size:.86rem}
.ovset{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:2px}
.ovset.on{background:var(--focus)}
.ovfacts{min-height:4.5em;margin:6px 0 10px}
.ovmarkbtn{min-width:9em}   /* fits "Done marking" too, so the button keeps its width */
.linkish:disabled{color:var(--faint);cursor:default;text-decoration:none}
.ovchip,.ovlet{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 8px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink)}
.ovchip[aria-pressed="true"],.ovlet[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.ovcols{display:grid;grid-template-columns:290px 1fr;gap:0 20px}
/* Full-width rows; a chosen color gets a ring (no bolder text, so nothing shifts) and a chosen letter its checked box */
.ovcols .ovchip,.ovcols .ovlet{width:100%;height:26px;border:0;background:none;padding:0 6px;border-radius:5px;justify-content:flex-start}
.ovcols .ovchip[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ovcols .ovlet[aria-pressed="true"]{box-shadow:none}
.ovcols :is(.ovchip,.ovlet):hover{background:var(--grid)}
.ovmsg{display:flex;align-items:center;height:26px;margin:10px 0 0;padding:0 6px;gap:7px}
.ovmsg input{width:14px;height:14px;margin:0;accent-color:var(--focus)}
@media (prefers-color-scheme: dark){ .ovmsg input{color-scheme:dark} }   /* a dark box, like the letters' boxes beside it */
.ovfinrow{display:flex;align-items:center;height:26px;padding:0 6px}
.ovfinrow .tgl{font-size:inherit}
.ovfinrow.na{visibility:hidden}   /* kept in place on days it doesn't apply, and out of the tab order */
.ovnoteb{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;margin:10px 0 6px}
.ovnoteb input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:var(--fs-sm)}
.ovpop-f{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.ovdh{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;border-radius:3px}
.ovdh:hover{background:var(--paper)}
.ovdh:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
.ovt th.dsel .ovdh{box-shadow:inset 0 0 0 2px var(--focus)}
.ovdpop{position:absolute;z-index:10;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:var(--fs-sm)}
.ovdpop p{margin:6px 0}
.ovdpop .actions{margin-top:8px}
.ovlink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.addday .pop{left:auto;right:0;width:360px;padding:12px 14px;gap:8px;font-size:var(--fs-sm)}   /* opens leftward from the right end of the toolbar */
.addday .pop p{margin:0}
.addday .hist-list{font-size:inherit}
.addday label{display:grid;gap:3px}
.addday input,.addday select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font:inherit;color:var(--ink)}
.addday .actions{margin-top:2px}
.addmsg{min-height:3em}
.ovxd{color:var(--focus);font-weight:700;margin-left:1px}
/* F marks: over a date, a Formative export that day; in a day, answered on Formative though not in Zoom. Placed in a corner, so no column gets wider. */
.ovfd,.ovfa{position:absolute;top:1px;font-size:.625rem;font-weight:700;line-height:1;font-style:normal}
.ovfd{right:2px;color:var(--ink)}
.ovfa{left:2px;color:var(--ov-ink)}
.ovfin{font-size:.625rem;font-weight:700;letter-spacing:0}
.ovkey .ovfd,.ovkey .ovfa,.ovkey .ovfin{position:static;font-size:var(--fs-xs);color:var(--ink)}
@media print{
  .ovblock{border:0}
  .ovt tr{break-inside:avoid}   /* a long class list goes on to the next page between rows, under the dates again */
  .ovt tbody tr:nth-child(-n+3){break-before:avoid}   /* and a block doesn't start at the foot of a page with just one row */
  .ovt thead th,.ovt thead tr:nth-child(2) th,.ovt th.ovname{position:relative;top:auto}   /* relative, not sticky: holds the F marks */
  .ovpop,.ovdpop,#tab-overview .toolbar{display:none !important}
  .ovt th.ovmo span{position:static}   /* the month's name sits at the start of its days */
  .ovmn{display:none}
  body.print-ov header.top{display:none}   /* the printed line above the grid says what it is, so a whole class fits on the first page */
  .ovc,.ovsw{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* Paper sizes: a block fits the page width, so it prints full size instead of shrunk */
  .ovt thead th{font-size:.56rem;padding:2px 0}
  .ovt th.ovmo{height:auto}
  .ovt th.ovname{min-width:0;width:140px;max-width:140px}
  .ovc{width:var(--pcw, 24px);min-width:var(--pcw, 24px);height:15px}
  .ovb{height:15px;font-size:.6rem}
  table.ovt{font-size:.62rem}
  .ovwd{font-size:.5rem}
  .ovb .ovm{font-size:.6rem}
  .ovt .ovfd,.ovb .ovfa{font-size:.45rem}   /* small enough to keep clear of the weekday and the ✓ in the narrower days */
  .ovt .ovfd{right:0} .ovb .ovfa{left:0}
  p.ovprint{margin:0 0 6px;font-weight:600}
}

/* Support hour tab */
.sup{max-width:560px}
.sup-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:4px 0 12px}
.sup-head h2{font-size:var(--fs-lg)}
.sup-head h2:focus{outline:none}
.sup .search{width:100%;max-width:none;font-size:1rem;padding:9px 12px}
.sup-h{font-size:1.05rem;margin:18px 0 6px}
.sup-list{list-style:none;margin:0;padding:0}
.sup-list li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:9px 2px;border-bottom:1px solid var(--grid)}
.sup-list li > b{min-width:9em}
.sup-when{color:var(--ink)}
.sup-found li{align-items:baseline}
.sup-no{color:var(--muted)}
.sup-days{display:flex;flex-wrap:wrap;gap:4px 12px;width:100%;font-size:.8rem;color:var(--muted)}
.sdc{display:inline-flex;align-items:center;gap:4px}
.sup-unm{margin-top:18px}
.sup-unm > summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.btn[data-supmark]{min-width:10.5em}
.sup-cols li,.sup-colh{display:grid;grid-template-columns:10rem minmax(0,1fr);column-gap:12px;align-items:center}   /* rem, so the small header labels line up with the rows */
.sup-cols .sup-item,.sup-colh > :last-child{display:flex;justify-content:space-between;margin:2px 0}
/* The default lists say "Finished work, let go early" once, over the boxes. A box keeps its size when it's ticked. */
.sup-colh{padding:0 2px 2px;border-bottom:1px solid var(--grid);font-size:var(--fs-xs);color:var(--muted)}
.sup-cols .tgl{min-width:24px;min-height:24px;justify-content:center}
.sup-item{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-right:18px}
.sup-yes,.sup-soft,.sup-no{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%}
.sup-yes{font-weight:600}
.sup-yes .sup-item,.sup-soft .sup-item{font-weight:400}
.sup-no{color:var(--muted)}
.sup-found + .legend-line{margin-top:10px}

/* Small dropdown menus (Print…) */
.menu{position:relative;display:inline-block}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column;gap:2px}
.menu .item{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:var(--fs-md);color:var(--ink)}
.menu .item:hover,.menu .item:focus-visible{background:var(--paper)}
.menu .inc{border-top:1px solid var(--grid);margin-top:4px;padding:8px 10px 4px;font-size:var(--fs-sm);color:var(--muted);display:flex;flex-direction:column;gap:4px}
.inc label{display:inline-flex;gap:6px;align-items:center}

/* Student report */
.sreport{max-width:920px}
/* The report's toolbar (a .toolbar above the report). Back, the other students and their place in the list keep fixed
   widths, so stepping from student to student never moves the date control or the button under the pointer. */
.rbar [data-studentback]{min-width:13.6em}   /* fits "← Back to Wed, May 12" as well as "← All students" */
.rbar .pn{display:flex;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.rbar .pn > span{min-width:4.5em;text-align:center}
.toolbar.rbar .pn .btn{display:block;width:130px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* a long name ends in "…"; the full name is in the title */
.rbar .pnx{width:130px}   /* holds the place of "Previous" or "Next" at either end of the list */
.rhead,.rsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rhead h2{font-size:var(--fs-xl);margin:0}
.rhead h2:focus{outline:none}
.rhead p{margin:2px 0;font-size:var(--fs-md)}
.rsec h3{font-size:var(--fs-lg);margin-bottom:12px}
.rsec h3 .small{font-family:var(--sans);font-weight:400}
.mblock{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--grid)}
.mfig{display:flex;flex-wrap:wrap;gap:6px 40px;margin:0}
.mfig dt{font-size:.78rem;color:var(--muted)}
.mfig dd{margin:0;font-size:1.55rem;font-weight:600;line-height:1.2;font-variant-numeric:proportional-nums}
.mfig dd span{font-size:.9rem;font-weight:400;color:var(--muted)}
.mbars{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;align-items:center;margin:12px 0 10px}
.mbars .lab{font-size:.82rem;white-space:nowrap}
.mbars .lab b{font-weight:600}
.mbars .lab span{color:var(--muted)}
.mbar{display:flex;gap:2px;height:14px}
.mbar i{display:block;min-width:2px}
.mbar i:last-child{border-radius:0 4px 4px 0}
/* Where the minutes went, one row each, in the order of the bars: swatch, name, minutes (lined up), and the days behind them */
.mkey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:12px max-content max-content minmax(0,1fr);column-gap:12px;row-gap:5px;align-items:center;font-size:var(--fs-sm)}
.mkey li{display:grid;grid-column:1 / -1;grid-template-columns:subgrid;align-items:center}
.mkey .kt{display:contents}
.mkey .ksw{grid-column:1}
.mkey .kt > b{grid-column:2}
.mkey b{font-weight:600}
.ksw{display:inline-block;width:12px;height:12px;border-radius:2px}
.mkey .v{grid-column:3;text-align:right;color:var(--muted)}
.mkey .kd{grid-column:4;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.mkey li.zero,.mkey li.zero .v{color:var(--faint)}
.mkey li.zero .ksw{opacity:.5}
.mkey .lc,.mnot .lc{width:16px;height:16px;font-size:var(--fs-xs)}
.mnot{font-size:.8rem;color:var(--muted);margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.wsched{margin:14px 0 0;max-width:640px}
.ws-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:var(--fs-sm);color:var(--muted);margin-bottom:2px}
.ws-head b{color:var(--ink);font-weight:600;font-size:var(--fs-md)}
.ws-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) 3.9em;gap:8px;align-items:center;margin-top:4px}
.ws-axis{margin-top:0}
.ws-axis .ws-track{height:16px;background:none}
.ws-axis .ws-track > span{position:absolute;top:0;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.ws-day{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.ws-min{font-size:var(--fs-sm);color:var(--muted);text-align:right;white-space:nowrap}
.ws-track{position:relative;height:28px;border-radius:4px;background:var(--paper)}
.ws-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.ws-blk{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.ws-blk.instruction,.ws-sw.instruction{background:var(--instr)}
.ws-blk.support,.ws-sw.support{background:var(--support)}
.ws-key{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin:6px 0 0 calc(2.4em + 8px)}
.ws-key > span{display:inline-flex;align-items:center;gap:6px}
.ws-sw{display:inline-block;width:14px;height:12px;border-radius:3px}
.ws-sw.instruction{box-shadow:inset 0 0 0 1px var(--instr-edge)}
.ws-sw.support{box-shadow:inset 0 0 0 1px var(--support-edge)}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.rtiles .tile{padding:10px 14px}

.caption{font-size:var(--fs-sm);color:var(--muted);margin:4px 0 0}
/* Calendar: weeks down, weekdays across */
.calwrap{max-width:760px}
table.cal{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
table.cal th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:center;padding:2px}
table.cal th.wk{width:4.6em;text-align:left}
table.cal td{height:50px;border-radius:6px;text-align:center;vertical-align:middle;position:relative;padding:0;font-size:.95rem;font-weight:700}
.cal .dn{position:absolute;top:3px;left:5px;font-size:.64rem;font-weight:500}
.cal .mn{display:block;font-size:.68rem;font-weight:500;margin-top:1px}
.cal td.c-noclass{border:1px dashed var(--line);color:var(--muted)}
.cal td.c-missing{border:1px dashed var(--late);color:var(--late)}
.cal td.c-off{color:var(--faint)}
.cal td.c-pending{border:1px solid var(--grid);color:var(--faint)}
.daydetail{border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:8px;padding:12px 14px;background:var(--surface)}
.dd-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.dd-links{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.dd-nav{display:grid;grid-template-columns:7.4em 7.4em;gap:6px;margin-left:6px}
.dd-nav > :first-child{text-align:right}
.dd-nav > :last-child{text-align:left}
.dd-min{margin:6px 0 2px}

/* Class-strip calendar (student report) */
table.scal{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0 2px;font-size:.8rem;--gut:18px}
table.scal.g2on{--gut:36px}
.scal col.c-lab{width:7%}
.scal col.c-wd{width:var(--wa)}
.scal col.c-wk{width:24%}
.scal th,.scal td{padding:0 2px}
.scal thead th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:left;vertical-align:bottom;padding-bottom:2px}
.scal th.lab{font-size:var(--fs-xs);font-weight:500;color:var(--muted);text-align:left;white-space:nowrap}
.colaxis{margin:3px 11px 0 calc(var(--gut) + 5px)}
.colaxis.wkax{margin:3px calc(6.4 * .75rem + 4px) 0 14px}
.rib{position:relative;height:5px;border-radius:2px}
.rib span{position:absolute;top:0;bottom:0}
.rib .instruction{background:var(--instr);box-shadow:inset 0 0 0 1px var(--instr-edge)}
.rib .support{background:var(--support);box-shadow:inset 0 0 0 1px var(--support-edge)}
.ticks{position:relative;height:15px;font-size:var(--fs-xs);font-weight:400;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ticks .s{left:0;transform:none}
.ticks .e{right:0;transform:none}
.scal tbody td{height:24px}
.scal.roomy tbody td{height:34px}
.sbtn,.scell{box-sizing:border-box;display:grid;grid-template-columns:var(--gut) minmax(0,1fr) 6px;column-gap:3px;align-items:center;width:100%;height:24px;padding:0 2px;border-radius:4px}
.sbtn{cursor:pointer;background:none;border:0;margin:0;font:inherit;color:inherit;text-align:left}
.scal.roomy .sbtn,.scal.roomy .scell{height:34px}
.sbtn:hover{background:var(--paper)}
.sbtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.sbtn[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:1px;background:var(--paper)}
.gut{display:flex;gap:2px}
.g{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;font-size:var(--fs-xs);font-weight:700;line-height:1;flex:none}
.g.lc-noclass{color:var(--muted);border:1px dashed var(--line)}
.g.lc-missing{color:var(--late);border:1px dashed var(--late)}
.ds{position:relative;display:block;height:10px}
.scal.roomy .ds{height:14px}
.ds .tk{position:absolute;top:0;bottom:0;background:var(--line);border-radius:2px;overflow:hidden}
.ds .tk.pend{opacity:.45}
.ds .tk i{position:absolute;top:0;bottom:0}
.ds .tk .bd{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.nd{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);justify-self:center}
.fuk{font-size:.7rem}
.scal tr.mo > *{border-top:1px solid var(--line)}
.scal tr.chg td{height:auto;padding:6px 2px 1px;font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line)}
.scal tfoot th,.scal tfoot td{font-size:var(--fs-xs);font-weight:500;color:var(--muted);height:auto;text-align:center;line-height:1.3;padding-top:4px}
.scal tfoot th{text-align:left}
.scal tr.ddrow td{height:auto;padding:4px 2px 10px}
.wb{display:grid;grid-template-columns:10px minmax(0,1fr) 6.4em;column-gap:4px;align-items:center;font-size:var(--fs-xs);color:var(--muted)}
.wb .fu{font-size:.6rem;color:var(--ink);line-height:1}
.wb .wt{display:block}
.wb .tr{position:relative;display:block;height:8px;background:var(--line);border-radius:0 4px 4px 0}
.wb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.wb b{font-weight:500;color:var(--ink);white-space:nowrap}
.ddpic{position:relative;margin:4px 0 2px}
.ddpic .ribl{position:relative;height:16px;font-size:var(--fs-xs);color:var(--muted)}
.ddpic .ribl span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ddpic .rib{height:6px;margin-bottom:3px}
.ddpic .ds{height:18px}
.ddpic .ev{position:relative;height:20px}
.ddpic .ev span{position:absolute;top:4px;white-space:nowrap;font-size:var(--fs-xs)}
.ddpic .ev .a-center{transform:translateX(-50%)}
.ddpic .ev .a-end{transform:translateX(-100%)}
.cal-cap{margin:0 0 6px}
.cal-cap + .legend-line{margin:0 0 8px}
.cal-hint{margin-left:auto}
details.daytable{margin-top:10px}
details.daytable > summary{cursor:pointer;font-size:.86rem;color:var(--muted)}
details.daytable .hist{margin-top:8px}
table.cal tfoot th,table.cal tfoot td{font-size:.72rem;font-weight:500;height:auto;color:var(--muted);text-align:center;padding:1px 2px;line-height:1.3}
table.cal tfoot th{text-align:left;white-space:normal;line-height:1.15}

/* Follow-ups, family note */
.fu{list-style:none;margin:0;padding:0}
.fu li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:.9rem}
.fu .when{color:var(--muted);min-width:4.5em}
.fu .txt{flex:1;min-width:12em}
.fuform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fuform input[type=text]{flex:1;min-width:200px}
textarea.family{min-height:240px;font-size:.92rem;line-height:1.5}
.ruled{border-bottom:1px solid #999;height:26px}
.notetext{white-space:pre-wrap;font-size:1rem;line-height:1.55;margin-top:14px}
.sched-step{border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:6px;padding:10px 14px;margin-top:12px;font-size:.9rem;background:var(--paper)}
.sched-step label{display:block;margin:6px 0}
.hist-list{margin:10px 0 0;padding:0;list-style:none;font-size:var(--fs-md)}
.hist-list li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--grid)}
.hist-list li span{flex:1}
.settext{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 14px;align-items:center;max-width:620px}
.settext input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:100%}
.printonly{display:none}
#printArea{display:none}

@media (max-width: 820px){
  .grid-head{display:none}
  .row{grid-template-columns:1fr auto auto;gap:6px 12px;padding:12px 0}
  .row .who{grid-column:1 / -1}
  .row .tlc{grid-column:1 / -1}

  .row .chips{grid-column:1 / -1}
  .mini{grid-template-columns:1fr}
  .mini > :nth-child(3){grid-column:auto}
  .two{grid-template-columns:1fr}
  .legend{margin-left:0}
  .counts{padding-left:0}
  .search{min-width:0;flex:1}
}
/* Phone layout for the new pieces. Screen only, so printed pages keep the desktop layout. */
@media screen and (max-width: 820px){
  .tablewrap{overflow:visible;background:none;border:0}
  table.sum,table.sum tbody{display:block}
  table.sum thead{display:none}
  table.sum tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
  table.sum td{padding:0;border:0}
  table.sum td.c-name,table.sum td.c-last{grid-column:1 / -1}
  table.sum td.num{display:none}
  table.sum td[data-label]::before{content:attr(data-label);display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:2px}
  table.sum .meter{min-width:0}
  .cardcounts{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}
  .rbar .pn{margin-left:0;width:100%}
  .rhead,.rsec{padding:14px}
  .rhead h2{font-size:1.45rem}
  .rtiles,.tiles{grid-template-columns:1fr 1fr}
  .menu .pop{position:static;margin-top:6px;min-width:0}
  table.cal{border-spacing:3px}
  table.cal th.wk{width:4.2em}
  /* Narrow cells: the date sits above the letter instead of beside it. */
  table.cal tbody td{height:58px;padding-top:12px}
  .cal .dn{top:2px;left:3px}
  .row.slim{grid-template-columns:1fr}
  .settext{grid-template-columns:1fr}
  .dd-links{margin-left:0}
  .nclist li > span:first-child{min-width:0}
}
@media screen and (max-width: 560px){
  nav.tabs{gap:14px}
  nav.tabs button{font-size:.88rem}
  .tabx{display:none}
  .mbars{grid-template-columns:1fr;gap:2px}
  .mbars .lab{margin-top:6px}
  .mkey{flex-direction:column;gap:6px}
  .mkey li{flex-wrap:nowrap;align-items:flex-start}
  .mkey .ksw{margin-top:3px;flex:none}
  .mkey .kd{display:block;margin-top:2px}
  .mkey .kd .sep{display:none}
  .mfig{gap:6px 24px}
  .scal col.c-lab{width:14%}
  .scal col.c-wd{width:var(--wb)}
  .scal col.c-wk{width:22%}
  .scal.wd3{--gut:16px}
  .scal.wd3 .g2{display:none}
  .ticks .mid{display:none}
  .scal.wd3 .ticks,.wkax{display:none}
  .colaxis{margin-right:4px}
  .scal.wd3 .wb{grid-template-columns:10px minmax(0,1fr) 0}
  .scal.wd3 .wb b{display:none}
  .scal.wd4 col.c-wk{width:0}
  .scal.wd4 .swk{display:none}
}
@media print{
  :root{
    --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
    --ink:#1C2433; --muted:#566074; --faint:#8790A0; --rule:#A3ACBA;
    --instr:#C9DAF8; --support:#FFF2CC; --bar:#24324D;
    --ok:#1D6F47; --ok-bg:#DFF1E7; --late:#8F4B00; --late-bg:#FBE8D2;
    --bad:#A8231A; --bad-bg:#FADFDB; --soft:#6E5800; --soft-bg:#FBF0BF;
    --drop:#57409A; --drop-bg:#E9E3F7; --fin:#11636C; --fin-bg:#D8EFF1;
    --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
    --loss-before:#CB7E6B; --loss-out:#5346A7; --loss-after:#837120; --loss-absent:#8E3642;
    --instr-edge:#8FAEE6; --support-edge:#D9B44A;
    --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-nosched:#E3E5E8; --ov-ink:#1C2433;
  }
  @page{margin:.5in}
  body{background:#fff}
  main.wrap{padding-bottom:0}   /* the screen's bottom space would push the last row of a list onto a page of its own */
  header.top nav, .folder, .toolbar, .savebar, .linkish, .mini .act, .notice, .daybar button, .noprint, .rbar, .backbar, #status{display:none !important}
  .printonly{display:block}
  span.printonly{display:inline}
  .tablewrap{overflow:visible;border:0}
  details.day{break-inside:avoid-page;border-color:#bbb}
  .lc, .chip, .count, .tl, .tl *, .cal td, .tile, .meter .track, .meter .fill, .ws-track, .ws-blk, .ws-sw, .mbar i, .ksw, .scal .tk, .scal .tk *, .rib span, .g, .nd, .wb .tr, .wb .tr i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-reports header.top, body.print-reports main{display:none !important}
  body.print-reports #printArea{display:block}
  .sreport{max-width:none}

  .rtiles, .mblock, .wsched, .calwrap, .hist tr, .fu li, .scal tr{break-inside:avoid}
  .scal tbody td{height:18px}
  .scell{height:18px}
  .ds{height:9px}
  .scal.dprint tbody td,.scal.dprint .scell{height:12px}
  .scal.dprint .ds{height:7px}
  .scal.dprint{--gut:11px}
  .scal.dprint .g{width:11px;height:11px;font-size:.5rem}
  .mfig dd{font-size:1.25rem}
  .s-before{background:repeating-linear-gradient(45deg,var(--loss-before) 0 1.5px,#fff 1.5px 3.5px)}
  .s-out{background:repeating-linear-gradient(90deg,var(--loss-out) 0 1.5px,#fff 1.5px 3.5px)}

  .scal tfoot{display:table-row-group}
  .scal.dprint th.lab,.scal.dprint .wb{line-height:1}
  .rib .support{background:repeating-linear-gradient(90deg,var(--support-edge) 0 3px,#fff 3px 5px)}
  .rhead, .rsec{border:0;padding:0 0 6px;margin-bottom:12px;border-radius:0}

  .name-btn{text-decoration:none}
  table.sum{font-size:.8rem}
  table.sum td.c-name{width:32%}
}
@media (forced-colors: active){ .mbar, .ksw, .ws-blk, .ws-sw, .ds, .rib, .wb .tr, .g{forced-color-adjust:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>Intervention attendance</h1>
        <p>Runs only on this computer. Nothing is uploaded.</p>
      </div>
      <div class="folder" id="folderBar"></div>
    </div>
    <div class="tabrow">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button role="tab" data-tab="reports" aria-selected="false">Reports</button>
        <button role="tab" data-tab="students" aria-selected="false">Students</button>
        <button role="tab" data-tab="support" aria-selected="false">Support<span class="tabx"> hour</span></button>

  <section id="tab-reports" hidden></section>
  <section id="tab-students" hidden></section>
  <section id="tab-support" hidden></section>
  <section id="tab-schedule" hidden></section>
  <section id="tab-settings" hidden></section>
</main>
<section id="printArea" aria-hidden="true"></section>
<input type="file" id="folderInput" webkitdirectory multiple hidden>

<script>
'use strict';
/* ------------------------------------------------------------------
   Everything below runs locally. There are no network requests, and the
   Content-Security-Policy above blocks them even if one were attempted.
   Data written: one file, attendance-tracker-data.json, inside the folder
   you choose (schedule and its history, settings, linked Zoom names,
   "finished work", excused-absence and no-class marks, notes and follow-ups).
   ------------------------------------------------------------------ */
const DATA_FILE = 'attendance-tracker-data.json';
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const HAS_FSA = typeof window.showDirectoryPicker === 'function';
const SEVERITY = {absent:6, missed:5, early:5, late:4, drop:3, soft:2, fin:1, exc:1, full:0};
// The boxes on every Reports day, always in this order.
const DAY_BOXES = [['full', 'present'], ['fin', 'let go early'], ['late', 'late'], ['early', 'left early'], ['drop', 'out mid-class'], ['absent', 'absent']];
const LETTER = { full:'✓', fin:'F', late:'L', missed:'M', early:'E', soft:'S', drop:'O', absent:'A', exc:'X', noclass:'–', missing:'?', off:'·' };
const LETTER_TEAM = { full:'whole class', fin:'finished work early', late:'late', missed:'missed instruction', early:'left early',
  soft:'left support early', drop:'out mid-class', absent:'absent', exc:'excused', noclass:'no class', missing:'no Zoom report', off:'not on the schedule' };
const LETTER_SUPPORT = { full:'stayed to the end', fin:'finished work, let go early', soft:'left the support hour early, not marked', early:'left early',
  absent:'absent', exc:'excused', noclass:'no class', missing:'no Zoom report' };
const LETTER_FAMILY = { full:'whole class', fin:'finished work early', late:'late', missed:'missed the teaching part', early:'left early',
  soft:'left help time early', drop:'out of Zoom for part of class', absent:'missed', exc:'excused', noclass:'no class', missing:'no record', off:'' };
const LETTER_ORDER = ['full','fin','late','missed','early','soft','drop','absent','exc','noclass','missing'];
const NOCLASS_REASONS = { holiday:'School holiday', testing:'Testing', canceled:'Class canceled', other:'Other' };
// The Overview grid's colors and letters, in the teacher's own words.
const OV_CAT = { engaged: 'Present and engaged', excused: 'Excusable absence', idle: 'Likely present but not engaging',
  away: 'Likely not actually present', absent: 'Did not attend', nosched: 'Not scheduled' };
const OV_LET = { L: 'Late or left early', C: 'Camera off' };   // the colors show engagement, so there's no D
const FU_HOW = { call:'Called home', message:'Emailed or texted home', student:'Talked with the student', meeting:'Meeting (team or family)', other:'Other' };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const mins = ms => Math.round(ms / 60000);
// Formatting dates is slow when every call builds a new formatter, so each format is built once.
const DTF = {};
const dtf = o => { const k = JSON.stringify(o); return DTF[k] || (DTF[k] = new Intl.DateTimeFormat([], o)); };
const fmt = t => t == null ? '—' : dtf({ hour: 'numeric', minute: '2-digit' }).format(t);
const fmtMin = m => { m = Math.round(m); let h = Math.floor(m / 60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(mi)} ${ap}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtRange = (a, b) => { const A = fmtMin(a), B = fmtMin(b); return (A.slice(-2) === B.slice(-2) ? A.slice(0, -3) : A) + '–' + B; };
const shortRange = (a, b) => fmtRange(a, b).replace(/:00/g, '');
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pct = (n, d) => d ? Math.round(n / d * 100) : null;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const todayDk = () => dkOf(new Date());
const parseDk = dk => { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate() + n); return dkOf(d); };
const weekKey = dk => { const d = parseDk(dk); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkOf(d); };
const asDate = d => typeof d === 'string' ? parseDk(d) : d;
const shortDate = d => dtf({ weekday: 'short', month: 'short', day: 'numeric' }).format(asDate(d));
const monDay = d => dtf({ month: 'short', day: 'numeric' }).format(asDate(d));
const longDate = d => dtf({ weekday: 'long', month: 'long', day: 'numeric' }).format(asDate(d));
const monthDay = d => dtf({ month: 'long', day: 'numeric' }).format(asDate(d));
const isDk = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDk(v));
const wdPlural = w => cap(DAYS[w]) + 's';
const byWeekOrder = (a, b) => ((a + 6) % 7) - ((b + 6) % 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// First name for the family note. Handles "Diaz, Ana" and stray leading symbols like "=Dee Evil".
function firstName(name){
  const s = String(name).replace(/^[^\p{L}]+/u, ''), m = s.match(/^([^,]+),\s*([^\s,]+)/);

/* ---------------- Text helpers ---------------- */
function normKey(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

}
function looksAlike(a, b){

/* ---------------- Schedule (pasted from the spreadsheet) ---------------- */
function toMin(h, mi, ap){
  if (ap === 'p' && h < 12) h += 12;
  else if (ap === 'a' && h === 12) h = 0;
  else if (!ap && h >= 1 && h <= 6) h += 12;   // school-day guess: "2" means 2 PM

}
function parseSectionHeader(cell){
  const low = cell.toLowerCase();

  if (!type) return null;
  const m = cell.match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?:\s*(?:-|–|—|to)\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?)?/i);

function parseSchedule(text){

  const colDay = {}, colSec = {}, stray = [];
  const dayFor = c => { if (colDay[c]) return colDay[c]; let best = null, bc = -1;
    for (const k in colDay){ const kc = +k; if (kc <= c && kc > bc){ bc = kc; best = colDay[k]; } } return best; };
  rows.forEach(row => row.forEach((cell, c) => {
    if (!cell) return;
    const d = DAYS.indexOf(cell.toLowerCase().replace(/[^a-z]/g, ''));
    if (d >= 0){ colDay[c] = DAYS[d]; colSec[c] = null; out.days[DAYS[d]] = out.days[DAYS[d]] || []; return; }
    const sec = parseSectionHeader(cell);
    if (sec){
      const day = dayFor(c);
      if (!day){ out.warnings.push(`“${cell}” doesn’t have a day name (like Monday) above it, so it was skipped.`); colSec[c] = null; return; }
      out.days[day].push(sec); colSec[c] = sec; return;
    }
    const s = colSec[c];
    if (s){ const name = cell.replace(/\s+/g, ' '); if (!s.students.some(n => normKey(n) === normKey(name))) s.students.push(name); }
    else stray.push(cell);

// Parsed schedules are reused across renders (and give planFor a stable object to cache against).
const schedCache = new Map();
function parsedSchedule(text){

  return schedCache.get(text);
}

/* ---------------- Zoom participant export ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseZoomTime(s){

  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else { const t = /\d{1,2}:\d{2}/.test(s) ? Date.parse(s) : NaN; return isNaN(t) ? null : new Date(t); }   // other formats need a time of day: "8" isn't a date

function parseZoomFile(name, text){
  const rows = parseCSV(String(text).replace(/^\uFEFF/, ''));
  // Zoom's own "Join Time" and "Leave Time" headers, not any cell that mentions joining or leaving (a Formative question can).
  const hi = rows.findIndex(r => r.some(c => /^join time/i.test(c.trim())) && r.some(c => /^leave time/i.test(c.trim())));
  if (hi < 0){
    const looksUnique = rows.some(r => r.some(c => /duration/i.test(c)) && r.some(c => /name/i.test(c)));
    return { error: looksUnique
      ? 'This file has no join or leave times. It was probably exported with “Show unique users” checked. Export it again with that box unchecked.'
      : 'This doesn’t look like a Zoom participant report (no “Join Time” column).' };
  }
  const h = rows[hi].map(c => c.trim().toLowerCase());
  let nameIdx = h.findIndex(c => c.startsWith('name') || c.includes('participant'));
  if (nameIdx < 0) nameIdx = 0;
  const joinIdx = h.findIndex(c => c.startsWith('join time'));
  const leaveIdx = h.findIndex(c => c.startsWith('leave time'));
  const waitIdx = h.findIndex(c => c.includes('waiting'));
  let emailIdx = h.findIndex((c, i) => c.includes('email') && i > nameIdx);
  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (r[nameIdx] || '').trim();
    const join = parseZoomTime(r[joinIdx]), leave = parseZoomTime(r[leaveIdx]);
    if (!nm || !join || !leave || leave <= join) continue;
    if (waitIdx >= 0 && /^y/i.test((r[waitIdx] || '').trim())) continue; // time in the waiting room isn't class time
    out.push({ name: nm, email: emailIdx >= 0 ? (r[emailIdx] || '').trim() : '', join, leave });
  }
  if (!out.length) return { error: 'No participant rows with join and leave times were found in this file.' };

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));
  const steps = [
    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []
  ];
  return (raw, email) => {
    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

/* ---------------- Attendance math ---------------- */
function mergeIntervals(list){
  const s = list.map(x => [x[0], x[1]]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s){ const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push(iv); }
  return out;
}
const overlap = (list, A, B) => list.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, B) - Math.max(a, A)), 0);

const sumIv = list => list.reduce((t, [a, b]) => t + b - a, 0);

function evaluate(intervals, sections, at, S, finished = false){
  const secs = sections.map(s => ({ type: s.type, a: at(s.startMin), b: at(s.endMin) })).sort((x, y) => x.a - y.a);
  const req = mergeIntervals(secs.map(s => [s.a, s.b]));
  const winStart = req[0][0], winEnd = req[req.length - 1][1];
  const merged = mergeIntervals(intervals);
  const presentMs = req.reduce((t, [A, B]) => t + overlap(merged, A, B), 0);
  const reqMs = sumIv(req);
  const instrIv = mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.a, s.b]));
  const iReqMs = sumIv(instrIv), iPresMs = instrIv.reduce((t, [a, b]) => t + overlap(merged, a, b), 0);
  const out = { secs, merged, flags: [], firstJoin: null, lastLeave: null, winStart, winEnd,
    presentMin: mins(presentMs), reqMin: mins(reqMs), instrMin: mins(iPresMs), instrReqMin: mins(iReqMs) };
  // Support minutes are "everything that isn't instruction", so overlapping sections are never counted twice.
  out.suppMin = out.presentMin - out.instrMin; out.suppReqMin = out.reqMin - out.instrReqMin;
  const G = S.lateGrace * 60000, L = S.leaveGrace * 60000, D = S.gapMin * 60000;
  // Less than a minute in class is absent, unless the teacher marked the day as finished work (they came, and were let go).
  if (presentMs < 60000 && !(finished && presentMs > 0)){ out.canFinish = presentMs > 0; out.flags.push({ k: 'absent', label: 'Absent' }); return out; }
  const rel = merged.filter(([a, b]) => b > winStart && a < winEnd);
  out.firstJoin = rel[0][0]; out.lastLeave = rel[rel.length - 1][1];
  out.canFinish = out.lastLeave < winEnd - L;   // left before the end: the teacher can mark it as finished work
  const instr = secs.filter(s => s.type === 'instruction'), supp = secs.filter(s => s.type === 'support');
  // Joining late is always said in minutes, however much of the class it took.
  if (out.firstJoin > winStart + G){ const m = mins(out.firstJoin - winStart); out.flags.push({ k: 'late', label: `Late ${m} min`, min: m }); }
  if (out.lastLeave < winEnd - L && finished){ const m = mins(winEnd - out.lastLeave); out.flags.push({ k: 'fin', label: `Finished work, left ${m} min early`, min: m }); }
  else if (out.lastLeave < winEnd - L){
    const m = mins(winEnd - out.lastLeave);
    const inSupport = supp.some(s => out.lastLeave >= s.a && out.lastLeave < s.b);
    const suppPresent = supp.reduce((t, s) => t + overlap(merged, s.a, s.b), 0);
    if (inSupport && suppPresent >= 5 * 60000){
      const sm = mins(overlap(mergeIntervals(supp.map(s => [s.a, s.b])), out.lastLeave, winEnd));   // support time left, not instruction
      out.flags.push({ k: 'soft', label: `Left ${sm} min early`, min: sm });
    }
    else if (inSupport && instr.length) out.flags.push({ k: 'early', label: `Left ${m} min early`, min: m, skip: true });
    else out.flags.push({ k: 'early', label: `Left ${m} min early`, min: m });
  }
  const spanA = Math.max(out.firstJoin, winStart), spanB = Math.min(out.lastLeave, winEnd);
  const reqInSpan = req.reduce((t, [A, B]) => t + Math.max(0, Math.min(B, spanB) - Math.max(A, spanA)), 0);
  const gap = reqInSpan - presentMs;
  if (gap > D){ const m = mins(gap); out.flags.push({ k: 'drop', label: `Out ${m} min mid-class`, min: m }); }
  if (!out.flags.length) out.flags.push({ k: 'full', label: 'Present full time' });
  return out;
}

/* ---------------- Formative exports ----------------
   A Formative results export (CSV) saved into the folder: one row per student, columns for each question.
   For each class day this gives, per student, how many questions they answered and of how many. */
const F_NAME = /^(student( full)?( name)?|name|full name|(student )?(first|last)( name)?|first|last)$/;

const F_META = /^(e-?mail( address)?|class(es)?|section|period|teacher|(student )?id|sis\b.*|grade( level)?|status|progress|returned|feedback|total|((total|possible|max) )?(score|points?)( earned| possible)?( ?\(%\)| ?%)?|percent(age)?( correct)?|%( correct)?|% ?score|standards?|mastery|((date|time|last) )?(submitted|started|updated|modified|completed)( at| on| date| time)?|submission( date| time)?|((due|assigned) )?date|time( spent)?( \(min(utes)?\))?)$/;
