</main>
<section id="printArea" aria-hidden="true"></section>
<div id="tip" class="tip" role="tooltip" hidden></div>
<input type="file" id="folderInput" webkitdirectory multiple hidden>

<script>
'use strict';
/* ------------------------------------------------------------------
   Everything below runs locally. There are no network requests, and the
   Content-Security-Policy above blocks them even if one were attempted.
   Data written: one file, attendance-tracker-data.json, inside the folder
   you choose (schedule and its history, settings, linked Zoom names,
   "finished work", excused-absence and no-class marks, notes, follow-ups
   and saved date ranges).
   ------------------------------------------------------------------ */
const DATA_FILE = 'attendance-tracker-data.json';
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const HAS_FSA = typeof window.showDirectoryPicker === 'function';
const SEVERITY = {absent:6, missed:5, early:5, late:4, drop:3, soft:2, fin:1, exc:1, full:0};
const COUNT_ORDER = [
  ['full','present full time'], ['fin','finished work early'], ['late','late'], ['missed','missed instruction'],
  ['early','left early'], ['soft','left support early'], ['drop','dropped off'], ['absent','absent'], ['exc','excused']
];
const FEW_DAYS = 4;            // fewer counted class days than this: show counts, never flag by percent
const PATTERN_MIN = 2;         // a pattern sentence needs at least this many matching days
const TREND_DAYS = 8, TREND_WEEKS = 3;
const WEEKDAY_GAP = 40;        // points between weekdays' attendance before it is mentioned
const LETTER = { full:'✓', fin:'F', late:'L', missed:'M', early:'E', soft:'S', drop:'O', absent:'A', exc:'X', noclass:'–', missing:'?', off:'·' };
const LETTER_TEAM = { full:'whole class', fin:'finished work early', late:'late', missed:'missed instruction', early:'left early',
  soft:'left support hour early', drop:'out of Zoom mid-class', absent:'absent', exc:'excused', noclass:'no class', missing:'no Zoom report', off:'not on the schedule' };
const LETTER_FAMILY = { full:'whole class', fin:'finished work early', late:'late', missed:'missed the teaching part', early:'left early',
  soft:'left help time early', drop:'out of Zoom for part of class', absent:'missed', exc:'excused', noclass:'no class', missing:'no record', off:'' };
const LETTER_ORDER = ['full','fin','late','missed','early','soft','drop','absent','exc','noclass','missing'];
const NOCLASS_REASONS = { holiday:'School holiday', testing:'Testing', canceled:'Class canceled', other:'Other' };
const FU_HOW = { call:'Called home', message:'Emailed or texted home', student:'Talked with the student', meeting:'Meeting (team or family)', other:'Other' };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const mins = ms => Math.round(ms / 60000);
// Formatting dates is slow when every call builds a new formatter, so each format is built once.
const DTF = {};
const dtf = o => { const k = JSON.stringify(o); return DTF[k] || (DTF[k] = new Intl.DateTimeFormat([], o)); };
const fmt = t => t == null ? '—' : dtf({ hour: 'numeric', minute: '2-digit' }).format(t);
const fmtMin = m => { m = Math.round(m); let h = Math.floor(m / 60), mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(mi)} ${ap}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtRange = (a, b) => { const A = fmtMin(a), B = fmtMin(b); return (A.slice(-2) === B.slice(-2) ? A.slice(0, -3) : A) + '–' + B; };
const shortRange = (a, b) => fmtRange(a, b).replace(/:00/g, '');
const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pct = (n, d) => d ? Math.round(n / d * 100) : null;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
const todayDk = () => dkOf(new Date());
const parseDk = dk => { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate() + n); return dkOf(d); };
const weekKey = dk => { const d = parseDk(dk); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkOf(d); };
const asDate = d => typeof d === 'string' ? parseDk(d) : d;
const shortDate = d => dtf({ weekday: 'short', month: 'short', day: 'numeric' }).format(asDate(d));
const monDay = d => dtf({ month: 'short', day: 'numeric' }).format(asDate(d));
const longDate = d => dtf({ weekday: 'long', month: 'long', day: 'numeric' }).format(asDate(d));
const monthDay = d => dtf({ month: 'long', day: 'numeric' }).format(asDate(d));
const isDk = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDk(v));
const clockOf = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
const median = xs => { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const wdPlural = w => cap(DAYS[w]) + 's';
const byWeekOrder = (a, b) => ((a + 6) % 7) - ((b + 6) % 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// First name for the family note. Handles "Diaz, Ana" and stray leading symbols like "=Dee Evil".
function firstName(name){
  const s = String(name).replace(/^[^\p{L}]+/u, ''), m = s.match(/^([^,]+),\s*([^\s,]+)/);
  return (m ? m[2] : s.split(/\s+/)[0]) || String(name);
}
function listJoin(items, max = 4){
  const xs = items.length === max + 1 ? items : items.slice(0, max), more = items.length - xs.length;
  if (more > 0) return `${xs.join(', ')} and ${more} more`;
  return xs.length < 2 ? (xs[0] || '') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
// A run of dates: listed when short, a "from … to …" span when long, so the latest date is always named.
function dateList(dks, max = 4, f = shortDate){
  return dks.length > max + 1 ? `from ${f(dks[0])} to ${f(dks[dks.length - 1])}` : listJoin(dks.map(f), max);
}
const ofN = (x, n, w, ws) => `${x} of ${plural(n, w, ws)}`;
function groupBy(xs, f){ const m = new Map(); for (const x of xs){ const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
function fmtPeriod(p){
  const a = parseDk(p.from), b = parseDk(p.to), o = { weekday: 'short', month: 'short', day: 'numeric' };
  if (a.getFullYear() !== b.getFullYear()) return `${dtf({ ...o, year: 'numeric' }).format(a)} – ${dtf({ ...o, year: 'numeric' }).format(b)}`;
  return `${dtf(o).format(a)} – ${dtf(o).format(b)}, ${b.getFullYear()}`;
}

function defaultData(){
  return { version: 3, scheduleText: '', scheduleVersions: [{ from: '', text: '' }],
    settings: { lateGrace: 5, leaveGrace: 5, gapMin: 5, sectionLen: 60, concernRate: 80,
                teacherName: '', className: 'our intervention class', contactLine: '' },
    aliases: {}, ignored: [], excused: {}, excusedAbsent: {}, notes: {},
    noClass: {},     // { 'YYYY-MM-DD': { reason } }
    followUps: {},   // { studentKey: [{ id, date, how, text }] }
    periods: [] };   // [{ id, name, from, to }]
}
const NUM_SETTINGS = { lateGrace: [0, 60], leaveGrace: [0, 60], gapMin: [1, 60], sectionLen: [15, 180], concernRate: [0, 100] };
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// Everything read from the data file is checked here, so a damaged or hand-edited file can't break the page.
function withDefaults(d){
  d = obj(d);
  const base = defaultData(), set = obj(d.settings);
  const out = { ...base, ...d, version: 3, settings: { ...base.settings },
    aliases: {}, ignored: Array.isArray(d.ignored) ? d.ignored.filter(x => typeof x === 'string') : [],
    excused: { ...obj(d.excused) }, excusedAbsent: { ...obj(d.excusedAbsent) }, notes: {}, noClass: {}, followUps: {},
    periods: Array.isArray(d.periods) ? d.periods.filter(p => p && isDk(p.from) && isDk(p.to) && p.from <= p.to)
      .map(p => ({ id: String(p.id || uid()), name: String(p.name || 'Saved dates').slice(0, 40), from: p.from, to: p.to })) : [] };
  for (const [k, [lo, hi]] of Object.entries(NUM_SETTINGS)){ const v = Number(set[k]); if (set[k] !== '' && Number.isFinite(v)) out.settings[k] = Math.min(hi, Math.max(lo, Math.round(v))); }
  for (const k of ['teacherName', 'className', 'contactLine']) if (typeof set[k] === 'string') out.settings[k] = set[k].slice(0, 120);
  for (const [k, v] of Object.entries(obj(d.aliases))) if (typeof v === 'string') out.aliases[k] = v;
  for (const [k, v] of Object.entries(obj(d.notes))) if (typeof v === 'string') out.notes[k] = v;
  for (const [k, v] of Object.entries(obj(d.noClass))) if (isDk(k)) out.noClass[k] = { reason: obj(v).reason in NOCLASS_REASONS ? obj(v).reason : 'other' };
  for (const [k, v] of Object.entries(obj(d.followUps))) if (Array.isArray(v)){
    const xs = v.filter(f => f && isDk(f.date)).map(f => ({ id: String(f.id || uid()), date: f.date, how: f.how in FU_HOW ? f.how : 'other', text: String(f.text || '').slice(0, 300) }));
    if (xs.length) out.followUps[k] = xs;
  }
  const vs = Array.isArray(d.scheduleVersions) && d.scheduleVersions.some(v => v && typeof v === 'object')
    ? d.scheduleVersions.filter(v => v && typeof v === 'object').map(v => ({ from: isDk(v.from) ? v.from : '', text: String(v.text || '') }))
    : [{ from: '', text: String(d.scheduleText || '') }];
  vs.sort((a, b) => a.from.localeCompare(b.from)); vs[0].from = '';
  // An older copy of this page only knows scheduleText. If it changed the schedule, keep that change.
  if (typeof d.scheduleText === 'string' && vs[vs.length - 1].text !== d.scheduleText) vs[vs.length - 1].text = d.scheduleText;
  out.scheduleVersions = vs; out.scheduleText = vs[vs.length - 1].text;
  return out;
}

const state = {
  data: defaultData(), files: [], dirHandle: null, savedHandle: null, canWrite: false,
  folderName: '', loaded: false, dirty: false, saving: false,
  tab: 'reports', filter: 'all', query: '', draft: null, openDays: new Set(), autoOpened: false, status: null,
  range: { preset: 'all', from: '', to: '', periodId: '' }, noteEdit: null,
  sort: 'concern', studentFilter: 'all', student: null, studentFrom: null, returnTo: null, highlight: null,
  include: { table: true, log: true, notes: false }, familyDraft: {}, familyConcern: {}, fuEdit: null, fuPrefill: null,
  calAll: false, savingPeriod: false, schedChange: null, viewVersion: null, lastAnalysis: null, renderIdx: 0
};

/* ---------------- Text helpers ---------------- */
function normKey(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function looksAlike(a, b){
  if (Math.abs(a.length - b.length) > 2) return false;
  const d = lev(a, b), ta = a.split(' '), tb = b.split(' ');
  return d === 1 || (d === 2 && (ta[0] === tb[0] || ta[ta.length - 1] === tb[tb.length - 1]));
}
/* ---------------- Schedule (pasted from the spreadsheet) ---------------- */
function toMin(h, mi, ap){
  if (ap === 'p' && h < 12) h += 12;
  else if (ap === 'a' && h === 12) h = 0;
  else if (!ap && h >= 1 && h <= 6) h += 12;   // school-day guess: "2" means 2 PM
  return h * 60 + mi;
}
function parseSectionHeader(cell){
  const low = cell.toLowerCase();
  let type = null;
  if (/instruct|lesson|teach/.test(low)) type = 'instruction';
  else if (/support|help|tutor|work time|office hour/.test(low)) type = 'support';
  if (!type) return null;
  const m = cell.match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?:\s*(?:-|–|—|to)\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?)?/i);
  if (!m) return null;
  const ap1 = m[3] ? m[3][0].toLowerCase() : null, ap2 = m[6] ? m[6][0].toLowerCase() : null;
  const startMin = toMin(+m[1], +(m[2] || 0), ap1 || ap2);
  let endMin = m[4] ? toMin(+m[4], +(m[5] || 0), ap2 || ap1) : null;
  if (endMin !== null && endMin <= startMin) endMin = null;
  return { type, label: cell, startMin, endMin, students: [] };
}
function parseSchedule(text){
  const out = { days: {}, roster: [], nameOf: {}, warnings: [], lookalikes: [] };
  if (!text || !text.trim()) return out;
  const rows = text.replace(/\r/g, '').split('\n').map(r => r.split('\t').map(c => c.trim()));
  const colDay = {}, colSec = {}, stray = [];
  const dayFor = c => { if (colDay[c]) return colDay[c]; let best = null, bc = -1;
    for (const k in colDay){ const kc = +k; if (kc <= c && kc > bc){ bc = kc; best = colDay[k]; } } return best; };
  rows.forEach(row => row.forEach((cell, c) => {
    if (!cell) return;
    const d = DAYS.indexOf(cell.toLowerCase().replace(/[^a-z]/g, ''));
    if (d >= 0){ colDay[c] = DAYS[d]; colSec[c] = null; out.days[DAYS[d]] = out.days[DAYS[d]] || []; return; }
    const sec = parseSectionHeader(cell);
    if (sec){
      const day = dayFor(c);
      if (!day){ out.warnings.push(`“${cell}” doesn’t have a day name (like Monday) above it, so it was skipped.`); colSec[c] = null; return; }
      out.days[day].push(sec); colSec[c] = sec; return;
    }
    const s = colSec[c];
    if (s){ const name = cell.replace(/\s+/g, ' '); if (!s.students.some(n => normKey(n) === normKey(name))) s.students.push(name); }
    else stray.push(cell);
  }));
  if (stray.length) out.warnings.push(`Skipped ${stray.length} cell${stray.length > 1 ? 's' : ''} that weren’t under a section heading (for example “${stray[0]}”).`);
  for (const day of Object.keys(out.days)) for (const s of out.days[day]) for (const n of s.students){
    const k = normKey(n); if (k && !out.nameOf[k]){ out.nameOf[k] = n; out.roster.push({ key: k, name: n }); }
  }
  out.roster.sort((a, b) => a.name.localeCompare(b.name));
  const R = out.roster;
  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++)
    if (looksAlike(R[i].key, R[j].key)) out.lookalikes.push([R[i].name, R[j].name]);
  return out;
}
// Parsed schedules are reused across renders (and give planFor a stable object to cache against).
const schedCache = new Map();
function parsedSchedule(text){
  if (!schedCache.has(text)){ if (schedCache.size > 30) schedCache.clear(); schedCache.set(text, parseSchedule(text)); }
  return schedCache.get(text);
}

/* ---------------- Zoom participant export ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseZoomTime(s){
  if (!s) return null; s = String(s).trim(); if (!s) return null;
  let y, mo, d, h, mi, se, ap, m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else { const t = Date.parse(s); return isNaN(t) ? null : new Date(t); }
  if (ap){ ap = ap.toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0; }
  return new Date(y, mo - 1, d, h, mi, se);
}
function parseZoomFile(name, text){
  const rows = parseCSV(String(text).replace(/^\uFEFF/, ''));
  const hi = rows.findIndex(r => r.some(c => /join/i.test(c)) && r.some(c => /leave/i.test(c)));
  if (hi < 0){
    const looksUnique = rows.some(r => r.some(c => /duration/i.test(c)) && r.some(c => /name/i.test(c)));
    return { error: looksUnique
      ? 'This file has no join or leave times. It was probably exported with “Show unique users” checked. Export it again with that box unchecked.'
      : 'This doesn’t look like a Zoom participant report (no “Join Time” column).' };
  }
  const h = rows[hi].map(c => c.trim().toLowerCase());
  let nameIdx = h.findIndex(c => c.startsWith('name') || c.includes('participant'));
  if (nameIdx < 0) nameIdx = 0;
  const joinIdx = h.findIndex(c => c.includes('join'));
  const leaveIdx = h.findIndex(c => c.includes('leave'));
  const waitIdx = h.findIndex(c => c.includes('waiting'));
  let emailIdx = h.findIndex((c, i) => c.includes('email') && i > nameIdx);
  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (r[nameIdx] || '').trim();
    const join = parseZoomTime(r[joinIdx]), leave = parseZoomTime(r[leaveIdx]);
    if (!nm || !join || !leave || leave <= join) continue;
    if (waitIdx >= 0 && /^y/i.test((r[waitIdx] || '').trim())) continue; // time in the waiting room isn't class time
    out.push({ name: nm, email: emailIdx >= 0 ? (r[emailIdx] || '').trim() : '', join, leave });
  }
  if (!out.length) return { error: 'No participant rows with join and leave times were found in this file.' };
  return { rows: out };
}

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));
  const steps = [
    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []
  ];
  return (raw, email) => {
    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

/* ---------------- Attendance math ---------------- */
function mergeIntervals(list){
  const s = list.map(x => [x[0], x[1]]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s){ const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push(iv); }
  return out;
}
const overlap = (list, A, B) => list.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, B) - Math.max(a, A)), 0);

const sumIv = list => list.reduce((t, [a, b]) => t + b - a, 0);

function evaluate(intervals, sections, at, S){
  const secs = sections.map(s => ({ type: s.type, a: at(s.startMin), b: at(s.endMin) })).sort((x, y) => x.a - y.a);
  const req = mergeIntervals(secs.map(s => [s.a, s.b]));
  const winStart = req[0][0], winEnd = req[req.length - 1][1];
  const merged = mergeIntervals(intervals);
  const presentMs = req.reduce((t, [A, B]) => t + overlap(merged, A, B), 0);
  const reqMs = sumIv(req);
  const instrIv = mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.a, s.b]));
  const iReqMs = sumIv(instrIv), iPresMs = instrIv.reduce((t, [a, b]) => t + overlap(merged, a, b), 0);
  const out = { secs, merged, flags: [], firstJoin: null, lastLeave: null, winStart, winEnd,
    presentMin: mins(presentMs), reqMin: mins(reqMs), instrMin: mins(iPresMs), instrReqMin: mins(iReqMs) };
  // Support minutes are "everything that isn't instruction", so overlapping sections are never counted twice.
  out.suppMin = out.presentMin - out.instrMin; out.suppReqMin = out.reqMin - out.instrReqMin;
  if (presentMs < 60000){ out.flags.push({ k: 'absent', label: 'Absent' }); return out; }
  const rel = merged.filter(([a, b]) => b > winStart && a < winEnd);
  out.firstJoin = rel[0][0]; out.lastLeave = rel[rel.length - 1][1];
  const G = S.lateGrace * 60000, L = S.leaveGrace * 60000, D = S.gapMin * 60000;
  const instr = secs.filter(s => s.type === 'instruction'), supp = secs.filter(s => s.type === 'support');
  if (instrIv.length && iPresMs < 5 * 60000) out.flags.push({ k: 'missed', label: 'Missed instruction' });
  else if (out.firstJoin > winStart + G){ const m = mins(out.firstJoin - winStart); out.flags.push({ k: 'late', label: `Late ${m} min`, min: m }); }
  if (out.lastLeave < winEnd - L){
    const m = mins(winEnd - out.lastLeave);
    const inSupport = supp.some(s => out.lastLeave >= s.a && out.lastLeave < s.b);
    const suppPresent = supp.reduce((t, s) => t + overlap(merged, s.a, s.b), 0);
    if (inSupport && suppPresent >= 5 * 60000){
      const sm = mins(overlap(mergeIntervals(supp.map(s => [s.a, s.b])), out.lastLeave, winEnd));   // support time left, not instruction
      out.flags.push({ k: 'soft', label: `Left support ${sm} min early`, min: sm });
    }
    else if (inSupport && instr.length) out.flags.push({ k: 'early', label: 'Skipped support hour', min: m, skip: true });
    else out.flags.push({ k: 'early', label: `Left ${m} min early`, min: m });
  }
  const spanA = Math.max(out.firstJoin, winStart), spanB = Math.min(out.lastLeave, winEnd);
  const reqInSpan = req.reduce((t, [A, B]) => t + Math.max(0, Math.min(B, spanB) - Math.max(A, spanA)), 0);
  const gap = reqInSpan - presentMs;
  if (gap > D){ const m = mins(gap); out.flags.push({ k: 'drop', label: `Out ${m} min mid-class`, min: m }); }
  if (!out.flags.length) out.flags.push({ k: 'full', label: 'Present full time' });
  return out;
}

function analyze(){
  const S = state.data.settings;
  // Each schedule version covers the days from its start date until the next version starts.
  const versions = state.data.scheduleVersions.map(v => ({ from: v.from || '', text: v.text, sched: parsedSchedule(v.text) }));
  const sched = versions[versions.length - 1].sched;
  const nameOf = {};
  for (const v of versions) for (const r of v.sched.roster) nameOf[r.key] = r.name;   // latest spelling wins
  const roster = Object.keys(nameOf).map(key => ({ key, name: nameOf[key] })).sort((a, b) => a.name.localeCompare(b.name));
  const verFor = dk => { let s = versions[0]; for (const v of versions) if (v.from <= dk) s = v; return s; };
  const schedFor = dk => verFor(dk).sched;
  // Zoom names are matched against that day's schedule first, so adding "Ben Carter" later can't make "ben c" ambiguous
  // on days Ben Carter wasn't scheduled. Everyone from every version is the fallback, for students who joined but weren't scheduled.
  const anyone = buildMatcher(roster, state.data.aliases);
  const matchFor = dk => { const v = verFor(dk); if (!v.match){ const m = buildMatcher(v.sched.roster, state.data.aliases); v.match = (r, e) => m(r, e) || anyone(r, e); } return v.match; };
  const ignored = new Set(state.data.ignored);
  const fileErrors = [], byDate = new Map();
  for (const f of state.files){
    const z = f.parsed || (f.parsed = parseZoomFile(f.name, f.text));
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    for (const r of z.rows){
      const dk = dkOf(r.join);
      if (!byDate.has(dk)) byDate.set(dk, { dk, files: new Set(), rows: [] });
      const g = byDate.get(dk); g.files.add(f.name); g.rows.push(r);
    }
  }
  const days = [...byDate.values()].sort((a, b) => b.dk.localeCompare(a.dk))
    .map(g => analyzeDay(g, schedFor(g.dk), nameOf, matchFor(g.dk), ignored, S));
  markGroupLate(days);
  return { sched, versions, schedFor, roster, nameOf, days, dayByDk: new Map(days.map(d => [d.dk, d])), fileErrors };
}

function analyzeDay(g, sched, nameOf, matcher, ignored, S){
  const date = parseDk(g.dk);
  // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
  const at = m => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m).getTime();
  const dayName = DAYS[date.getDay()];
  const secs = (sched.days[dayName] || []).map(s => ({ ...s, endMin: s.endMin ?? s.startMin + S.sectionLen }));
  const plan = new Map();
  for (const s of secs) for (const n of s.students){
    const k = normKey(n); if (!k) continue;
    if (!plan.has(k)) plan.set(k, { key: k, name: nameOf[k] || n, sections: [] });
    plan.get(k).sections.push(s);
  }
  const seen = new Map(), unmatched = new Map();
  for (const r of g.rows){
    const rk = normKey(r.name);
    if (ignored.has(rk)) continue;
    const iv = [r.join.getTime(), r.leave.getTime()];
    const m = matcher(r.name, r.email);
    if (m){
      if (!seen.has(m.key)) seen.set(m.key, { key: m.key, name: m.name, intervals: [], zoom: new Set(), segs: [] });
      const e = seen.get(m.key); e.intervals.push(iv); e.zoom.add(r.name); e.segs.push({ a: iv[0], b: iv[1], name: r.name });
    } else {
      if (!unmatched.has(rk)) unmatched.set(rk, { rk, raw: r.name, email: r.email, intervals: [] });
      unmatched.get(rk).intervals.push(iv);
    }
  }
  let axisStart, axisEnd;
  if (secs.length){
    axisStart = at(Math.min(...secs.map(s => s.startMin)) - 10);
    axisEnd = at(Math.max(...secs.map(s => s.endMin)) + 10);
  } else {
    const all = g.rows.map(r => [r.join.getTime(), r.leave.getTime()]);
    axisStart = Math.min(...all.map(x => x[0])) - 5 * 60000;
    axisEnd = Math.max(...all.map(x => x[1])) + 5 * 60000;
  }
  const students = [...plan.values()].map(p => {
    const e = seen.get(p.key);
    const res = evaluate(e ? e.intervals : [], p.sections, at, S);
    const xkey = `${g.dk}|${p.key}`;
    const soft = res.flags.find(f => f.k === 'soft');
    if (soft && state.data.excused[xkey]){ soft.k = 'fin'; soft.label = `Finished work, left ${soft.min} min early`; }
    const isAbsent = res.flags[0].k === 'absent';
    if (isAbsent && state.data.excusedAbsent[xkey]) res.flags[0] = { k: 'exc', label: 'Excused absence' };
    const sev = Math.max(...res.flags.map(f => SEVERITY[f.k]));
    const kinds = new Set(p.sections.map(s => s.type));
    const schedLabel = kinds.has('instruction') && kinds.has('support') ? 'Instruction + support'
      : kinds.has('instruction') ? 'Instruction' : 'Support hour only';
    const zoomNames = e ? [...e.zoom].filter(z => normKey(z) !== p.key) : [];
    const segs = e ? [...e.segs].sort((x, y) => x.a - y.a) : [];
    return { ...p, ...res, dk: g.dk, xkey, sev, schedLabel, zoomNames, segs, hasSoft: !!soft, isAbsent, groupLate: false,
      note: state.data.notes[xkey] || '' };
  }).sort((a, b) => b.sev - a.sev || a.name.localeCompare(b.name));
  const extras = [...seen.values()].filter(e => !plan.has(e.key)).map(e => ({ ...e, merged: mergeIntervals(e.intervals) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const unm = [...unmatched.values()].map(u => ({ ...u, merged: mergeIntervals(u.intervals) })).sort((a, b) => a.raw.localeCompare(b.raw));
  const ticks = [];
  for (let t = Math.ceil(axisStart / 1800000) * 1800000; t <= axisEnd; t += 1800000) ticks.push(t);
  return { dk: g.dk, date, dayName, files: [...g.files].sort(), secs, students, extras, unmatched: unm, axisStart, axisEnd, ticks,
    roster: sched.roster, groupLate: [] };
}

// When most of a group joined late, the delay was probably on the class side (a late link, a fire drill),
// so those days are left out of a student's lateness pattern.
function markGroupLate(days){
  for (const day of days){
    for (const [start, g] of groupBy(day.students, s => s.secs[0].a)){
      const came = g.filter(s => !s.isAbsent);
      if (came.length >= 3 && came.filter(s => s.flags.some(f => f.k === 'late')).length * 2 > came.length){
        g.forEach(s => { s.groupLate = true; });
        day.groupLate.push(start);
      }
    }
  }
}

/* ---------------- Rendering ---------------- */
function timeline(day, merged, secs){
  const span = day.axisEnd - day.axisStart, pct = t => ((t - day.axisStart) / span * 100).toFixed(3);
  let h = '';
  for (const s of secs || []) h += `<span class="band ${s.type}" style="left:${pct(s.a)}%;width:${(pct(s.b) - pct(s.a)).toFixed(3)}%"></span>`;
  for (const t of day.ticks) h += `<span class="tick${new Date(t).getMinutes() ? ' half' : ''}" style="left:${pct(t)}%"></span>`;
  const label = [];
  for (const [a, b] of merged){
    const A = Math.max(a, day.axisStart), B = Math.min(b, day.axisEnd); label.push(`${fmt(a)} to ${fmt(b)}`);
    if (B <= A) continue;
    h += `<span class="bar" title="In Zoom ${esc(fmt(a))}–${esc(fmt(b))}" style="left:${pct(A)}%;width:${Math.max(0.5, pct(B) - pct(A)).toFixed(3)}%"></span>`;
  }
  return `<div class="tl" role="img" aria-label="${esc(label.length ? 'In Zoom ' + label.join(', ') : 'Not in Zoom')}">${h}</div>`;
}
function axis(day){
  const span = day.axisEnd - day.axisStart;
  return `<div class="axis" aria-hidden="true">${day.ticks.filter(t => !new Date(t).getMinutes())
    .map(t => `<span style="left:${((t - day.axisStart) / span * 100).toFixed(2)}%">${esc(fmt(t).replace(/:00/, ''))}</span>`).join('')}</div>`;
}
// A time axis for one date, from minutes after midnight. Lets rows from different days line up.
function axisFor(dk, startMin, endMin){
  const d = parseDk(dk), at = m => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, m).getTime();
  const axisStart = at(startMin - 10), axisEnd = at(endMin + 10), ticks = [];
  for (let t = Math.ceil(axisStart / 1800000) * 1800000; t <= axisEnd; t += 1800000) ticks.push(t);
  return { axisStart, axisEnd, ticks };
}
function rangeText(merged){ return merged.map(([a, b]) => `${fmt(a)}–${fmt(b)}`).join(', '); }

function renderReports(){
  const el = $('#tab-reports');
  const A = analyze();
  state.lastAnalysis = A;
  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  let h = '';
  if (state.returnTo) h += `<div class="backbar">From ${esc(state.returnTo.name)}’s report <button class="btn small" data-returnto>Back to ${esc(state.returnTo.name)}</button>
    <button class="linkish" data-dismissreturn>Stay here</button></div>`;
  if (!A.sched.roster.length) h += `<div class="notice">Add your class schedule on the <button class="linkish" data-goto="schedule">Schedule tab</button> so each student can be checked against the hours they’re expected.</div>`;
  if (A.fileErrors.length) h += `<div class="notice"><b>Some files couldn’t be read:</b><ul>${A.fileErrors.map(f => `<li>${esc(f.name)}: ${esc(f.error)}</li>`).join('')}</ul></div>`;
  if (!A.days.length){
    el.innerHTML = h + `<div class="start"><h2>No Zoom reports in this folder yet</h2><p class="muted">Save a participant report from Zoom into <b>${esc(state.folderName || 'your folder')}</b>, then click Refresh.</p>${zoomHelp()}</div>`;
    return;
  }
  const days = daysInRange(A.days), period = periodOf(A);
  h += `<div class="toolbar">${rangeBar()}
    <div class="seg" role="group" aria-label="Show">
      <button data-filter="all" aria-pressed="${state.filter === 'all'}">Everyone</button>
      <button data-filter="flag" aria-pressed="${state.filter === 'flag'}">Needs a look</button>
    </div>
    <input class="search" data-search type="search" placeholder="Find a student" value="${esc(state.query)}" aria-label="Find a student">
    <button class="btn small ghost" id="openAll">Expand all</button><button class="btn small ghost" id="closeAll">Collapse all</button>
    <button class="btn small ghost" id="exportDays"${days.length ? '' : ' disabled'}>Export CSV</button>
    <div class="legend"><span><i class="sw i"></i>Instruction hour</span><span><i class="sw s"></i>Support hour</span><span><i class="sw p"></i>In Zoom</span></div>
  </div>`;
  h += missingNotice(A, period);
  const noClassDays = Object.keys(state.data.noClass).filter(dk => !A.dayByDk.has(dk) && dk >= period.from && dk <= period.to);
  if (!days.length && !noClassDays.length){ el.innerHTML = h + `<div class="notice info">No Zoom reports fall in these dates. ${A.days.length} report day${A.days.length === 1 ? ' is' : 's are'} outside the range. <button class="linkish" data-range="all">Show all dates</button></div>`; return; }
  if (!state.autoOpened && days.length){ state.openDays.add(days[0].dk); state.autoOpened = true; }
  const cards = [...days.map(d => ({ dk: d.dk, day: d })), ...noClassDays.map(dk => ({ dk }))].sort((a, b) => b.dk.localeCompare(a.dk));
  for (const c of cards) h += c.day ? renderDay(c.day) : noClassCard(c.dk);
  el.innerHTML = h;
  focusNoteInput(el);
}
function noClassCard(dk){
  const r = state.data.noClass[dk] || {};
  return `<div class="noclasscard" data-dk="${esc(dk)}"><b>${esc(longDate(dk))}</b> <span>No class: ${esc(NOCLASS_REASONS[r.reason] || 'Other')}</span>
    <button class="linkish" data-undonoclass="${esc(dk)}">Undo</button></div>`;
}
function focusNoteInput(el){
  if (!state.noteEdit) return;
  const n = el.querySelector('input.note'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
}

/* ---------------- Date range (shared by Reports and Students) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
function daysInRange(days){
  const { from, to } = rangeBounds();
  return days.filter(d => (!from || d.dk >= from) && (!to || d.dk <= to));
}
// The dates a person reads: an open start becomes the oldest report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const oldest = A.days.length ? A.days[A.days.length - 1].dk : today;
  const from = b.from || oldest, to = b.to || (A.days.length && A.days[0].dk > today ? A.days[0].dk : today);
  const saved = state.range.periodId && state.data.periods.find(p => p.id === state.range.periodId);
  return { from, to, calcTo: to < today ? to : today, open: to >= today, name: saved ? saved.name : '' };
}
function rangeBar(){
  const p = state.range.preset, b = rangeBounds(), P = state.data.periods;
  return `<div class="range" role="group" aria-label="Dates">
    <div class="seg"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
      <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
      <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button></div>
    <label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
    <label>to <input type="date" data-rto value="${esc(b.to)}"></label>
    ${P.length ? `<label>Saved dates <select data-periodsel><option value="">Choose…</option>${P.map(x =>
      `<option value="${esc(x.id)}"${state.range.periodId === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
    ${state.savingPeriod ? `<span class="saveperiod"><input type="text" data-periodname maxlength="40" placeholder="For example, Cycle 1" aria-label="Name for these dates">
      <button class="btn small" data-saveperiod>Save</button><button class="btn small ghost" data-cancelperiod>Cancel</button></span>`
      : `<button class="linkish" data-startperiod>Save these dates…</button>`}</div>`;
}
function stamp(){
  const saved = state.range.periodId && state.data.periods.find(p => p.id === state.range.periodId);
  if (saved) return normKey(saved.name).replace(/ /g, '-') || 'saved-dates';
  const { from, to } = rangeBounds(); return from || to ? `${from || 'start'}_to_${to || 'latest'}` : 'all-dates';
}

/* ---------------- Days with no report, and "no class" marks ---------------- */
function weekdayScheduled(A, dk){
  const s = A.schedFor(dk); return (s.days[DAYS[parseDk(dk).getDay()]] || []).some(sec => sec.students.length);
}
function missingDates(A, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && dk < today && i < 1500; dk = addDays(dk, 1), i++)
    if (!A.dayByDk.has(dk) && !state.data.noClass[dk] && weekdayScheduled(A, dk)) out.push(dk);
  return out;
}
const reasonSelect = () => `<select data-ncreason aria-label="Why there was no class">${Object.entries(NOCLASS_REASONS)
  .map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select>`;
function noClassItems(dks){
  const shown = dks.slice(0, 5), rest = dks.slice(5);
  return `<ul class="nclist">${shown.map(dk => `<li><span>${esc(shortDate(dk))}</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclass="${dk}">Mark no class</button></li>`).join('')}
    ${rest.length ? `<li><span>and ${rest.length} more (${esc(monDay(rest[0]))} – ${esc(monDay(rest[rest.length - 1]))})</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclassall="${rest.join(',')}">Mark all ${rest.length} as no class</button></li>` : ''}</ul>`;
}
function missingNotice(A, period){
  const miss = missingDates(A, period);
  let h = '';
  if (miss.length){
    const named = miss.slice(0, 5).map(dk => `<b>${esc(shortDate(dk))}</b>`);
    h += `<div class="notice"><p style="margin:0">No Zoom report for ${listJoin(named, 5)}${miss.length > 5 ? ` and ${miss.length - 5} more` : ''}. If class met, save that Zoom report into this folder and click Refresh. If there was no class that day:</p>${noClassItems(miss)}</div>`;
  }
  return h + conflictNotices(A, period);
}
function conflictNotices(A, period, key){
  return Object.keys(state.data.noClass).filter(dk => A.dayByDk.has(dk) && dk >= period.from && dk <= period.to
      && (!key || A.dayByDk.get(dk).students.some(s => s.key === key))).sort()
    .map(dk => `<div class="notice">${esc(monDay(dk))} is marked “No class” but has a Zoom report. The report is used. <button class="linkish" data-undonoclass="${dk}">Remove the mark</button></div>`).join('');
}

function followUpText(day){
  const title = longDate(day.date);
  const flagged = day.students.filter(s => s.sev >= 2);
  const lines = [`${title}: ${plural(flagged.length, 'student')} to follow up with`];
  for (const s of flagged) lines.push(`- ${s.name}: ${s.flags.filter(f => SEVERITY[f.k] >= 2).map(f => f.label).join('; ')}${s.note ? ` (note: ${s.note})` : ''}`);
  if (!flagged.length) lines.push('Everyone scheduled was present the full time.');
  return lines.join('\n');
}

// The action links under a student's status, shared by Reports and the student report.
function rowActions(s){
  const editing = state.noteEdit === s.xkey;
  return `${s.hasSoft ? `<button class="linkish" data-excuse="${esc(s.xkey)}">${state.data.excused[s.xkey] ? 'Undo finished work' : 'Mark finished work'}</button>` : ''}
    ${s.isAbsent ? `<button class="linkish" data-excabs="${esc(s.xkey)}">${state.data.excusedAbsent[s.xkey] ? 'Undo excused' : 'Mark excused'}</button>` : ''}
    ${editing ? '' : `<button class="linkish" data-noteedit="${esc(s.xkey)}">${s.note ? 'Edit note' : 'Add note'}</button>`}`;
}
function noteBlock(s){
  return state.noteEdit === s.xkey
    ? `<input class="note" data-note="${esc(s.xkey)}" value="${esc(s.note)}" placeholder="Note, then press Enter" aria-label="Note for ${esc(s.name)}, ${esc(shortDate(s.dk))}">`
    : s.note ? `<span class="note-txt">${esc(s.note)}</span>` : '';
}

// A closed day only draws its heading; its rows are drawn when it's opened (see the toggle listener), which keeps
// the Reports tab quick with a whole year of reports.
function renderDay(day){
  const counts = {}; for (const s of day.students) for (const f of s.flags) counts[f.k] = (counts[f.k] || 0) + 1;
  const title = longDate(day.date);
  const sub = day.secs.length
    ? `${day.students.length} scheduled, ${day.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support'} ${fmtMin(s.startMin).replace(':00', '')}`).join(' and ')}`
    : `No ${cap(day.dayName)} schedule`;
  const groupLate = day.groupLate.map(t => fmt(t).replace(':00', ''));
  const open = state.openDays.has(day.dk);
  return `<details class="day" data-dk="${day.dk}"${open ? ' open' : ''}>
    <summary><h2>${esc(title)}</h2><span class="sub">${esc(sub)}</span>
      <span class="counts">${COUNT_ORDER.filter(([k]) => counts[k]).map(([k, l]) => `<span class="count k-${k}">${counts[k]} ${l}</span>`).join('')}
      ${day.unmatched.length ? `<span class="count k-extra">${day.unmatched.length} unmatched Zoom name${day.unmatched.length > 1 ? 's' : ''}</span>` : ''}
      ${groupLate.length ? `<span class="count k-extra">Most of the ${esc(listJoin(groupLate))} group joined late</span>` : ''}</span>
    </summary><div class="day-body">${open ? dayBody(day) : ''}</div></details>`;
}
function fillDayBody(el){
  const body = el.querySelector(':scope > .day-body'), day = state.lastAnalysis && state.lastAnalysis.dayByDk.get(el.dataset.dk);
  if (body && day && !body.childElementCount) body.innerHTML = dayBody(day);
}
function dayBody(day){
  const q = normKey(state.query);
  const expected = day.students.filter(s => s.flags[0].k !== 'exc').length;
  const came = day.students.filter(s => !s.isAbsent).length;
  const rows = day.students.filter(s => (state.filter === 'all' || s.sev >= 2) && (!q || s.key.includes(q)));
  const groupLate = day.groupLate.map(t => fmt(t).replace(':00', ''));
  let h = '';
  if (!day.secs.length) h += `<p class="muted small">There’s no ${cap(day.dayName)} section in your schedule, so everyone who joined is listed below without on-time checks.</p>`;
  if (groupLate.length) h += `<p class="muted small">Most of the ${esc(listJoin(groupLate))} group joined late, so the class may have started late. This day isn’t used for anyone’s lateness pattern on their student report.</p>`;
  if (day.students.length){
    h += `<div class="daybar"><span class="rate">${came} of ${expected} attended (${pct(came, expected) ?? 0}%)</span>
      <button class="btn small ghost" data-copy="${day.dk}">Copy follow-up list</button></div>`;
    h += `<div class="grid-head"><span>Student</span>${axis(day)}<span>Joined</span><span>Left</span><span>Status</span></div>`;
    if (!rows.length) h += `<p class="muted small" style="padding:10px 0">${state.filter === 'flag' ? 'Everyone was present the full time.' : 'No students match that search.'}</p>`;
    for (const s of rows){
      const meta = [s.schedLabel];
      if (!s.isAbsent) meta.push(`${s.presentMin} of ${s.reqMin} min`);
      const hl = state.highlight === s.xkey;
      h += `<div class="row${hl ? ' hl' : ''}" data-xkey="${esc(s.xkey)}">
        <div class="who"><button class="name-btn" data-openstudent="${esc(s.key)}" data-from="${day.dk}" title="Open ${esc(s.name)}’s student report">${esc(s.name)}</button>
          <span class="meta">${esc(meta.join(', '))}</span>
          ${hl && state.returnTo ? `<span class="meta">↳ from ${esc(state.returnTo.name)}’s report</span>` : ''}
          ${s.zoomNames.length ? `<span class="meta">In Zoom as ${s.zoomNames.map(z => `“${esc(z)}”`).join(', ')}</span>` : ''}
          ${noteBlock(s)}</div>
        <div class="tlc">${timeline(day, s.merged, s.secs)}</div>
        <div class="time${s.firstJoin ? '' : ' none'}" data-label="Joined">${esc(fmt(s.firstJoin))}</div>
        <div class="time${s.lastLeave ? '' : ' none'}" data-label="Left">${esc(fmt(s.lastLeave))}</div>
        <div class="chips">${s.flags.map(f => `<span class="chip k-${f.k}">${esc(f.label)}</span>`).join('')} ${rowActions(s)}</div>
      </div>`;
    }
  }
  const extras = day.extras.filter(e => !q || e.key.includes(q));
  if (extras.length){
    h += `<h3 class="subhead">${day.secs.length ? `Joined but not on the ${cap(day.dayName)} schedule` : 'Joined'}</h3>`;
    for (const e of extras) h += `<div class="mini"><div class="who"><b>${esc(e.name)}</b></div><div>${timeline(day, e.merged)}</div><div class="small muted">${esc(rangeText(e.merged))}</div></div>`;
  }
  if (day.unmatched.length){
    const opts = day.roster.map(r => `<option value="${esc(r.key)}">${esc(r.name)}</option>`).join('');
    h += `<h3 class="subhead">Zoom names that didn’t match a student</h3>
      <p class="small muted" style="margin:0 0 4px">Link a name once and it’s matched automatically from then on. Ignore names that aren’t students, like your own.</p>`;
    for (const u of day.unmatched) h += `<div class="mini" data-rk="${esc(u.rk)}">
      <div class="who"><b>${esc(u.raw)}</b>${u.email ? `<span class="meta">${esc(u.email)}</span>` : ''}</div>
      <div>${timeline(day, u.merged)}</div>
      <div class="act"><span class="small muted">${esc(rangeText(u.merged))}</span>
        ${opts ? `<select aria-label="Student for ${esc(u.raw)}"><option value="">Choose student…</option>${opts}</select>
        <button class="btn small" data-link>Link</button>` : ''}
        <button class="btn small ghost" data-ignore>Ignore</button></div></div>`;
  }
  h += `<div class="files">From ${day.files.map(esc).join(', ')}</div>`;
  return h;
}

/* ---------------- Students: computation ---------------- */
const hasFlag = (s, k) => s.flags.some(f => f.k === k);
const isWhole = s => !s.isAbsent && s.flags.every(f => f.k === 'full' || f.k === 'fin');
const worstFlag = s => s.flags.reduce((w, x) => SEVERITY[x.k] > SEVERITY[w.k] ? x : w);
const isExcused = s => s.flags[0].k === 'exc';
// Minutes a student left early after finishing their work. They come out of the "scheduled" total.
function finMinOf(s){
  const f = s.flags.find(x => x.k === 'fin');
  return f ? Math.min(f.min || 0, Math.max(0, s.reqMin - s.presentMin), Math.max(0, s.suppReqMin - s.suppMin)) : 0;
}
const instrIvOf = s => mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));

// A student's scheduled sections on one date, from the schedule version in effect that day
// (or, with `at`, from the version in effect on another date).
const planCache = new WeakMap();
function planFor(A, key, dk, at){
  const sched = A.schedFor(at || dk), w = DAYS[parseDk(dk).getDay()], len = state.data.settings.sectionLen;
  let m = planCache.get(sched); if (!m) planCache.set(sched, m = new Map());
  const ck = `${w}|${key}|${len}`;
  if (!m.has(ck)){
    const secs = (sched.days[w] || []).filter(s => s.students.some(n => normKey(n) === key))
      .map(s => ({ type: s.type, startMin: s.startMin, endMin: s.endMin ?? s.startMin + len })).sort((a, b) => a.startMin - b.startMin);
    if (!secs.length) m.set(ck, null);
    else {
      const iv = mergeIntervals(secs.map(s => [s.startMin, s.endMin]));
      const instrMin = sumIv(mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.startMin, s.endMin])));
      const minutes = sumIv(iv);
      m.set(ck, { secs, minutes, instrMin, suppMin: minutes - instrMin, startMin: iv[0][0], endMin: iv[iv.length - 1][1] });
    }
  }
  return m.get(ck);
}

// Every date in the period the student was scheduled, with what happened (oldest first).
function studentDates(A, key, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && i < 1500; dk = addDays(dk, 1), i++){
    const day = A.dayByDk.get(dk), rec = day ? day.students.find(s => s.key === key) : null;
    const plan = planFor(A, key, dk);
    if (!plan && !rec) continue;
    const status = rec ? 'held' : day ? 'off' : state.data.noClass[dk] ? 'noclass' : dk === today ? 'pending' : dk > today ? 'upcoming' : 'missing';
    if (status === 'off') continue;
    out.push({ dk, status, plan, rec, day });
  }
  return out;
}

// Times the student was out of Zoom in the middle of class.
function gapsOf(s){
  const out = [], M = s.merged;
  for (let i = 0; i + 1 < M.length; i++){
    const a = Math.max(M[i][1], s.winStart), b = Math.min(M[i + 1][0], s.winEnd);
    if (b - a < 60000) continue;
    const before = [...s.segs].reverse().find(x => x.b <= a + 30000), after = s.segs.find(x => x.a >= b - 30000);
    out.push({ a, b, min: mins(b - a), clock: clockOf(a),
      changedName: !!(before && after && normKey(before.name) !== normKey(after.name)) });
  }
  return out;
}

const MISSED_LABEL = { absent: 'absences', late: 'joining late', early: 'leaving class early', support: 'leaving the support hour early', mid: 'time out of Zoom mid-class' };
// Where the missed minutes went. The parts add up exactly to scheduled minus present.
function minutesBreakdown(rec, target){
  const b = { absent: 0, late: 0, early: 0, support: 0, mid: 0 };
  for (const { s } of rec){
    if (isExcused(s)) continue;
    const req = mergeIntervals(s.secs.map(x => [x.a, x.b])), reqMs = sumIv(req);
    if (s.isAbsent){ b.absent += reqMs; continue; }
    const presMs = req.reduce((t, [A, B]) => t + overlap(s.merged, A, B), 0);
    const late = overlap(req, s.winStart, s.firstJoin), early = overlap(req, s.lastLeave, s.winEnd);
    b.late += late;
    if (!hasFlag(s, 'fin')) b[hasFlag(s, 'soft') || s.flags.some(f => f.skip) ? 'support' : 'early'] += early;
    b.mid += Math.max(0, reqMs - presMs - late - early);
  }
  for (const k in b) b[k] = mins(b[k]);
  b.mid = Math.max(0, target - b.absent - b.late - b.early - b.support);
  return b;
}
function topMissed(b, target){
  return Object.entries(b).filter(([, m]) => m > 0 && m >= target * .1).sort((x, y) => y[1] - x[1]).slice(0, 2)
    .map(([k, m]) => `${MISSED_LABEL[k]} (${m} min)`).join(' and ');
}

function studentSummary(days){
  const map = new Map();
  for (const day of [...days].reverse()) for (const s of day.students){   // oldest first
    if (!map.has(s.key)) map.set(s.key, { key: s.key, name: s.name, rec: [] });
    map.get(s.key).rec.push({ day, s });
  }
  const T = state.data.settings.concernRate;
  return [...map.values()].map(p => summarize(p, T));
}
function summarize(p, T){
  const c = { sessions: 0, excused: 0, attended: 0, absent: 0, late: 0, missed: 0, suppOnly: 0, early: 0, soft: 0, drop: 0, full: 0,
    pres: 0, req: 0, finMin: 0, iPres: 0, iReq: 0, sPres: 0, sReq: 0 };
  for (const { s } of p.rec){
    c.sessions++;
    if (isExcused(s)){ c.excused++; continue; }
    const fin = finMinOf(s);
    c.req += s.reqMin - fin; c.pres += s.presentMin; c.finMin += fin;
    c.iReq += s.instrReqMin; c.iPres += s.instrMin; c.sReq += s.suppReqMin - fin; c.sPres += s.suppMin;
    if (s.isAbsent) c.absent++; else c.attended++;
    if (hasFlag(s, 'late')) c.late++;
    if (hasFlag(s, 'missed')){ c.missed++; if (s.suppMin >= 5) c.suppOnly++; }   // suppOnly: missed instruction but was in the support hour
    if (hasFlag(s, 'early')) c.early++;
    if (hasFlag(s, 'soft')) c.soft++;
    if (hasFlag(s, 'drop')) c.drop++;
    if (isWhole(s)) c.full++;
  }
  const n = c.sessions - c.excused, few = n < FEW_DAYS;
  const rate = pct(c.attended, n), dose = pct(c.pres, c.req), instrDose = pct(c.iPres, c.iReq), suppDose = pct(c.sPres, c.sReq);
  let run = [], longest = { len: 0, dates: [] };
  for (const { day, s } of p.rec){
    if (isExcused(s)) continue;
    if (s.isAbsent){ run.push(day.dk); if (run.length > longest.len) longest = { len: run.length, dates: [...run] }; } else run = [];
  }
  const streak = run.length, streakDates = run;
  const breakdown = minutesBreakdown(p.rec, c.req - c.pres);
  // The reasons are built from the same tests that decide "needs a look", so the page never contradicts itself.
  const reasons = [];
  if (!few && rate !== null && rate < T) reasons.push({ k: 'rate', short: `came ${ofN(c.attended, n, 'day')} (${rate}%)`,
    long: `Attended ${ofN(c.attended, n, 'class day')} (${rate}%), ${T - rate} under your ${T}% line.` });
  if (!few && dose !== null && dose < T){
    const top = topMissed(breakdown, c.req - c.pres);
    reasons.push({ k: 'dose', short: `minutes ${dose}%`,
      long: `In Zoom for ${c.pres} of ${c.req} scheduled minutes (${dose}%), ${T - dose} under your ${T}% line.${top ? ` Most of the missed time: ${top}.` : ''}` });
  }
  if (streak >= 2) reasons.push({ k: 'streak', short: `absent the last ${streak} class days`,
    long: `Absent the last ${streak} class days (${dateList(streakDates)}).` });
  const concern = reasons.length > 0;
  const near = !concern && !few && Math.min(rate ?? 101, dose ?? 101) < T + 5;
  return { ...p, ...c, n, few, rate, dose, instrDose, suppDose, streak, streakDates, longest, breakdown, reasons, concern, near };
}
// "Only 3 class days so far" while the period is still running, "in these dates" once it has ended.
const fewText = (p, open) => !p.n ? 'All class days in these dates were excused' : `Only ${plural(p.n, 'class day')} ${open ? 'so far' : 'in these dates'}`;
function sortStudents(list){
  const by = state.sort, v = x => x ?? 101, name = (a, b) => a.name.localeCompare(b.name);
  return list.sort((a, b) =>
    by === 'name' ? name(a, b)
    : by === 'rate' ? v(a.rate) - v(b.rate) || name(a, b)
    : by === 'dose' ? v(a.dose) - v(b.dose) || name(a, b)
    : by === 'instr' ? v(a.instrDose) - v(b.instrDose) || name(a, b)
    : by === 'absent' ? b.absent - a.absent || name(a, b)
    : (b.concern - a.concern) || b.streak - a.streak || v(a.rate) - v(b.rate) || v(a.dose) - v(b.dose) || name(a, b));
}
function sameWeekday(rs){ const w = new Set(rs.map(r => r.day.date.getDay())); return w.size === 1 ? [...w][0] : null; }
const spanTxt = rs => `${monDay(rs[0].day.dk)} – ${monDay(rs[rs.length - 1].day.dk)}`;

// "What the attendance shows": template sentences only, each tied to the days it describes.
// `open` is true while the period is still running, so "so far" is only said when more days can come.
function describeStudent(p, allN, open = true){
  const R = p.rec.filter(r => !isExcused(r.s)), att = R.filter(r => !r.s.isAbsent);
  const soFar = small => small && open ? ' so far' : '';
  const so = soFar(p.few);
  const lead = [];
  if (!p.n) lead.push(`All ${plural(p.sessions, 'class day')} in these dates were excused.`);
  else {
    const exc = p.excused ? `, not counting ${plural(p.excused, 'excused absence')}` : '';
    lead.push(p.few ? `Attended ${ofN(p.attended, p.n, 'class day')}${so}${exc}.` : `Attended ${ofN(p.attended, p.n, 'class day')} (${p.rate}%)${exc}.`);
    const iTxt = `${p.iPres} of ${p.iReq} instruction minutes${p.few ? '' : ` (${p.instrDose}%)`}`;
    const sTxt = `${p.sPres} of ${p.sReq} support-hour minutes${p.few ? '' : ` (${p.suppDose}%)`}`;
    if (p.iReq && p.sReq) lead.push(`Received ${iTxt} and ${sTxt}${so}.`);
    else if (p.iReq) lead.push(`Received ${iTxt}${so}.`);
    else if (p.sReq) lead.push(`Received ${sTxt}${so}.`);
    if (p.finMin) lead.push(`${p.finMin} minutes of finished-work time are not counted.`);
  }
  const items = [], dks = rs => rs.map(r => r.day.dk);
  // F: absences in a row
  if (p.streak >= 2){
    let k = 0; for (let i = R.length - p.streak - 1; i >= 0 && !R[i].s.isAbsent; i--) k++;
    items.push({ id: 'F', text: `Absent the last ${p.streak} class days (${dateList(p.streakDates)})${k >= 2 ? ` after attending ${k} in a row` : ''}.`, dks: p.streakDates });
  } else if (p.longest.len >= 2) items.push({ id: 'F', text: `Absent ${p.longest.len} class days in a row (${dateList(p.longest.dates)}).`, dks: p.longest.dates });
  else if (p.absent >= 3 && p.absent / p.n >= .3){
    const ab = R.filter(r => r.s.isAbsent);
    items.push({ id: 'F', text: `Absent on ${ofN(p.absent, p.n, 'class day')} (${dateList(dks(ab))}).`, dks: dks(ab) });
  }
  // T: trend in minutes received
  const weeks = new Set(R.map(r => weekKey(r.day.dk))).size;
  let trend = null;
  if (p.n >= TREND_DAYS && weeks >= TREND_WEEKS){
    const k = p.n >= 12 ? 6 : 4, recent = R.slice(-k), earlier = R.slice(0, -k);
    const d = rs => pct(rs.reduce((t, r) => t + r.s.presentMin, 0), rs.reduce((t, r) => t + r.s.reqMin - finMinOf(r.s), 0));
    const dR = d(recent), dE = d(earlier), thr = Math.ceil(100 / k) + 5;
    if (dR !== null && dE !== null && Math.abs(dR - dE) >= thr){
      trend = `Minutes received went ${dR < dE ? 'down' : 'up'} from ${dE}% (${spanTxt(earlier)}) to ${dR}% (${spanTxt(recent)}).`;
      items.push({ id: 'T', text: trend, dks: dks(recent) });
    }
  }
  const trendCaption = trend || (p.n >= TREND_DAYS && weeks >= TREND_WEEKS ? 'No clear change in minutes received over these dates.'
    : (allN || 0) > p.n && allN >= TREND_DAYS ? 'Choose a longer date range to see a trend.'
    : p.n >= TREND_DAYS ? `Too early to call a trend: ${plural(weeks, 'week')} of class${open ? ' so far' : ' in these dates'} (needs ${TREND_WEEKS}).`
    : `Too early to call a trend: ${plural(p.n, 'class day')}${open ? ' so far' : ' in these dates'} (needs ${TREND_DAYS} over ${TREND_WEEKS} weeks).`);
  // W: one weekday much worse than another
  const ws = [...groupBy(R, r => r.day.date.getDay())].filter(([, xs]) => xs.length >= 2)
    .map(([w, xs]) => ({ w, xs, n: xs.length, a: xs.filter(r => !r.s.isAbsent).length })).map(o => ({ ...o, rate: o.a / o.n }));
  if (ws.length >= 2){
    ws.sort((x, y) => y.rate - x.rate);
    const hi = ws[0], lo = ws[ws.length - 1];
    if ((hi.rate - lo.rate) * 100 >= WEEKDAY_GAP)
      items.push({ id: 'W', text: `Attended ${hi.a} of ${hi.n} ${wdPlural(hi.w)} but ${lo.a} of ${lo.n} ${wdPlural(lo.w)}.`, dks: dks(lo.xs.filter(r => r.s.isAbsent)) });
  }
  // E: missed instruction. Only called "came for the support hour" when the student really was in the support hour.
  const suppOnlyR = att.filter(r => hasFlag(r.s, 'missed') && r.s.suppMin >= 5), briefR = att.filter(r => hasFlag(r.s, 'missed') && r.s.suppMin < 5);
  if (suppOnlyR.length >= PATTERN_MIN)
    items.push({ id: 'E', text: `Was in Zoom only for the support hour, not instruction, on ${suppOnlyR.length} of ${plural(att.length, 'day')} attended.`, dks: dks(suppOnlyR) });
  if (briefR.length >= PATTERN_MIN)
    items.push({ id: 'E2', text: `Was in Zoom for less than 5 minutes of instruction on ${briefR.length} of ${plural(att.length, 'day')} attended.`, dks: dks(briefR) });
  // C: out of Zoom mid-class
  const dropR = att.filter(r => hasFlag(r.s, 'drop'));
  if (dropR.length >= PATTERN_MIN){
    const oneW = sameWeekday(dropR), baseR = oneW !== null ? att.filter(r => r.day.date.getDay() === oneW) : att;
    if (dropR.length / baseR.length >= .4){
      const perDay = dropR.map(r => gapsOf(r.s));
      let best = null;
      for (const gs of perDay){ for (const g of gs){
        const hits = perDay.map(x => x.find(y => Math.abs(y.clock - g.clock) <= 10));
        if (hits.every(Boolean)){ best = hits; break; } } if (best) break; }
      const medMin = Math.round(median(dropR.map(r => r.s.flags.find(f => f.k === 'drop').min)));
      // dropR has at least 2 days, so the base is always plural.
      let text = `Out of Zoom in the middle of class on ${dropR.length} of ${baseR.length} ${oneW !== null ? wdPlural(oneW) : 'days attended'}${soFar(baseR.length < FEW_DAYS)}${best ? `, usually around ${fmtMin(median(best.map(g => g.clock)))}` : ''}, for about ${medMin} minutes.`;
      const j = best ? best.filter(g => g.changedName).length : 0;
      if (j && j * 2 >= best.length) text += ` On ${j} of these days, Zoom shows a different name before and after.`;
      items.push({ id: 'C', text, dks: dks(dropR), w: oneW });
    }
  }
  // B: leaving early
  const leftR = att.filter(r => !hasFlag(r.s, 'fin') && (hasFlag(r.s, 'early') || hasFlag(r.s, 'soft')));
  if (leftR.length >= PATTERN_MIN){
    const endsInSupport = r => r.s.secs.some(x => x.type === 'support' && r.s.lastLeave >= x.a && r.s.lastLeave < x.b);
    const allSupp = leftR.every(endsInSupport), allSkip = leftR.every(r => r.s.flags.some(f => f.skip));
    const oneW = sameWeekday(leftR);
    let baseR = allSupp ? att.filter(r => r.s.secs.some(x => x.type === 'support')) : att;
    if (oneW !== null) baseR = baseR.filter(r => r.day.date.getDay() === oneW);
    if (baseR.length && leftR.length / baseR.length >= .5){
      const word = oneW !== null ? wdPlural(oneW) : allSupp ? 'days with a support hour' : 'days attended';
      const sf = soFar(baseR.length < FEW_DAYS);
      const clock = fmtMin(median(leftR.map(r => clockOf(r.s.lastLeave))));
      const text = allSkip ? `Was not in Zoom for the support hour on ${leftR.length} of ${baseR.length} ${word}${sf}.`
        : allSupp ? `Left the support hour early on ${leftR.length} of ${baseR.length} ${word}${sf}, usually around ${clock}.`
        : `Left before the end of class on ${leftR.length} of ${baseR.length} ${word}${sf}, usually around ${clock}.`;
      items.push({ id: 'B', text, dks: dks(leftR), w: oneW });
    }
  }
  // A: joining late (days when most of the group was late are left out)
  const ng = att.filter(r => !r.s.groupLate), lateR = ng.filter(r => hasFlag(r.s, 'late'));
  if (lateR.length >= PATTERN_MIN){
    const lateMin = r => r.s.flags.find(f => f.k === 'late').min;
    const lost = rs => mins(rs.reduce((t, r) => t + overlap(instrIvOf(r.s), r.s.winStart, r.s.firstJoin), 0));
    const cands = [...groupBy(ng, r => r.day.date.getDay())].map(([w, xs]) => ({ w, xs, late: xs.filter(r => hasFlag(r.s, 'late')) }))
      .filter(o => o.xs.length >= 2 && o.late.length >= 2 && o.late.length / o.xs.length >= .75).sort((a, b) => b.late.length - a.late.length);
    let done = false;
    for (const c of cands){
      const others = ng.filter(r => r.day.date.getDay() !== c.w), lateO = others.filter(r => hasFlag(r.s, 'late')).length;
      if (others.length && lateO / others.length > .34) continue;
      const onTime = others.filter(r => !hasFlag(r.s, 'late') && !hasFlag(r.s, 'missed')).length;
      const otherWs = [...new Set(others.map(r => r.day.date.getDay()))].sort(byWeekOrder).map(wdPlural);
      let text = `Joined late on ${c.late.length} of ${c.xs.length} ${wdPlural(c.w)}${soFar(c.xs.length < FEW_DAYS)}, about ${Math.round(median(c.late.map(lateMin)))} minutes after the start.`;
      if (others.length) text += ` On time on ${onTime} of ${others.length} ${others.length === 1 ? otherWs[0].replace(/s$/, '') : listJoin(otherWs)}.`;
      const l = lost(c.late); if (l) text += ` About ${l} minutes of instruction missed this way.`;
      items.push({ id: 'A', text, dks: dks(c.late), w: c.w }); done = true; break;
    }
    if (!done && lateR.length / ng.length >= .5)
      items.push({ id: 'A', text: `Joined late on ${lateR.length} of ${plural(ng.length, 'day')} attended, usually about ${Math.round(median(lateR.map(lateMin)))} minutes after the start.`, dks: dks(lateR), w: null });
  }
  // One strength, always last.
  let strength = null;
  if (p.n >= 2 && p.absent === 0) strength = `Came to every class day in this period (${p.attended} of ${p.n}).`;
  else if (p.attended >= 2 && p.full === p.attended) strength = `Stayed for the whole class on every day attended (${p.full} of ${p.attended}).`;
  else {
    let run = 0; for (let i = R.length - 1; i >= 0 && isWhole(R[i].s); i--) run++;
    if (run >= 3) strength = `Was in class the whole time on the last ${run} class days in a row.`;
    else if (R.length >= 2 && !R[R.length - 1].s.isAbsent && R[R.length - 2].s.isAbsent) strength = `Came back to class on ${shortDate(R[R.length - 1].day.dk)}.`;
    else if (p.full >= 1) strength = `Was in class the whole time on ${p.full} of ${plural(p.attended, 'day')} attended.`;
  }
  const shown = items.slice(0, 3);
  // When nothing reaches a pattern, still say what happened instead of claiming there was nothing.
  let empty = null;
  if (!shown.length && p.n){
    const parts = [];
    if (p.late) parts.push(`late on ${plural(p.late, 'day')}`);
    if (p.early + p.soft) parts.push(`left early on ${plural(p.early + p.soft, 'day')}`);
    if (p.drop) parts.push(`out of Zoom mid-class on ${plural(p.drop, 'day')}`);
    if (p.missed) parts.push(`missed instruction on ${plural(p.missed, 'day')}`);
    const count = p.late + p.early + p.soft + p.drop + p.missed;
    empty = count > 1 ? `${cap(listJoin(parts, 4))} out of ${plural(att.length, 'day')} attended, with no regular pattern.`
      : p.n < TREND_DAYS ? `Nothing else stands out yet (${plural(p.n, 'class day')}).` : 'No repeated lateness, leaving early or time out of Zoom.';
  }
  return { lead, items: shown, found: items, strength, empty, trendCaption };
}

// Weekly totals for the chart and the calendar rows. Upcoming days are left out, so this week is "so far".
function weekRows(dates, period, hasPlan = () => true){
  const map = new Map(), today = todayDk(), thisWeek = weekKey(today);
  // A week is complete when none of the student's scheduled days in it fall outside the period
  // (so a period ending on a Friday still counts its last week).
  const inside = wk => { for (let i = 0; i < 7; i++){ const dk = addDays(wk, i); if ((dk < period.from || dk > period.to) && hasPlan(dk)) return false; } return true; };
  for (const d of dates){
    const wk = weekKey(d.dk);
    if (!map.has(wk)) map.set(wk, { wk, received: 0, missed: 0, excFin: 0, notHeld: 0, noReport: 0, cameDays: 0, heldDays: 0,
      waiting: 0, iRec: 0, iReq: 0, absentDks: [], dates: [] });
    const w = map.get(wk); w.dates.push(d);
    if (d.status === 'held'){
      const s = d.rec;
      if (isExcused(s)){ w.excFin += s.reqMin; continue; }
      const fin = finMinOf(s);
      w.received += s.presentMin; w.missed += s.reqMin - s.presentMin - fin; w.excFin += fin;
      w.heldDays++; if (!s.isAbsent) w.cameDays++; else w.absentDks.push(d.dk);
      w.iRec += s.instrMin; w.iReq += s.instrReqMin;
    } else if (d.status === 'noclass') w.notHeld += d.plan.minutes;
    else if (d.status === 'missing') w.noReport += d.plan.minutes;
    else w.waiting++;
  }
  return [...map.values()].sort((a, b) => a.wk.localeCompare(b.wk)).map(w => ({ ...w,
    counted: w.received + w.missed,
    complete: !w.waiting && inside(w.wk),
    current: w.wk === thisWeek }));
}

// Whether a schedule version starting on `from` changed this student's days or times
// (the same weekday is compared the week before and the week of the change).
function planChanged(A, key, from){
  for (let i = 0; i < 7; i++) if (JSON.stringify(planFor(A, key, addDays(from, i - 7))) !== JSON.stringify(planFor(A, key, addDays(from, i)))) return true;
  return false;
}
// The student's weekly schedule as of the end of the period, e.g. "Mondays 2–4 PM (instruction 2–3, support hour 3–4)".
function scheduleInfo(A, key, period){
  // Every weekday is read from the one schedule in effect at the end of the period.
  const end = isDk(period.to) ? period.to : todayDk(), endW = parseDk(end).getDay(), byW = [];
  for (const w of [1, 2, 3, 4, 5, 6, 0]){
    const plan = planFor(A, key, addDays(end, -((endW - w + 7) % 7)), end);
    if (plan) byW.push({ w, plan });
  }
  const desc = plan => {
    const types = new Set(plan.secs.map(s => s.type));
    const span = shortRange(plan.startMin, plan.endMin);
    if (types.size === 2) return `${span} (${plan.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support hour'} ${shortRange(s.startMin, s.endMin).replace(/ [AP]M$/, '')}`).join(', ')})`;
    return `${span} (${types.has('instruction') ? 'instruction' : 'support hour'})`;
  };
  const groups = [];
  for (const x of byW){ const d = desc(x.plan), g = groups.find(y => y.d === d); if (g) g.ws.push(x.w); else groups.push({ d, ws: [x.w] }); }
  const line = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)} ${g.d}`).join(' · ');
  const weekMin = byW.reduce((t, x) => t + x.plan.minutes, 0);
  // Did this student's plan change inside the period? (The last change wins.)
  let changedOn = null;
  for (const v of A.versions) if (v.from && v.from > period.from && v.from <= period.to && planChanged(A, key, v.from)) changedOn = v.from;
  // The first schedule version with the student, and whether today's schedule has them.
  let firstFrom = null; const inLatest = A.schedFor(todayDk()).roster.some(r => r.key === key);
  for (const v of A.versions) if (v.sched.roster.some(r => r.key === key)){ firstFrom = v.from; break; }
  // Joining the schedule is reported on its own line, so it isn't also called a change.
  if (changedOn && changedOn === firstFrom) changedOn = null;
  return { byW, line, weekMin, changedOn, addedOn: firstFrom || null, inLatest };
}

/* ---------------- Students tab: the list ---------------- */
function meter(v, few){
  if (v === null) return '<span class="zero">—</span>';
  const low = !few && v < state.data.settings.concernRate;
  return `<span class="meter${few ? ' few' : low ? ' low' : ''}"><span class="track"><span class="fill" style="width:${v}%"></span></span><b>${v}%${few ? '<span class="sr"> so far</span>' : ''}</b></span>`;
}
const cnt = n => `<span class="${n ? '' : 'zero'}">${n}</span>`;
function cellKind(d){ return d.status === 'held' ? worstFlag(d.rec).k : d.status; }
function cellTitle(d){
  if (d.status === 'held') return `${shortDate(d.dk)}: ${d.rec.flags.map(f => f.label).join(', ')}`;
  if (d.status === 'noclass') return `${shortDate(d.dk)}: No class (${NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other'})`;
  if (d.status === 'missing') return `${shortDate(d.dk)}: No Zoom report`;
  return shortDate(d.dk);
}
const letterCell = (k, title) => `<span class="lc ${k === 'noclass' || k === 'missing' ? 'lc-' + k : 'k-' + k}" title="${esc(title)}" aria-hidden="true">${LETTER[k]}</span>`;
function lastTen(dates){
  const xs = dates.filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing').slice(-10);
  if (!xs.length) return '<span class="zero">—</span>';
  const counts = {}; for (const d of xs){ const k = cellKind(d); counts[k] = (counts[k] || 0) + 1; }
  const absentDks = xs.filter(d => cellKind(d) === 'absent').map(d => d.dk);
  const label = `Last ${plural(xs.length, 'class day')}: ` + LETTER_ORDER.filter(k => counts[k])
    .map(k => `${counts[k]} ${LETTER_TEAM[k]}${k === 'absent' ? ` (${listJoin(absentDks.map(monDay), 4)})` : ''}`).join(', ');
  return `<div class="last10" role="img" aria-label="${esc(label)}">${xs.map(d => letterCell(cellKind(d), cellTitle(d))).join('')}</div>`;
}
function letterLegend(kinds, words = LETTER_TEAM){
  const ks = LETTER_ORDER.filter(k => kinds.has(k) && words[k]);
  return ks.length ? `<div class="legend-line" aria-hidden="true">${ks.map(k => `<span>${letterCell(k, '')} ${esc(words[k])}</span>`).join('')}</div>` : '';
}
function studentList(A){
  const days = daysInRange(A.days), period = periodOf(A), q = normKey(state.query);
  const all = sortStudents(studentSummary(days));
  const list = all.filter(s => (!q || s.key.includes(q)) && (state.studentFilter === 'all' || s.concern));
  return { days, period, all, list };
}
function lastFollowUp(key){
  const xs = state.data.followUps[key] || [];
  return xs.length ? [...xs].sort((a, b) => b.date.localeCompare(a.date))[0] : null;
}
function printMenu(flagged, total){

    <button class="item" data-printlist>This list</button>

    <button class="item" data-printreports="all">A report for every student (${total})</button>

}
function includeBoxes(){

}

  h += missingNotice(A, period);
  if (!days.length){ el.innerHTML = h + `<div class="notice info">No Zoom reports fall in these dates. <button class="linkish" data-range="all">Show all dates</button></div>`; return; }
  const rates = all.filter(s => s.rate !== null), doses = all.filter(s => s.dose !== null);
