<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: this page may not load or send anything over the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervention attendance</title>
<style>
:root{
  --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
  --ink:#1C2433; --muted:#566074; --faint:#8790A0;
  --instr:#C9DAF8; --support:#FFF2CC; --bar:#24324D;
  --ok:#1D6F47; --ok-bg:#DFF1E7;
  --late:#8F4B00; --late-bg:#FBE8D2;
  --bad:#A8231A; --bad-bg:#FADFDB;
  --soft:#6E5800; --soft-bg:#FBF0BF;
  --drop:#57409A; --drop-bg:#E9E3F7;
  --fin:#11636C; --fin-bg:#D8EFF1;
  --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
  /* Where a scheduled minute went, for the student report's bars and strips (checked for color-blind separation). */
  --loss-before:#CB7E6B; --loss-out:#5346A7; --loss-after:#837120; --loss-absent:#8E3642;
  --instr-edge:#8FAEE6; --support-edge:#D9B44A;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121822; --surface:#19212E; --line:#2B3546; --grid:#222B39;
    --ink:#E5E9F1; --muted:#A4AEBF; --faint:#7A8597;
    --instr:#2C3D61; --support:#4A4123; --bar:#A9C2F5;
    --ok:#74D3A2; --ok-bg:#163428; --late:#F2B36B; --late-bg:#3D2A12;
    --bad:#F28B82; --bad-bg:#40201D; --soft:#E8D27A; --soft-bg:#3A3315;
    --drop:#C3B1F2; --drop-bg:#2C2445; --fin:#7FD3DB; --fin-bg:#14363A;
    --focus:#7FA8FF; --btn:#A9C2F5; --btn-ink:#121822;
    --loss-before:#A05B11; --loss-out:#6863B1; --loss-after:#A19500; --loss-absent:#D1717A;
    --instr-edge:#5577BB; --support-edge:#8C7A2E;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:18px 0 12px}
.brand h1{font-size:1.6rem;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.folder{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.folder .where{color:var(--muted);font-size:.88rem;margin-right:4px}
.folder .where b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:3px 9px;font-size:.8rem;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs button{flex:none}
nav.tabs button{background:none;border:0;padding:10px 0 11px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bar)}
.savebar{font-size:.84rem;color:var(--muted);margin-left:auto;align-self:center;display:flex;gap:8px;align-items:center}
.savebar.warn{color:var(--late)}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}

main.wrap{padding:22px 20px 60px}
.notice{border:1px solid var(--line);border-left:4px solid var(--late);background:var(--surface);padding:10px 14px;border-radius:6px;margin:0 0 14px;font-size:.92rem}
.notice.info{border-left-color:var(--bar)}
.notice ul{margin:6px 0 0;padding-left:20px}

/* Onboarding */
.start{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 28px;max-width:760px}
.start h2{font-size:1.45rem;margin-bottom:6px}
.start ol{padding-left:22px;margin:14px 0 18px}
.start li{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;min-width:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:10px;border-radius:2px}
.sw.i{background:var(--instr)} .sw.s{background:var(--support)} .sw.p{background:var(--bar);height:6px}

/* Day */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
details.day > summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
details.day > summary::-webkit-details-marker{display:none}
details.day > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);align-self:center;margin-right:2px;transition:transform .15s}
details.day[open] > summary::before{transform:rotate(45deg)}
.day h2{font-size:1.35rem}
.day .sub{color:var(--muted);font-size:.88rem}
.counts{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:20px}
.count{font-size:.8rem;font-weight:600;border-radius:999px;padding:2px 10px}
.day-body{padding:0 20px 18px}

/* Status colors */
.k-full{background:var(--ok-bg);color:var(--ok)}
.s-in{background:var(--bar)} .s-before{background:var(--loss-before)} .s-out{background:var(--loss-out)}
.s-after{background:var(--loss-after)} .s-absent{background:var(--loss-absent)} .s-none{background:var(--line)}
.k-fin{background:var(--fin-bg);color:var(--fin)}
.k-late{background:var(--late-bg);color:var(--late)}
.k-missed,.k-early{background:var(--bad-bg);color:var(--bad)}
.k-soft{background:var(--soft-bg);color:var(--soft)}
.k-drop{background:var(--drop-bg);color:var(--drop)}
.k-absent{background:var(--bad);color:var(--surface)}
.k-extra{background:var(--grid);color:var(--muted)}
.k-exc{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* Date range + day actions */
.range{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.range label{font-size:.86rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.range input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:.86rem}
.daybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.daybar .rate{font-size:.86rem;color:var(--muted);margin-right:auto}
.note-txt{display:block;font-size:.8rem;color:var(--ink);font-style:italic;line-height:1.35;margin-top:2px}
input.note{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px;font-size:.82rem;width:100%;margin-top:4px}

/* Students tab */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.tile .n{font-size:1.6rem;font-weight:600;line-height:1.15;font-variant-numeric:proportional-nums}
.tile .l{font-size:.82rem;color:var(--muted)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.sum{width:100%;border-collapse:collapse;font-size:.88rem}
table.sum th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.sum .num{text-align:right;white-space:nowrap}
table.sum .zero{color:var(--faint)}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .track{flex:1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:50px}
.meter .fill{display:block;height:100%;background:var(--bar)}
.meter b{font-weight:600;min-width:38px;text-align:right}
.hist{width:100%;border-collapse:collapse;font-size:.84rem}
.hist td,.hist th{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
.hist th{font-size:.74rem;color:var(--muted);font-weight:600}

/* Table */
.grid-head,.row{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:0 14px;align-items:center}
.grid-head{font-size:.78rem;color:var(--muted);padding:6px 0 6px;border-bottom:1px solid var(--line);font-weight:600}
.row{padding:8px 0;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.who b{font-weight:600}
.who .meta{display:block;font-size:.78rem;color:var(--muted);line-height:1.35}
.time{font-size:.86rem}
.time.none{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:.78rem;font-weight:600;border-radius:5px;padding:2px 8px;white-space:nowrap}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:.78rem}
.linkish:hover{color:var(--ink)}

/* Timeline: the class block drawn like a strip of graph paper */
.axis{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:.74rem;color:var(--muted);white-space:nowrap}
.tl{position:relative;height:22px;border-radius:4px;background:var(--paper);border:1px solid var(--grid);overflow:hidden}
.tl .band{position:absolute;top:0;bottom:0}
.tl .band.instruction{background:var(--instr)}
.tl .band.support{background:var(--support)}
.tl .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.9}
.tl .tick.half{opacity:.45}
.tl .bar{position:absolute;top:7px;height:8px;border-radius:2px;background:var(--bar)}

.subhead{font-family:var(--serif);font-size:1.05rem;margin:20px 0 6px}
.mini{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(240px,2.6fr) 74px 74px minmax(190px,1.45fr);gap:6px 14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.mini:last-child{border-bottom:0}
.mini > :nth-child(3){grid-column:3 / -1}
.mini .act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:210px;font-size:.84rem}
.files{font-size:.8rem;color:var(--faint);margin-top:12px}

/* Schedule tab */
.two{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.2fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel h2{font-size:1.2rem;margin-bottom:6px}
textarea{width:100%;min-height:340px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:10px;font-size:.85rem;line-height:1.4;resize:vertical}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:10px}
.dcol h3{font-size:1.02rem;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:8px}
.sec{border-radius:6px;padding:7px 9px;margin-bottom:8px;font-size:.84rem}
.sec.instruction{background:var(--instr)} .sec.support{background:var(--support)}
.sec b{display:block;font-weight:600}
.sec details summary{cursor:pointer;color:var(--muted);font-size:.8rem}
.sec ul{margin:4px 0 0;padding-left:16px}
.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* Settings */
.set{display:grid;grid-template-columns:auto 80px;gap:10px 14px;align-items:center;max-width:560px}
.set input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:80px}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid);font-size:.9rem}
.list li span{flex:1}
.stack > * + *{margin-top:18px}

/* Shared bits for student reports */
.name-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink);font-size:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name-btn:hover{text-decoration-color:var(--ink)}
.lc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:.7rem;font-weight:700;line-height:1;flex:none}
.lc-noclass{color:var(--muted);border:1px dashed var(--line)}
.lc-missing{color:var(--late);border:1px dashed var(--late)}
.last10{display:flex;gap:3px;flex-wrap:wrap}
.legend-line{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 8px}
.legend-line > span{display:inline-flex;gap:5px;align-items:center}
.nclist{list-style:none;margin:6px 0 0;padding:0}
.nclist li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 0}
.nclist li > span:first-child{min-width:8.5em}
.nclist select,.rsec select,.rsec input[type=date],.rsec input[type=text],.sched-step input[type=date]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 7px;font-size:.86rem}
.noclasscard{border:1px dashed var(--line);border-radius:10px;padding:12px 20px;margin-bottom:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.noclasscard b{color:var(--ink);font-family:var(--serif);font-size:1.1rem}
.backbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
.hl{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
.row.hl{background:var(--grid)}
.row.slim{grid-template-columns:minmax(170px,1.25fr) 1fr}
.tile .s{font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:2px}
.listinfo{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.cardcounts{display:none}
.sortby{font-size:.86rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sortby select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:.86rem}

.dropnote{margin:2px 0 6px;font-size:.88rem;color:var(--late);font-weight:600}
.dropnote .linkish{font-weight:400}
.dropbtn{font-size:.8rem;margin:0 0 4px}
.dropform{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 8px;font-size:.88rem}
.dropform input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 7px}
.ovdrop{display:block;font-size:.66rem;font-weight:500;color:var(--late)}
/* Overview grid: the teacher's spreadsheet colors */
:root{ --ov-engaged:#93C47D; --ov-excused:#6D9EEB; --ov-idle:#FFD966; --ov-camera:#F6B26B; --ov-away:#C27BA0; --ov-absent:#E06666; --ov-nosched:#E3E5E8; --ov-ink:#1C2433 }
@media (prefers-color-scheme: dark){ :root{ --ov-engaged:#5E8F4B; --ov-excused:#4C78C4; --ov-idle:#C2A23A; --ov-camera:#C27E3C; --ov-away:#97577A; --ov-absent:#B44A4A; --ov-nosched:#262F3D; --ov-ink:#10151E } }
.c-engaged{background:var(--ov-engaged)} .c-excused{background:var(--ov-excused)} .c-idle{background:var(--ov-idle)} .c-camera{background:var(--ov-camera)}
.c-away{background:var(--ov-away)} .c-absent{background:var(--ov-absent)} .c-nosched{background:var(--ov-nosched)}
.c-noclass{background:var(--surface);color:var(--muted)} .c-missing{background:var(--surface);color:var(--late)} .c-later{background:var(--surface)}
.ovlegend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--muted);margin:0 0 6px}
.ovlegend > span{display:inline-flex;align-items:center;gap:6px}
.ovlegend b{color:var(--ink)}
.ovsw{display:inline-flex;align-items:center;justify-content:center;width:16px;height:12px;border-radius:2px;font-style:normal;font-size:.7rem;border:1px solid var(--line)}
.ovsw.ovnote-k{background:linear-gradient(225deg,var(--ink) 0 4px,var(--surface) 4px)}
.ovwrap{position:relative;margin-top:8px}
.ovblock{position:relative;width:fit-content;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
table.ovt{border-collapse:separate;border-spacing:0;font-size:.78rem}
.ovt th,.ovt td{padding:0;border-right:1px solid var(--surface);border-bottom:1px solid var(--surface)}
.ovt thead th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--muted);font-weight:600;text-align:center;white-space:nowrap;padding:2px 3px;font-size:.72rem}
.ovt thead tr:nth-child(2) th{top:22px}
.ovt th.ovmo{text-align:left;color:var(--ink);padding-left:6px;height:22px}
.ovt th.today{color:var(--focus)}
.ovwd{display:block;font-weight:400;font-size:.66rem}
.ovt .wk{border-left:2px solid var(--muted)}
.ovt th.ovname{position:sticky;left:0;z-index:3;background:var(--surface);text-align:left;padding:0 10px 0 8px;min-width:170px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink);border-right:1px solid var(--line)}
.ovt thead th.ovcorner{z-index:4;vertical-align:bottom;padding-bottom:4px}
.ovt tbody tr:hover th.ovname{background:var(--paper)}
.ovc{width:38px;min-width:38px;height:24px}
.ovb{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;gap:2px;width:100%;height:24px;cursor:pointer;color:var(--ov-ink);font-size:.68rem;font-weight:700;letter-spacing:.04em}
.ovb:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.ovb:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ovc.sel .ovb{outline:3px solid var(--focus);outline-offset:-3px}
.c-noclass .ovb,.c-missing .ovb,.c-later .ovb{color:inherit}
.ovm{font-size:.72rem;color:var(--ov-ink)}
.ovlegend .ovm{color:var(--ink)}
.ovn{position:absolute;top:0;right:0;width:0;height:0;border-top:6px solid var(--ov-ink);border-left:6px solid transparent}
.ovmarkbar{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:.88rem}
.ovbrushes{display:flex;flex-wrap:wrap;gap:4px}
.ovwrap.marking .ovb{cursor:copy}
.ovwrap.marking .ovb:hover{box-shadow:inset 0 0 0 2px var(--focus)}
.ovpop{position:absolute;z-index:10;width:340px;max-height:calc(100vh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:.86rem}
.ovpop p{margin:6px 0 8px}
.ovpop-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.ovx{margin-left:auto}
.ovgrp{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.ovgrp > span{width:100%}
.ovchip,.ovlet{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 8px;font-size:.78rem;cursor:pointer;color:var(--ink)}
.ovchip[aria-pressed="true"],.ovlet[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.ovmsg{display:flex;align-items:center;gap:8px;margin:8px 0}
.ovnoteb{display:grid;gap:2px;margin:6px 0}
.ovnoteb input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;font-size:.86rem}
.ovpop-f{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
.ovlink{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
@media print{
  .ovblock{border:0;break-inside:avoid}
  .ovt thead th,.ovt th.ovname{position:static}
  .ovpop,#tab-overview .toolbar{display:none !important}
  .ovc,.ovsw{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ovc{width:24px;min-width:24px}
  table.ovt{font-size:.62rem}
}

/* Support hour tab */
.sup{max-width:560px}
.sup-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:4px 0 12px}
.sup-head h2{font-size:1.4rem}
.sup-head h2:focus{outline:none}
.sup .search{width:100%;max-width:none;font-size:1rem;padding:9px 12px}
.sup-h{font-size:1.05rem;margin:18px 0 6px}
.sup-list{list-style:none;margin:0;padding:0}
.sup-list li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:9px 2px;border-bottom:1px solid var(--grid)}
.sup-list li > b{min-width:9em}
.sup-when{color:var(--ink)}
.sup-found li{align-items:baseline}
.sup-no{color:var(--muted)}
.sup-days{display:flex;flex-wrap:wrap;gap:4px 12px;width:100%;font-size:.8rem;color:var(--muted)}
.sdc{display:inline-flex;align-items:center;gap:4px}
.sup-unm{margin-top:18px}
.sup-unm > summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.btn[data-supmark]{min-width:10.5em}
.sup-cols li{display:grid;grid-template-columns:10em minmax(0,1fr);align-items:center}
.sup-cols .sup-item{display:flex;justify-content:space-between;margin:2px 0}
.sup-item{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-right:18px}
.sup-yes,.sup-soft,.sup-no{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%}
.sup-yes{font-weight:600}
.sup-yes .sup-item,.sup-soft .sup-item{font-weight:400}
.sup-no{color:var(--muted)}
.sup-found + .legend-line{margin-top:10px}

/* Small dropdown menus (Print…) */
.menu{position:relative;display:inline-block}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column;gap:2px}
.menu .item{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.menu .item:hover,.menu .item:focus-visible{background:var(--paper)}
.menu .inc{border-top:1px solid var(--grid);margin-top:4px;padding:8px 10px 4px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.inc label{display:inline-flex;gap:6px;align-items:center}

/* Student report */
.sreport{max-width:920px}
.rbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rbar .r1{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rbar .pn{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted);min-width:0}
.rbar .pn button{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .r2{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.rhead,.rsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 22px;margin-bottom:14px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rhead h2{font-size:1.75rem;margin:2px 0 6px}
.rhead h2:focus{outline:none}
.rhead p{margin:2px 0;font-size:.9rem}
.rsec h3{font-size:1.12rem;margin-bottom:8px}
.rsec h3 .small{font-family:var(--sans);font-weight:400}
.mblock{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--grid)}
.mfig{display:flex;flex-wrap:wrap;gap:6px 40px;margin:0}
.mfig dt{font-size:.78rem;color:var(--muted)}
.mfig dd{margin:0;font-size:1.55rem;font-weight:600;line-height:1.2;font-variant-numeric:proportional-nums}
.mfig dd span{font-size:.9rem;font-weight:400;color:var(--muted)}
.mbars{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;align-items:center;margin:12px 0 10px}
.mbars .lab{font-size:.82rem;white-space:nowrap}
.mbars .lab b{font-weight:600}
.mbars .lab span{color:var(--muted)}
.mbar{display:flex;gap:2px;height:14px}
.mbar i{display:block;min-width:2px}
.mbar i:last-child{border-radius:0 4px 4px 0}
.mkey{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 20px;font-size:.82rem}
.mkey li{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px 6px}
.mkey b{font-weight:600}
.ksw{display:inline-block;width:12px;height:12px;border-radius:2px}
.mkey .v{color:var(--muted)}
.mkey li.zero,.mkey li.zero .v{color:var(--faint)}
.mkey li.zero .ksw{opacity:.5}
.mkey .lc,.mnot .lc{width:16px;height:16px;font-size:.64rem}
.mkey .kd .lc{margin-right:4px}
.mnot{font-size:.8rem;color:var(--muted);margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.wsched{margin:14px 0 0;max-width:640px}
.ws-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.ws-head b{color:var(--ink);font-weight:600;font-size:.9rem}
.ws-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) 3.9em;gap:8px;align-items:center;margin-top:4px}
.ws-axis{margin-top:0}
.ws-axis .ws-track{height:16px;background:none}
.ws-axis .ws-track > span{position:absolute;top:0;transform:translateX(-50%);font-size:.72rem;color:var(--muted);white-space:nowrap}
.ws-day{font-size:.8rem;font-weight:600;color:var(--muted)}
.ws-min{font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap}
.ws-track{position:relative;height:28px;border-radius:4px;background:var(--paper)}
.ws-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.ws-blk{position:absolute;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.ws-blk.instruction,.ws-sw.instruction{background:var(--instr)}
.ws-blk.support,.ws-sw.support{background:var(--support)}
.ws-key{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:6px 0 0 calc(2.4em + 8px)}
.ws-key > span{display:inline-flex;align-items:center;gap:6px}
.ws-sw{display:inline-block;width:14px;height:12px;border-radius:3px}
.ws-sw.instruction{box-shadow:inset 0 0 0 1px var(--instr-edge)}
.ws-sw.support{box-shadow:inset 0 0 0 1px var(--support-edge)}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.rtiles .tile{padding:10px 14px}

.caption{font-size:.84rem;color:var(--muted);margin:4px 0 0}
/* Calendar: weeks down, weekdays across */
.calwrap{max-width:760px}
table.cal{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
table.cal th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:center;padding:2px}
table.cal th.wk{width:4.6em;text-align:left}
table.cal td{height:50px;border-radius:6px;text-align:center;vertical-align:middle;position:relative;padding:0;font-size:.95rem;font-weight:700}
.cal .dn{position:absolute;top:3px;left:5px;font-size:.64rem;font-weight:500}
.cal .mn{display:block;font-size:.68rem;font-weight:500;margin-top:1px}
.cal td.c-noclass{border:1px dashed var(--line);color:var(--muted)}
.cal td.c-missing{border:1px dashed var(--late);color:var(--late)}
.cal td.c-off{color:var(--faint)}
.cal td.c-pending{border:1px solid var(--grid);color:var(--faint)}
.daydetail{border:1px solid var(--line);border-left:4px solid var(--focus);border-radius:8px;padding:12px 14px;background:var(--surface)}
.dd-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.dd-links{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.dd-nav{display:grid;grid-template-columns:7.4em 7.4em;gap:6px;margin-left:6px}
.dd-nav > :first-child{text-align:right}
.dd-nav > :last-child{text-align:left}
.dd-min{margin:6px 0 2px}

/* Class-strip calendar (student report) */
table.scal{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0 2px;font-size:.8rem;--gut:16px}
table.scal.g2on{--gut:34px}
.scal col.c-lab{width:7%}
.scal col.c-wd{width:var(--wa)}
.scal col.c-wk{width:24%}
.scal th,.scal td{padding:0 2px}
.scal thead th{font-size:.76rem;color:var(--muted);font-weight:600;text-align:left;vertical-align:bottom;padding-bottom:2px}
.scal th.lab{font-size:.72rem;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap}
.colaxis{margin:3px 11px 0 calc(var(--gut) + 5px)}
.colaxis.wkax{margin:3px calc(6.4 * .72rem + 4px) 0 14px}
.rib{position:relative;height:5px;border-radius:2px}
.rib span{position:absolute;top:0;bottom:0}
.rib .instruction{background:var(--instr);box-shadow:inset 0 0 0 1px var(--instr-edge)}
.rib .support{background:var(--support);box-shadow:inset 0 0 0 1px var(--support-edge)}
.ticks{position:relative;height:13px;font-size:.66rem;font-weight:400;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ticks .s{left:0;transform:none}
.ticks .e{right:0;transform:none}
.scal tbody td{height:24px}
.scal.roomy tbody td{height:34px}
.sbtn,.scell{box-sizing:border-box;display:grid;grid-template-columns:var(--gut) minmax(0,1fr) 6px;column-gap:3px;align-items:center;width:100%;height:24px;padding:0 2px;border-radius:4px}
.sbtn{cursor:pointer;background:none;border:0;margin:0;font:inherit;color:inherit;text-align:left}
.scal.roomy .sbtn,.scal.roomy .scell{height:34px}
.sbtn:hover{background:var(--paper)}
.sbtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.sbtn[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:1px;background:var(--paper)}
.gut{display:flex;gap:2px}
.g{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;font-size:.6rem;font-weight:700;line-height:1;flex:none}
.g.lc-noclass{color:var(--muted);border:1px dashed var(--line)}
.g.lc-missing{color:var(--late);border:1px dashed var(--late)}
.ds{position:relative;display:block;height:10px}
.scal.roomy .ds{height:14px}
.ds .tk{position:absolute;top:0;bottom:0;background:var(--line);border-radius:2px;overflow:hidden}
.ds .tk.pend{opacity:.45}
.ds .tk i{position:absolute;top:0;bottom:0}
.ds .tk .bd{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.nd{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);justify-self:center}
.fuk{font-size:.7rem}
.scal tr.mo > *{border-top:1px solid var(--line)}
.scal tr.chg td{height:auto;padding:6px 2px 1px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--line)}
.scal tfoot th,.scal tfoot td{font-size:.72rem;font-weight:500;color:var(--muted);height:auto;text-align:center;line-height:1.3;padding-top:4px}
.scal tfoot th{text-align:left}
.scal tr.ddrow td{height:auto;padding:4px 2px 10px}
.wb{display:grid;grid-template-columns:10px minmax(0,1fr) 6.4em;column-gap:4px;align-items:center;font-size:.72rem;color:var(--muted)}
.wb .fu{font-size:.6rem;color:var(--ink);line-height:1}
.wb .wt{display:block}
.wb .tr{position:relative;display:block;height:8px;background:var(--line);border-radius:0 4px 4px 0}
.wb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.wb b{font-weight:500;color:var(--ink);white-space:nowrap}
.ddpic{position:relative;margin:4px 0 2px}
.ddpic .ribl{position:relative;height:16px;font-size:.74rem;color:var(--muted)}
.ddpic .ribl span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ddpic .rib{height:6px;margin-bottom:3px}
.ddpic .ds{height:18px}
.ddpic .ev{position:relative;height:20px}
.ddpic .ev span{position:absolute;top:4px;white-space:nowrap;font-size:.74rem}
.ddpic .ev .a-center{transform:translateX(-50%)}
.ddpic .ev .a-end{transform:translateX(-100%)}
.cal-cap{margin:0 0 6px}
.cal-cap + .legend-line{margin:0 0 8px}
details.daytable{margin-top:10px}
details.daytable > summary{cursor:pointer;font-size:.86rem;color:var(--muted)}
details.daytable .hist{margin-top:8px}
table.cal tfoot th,table.cal tfoot td{font-size:.72rem;font-weight:500;height:auto;color:var(--muted);text-align:center;padding:1px 2px;line-height:1.3}
table.cal tfoot th{text-align:left;white-space:normal;line-height:1.15}

/* Follow-ups, family note */
.fu{list-style:none;margin:0;padding:0}
.fu li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:.9rem}
.fu .when{color:var(--muted);min-width:4.5em}
.fu .txt{flex:1;min-width:12em}
.fuform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.fuform input[type=text]{flex:1;min-width:200px}
textarea.family{min-height:240px;font-size:.92rem;line-height:1.5}
.ruled{border-bottom:1px solid #999;height:26px}
.notetext{white-space:pre-wrap;font-size:1rem;line-height:1.55;margin-top:14px}
.sched-step{border:1px solid var(--line);border-left:4px solid var(--bar);border-radius:6px;padding:10px 14px;margin-top:12px;font-size:.9rem;background:var(--paper)}
.sched-step label{display:block;margin:6px 0}
.hist-list{margin:10px 0 0;padding:0;list-style:none;font-size:.86rem}
.hist-list li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--grid)}
.hist-list li span{flex:1}
.settext{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 14px;align-items:center;max-width:620px}
.settext input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:100%}
.printonly{display:none}
#printArea{display:none}

@media (max-width: 820px){
  .grid-head{display:none}
  .row{grid-template-columns:1fr auto auto;gap:6px 12px;padding:12px 0}
  .row .who{grid-column:1 / -1}
  .row .tlc{grid-column:1 / -1}
  .row .time::before{content:attr(data-label) " ";color:var(--muted);font-size:.78rem}
  .row .chips{grid-column:1 / -1}
  .mini{grid-template-columns:1fr}
  .mini > :nth-child(3){grid-column:auto}
  .two{grid-template-columns:1fr}
  .legend{margin-left:0}
  .counts{padding-left:0}
  .search{min-width:0;flex:1}
}
/* Phone layout for the new pieces. Screen only, so printed pages keep the desktop layout. */
@media screen and (max-width: 820px){
  .tablewrap{overflow:visible;background:none;border:0}
  table.sum,table.sum tbody{display:block}
  table.sum thead{display:none}
  table.sum tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
  table.sum td{padding:0;border:0}
  table.sum td.c-name,table.sum td.c-last{grid-column:1 / -1}
  table.sum td.num{display:none}
  table.sum td[data-label]::before{content:attr(data-label);display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:2px}
  table.sum .meter{min-width:0}
  .cardcounts{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}
  .rbar .pn{margin-left:0;width:100%}
  .rhead,.rsec{padding:14px}
  .rhead h2{font-size:1.45rem}
  .rtiles,.tiles{grid-template-columns:1fr 1fr}
  .menu .pop{position:static;margin-top:6px;min-width:0}
  table.cal{border-spacing:3px}
  table.cal th.wk{width:4.2em}
  /* Narrow cells: the date sits above the letter instead of beside it. */
  table.cal tbody td{height:58px;padding-top:12px}
  .cal .dn{top:2px;left:3px}
  .row.slim{grid-template-columns:1fr}
  .settext{grid-template-columns:1fr}
  .dd-links{margin-left:0}
  .nclist li > span:first-child{min-width:0}
}
@media screen and (max-width: 560px){
  nav.tabs{gap:14px}
  nav.tabs button{font-size:.88rem}
  .tabx{display:none}
  .mbars{grid-template-columns:1fr;gap:2px}
  .mbars .lab{margin-top:6px}
  .mkey{flex-direction:column;gap:6px}
  .mkey li{flex-wrap:nowrap;align-items:flex-start}
  .mkey .ksw{margin-top:3px;flex:none}
  .mkey .kd{display:block;margin-top:2px}
  .mkey .kd .sep{display:none}
  .mfig{gap:6px 24px}
  .scal col.c-lab{width:14%}
  .scal col.c-wd{width:var(--wb)}
  .scal col.c-wk{width:22%}
  .scal.wd3{--gut:16px}
  .scal.wd3 .g2{display:none}
  .ticks .mid{display:none}
  .scal.wd3 .ticks,.wkax{display:none}
  .colaxis{margin-right:4px}
  .scal.wd3 .wb{grid-template-columns:10px minmax(0,1fr) 0}
  .scal.wd3 .wb b{display:none}
  .scal.wd4 col.c-wk{width:0}
  .scal.wd4 .swk{display:none}
}
@media print{
  :root{
    --paper:#F7F9FC; --surface:#FFFFFF; --line:#DDE3EC; --grid:#E9EDF3;
    --ink:#1C2433; --muted:#566074; --faint:#8790A0;
    --instr:#C9DAF8; --support:#FFF2CC; --bar:#24324D;
    --ok:#1D6F47; --ok-bg:#DFF1E7; --late:#8F4B00; --late-bg:#FBE8D2;
    --bad:#A8231A; --bad-bg:#FADFDB; --soft:#6E5800; --soft-bg:#FBF0BF;
    --drop:#57409A; --drop-bg:#E9E3F7; --fin:#11636C; --fin-bg:#D8EFF1;
    --focus:#2F6FEB; --btn:#24324D; --btn-ink:#FFFFFF;
    --loss-before:#CB7E6B; --loss-out:#5346A7; --loss-after:#837120; --loss-absent:#8E3642;
    --instr-edge:#8FAEE6; --support-edge:#D9B44A;
  }
  @page{margin:.5in}
  body{background:#fff}
  header.top nav, .folder, .toolbar, .savebar, .linkish, .mini .act, .notice, .daybar button, .noprint, .rbar, .backbar, #status{display:none !important}
  .printonly{display:block}
  span.printonly{display:inline}
  .tablewrap{overflow:visible;border:0}
  details.day{break-inside:avoid-page;border-color:#bbb}
  .lc, .chip, .count, .tl, .tl *, .cal td, .tile, .meter .track, .meter .fill, .ws-track, .ws-blk, .ws-sw, .mbar i, .ksw, .scal .tk, .scal .tk *, .rib span, .g, .nd, .wb .tr, .wb .tr i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-reports header.top, body.print-reports main{display:none !important}
  body.print-reports #printArea{display:block}
  .sreport{max-width:none}
  .sreport + .sreport{break-before:page}
  .rtiles, .mblock, .wsched, .calwrap, .hist tr, .fu li, .scal tr{break-inside:avoid}
  .scal tbody td{height:18px}
  .scell{height:18px}
  .ds{height:9px}
  .scal.dprint tbody td,.scal.dprint .scell{height:12px}
  .scal.dprint .ds{height:7px}
  .scal.dprint{--gut:11px}
  .scal.dprint .g{width:11px;height:11px;font-size:.5rem}
  .mfig dd{font-size:1.25rem}
  .s-before{background:repeating-linear-gradient(45deg,var(--loss-before) 0 1.5px,#fff 1.5px 3.5px)}
  .s-out{background:repeating-linear-gradient(90deg,var(--loss-out) 0 1.5px,#fff 1.5px 3.5px)}
  .s-after{background:repeating-linear-gradient(135deg,var(--loss-after) 0 1.5px,#fff 1.5px 3.5px)}
  .s-absent{background:repeating-linear-gradient(45deg,var(--loss-absent) 0 1.2px,transparent 1.2px 3.5px),repeating-linear-gradient(135deg,var(--loss-absent) 0 1.2px,#fff 1.2px 3.5px)}

<script>

/* ------------------------------------------------------------------

const DATA_FILE = 'attendance-tracker-data.json';

];
const LETTER = { full:'✓', fin:'F', late:'L', missed:'M', early:'E', soft:'S', drop:'O', absent:'A', exc:'X', noclass:'–', missing:'?', off:'·' };
const LETTER_TEAM = { full:'whole class', fin:'finished work early', late:'late', missed:'missed instruction', early:'left early',
  soft:'left support hour early', drop:'out of Zoom mid-class', absent:'absent', exc:'excused', noclass:'no class', missing:'no Zoom report', off:'not on the schedule' };

  soft:'left help time early', drop:'out of Zoom for part of class', absent:'missed', exc:'excused', noclass:'no class', missing:'no record', off:'' };
const LETTER_ORDER = ['full','fin','late','missed','early','soft','drop','absent','exc','noclass','missing'];
const NOCLASS_REASONS = { holiday:'School holiday', testing:'Testing', canceled:'Class canceled', other:'Other' };
// The Overview grid's colors and letters, in the teacher's own words.
const OV_CAT = { engaged: 'Present and engaged', excused: 'Excusable absence', idle: 'Likely present but not engaging', camera: 'Camera off',
  away: 'Likely not actually present', absent: 'Did not attend', nosched: 'Not scheduled' };

const $ = (s, el = document) => el.querySelector(s);

const dkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const todayDk = () => dkOf(new Date());
const parseDk = dk => { const [y, m, d] = String(dk).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dk, n) => { const d = parseDk(dk); d.setDate(d.getDate() + n); return dkOf(d); };
const weekKey = dk => { const d = parseDk(dk); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkOf(d); };
const asDate = d => typeof d === 'string' ? parseDk(d) : d;
const shortDate = d => dtf({ weekday: 'short', month: 'short', day: 'numeric' }).format(asDate(d));
const monDay = d => dtf({ month: 'short', day: 'numeric' }).format(asDate(d));
const longDate = d => dtf({ weekday: 'long', month: 'long', day: 'numeric' }).format(asDate(d));
const monthDay = d => dtf({ month: 'long', day: 'numeric' }).format(asDate(d));
const isDk = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDk(v));
const wdPlural = w => cap(DAYS[w]) + 's';
const byWeekOrder = (a, b) => ((a + 6) % 7) - ((b + 6) % 7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// First name for the family note. Handles "Diaz, Ana" and stray leading symbols like "=Dee Evil".
function firstName(name){
  const s = String(name).replace(/^[^\p{L}]+/u, ''), m = s.match(/^([^,]+),\s*([^\s,]+)/);

}
function listJoin(items, max = 4){

  if (more > 0) return `${xs.join(', ')} and ${more} more`;
  return xs.length < 2 ? (xs[0] || '') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
}
const ofN = (x, n, w, ws) => `${x} of ${plural(n, w, ws)}`;
function fmtPeriod(p){
  const a = parseDk(p.from), b = parseDk(p.to), o = { weekday: 'short', month: 'short', day: 'numeric' };
  if (a.getFullYear() !== b.getFullYear()) return `${dtf({ ...o, year: 'numeric' }).format(a)} – ${dtf({ ...o, year: 'numeric' }).format(b)}`;
  return `${dtf(o).format(a)} – ${dtf(o).format(b)}, ${b.getFullYear()}`;
}

function defaultData(){
  return { version: 3, scheduleText: '', scheduleVersions: [{ from: '', text: '' }],
    settings: { lateGrace: 5, leaveGrace: 5, gapMin: 5, sectionLen: 60, engagedPct: 50,
                teacherName: '', className: 'our intervention class', contactLine: '' },
    aliases: {}, ignored: [], excused: {}, excusedAbsent: {}, notes: {},
    noClass: {},     // { 'YYYY-MM-DD': { reason } }
    dayStatus: {},   // { 'YYYY-MM-DD|studentKey': { cat, L, D, C } } choices made on the Overview grid
    drops: {},       // { studentKey: { date } } dropped from the class starting that date
    followUps: {} }; // { studentKey: [{ id, date, how, text, day }] } (day: the class day a message was about)
}
const NUM_SETTINGS = { lateGrace: [0, 60], leaveGrace: [0, 60], gapMin: [1, 60], sectionLen: [15, 180], engagedPct: [1, 100] };
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
// Everything read from the data file is checked here, so a damaged or hand-edited file can't break the page.
function withDefaults(d){

    aliases: {}, ignored: Array.isArray(d.ignored) ? d.ignored.filter(x => typeof x === 'string') : [],
    excused: { ...obj(d.excused) }, excusedAbsent: { ...obj(d.excusedAbsent) }, notes: {}, noClass: {}, dayStatus: {}, drops: {}, followUps: {} };
  for (const [k, [lo, hi]] of Object.entries(NUM_SETTINGS)){ const v = Number(set[k]); if (set[k] !== '' && Number.isFinite(v)) out.settings[k] = Math.min(hi, Math.max(lo, Math.round(v))); }
  for (const k of ['teacherName', 'className', 'contactLine']) if (typeof set[k] === 'string') out.settings[k] = set[k].slice(0, 120);
  for (const [k, v] of Object.entries(obj(d.aliases))) if (typeof v === 'string') out.aliases[k] = v;
  for (const [k, v] of Object.entries(obj(d.notes))) if (typeof v === 'string') out.notes[k] = v;
  for (const [k, v] of Object.entries(obj(d.noClass))) if (isDk(k)) out.noClass[k] = { reason: obj(v).reason in NOCLASS_REASONS ? obj(v).reason : 'other' };
  for (const [k, v] of Object.entries(obj(d.drops))) if (isDk(obj(v).date)) out.drops[k] = { date: v.date };
  for (const [k, v] of Object.entries(obj(d.dayStatus))){
    const o = {}, x = obj(v);
    if (x.cat in OV_CAT) o.cat = x.cat;
    for (const l of ['L', 'D', 'C']) if (typeof x[l] === 'boolean') o[l] = x[l];
    if (isDk(k.split('|')[0]) && Object.keys(o).length) out.dayStatus[k] = o;
  }
  for (const [k, v] of Object.entries(obj(d.followUps))) if (Array.isArray(v)){
    const xs = v.filter(f => f && isDk(f.date)).map(f => ({ id: String(f.id || uid()), date: f.date, how: f.how in FU_HOW ? f.how : 'other', text: String(f.text || '').slice(0, 300), ...(isDk(f.day) ? { day: f.day } : {}) }));
    if (xs.length) out.followUps[k] = xs;
  }

  if (typeof d.scheduleText === 'string' && vs[vs.length - 1].text !== d.scheduleText) vs[vs.length - 1].text = d.scheduleText;

}

const state = {
  data: defaultData(), files: [], dirHandle: null, savedHandle: null, canWrite: false,
  folderName: '', loaded: false, dirty: false, saving: false,
  tab: 'overview', query: '', draft: null, openDays: new Set(), autoOpened: false, status: null,
  range: { preset: 'all', from: '', to: '' }, noteEdit: null,
  sort: 'name', student: null, studentFrom: null, returnTo: null, highlight: null,
  include: { table: true, log: true, notes: false }, familyDraft: {}, fuEdit: null, fuPrefill: null,
  selDay: null, dayTableOpen: false, supQuery: '', supUnmOpen: false, ovSel: null, ovMark: null, ovMarkN: 0, dropEdit: null, showDropped: false, schedChange: null, viewVersion: null, lastAnalysis: null
};

/* ---------------- Text helpers ---------------- */
function normKey(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[.'’`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function looksAlike(a, b){
  if (Math.abs(a.length - b.length) > 2) return false;
  const d = lev(a, b), ta = a.split(' '), tb = b.split(' ');
  return d === 1 || (d === 2 && (ta[0] === tb[0] || ta[ta.length - 1] === tb[tb.length - 1]));
}
/* ---------------- Schedule (pasted from the spreadsheet) ---------------- */
function toMin(h, mi, ap){
  if (ap === 'p' && h < 12) h += 12;
  else if (ap === 'a' && h === 12) h = 0;
  else if (!ap && h >= 1 && h <= 6) h += 12;   // school-day guess: "2" means 2 PM
  return h * 60 + mi;
}
function parseSectionHeader(cell){
  const low = cell.toLowerCase();
  let type = null;
  if (/instruct|lesson|teach/.test(low)) type = 'instruction';
  else if (/support|help|tutor|work time|office hour/.test(low)) type = 'support';
  if (!type) return null;
  const m = cell.match(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?:\s*(?:-|–|—|to)\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?)?/i);
  if (!m) return null;
  const ap1 = m[3] ? m[3][0].toLowerCase() : null, ap2 = m[6] ? m[6][0].toLowerCase() : null;
  const startMin = toMin(+m[1], +(m[2] || 0), ap1 || ap2);
  let endMin = m[4] ? toMin(+m[4], +(m[5] || 0), ap2 || ap1) : null;
  if (endMin !== null && endMin <= startMin) endMin = null;
  return { type, label: cell, startMin, endMin, students: [] };
}
function parseSchedule(text){
  const out = { days: {}, roster: [], nameOf: {}, warnings: [], lookalikes: [] };
  if (!text || !text.trim()) return out;
  const rows = text.replace(/\r/g, '').split('\n').map(r => r.split('\t').map(c => c.trim()));
  const colDay = {}, colSec = {}, stray = [];
  const dayFor = c => { if (colDay[c]) return colDay[c]; let best = null, bc = -1;
    for (const k in colDay){ const kc = +k; if (kc <= c && kc > bc){ bc = kc; best = colDay[k]; } } return best; };
  rows.forEach(row => row.forEach((cell, c) => {
    if (!cell) return;
    const d = DAYS.indexOf(cell.toLowerCase().replace(/[^a-z]/g, ''));
    if (d >= 0){ colDay[c] = DAYS[d]; colSec[c] = null; out.days[DAYS[d]] = out.days[DAYS[d]] || []; return; }
    const sec = parseSectionHeader(cell);
    if (sec){
      const day = dayFor(c);
      if (!day){ out.warnings.push(`“${cell}” doesn’t have a day name (like Monday) above it, so it was skipped.`); colSec[c] = null; return; }
      out.days[day].push(sec); colSec[c] = sec; return;
    }
    const s = colSec[c];
    if (s){ const name = cell.replace(/\s+/g, ' '); if (!s.students.some(n => normKey(n) === normKey(name))) s.students.push(name); }

  if (stray.length) out.warnings.push(`Skipped ${stray.length} cell${stray.length > 1 ? 's' : ''} that weren’t under a section heading (for example “${stray[0]}”).`);
  for (const day of Object.keys(out.days)) for (const s of out.days[day]) for (const n of s.students){

  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++)
    if (looksAlike(R[i].key, R[j].key)) out.lookalikes.push([R[i].name, R[j].name]);

}
// Parsed schedules are reused across renders (and give planFor a stable object to cache against).
const schedCache = new Map();
function parsedSchedule(text){
  if (!schedCache.has(text)){ if (schedCache.size > 30) schedCache.clear(); schedCache.set(text, parseSchedule(text)); }
  return schedCache.get(text);
}

/* ---------------- Zoom participant export ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function parseZoomTime(s){
  if (!s) return null; s = String(s).trim(); if (!s) return null;
  let y, mo, d, h, mi, se, ap, m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?/))){
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0); ap = m[7];
  } else { const t = Date.parse(s); return isNaN(t) ? null : new Date(t); }
  if (ap){ ap = ap.toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0; }

}
function parseZoomFile(name, text){
  const rows = parseCSV(String(text).replace(/^\uFEFF/, ''));
  const hi = rows.findIndex(r => r.some(c => /join/i.test(c)) && r.some(c => /leave/i.test(c)));
  if (hi < 0){
    const looksUnique = rows.some(r => r.some(c => /duration/i.test(c)) && r.some(c => /name/i.test(c)));
    return { error: looksUnique
      ? 'This file has no join or leave times. It was probably exported with “Show unique users” checked. Export it again with that box unchecked.'
      : 'This doesn’t look like a Zoom participant report (no “Join Time” column).' };
  }
  const h = rows[hi].map(c => c.trim().toLowerCase());
  let nameIdx = h.findIndex(c => c.startsWith('name') || c.includes('participant'));
  if (nameIdx < 0) nameIdx = 0;
  const joinIdx = h.findIndex(c => c.includes('join'));
  const leaveIdx = h.findIndex(c => c.includes('leave'));
  const waitIdx = h.findIndex(c => c.includes('waiting'));
  let emailIdx = h.findIndex((c, i) => c.includes('email') && i > nameIdx);
  if (emailIdx < 0) emailIdx = h.findIndex(c => c.includes('email'));
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (r[nameIdx] || '').trim();
    const join = parseZoomTime(r[joinIdx]), leave = parseZoomTime(r[leaveIdx]);
    if (!nm || !join || !leave || leave <= join) continue;
    if (waitIdx >= 0 && /^y/i.test((r[waitIdx] || '').trim())) continue; // time in the waiting room isn't class time
    out.push({ name: nm, email: emailIdx >= 0 ? (r[emailIdx] || '').trim() : '', join, leave });

}

/* ---------------- Matching Zoom names to students ---------------- */
function zoomCandidates(raw){
  const s = String(raw || '').trim();
  const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);   // "Current name (Original name)"
  const parts = m ? [m[1], m[2]] : [s];
  return parts.map(x => x.replace(/['’]s\s+(i?phone|ipad|android|galaxy|chromebook|macbook(\s+(air|pro))?|mac|laptop|computer|pc|tablet|device)\b.*$/i, '').trim()).filter(Boolean);
}
function buildMatcher(roster, aliases){
  const E = roster.map(r => { const toks = r.key.split(' '); return { key: r.key, name: r.name, toks, first: toks[0], last: toks[toks.length - 1], rest: toks.slice(1) }; });
  const byKey = new Map(E.map(e => [e.key, e]));

    t => E.filter(e => e.key === t.join(' ')),
    t => t.length > 1 ? E.filter(e => e.toks.length > 1 && t.includes(e.first) && t.includes(e.last)) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => e.rest.includes(x))) : [],
    t => t.length > 1 ? E.filter(e => t[0] === e.first && t.slice(1).every(x => x.length === 1) && e.rest.some(x => x[0] === t[1])) : [],
    t => E.filter(e => e.toks.join('') === t.join('')),
    t => t.length === 1 ? E.filter(e => e.first === t[0]) : []

    const cands = [...new Set([normKey(raw), ...zoomCandidates(raw).map(normKey)])].filter(Boolean);
    for (const k of cands){ const a = aliases[k]; if (a && byKey.has(a)) return byKey.get(a); }
    const toks = cands.map(k => k.split(' '));
    for (const step of steps) for (const t of toks){ const r = step(t); if (r.length === 1) return r[0]; }
    if (email){
      const local = normKey(String(email).split('@')[0]).replace(/[^a-z]/g, '');
      if (local.length >= 4){
        const r = E.filter(e => { const rj = e.rest.join(''); return e.last.length >= 3 &&
          (local.includes(rj || e.last) || local.includes(e.last)) && (local.includes(e.first) || local.startsWith(e.first[0])); });
        if (r.length === 1) return r[0];
      }
    }
    return null;
  };
}

/* ---------------- Attendance math ---------------- */
function mergeIntervals(list){
  const s = list.map(x => [x[0], x[1]]).sort((a, b) => a[0] - b[0]); const out = [];
  for (const iv of s){ const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push(iv); }
  return out;
}
const overlap = (list, A, B) => list.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, B) - Math.max(a, A)), 0);

const sumIv = list => list.reduce((t, [a, b]) => t + b - a, 0);

function evaluate(intervals, sections, at, S){
  const secs = sections.map(s => ({ type: s.type, a: at(s.startMin), b: at(s.endMin) })).sort((x, y) => x.a - y.a);
  const req = mergeIntervals(secs.map(s => [s.a, s.b]));
  const winStart = req[0][0], winEnd = req[req.length - 1][1];
  const merged = mergeIntervals(intervals);
  const presentMs = req.reduce((t, [A, B]) => t + overlap(merged, A, B), 0);
  const reqMs = sumIv(req);
  const instrIv = mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.a, s.b]));
  const iReqMs = sumIv(instrIv), iPresMs = instrIv.reduce((t, [a, b]) => t + overlap(merged, a, b), 0);
  const out = { secs, merged, flags: [], firstJoin: null, lastLeave: null, winStart, winEnd,
    presentMin: mins(presentMs), reqMin: mins(reqMs), instrMin: mins(iPresMs), instrReqMin: mins(iReqMs) };
  // Support minutes are "everything that isn't instruction", so overlapping sections are never counted twice.
  out.suppMin = out.presentMin - out.instrMin; out.suppReqMin = out.reqMin - out.instrReqMin;
  if (presentMs < 60000){ out.flags.push({ k: 'absent', label: 'Absent' }); return out; }
  const rel = merged.filter(([a, b]) => b > winStart && a < winEnd);
  out.firstJoin = rel[0][0]; out.lastLeave = rel[rel.length - 1][1];
  const G = S.lateGrace * 60000, L = S.leaveGrace * 60000, D = S.gapMin * 60000;
  const instr = secs.filter(s => s.type === 'instruction'), supp = secs.filter(s => s.type === 'support');
  if (instrIv.length && iPresMs < 5 * 60000) out.flags.push({ k: 'missed', label: 'Missed instruction' });
  else if (out.firstJoin > winStart + G){ const m = mins(out.firstJoin - winStart); out.flags.push({ k: 'late', label: `Late ${m} min`, min: m }); }
  if (out.lastLeave < winEnd - L){
    const m = mins(winEnd - out.lastLeave);
    const inSupport = supp.some(s => out.lastLeave >= s.a && out.lastLeave < s.b);
    const suppPresent = supp.reduce((t, s) => t + overlap(merged, s.a, s.b), 0);
    if (inSupport && suppPresent >= 5 * 60000){
      const sm = mins(overlap(mergeIntervals(supp.map(s => [s.a, s.b])), out.lastLeave, winEnd));   // support time left, not instruction
      out.flags.push({ k: 'soft', label: `Left support ${sm} min early`, min: sm });
    }
    else if (inSupport && instr.length) out.flags.push({ k: 'early', label: 'Skipped support hour', min: m, skip: true });
    else out.flags.push({ k: 'early', label: `Left ${m} min early`, min: m });
  }
  const spanA = Math.max(out.firstJoin, winStart), spanB = Math.min(out.lastLeave, winEnd);
  const reqInSpan = req.reduce((t, [A, B]) => t + Math.max(0, Math.min(B, spanB) - Math.max(A, spanA)), 0);
  const gap = reqInSpan - presentMs;
  if (gap > D){ const m = mins(gap); out.flags.push({ k: 'drop', label: `Out ${m} min mid-class`, min: m }); }
  if (!out.flags.length) out.flags.push({ k: 'full', label: 'Present full time' });
  return out;
}

/* ---------------- Formative exports ----------------
   A Formative results export (CSV) saved into the folder: one row per student, columns for each question.
   For each class day this gives, per student, how many questions they answered and of how many. */
const F_NAME = /^(student( full)?( name)?|name|full name|(student )?(first|last)( name)?|first|last)$/;
const F_META = /e-?mail|^(class(es)?|section|period|teacher|id|student id|sis\b.*|grade( level)?|status|progress|returned|feedback|total.*|score.*|.*percent.*|%.*|.*points?( earned| possible)?|.*standards?.*|.*mastery.*)$|submitted|started|updated|modified|^(date|time)\b|\bdate$|\btime$/;
function dateInName(name, year){
  let m;
  if ((m = name.match(/(20\d\d)[-_. ](\d{1,2})[-_. ](\d{1,2})/))) return dkOf(new Date(+m[1], +m[2] - 1, +m[3]));
  if ((m = name.match(/(?:^|\D)(\d{1,2})[-_. ](\d{1,2})[-_. ](\d{2}|\d{4})(?:\D|$)/))){ let y = +m[3]; if (y < 100) y += 2000; return dkOf(new Date(y, +m[1] - 1, +m[2])); }
  const mon = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  if ((m = name.toLowerCase().match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[ _-]?(\d{1,2})\b/))) return dkOf(new Date(year, mon.indexOf(m[1]), +m[2]));
  return null;
}
function parseFormativeFile(name, text, modified){
  const rows = parseCSV(String(text).replace(/^﻿/, '')).filter(r => r.some(c => c.trim()));
  const hi = rows.slice(0, 8).findIndex(r => r.some(c => F_NAME.test(c.trim().toLowerCase())));
  if (hi < 0) return null;
  const h = rows[hi].map(c => c.trim().toLowerCase()), col = re => h.findIndex(c => re.test(c));
  // Only a file named for Formative, or one with score or question columns, counts. Any other CSV keeps its Zoom error.
  if (!/formative/i.test(name) && !h.some(c => /score|points|percent|question|response|answer/.test(c))) return null;
  const first = col(/^(student )?first( name)?$|^first$/), last = col(/^(student )?last( name)?$|^last$/), full = col(/^(student( full)?( name)?|name|full name)$/);
  const email = col(/e-?mail/), pctCol = col(/percent|^%|score %|% score|^score \(%\)/);
  const meta = new Set([first, last, full, email].filter(i => i >= 0));
  h.forEach((c, i) => { if (!c || F_NAME.test(c) || F_META.test(c)) meta.add(i); });
  const qCols = h.map((c, i) => i).filter(i => !meta.has(i));
  const stamps = h.map((c, i) => /submitted|started|updated|modified|\bdate\b|\btime\b/.test(c) ? i : -1).filter(i => i >= 0);
  const out = [], dates = {};
  for (const r of rows.slice(hi + 1)){
    const nm = (full >= 0 && r[full] ? r[full] : [first >= 0 ? r[first] : '', last >= 0 ? r[last] : ''].join(' ')).trim();
    if (!nm || /^(average|class average|total|mean|median)s?$/i.test(nm)) continue;
    const answered = qCols.filter(i => (r[i] || '').trim() && !/^(-|—|n\/a|not answered|no response|unanswered|0\/\d+)$/i.test((r[i] || '').trim())).length;
    const pv = pctCol >= 0 ? parseFloat(String(r[pctCol]).replace('%', '')) : NaN;
    out.push({ name: nm, email: email >= 0 ? (r[email] || '').trim() : '', answered, pct: Number.isFinite(pv) ? pv : null });
    for (const i of stamps){ const t = parseZoomTime(r[i]); if (t) dates[dkOf(t)] = (dates[dkOf(t)] || 0) + 1; }
  }
  if (!out.length) return { error: 'This looks like a Formative export, but no student rows were found in it.' };
  // The class day: a date in the file name, else the date most answers were submitted, else the day the file was saved.
  const year = new Date(modified || Date.now()).getFullYear();
  const dk = dateInName(name, year) || Object.entries(dates).sort((a, b) => b[1] - a[1])[0]?.[0] || (modified ? dkOf(new Date(modified)) : null);
  if (!dk) return { error: 'This Formative export has no date. Put the class date in the file name, like formative-10-14-2026.csv.' };
  return { formative: true, dk, questions: qCols.length, rows: out };
}

// Each file is read once: a Zoom participant report, or else a Formative export, or else an error.
function parsedFile(f){
  if (!f.parsed){ const z = parseZoomFile(f.name, f.text); f.parsed = z.error ? (parseFormativeFile(f.name, f.text, f.modified) || z) : z; }
  return f.parsed;
}

function analyze(){
  const S = state.data.settings;
  // Each schedule version covers the days from its start date until the next version starts.
  const versions = state.data.scheduleVersions.map(v => ({ from: v.from || '', text: v.text, sched: parsedSchedule(v.text) }));
  const sched = versions[versions.length - 1].sched;
  const nameOf = {};
  for (const v of versions) for (const r of v.sched.roster) nameOf[r.key] = r.name;   // latest spelling wins
  const roster = Object.keys(nameOf).map(key => ({ key, name: nameOf[key] })).sort((a, b) => a.name.localeCompare(b.name));
  const verFor = dk => { let s = versions[0]; for (const v of versions) if (v.from <= dk) s = v; return s; };
  // A student dropped from the class is taken off every schedule from the drop date on; their earlier days stay as they were.
  const drops = Object.entries(state.data.drops).map(([k, v]) => [k, v.date]), dropCache = new Map();
  const schedFor = dk => {
    const v = verFor(dk), gone = drops.filter(([, d]) => d <= dk).map(([k]) => k).sort();
    if (!gone.length) return v.sched;
    const ck = `${v.from}|${gone.join(',')}`;
    if (!dropCache.has(ck)){
      const out = new Set(gone), days = {};
      for (const [w, secs] of Object.entries(v.sched.days)) days[w] = secs.map(x => ({ ...x, students: x.students.filter(n => !out.has(normKey(n))) }));
      dropCache.set(ck, { ...v.sched, days, roster: v.sched.roster.filter(r => !out.has(r.key)) });
    }
    return dropCache.get(ck);
  };
  // Zoom names are matched against that day's schedule first, so adding "Ben Carter" later can't make "ben c" ambiguous
  // on days Ben Carter wasn't scheduled. Everyone from every version is the fallback, for students who joined but weren't scheduled.
  const anyone = buildMatcher(roster, state.data.aliases);
  const matchFor = dk => { const v = verFor(dk); if (!v.match){ const m = buildMatcher(v.sched.roster, state.data.aliases); v.match = (r, e) => m(r, e) || anyone(r, e); } return v.match; };
  const ignored = new Set(state.data.ignored);
  const fileErrors = [], byDate = new Map(), forms = [];
  for (const f of state.files){
    const z = parsedFile(f);
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    if (z.formative){ forms.push({ name: f.name, ...z }); continue; }
    for (const r of z.rows){
      const dk = dkOf(r.join);
      if (!byDate.has(dk)) byDate.set(dk, { dk, files: new Set(), rows: [] });
      const g = byDate.get(dk); g.files.add(f.name); g.rows.push(r);
    }
  }
  const days = [...byDate.values()].sort((a, b) => b.dk.localeCompare(a.dk))
    .map(g => analyzeDay(g, schedFor(g.dk), nameOf, matchFor(g.dk), ignored, S));
  // Formative results by class day: per student, questions answered of the day's total (several files in a day add up).
  const formByDk = new Map();
  for (const F of forms){
    if (!formByDk.has(F.dk)) formByDk.set(F.dk, { dk: F.dk, files: [], questions: 0, byKey: new Map(), unmatched: new Map() });
    const g = formByDk.get(F.dk), match = matchFor(F.dk);
    g.files.push(F.name); g.questions += F.questions;
    const seen = new Map();
    for (const r of F.rows){
      const m = match(r.name, r.email);
      if (!m){ const rk = normKey(r.name); if (rk && !ignored.has(rk)) g.unmatched.set(rk, { rk, raw: r.name, email: r.email }); continue; }
      const e = seen.get(m.key) || { answered: 0, pct: null };
      e.answered = Math.max(e.answered, r.answered); if (r.pct !== null) e.pct = Math.max(e.pct ?? 0, r.pct);
      seen.set(m.key, e);
    }
    for (const [k, e] of seen){
      const t = g.byKey.get(k) || { answered: 0, pcts: [] };
      t.answered += e.answered; if (e.pct !== null) t.pcts.push(e.pct);
      g.byKey.set(k, t);
    }
  }
  return { sched, versions, schedFor, roster, nameOf, days, dayByDk: new Map(days.map(d => [d.dk, d])), fileErrors, formByDk };
}

function analyzeDay(g, sched, nameOf, matcher, ignored, S){
  const date = parseDk(g.dk);
  // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
  const at = m => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m).getTime();
  const dayName = DAYS[date.getDay()];
  const secs = (sched.days[dayName] || []).map(s => ({ ...s, endMin: s.endMin ?? s.startMin + S.sectionLen }));
  const plan = new Map();
  for (const s of secs) for (const n of s.students){
    const k = normKey(n); if (!k) continue;
    if (!plan.has(k)) plan.set(k, { key: k, name: nameOf[k] || n, sections: [] });
    plan.get(k).sections.push(s);
  }
  const seen = new Map(), unmatched = new Map();
  for (const r of g.rows){
    const rk = normKey(r.name);
    if (ignored.has(rk)) continue;
    const iv = [r.join.getTime(), r.leave.getTime()];
    const m = matcher(r.name, r.email);
    if (m){
      if (!seen.has(m.key)) seen.set(m.key, { key: m.key, name: m.name, intervals: [], zoom: new Set(), segs: [] });
      const e = seen.get(m.key); e.intervals.push(iv); e.zoom.add(r.name); e.segs.push({ a: iv[0], b: iv[1], name: r.name });
    } else {
      if (!unmatched.has(rk)) unmatched.set(rk, { rk, raw: r.name, email: r.email, intervals: [] });
      unmatched.get(rk).intervals.push(iv);
    }
  }
  let axisStart, axisEnd;
  if (secs.length){
    axisStart = at(Math.min(...secs.map(s => s.startMin)) - 10);
    axisEnd = at(Math.max(...secs.map(s => s.endMin)) + 10);
  } else {
    const all = g.rows.map(r => [r.join.getTime(), r.leave.getTime()]);
    axisStart = Math.min(...all.map(x => x[0])) - 5 * 60000;
    axisEnd = Math.max(...all.map(x => x[1])) + 5 * 60000;
  }
  const students = [...plan.values()].map(p => {
    const e = seen.get(p.key);
    const res = evaluate(e ? e.intervals : [], p.sections, at, S);
    const xkey = `${g.dk}|${p.key}`;
    const soft = res.flags.find(f => f.k === 'soft');
    if (soft && state.data.excused[xkey]){ soft.k = 'fin'; soft.label = `Finished work, left ${soft.min} min early`; }
    const isAbsent = res.flags[0].k === 'absent';
    if (isAbsent && state.data.excusedAbsent[xkey]) res.flags[0] = { k: 'exc', label: 'Excused absence' };
    const sev = Math.max(...res.flags.map(f => SEVERITY[f.k]));
    const kinds = new Set(p.sections.map(s => s.type));
    const schedLabel = kinds.has('instruction') && kinds.has('support') ? 'Instruction + support'
      : kinds.has('instruction') ? 'Instruction' : 'Support hour only';
    const zoomNames = e ? [...e.zoom].filter(z => normKey(z) !== p.key) : [];
    const segs = e ? [...e.segs].sort((x, y) => x.a - y.a) : [];
    return { ...p, ...res, dk: g.dk, xkey, sev, schedLabel, zoomNames, segs, hasSoft: !!soft, isAbsent,
      note: state.data.notes[xkey] || '' };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const extras = [...seen.values()].filter(e => !plan.has(e.key)).map(e => ({ ...e, merged: mergeIntervals(e.intervals) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const unm = [...unmatched.values()].map(u => ({ ...u, merged: mergeIntervals(u.intervals) })).sort((a, b) => a.raw.localeCompare(b.raw));
  const ticks = [];
  for (let t = Math.ceil(axisStart / 1800000) * 1800000; t <= axisEnd; t += 1800000) ticks.push(t);
  return { dk: g.dk, date, dayName, files: [...g.files].sort(), secs, students, extras, unmatched: unm, axisStart, axisEnd, ticks,
    roster: sched.roster };
}

/* ---------------- Rendering ---------------- */
function timeline(day, merged, secs){
  const span = day.axisEnd - day.axisStart, pct = t => ((t - day.axisStart) / span * 100).toFixed(3);
  let h = '';
  for (const s of secs || []) h += `<span class="band ${s.type}" style="left:${pct(s.a)}%;width:${(pct(s.b) - pct(s.a)).toFixed(3)}%"></span>`;
  for (const t of day.ticks) h += `<span class="tick${new Date(t).getMinutes() ? ' half' : ''}" style="left:${pct(t)}%"></span>`;
  const label = [];
  for (const [a, b] of merged){
    const A = Math.max(a, day.axisStart), B = Math.min(b, day.axisEnd); label.push(`${fmt(a)} to ${fmt(b)}`);
    if (B <= A) continue;
    h += `<span class="bar" title="In Zoom ${esc(fmt(a))}–${esc(fmt(b))}" style="left:${pct(A)}%;width:${Math.max(0.5, pct(B) - pct(A)).toFixed(3)}%"></span>`;
  }
  return `<div class="tl" role="img" aria-label="${esc(label.length ? 'In Zoom ' + label.join(', ') : 'Not in Zoom')}">${h}</div>`;
}
function axis(day){
  const span = day.axisEnd - day.axisStart;
  return `<div class="axis" aria-hidden="true">${day.ticks.filter(t => !new Date(t).getMinutes())
    .map(t => `<span style="left:${((t - day.axisStart) / span * 100).toFixed(2)}%">${esc(fmt(t).replace(/:00/, ''))}</span>`).join('')}</div>`;
}
function rangeText(merged){ return merged.map(([a, b]) => `${fmt(a)}–${fmt(b)}`).join(', '); }

function renderReports(){
  const el = $('#tab-reports');
  const A = analyze();
  state.lastAnalysis = A;
  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  let h = '';
  if (state.returnTo) h += `<div class="backbar">From ${esc(state.returnTo.name)}’s report <button class="btn small" data-returnto>Back to ${esc(state.returnTo.name)}</button>
    <button class="linkish" data-dismissreturn>Stay here</button></div>`;
  if (!A.sched.roster.length) h += `<div class="notice">Add your class schedule on the <button class="linkish" data-goto="schedule">Schedule tab</button> so each student can be checked against the hours they’re expected.</div>`;
  if (A.fileErrors.length) h += `<div class="notice"><b>Some files couldn’t be read:</b><ul>${A.fileErrors.map(f => `<li>${esc(f.name)}: ${esc(f.error)}</li>`).join('')}</ul></div>`;
  if (!A.days.length){
    el.innerHTML = h + `<div class="start"><h2>No Zoom reports in this folder yet</h2><p class="muted">Save a participant report from Zoom into <b>${esc(state.folderName || 'your folder')}</b>, then click Refresh.</p>${zoomHelp()}</div>`;
    return;
  }
  const days = daysInRange(A.days), period = periodOf(A);
  h += `<div class="toolbar">${rangeBar()}
    <input class="search" data-search type="search" placeholder="Find a student" value="${esc(state.query)}" aria-label="Find a student">
    <button class="btn small ghost" id="exportDays"${days.length ? '' : ' disabled'}>Export CSV</button>
    <div class="legend"><span><i class="sw i"></i>Instruction hour</span><span><i class="sw s"></i>Support hour</span><span><i class="sw p"></i>In Zoom</span></div>
  </div>`;
  h += missingNotice(A, period);
  const noClassDays = Object.keys(state.data.noClass).filter(dk => !A.dayByDk.has(dk) && dk >= period.from && dk <= period.to);
  if (!days.length && !noClassDays.length){ el.innerHTML = h + `<div class="notice info">No Zoom reports fall in these dates. ${A.days.length} report day${A.days.length === 1 ? ' is' : 's are'} outside the range. <button class="linkish" data-range="all">Show all dates</button></div>`; return; }
  if (!state.autoOpened && days.length){ state.openDays.add(days[0].dk); state.autoOpened = true; }
  const cards = [...days.map(d => ({ dk: d.dk, day: d })), ...noClassDays.map(dk => ({ dk }))].sort((a, b) => b.dk.localeCompare(a.dk));
  for (const c of cards) h += c.day ? renderDay(c.day) : noClassCard(c.dk);
  el.innerHTML = h;
  focusNoteInput(el);
}
function noClassCard(dk){
  const r = state.data.noClass[dk] || {};
  return `<div class="noclasscard" data-dk="${esc(dk)}"><b>${esc(longDate(dk))}</b> <span>No class: ${esc(NOCLASS_REASONS[r.reason] || 'Other')}</span>
    <button class="linkish" data-undonoclass="${esc(dk)}">Undo</button></div>`;
}
function focusNoteInput(el){
  if (!state.noteEdit) return;
  const n = el.querySelector('input.note'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
}

/* ---------------- Date range (shared by Reports and Students) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
function daysInRange(days){
  const { from, to } = rangeBounds();
  return days.filter(d => (!from || d.dk >= from) && (!to || d.dk <= to));
}
// The dates a person reads: an open start becomes the oldest report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const oldest = A.days.length ? A.days[A.days.length - 1].dk : today;
  const from = b.from || oldest, to = b.to || (A.days.length && A.days[0].dk > today ? A.days[0].dk : today);
  return { from, to, calcTo: to < today ? to : today, open: to >= today };
}
function rangeBar(){
  const p = state.range.preset, b = rangeBounds();
  return `<div class="range" role="group" aria-label="Dates">
    <div class="seg"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
      <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
      <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button></div>
    <label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
    <label>to <input type="date" data-rto value="${esc(b.to)}"></label></div>`;
}
function stamp(){ const { from, to } = rangeBounds(); return from || to ? `${from || 'start'}_to_${to || 'latest'}` : 'all-dates'; }

/* ---------------- Days with no report, and "no class" marks ---------------- */
function weekdayScheduled(A, dk){
  const s = A.schedFor(dk); return (s.days[DAYS[parseDk(dk).getDay()]] || []).some(sec => sec.students.length);
}
function missingDates(A, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && dk < today && i < 1500; dk = addDays(dk, 1), i++)
    if (!A.dayByDk.has(dk) && !state.data.noClass[dk] && weekdayScheduled(A, dk)) out.push(dk);
  return out;
}
const reasonSelect = () => `<select data-ncreason aria-label="Why there was no class">${Object.entries(NOCLASS_REASONS)
  .map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select>`;
function noClassItems(dks){
  const shown = dks.slice(0, 5), rest = dks.slice(5);
  return `<ul class="nclist">${shown.map(dk => `<li><span>${esc(shortDate(dk))}</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclass="${dk}">Mark no class</button></li>`).join('')}
    ${rest.length ? `<li><span>and ${rest.length} more (${esc(monDay(rest[0]))} – ${esc(monDay(rest[rest.length - 1]))})</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclassall="${rest.join(',')}">Mark all ${rest.length} as no class</button></li>` : ''}</ul>`;
}
function missingNotice(A, period){
  const miss = missingDates(A, period);
  let h = '';
  if (miss.length){
    const named = miss.slice(0, 5).map(dk => `<b>${esc(shortDate(dk))}</b>`);
    h += `<div class="notice"><p style="margin:0">No Zoom report for ${listJoin(named, 5)}${miss.length > 5 ? ` and ${miss.length - 5} more` : ''}. If class met, save that Zoom report into this folder and click Refresh. If there was no class that day:</p>${noClassItems(miss)}</div>`;
  }
  return h + conflictNotices(A, period);
}
function conflictNotices(A, period, key){
  return Object.keys(state.data.noClass).filter(dk => A.dayByDk.has(dk) && dk >= period.from && dk <= period.to
      && (!key || A.dayByDk.get(dk).students.some(s => s.key === key))).sort()
    .map(dk => `<div class="notice">${esc(monDay(dk))} is marked “No class” but has a Zoom report. The report is used. <button class="linkish" data-undonoclass="${dk}">Remove the mark</button></div>`).join('');
}

// The action links under a student's status, shared by Reports and the student report.
function rowActions(s){

function noteBlock(s){

    ? `<input class="note" data-note="${esc(s.xkey)}" value="${esc(s.note)}" placeholder="Note, then press Enter" aria-label="Note for ${esc(s.name)}, ${esc(shortDate(s.dk))}">`

// A closed day only draws its heading; its rows are drawn when it's opened (see the toggle listener), which keeps
// the Reports tab quick with a whole year of reports.
function renderDay(day){
  const counts = {}; for (const s of day.students) for (const f of s.flags) counts[f.k] = (counts[f.k] || 0) + 1;
  const title = longDate(day.date);

    ? `${day.students.length} scheduled, ${day.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support'} ${fmtMin(s.startMin).replace(':00', '')}`).join(' and ')}`
    : `No ${cap(day.dayName)} schedule`;

    <summary><h2>${esc(title)}</h2><span class="sub">${esc(sub)}</span>

}
function fillDayBody(el){
  const body = el.querySelector(':scope > .day-body'), day = state.lastAnalysis && state.lastAnalysis.dayByDk.get(el.dataset.dk);

}
function dayBody(day){

    h += `<div class="daybar"><span class="rate">${came} of ${expected} attended</span></div>`;
    h += `<div class="grid-head"><span>Student</span>${axis(day)}<span>Joined</span><span>Left</span><span>Status</span></div>`;
    if (!rows.length) h += `<p class="muted small" style="padding:10px 0">No students match that search.</p>`;
    for (const s of rows){
