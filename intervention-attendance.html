const fMeta = c => F_QNUM.test(c) ? /^q(uestion)?\s*\d+\s+(score|points?|pts|feedback)$/.test(c) : F_NAME.test(c) || F_META.test(c);
// Dates in a file name: a full numeric date (10-14-2026, 10_14_2026, 2026-10-14), or a whole month name and day ("October 14").
// Words like "Decimals 4" and lesson numbers like "6.2.12" aren't dates, and neither is an impossible one like 02-30-2026.
function dateInName(name, year){
  const real = (y, mo, d) => { const t = new Date(y, mo - 1, d); return t.getMonth() === mo - 1 && t.getDate() === d ? dkOf(t) : null; };
  const mon = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  let m, num = null, month = null;
  if ((m = name.match(/(?:^|\D)(20\d\d)([-_])(\d{1,2})\2(\d{1,2})(?!\d)/))) num = real(+m[1], +m[3], +m[4]);
  else if ((m = name.match(/(?:^|\D)(\d{1,2})([-_])(\d{1,2})\2(20\d\d)(?!\d)/))) num = real(+m[4], +m[1], +m[3]);
  if ((m = name.toLowerCase().match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)[ _-]?(\d{1,2})(?!\d)/))) month = real(year, mon.indexOf(m[1]) + 1, +m[2]);
  return { num, month };
}
function parseFormativeFile(name, text, modified){
  const rows = parseCSV(String(text).replace(/^﻿/, '')).filter(r => r.some(c => c.trim()));
  const named = /formative/i.test(name), hi = rows.slice(0, 8).findIndex(r => r.some(c => F_NAME.test(c.trim().toLowerCase())));
  if (hi < 0) return named ? { error: 'This looks like a Formative export, but no student name column (like “Student Name” or “First Name”) was found in it.' } : null;
  const h = rows[hi].map(c => c.trim().toLowerCase()), col = re => h.findIndex(c => re.test(c));
  // Only a file named for Formative, or one with score or question columns, counts. Any other file with a student column
  // gets a hint, except Zoom's "unique users" export (a Name column and a duration), which keeps Zoom's own message.
  if (!named && !h.some(c => /score|points|percent|question|response|answer/.test(c)))
    return h.some(c => /duration/.test(c)) ? null : { error: 'This doesn’t look like a Zoom participant report (no “Join Time” column). If it’s a Formative export, put the word “formative” in its file name.' };
  const first = col(/^(student )?first( name)?$|^first$/), last = col(/^(student )?last( name)?$|^last$/), full = col(/^(student( full)?( name)?|name|full name)$/);
  const email = col(/^(student )?e-?mail( address)?$/), pctCol = col(/^((total )?score ?(%|\(%\))|% ?score|percent(age)?( correct)?|%( correct)?)$/);
  const meta = new Set([first, last, full, email].filter(i => i >= 0));
  h.forEach((c, i) => { if (!c || fMeta(c)) meta.add(i); });
  const qCols = h.map((c, i) => i).filter(i => !meta.has(i));
  const stamps = h.map((c, i) => meta.has(i) && /submitted|started|completed|updated|modified|submission|^(date|time)$/.test(c) ? i : -1).filter(i => i >= 0);
  const out = [], dates = {};
  for (const r of rows.slice(hi + 1)){
    const nm = (full >= 0 && r[full] ? r[full] : [first >= 0 ? r[first] : '', last >= 0 ? r[last] : ''].join(' ')).trim();
    if (!nm || /^(average|class average|total|mean|median)s?$/i.test(nm)) continue;
    const answered = qCols.filter(i => (r[i] || '').trim() && !/^(-|—|n\/a|not answered|no response|unanswered)$/i.test((r[i] || '').trim())).length;
    const pv = pctCol >= 0 ? parseFloat(String(r[pctCol]).replace('%', '')) : NaN;
    out.push({ name: nm, email: email >= 0 ? (r[email] || '').trim() : '', answered, pct: Number.isFinite(pv) ? pv : null });
    for (const i of stamps){ const t = parseZoomTime(r[i]); if (t) dates[dkOf(t)] = (dates[dkOf(t)] || 0) + 1; }
  }
  if (!out.length) return { error: 'This looks like a Formative export, but no student rows were found in it.' };
  // The class day: a full date in the file name, else the day most answers were submitted, else a month and day in the file name,
  // else the day the file was saved. The Overview's day editor says which.
  const nd = dateInName(name, new Date(modified || Date.now()).getFullYear()), sub = Object.entries(dates).sort((a, b) => b[1] - a[1])[0]?.[0];
  const [dk, dated] = nd.num ? [nd.num, 'the file name'] : sub ? [sub, 'submission times'] : nd.month ? [nd.month, 'the file name']
    : modified ? [dkOf(new Date(modified)), 'the day the file was saved'] : [];
  if (!dk) return { error: 'This Formative export has no date. Put the class date in the file name, like formative-10-14-2026.csv.' };
  return { formative: true, dk, dated, questions: qCols.length, qs: qCols.map(i => h[i]), rows: out };
}

// A gradebook export (a CSV with "grades" and the date in its name): each student's current grade.
// The grade comes from the first column found, in this order: current/overall/final grade or score, then grade, percent,
// score, average. A cell like "87%", "87" or "B+ (87%)" gives 87% (as written, not rounded); a letter alone is kept as written.
const G_COLS = [/^current (grade|score|percent(age)?)( ?\(%\)| ?%)?$/, /^(overall|final|course|total)( grade| score| percent(age)?| %)?( ?\(%\)| ?%)?$/,
  /^(grade|percent(age)?|%|score|average|avg)( ?\(%\)| ?%)?$/, /percent|%|grade(?! level)|score|average/];
function parseGradesFile(name, text, modified){
  const rows = parseCSV(String(text).replace(/^\ufeff/, '')).filter(r => r.some(c => c.trim()));
  const hi = rows.slice(0, 8).findIndex(r => r.some(c => F_NAME.test(c.trim().toLowerCase())));
  if (hi < 0) return { error: 'This looks like a grades file, but no student name column (like “Student Name” or “First Name”) was found in it.' };
  const h = rows[hi].map(c => c.trim().toLowerCase()), col = re => h.findIndex(c => re.test(c));
  const first = col(/^(student )?first( name)?$|^first$/), last = col(/^(student )?last( name)?$|^last$/), full = col(/^(student( full)?( name)?|name|full name)$/);
  const email = col(/^(student )?e-?mail( address)?$/), names = new Set([first, last, full, email]);
  let g = -1; for (const re of G_COLS){ g = h.findIndex((c, i) => !names.has(i) && re.test(c)); if (g >= 0) break; }
  if (g < 0) return { error: 'This looks like a grades file, but no grade column (like “Grade”, “Percent” or “Current Score”) was found in it.' };
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (full >= 0 && r[full] ? r[full] : [first >= 0 ? r[first] : '', last >= 0 ? r[last] : ''].join(' ')).trim(), v = String(r[g] || '').trim();
    if (!nm || !v || /^(average|class average|total|mean|median|points possible|due date)s?$/i.test(nm)) continue;
    const m = v.match(/(\d+(?:\.\d+)?)\s*%/) || v.match(/^(\d+(?:\.\d+)?)$/);
    out.push({ name: nm, email: email >= 0 ? (r[email] || '').trim() : '', grade: m ? `${m[1]}%` : v });
  }
  if (!out.length) return { error: 'This looks like a grades file, but no student grades were found in it.' };
  const nd = dateInName(name, new Date(modified || Date.now()).getFullYear()), dk = nd.num || nd.month || (modified ? dkOf(new Date(modified)) : '');
  return { grades: true, dk, column: rows[hi][g].trim(), rows: out };
}

// Each file is read once: a Zoom participant report or a Formative export, or else an error. A file named for Formative
// is read as one first, so a question that mentions joining or leaving can't make it look like a Zoom report.
function parsedFile(f){
  if (!f.parsed){
    const form = () => parseFormativeFile(f.name, f.text, f.modified);
    let p = /formative/i.test(f.name) ? form() : /grade/i.test(f.name) ? parseGradesFile(f.name, f.text, f.modified) : null;
    if (!p || p.error){ const z = parseZoomFile(f.name, f.text); p = !z.error ? z : p || form() || z; }
    f.parsed = p;
  }
  return f.parsed;
}

function analyze(){
  const S = state.data.settings;
  // Each schedule version covers the days from its start date until the next version starts.
  const versions = state.data.scheduleVersions.map(v => ({ from: v.from || '', text: v.text, sched: parsedSchedule(v.text) }));
  const sched = versions[versions.length - 1].sched;
  const nameOf = {};
  for (const v of versions) for (const r of v.sched.roster) nameOf[r.key] = r.name;   // latest spelling wins
  const deleted = new Set(Object.keys(state.data.deleted));
  const roster = Object.keys(nameOf).filter(key => !deleted.has(key)).map(key => ({ key, name: nameOf[key] })).sort((a, b) => a.name.localeCompare(b.name));
  const verFor = dk => { let s = versions[0]; for (const v of versions) if (v.from <= dk) s = v; return s; };
  // A student dropped from the class is taken off every schedule from the drop date on; their earlier days stay as they were.
  // A deleted student is taken off every schedule on every date.
  const drops = Object.entries(state.data.drops).map(([k, v]) => [k, v.date]), dropCache = new Map();
  const weekSched = dk => {
    const v = verFor(dk), gone = [...new Set([...deleted, ...drops.filter(([, d]) => d <= dk).map(([k]) => k)])].sort();
    if (!gone.length) return v.sched;
    const ck = `${v.from}|${gone.join(',')}`;
    if (!dropCache.has(ck)){
      const out = new Set(gone), days = {};
      for (const [w, secs] of Object.entries(v.sched.days)) days[w] = secs.map(x => ({ ...x, students: x.students.filter(n => !out.has(normKey(n))) }));
      dropCache.set(ck, { ...v.sched, days, roster: v.sched.roster.filter(r => !out.has(r.key)) });
    }
    return dropCache.get(ck);
  };
  // A day added by hand has the students and times of the weekday picked for it, in the schedule in effect that day.
  const extra = state.data.extraDays, extraCache = new Map(), delDays = state.data.deletedDays;
  const schedFor = dk => {
    const base = weekSched(dk), x = extra[dk];
    if (delDays[dk]){   // a deleted day has no class
      if (!extraCache.has(dk)) extraCache.set(dk, { ...base, days: { ...base.days, [DAYS[parseDk(dk).getDay()]]: [] } });
      return extraCache.get(dk);
    }
    if (!x) return base;
    const secs = x.like === 'none' ? [] : x.like === 'all' ? allClasses(base) : base.days[x.like] || [];
    if (x.like !== 'none' && !secs.some(sec => sec.students.length)) return base;   // no such class in that day's schedule: it keeps its own
    if (!extraCache.has(dk)) extraCache.set(dk, { ...base, days: { ...base.days, [DAYS[parseDk(dk).getDay()]]: secs } });
    return extraCache.get(dk);
  };
  // Zoom names are matched against that day's schedule first, so adding "Ben Carter" later can't make "ben c" ambiguous
  // on days Ben Carter wasn't scheduled. Everyone from every version is the fallback, for students who joined but weren't scheduled.
  const anyone = buildMatcher(roster, state.data.aliases);
  const matchFor = dk => { const v = verFor(dk); if (!v.match){ const m = buildMatcher(v.sched.roster, state.data.aliases); v.match = (r, e) => m(r, e) || anyone(r, e); } return v.match; };
  const ignored = new Set(state.data.ignored);
  const fileErrors = [], byDate = new Map(), forms = [], gradeFiles = [];
  for (const f of state.files){
    const z = parsedFile(f);
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    if (z.formative){ forms.push({ name: f.name, ...z }); continue; }
    if (z.grades){ gradeFiles.push({ name: f.name, ...z }); continue; }
    for (const r of z.rows){
      const dk = dkOf(r.join);
      if (state.data.deletedDays[dk]) continue;   // a deleted day's Zoom report is set aside
      if (!byDate.has(dk)) byDate.set(dk, { dk, files: new Set(), rows: [] });
      const g = byDate.get(dk); g.files.add(f.name); g.rows.push(r);
    }
  }
  const days = [...byDate.values()].sort((a, b) => b.dk.localeCompare(a.dk))
    .map(g => analyzeDay(g, schedFor(g.dk), nameOf, matchFor(g.dk), ignored, S, deleted, new Set(drops.filter(([, d]) => d <= g.dk).map(([k]) => k))));
  // Formative results by class day: per student, questions answered of the questions they were given. Files with the same
  // questions are one Formative (a second export, or one file per group), where a student counts once, with their best file.
  // A student's total adds up only the Formatives whose files list them.
  const formByDk = new Map();
  for (const F of forms){
    if (state.data.deletedDays[F.dk]) continue;
    if (!formByDk.has(F.dk)) formByDk.set(F.dk, { dk: F.dk, files: [], dated: new Set(), questions: 0, sets: new Map(), byKey: new Map(), unmatched: new Map() });
    const g = formByDk.get(F.dk), match = matchFor(F.dk), qk = F.qs.join('\u0001');
    g.files.push(F.name); g.dated.add(F.dated);
    if (!g.sets.has(qk)){ g.sets.set(qk, { questions: F.questions, byKey: new Map() }); g.questions += F.questions; }
    const seen = g.sets.get(qk).byKey;
    for (const r of F.rows){
      const m = match(r.name, r.email);
      if (!m){ const rk = normKey(r.name); if (rk && !ignored.has(rk)) g.unmatched.set(rk, { rk, raw: r.name, email: r.email }); continue; }
      if (deleted.has(m.key)) continue;
      const e = seen.get(m.key) || { answered: 0, pct: null };
      e.answered = Math.max(e.answered, r.answered); if (r.pct !== null) e.pct = Math.max(e.pct ?? 0, r.pct);
      seen.set(m.key, e);
    }
  }
  for (const g of formByDk.values()) for (const set of g.sets.values()) for (const [k, e] of set.byKey){
    const t = g.byKey.get(k) || { answered: 0, total: 0, pcts: [] };
    t.answered += e.answered; t.total += set.questions; if (e.pct !== null) t.pcts.push(e.pct);
    g.byKey.set(k, t);
  }
  // Grades: each student's grade from the newest grades file that lists them (newest by the date in its name).
  const grades = new Map(), gradeUnmatched = new Map();
  gradeFiles.sort((a, b) => b.dk.localeCompare(a.dk) || b.name.localeCompare(a.name));
  for (const G of gradeFiles){
    const match = matchFor(G.dk || todayDk()), newest = G === gradeFiles[0];   // names that didn't match are listed from the newest file only
    for (const r of G.rows){
      const m = match(r.name, r.email);
      if (!m){ const rk = normKey(r.name); if (rk && !ignored.has(rk) && newest) gradeUnmatched.set(rk, { rk, raw: r.name, email: r.email }); continue; }
      if (!deleted.has(m.key) && !grades.has(m.key)) grades.set(m.key, { grade: r.grade, file: G.name, dk: G.dk });
    }
  }
  return { sched, versions, schedFor, weekSched, roster, nameOf, days, dayByDk: new Map(days.map(d => [d.dk, d])), fileErrors, formByDk,
    grades, gradeUnmatched, gradeFiles };
}

// Every class in a week's schedule as one day: sections with the same kind and times are one section with all their students.
function allClasses(sched){
  const by = new Map();
  for (const w of DAYS) for (const sec of sched.days[w] || []){
    const k = `${sec.type}|${sec.startMin}|${sec.endMin ?? ''}`;
    if (!by.has(k)) by.set(k, { ...sec, students: [] });
    const m = by.get(k); for (const n of sec.students) if (!m.students.some(x => normKey(x) === normKey(n))) m.students.push(n);
  }
  return [...by.values()].sort((a, b) => a.startMin - b.startMin || a.type.localeCompare(b.type));
}
function analyzeDay(g, sched, nameOf, matcher, ignored, S, deleted, dropped){
  const date = parseDk(g.dk);
  // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
  const at = m => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m).getTime();
  const dayName = DAYS[date.getDay()];
  const secs = (sched.days[dayName] || []).map(s => ({ ...s, endMin: s.endMin ?? s.startMin + S.sectionLen }));
  const plan = new Map();
  for (const s of secs) for (const n of s.students){
    const k = normKey(n); if (!k) continue;
    if (!plan.has(k)) plan.set(k, { key: k, name: nameOf[k] || n, sections: [] });
    plan.get(k).sections.push(s);
  }
  const seen = new Map(), unmatched = new Map();
  for (const r of g.rows){
    const rk = normKey(r.name);
    if (ignored.has(rk)) continue;
    const iv = [r.join.getTime(), r.leave.getTime()];
    const m = matcher(r.name, r.email);
    if (m && deleted.has(m.key)) continue;   // a deleted student's Zoom rows aren't listed anywhere
    if (m){
      if (!seen.has(m.key)) seen.set(m.key, { key: m.key, name: m.name, intervals: [], zoom: new Set(), segs: [] });
      const e = seen.get(m.key); e.intervals.push(iv); e.zoom.add(r.name); e.segs.push({ a: iv[0], b: iv[1], name: r.name });
    } else {
      if (!unmatched.has(rk)) unmatched.set(rk, { rk, raw: r.name, email: r.email, intervals: [] });
      unmatched.get(rk).intervals.push(iv);
    }
  }
  let axisStart, axisEnd;
  if (secs.length){
    axisStart = at(Math.min(...secs.map(s => s.startMin)) - 10);
    axisEnd = at(Math.max(...secs.map(s => s.endMin)) + 10);
  } else {
    const all = g.rows.map(r => [r.join.getTime(), r.leave.getTime()]);
    axisStart = Math.min(...all.map(x => x[0])) - 5 * 60000;
    axisEnd = Math.max(...all.map(x => x[1])) + 5 * 60000;
  }
  // A student on the class list who came to a class hour they aren't scheduled for (at least 5 minutes in it) is counted
  // for the hours they were there, and marked as not scheduled that day.
  for (const e of seen.values()){
    if (plan.has(e.key) || dropped.has(e.key)) continue;
    const mine = secs.filter(sec => e.intervals.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, at(sec.endMin)) - Math.max(a, at(sec.startMin))), 0) >= 5 * 60000);
    if (mine.length) plan.set(e.key, { key: e.key, name: nameOf[e.key] || e.name, sections: mine, unsched: true });
  }
  const students = [...plan.values()].map(p => {
    const e = seen.get(p.key);
    const xkey = `${g.dk}|${p.key}`;
    const res = evaluate(e ? e.intervals : [], p.sections, at, S, !!state.data.excused[xkey]);
    const isAbsent = res.flags[0].k === 'absent';
    if (isAbsent && state.data.excusedAbsent[xkey]) res.flags[0] = { k: 'exc', label: 'Excused absence' };
    const sev = Math.max(...res.flags.map(f => SEVERITY[f.k]));
    const kinds = new Set(p.sections.map(s => s.type));
    const schedLabel = p.unsched ? `Not scheduled, came to ${kinds.size > 1 ? 'both hours' : kinds.has('instruction') ? 'instruction' : 'the support hour'}`
      : kinds.has('instruction') && kinds.has('support') ? 'Instruction + support' : kinds.has('instruction') ? 'Instruction' : 'Support hour only';
    const zoomNames = e ? [...e.zoom].filter(z => normKey(z) !== p.key) : [];
    const segs = e ? [...e.segs].sort((x, y) => x.a - y.a) : [];
    return { ...p, ...res, dk: g.dk, xkey, sev, schedLabel, zoomNames, segs, isAbsent,
      note: state.data.notes[xkey] || '' };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const extras = [...seen.values()].filter(e => !plan.has(e.key)).map(e => ({ ...e, merged: mergeIntervals(e.intervals) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const unm = [...unmatched.values()].map(u => ({ ...u, merged: mergeIntervals(u.intervals) })).sort((a, b) => a.raw.localeCompare(b.raw));
  const ticks = [];
  for (let t = Math.ceil(axisStart / 1800000) * 1800000; t <= axisEnd; t += 1800000) ticks.push(t);
  return { dk: g.dk, date, dayName, files: [...g.files].sort(), secs, students, extras, unmatched: unm, axisStart, axisEnd, ticks,
    roster: sched.roster };
}

/* ---------------- Rendering ---------------- */
function timeline(day, merged, secs){
  const span = day.axisEnd - day.axisStart, pct = t => ((t - day.axisStart) / span * 100).toFixed(3);
  let h = '';
  for (const s of secs || []) h += `<span class="band ${s.type}" style="left:${pct(s.a)}%;width:${(pct(s.b) - pct(s.a)).toFixed(3)}%"></span>`;
  for (const t of day.ticks) h += `<span class="tick${new Date(t).getMinutes() ? ' half' : ''}" style="left:${pct(t)}%"></span>`;
  const label = [];
  for (const [a, b] of merged){
    const A = Math.max(a, day.axisStart), B = Math.min(b, day.axisEnd); label.push(`${fmt(a)} to ${fmt(b)}`);
    if (B <= A) continue;
    h += `<span class="bar" title="In Zoom ${esc(fmt(a))}–${esc(fmt(b))}" style="left:${pct(A)}%;width:${Math.max(0.5, pct(B) - pct(A)).toFixed(3)}%"></span>`;
  }
  return `<div class="tl" role="img" aria-label="${esc(label.length ? 'In Zoom ' + label.join(', ') : 'Not in Zoom')}">${h}</div>`;
}
function axis(day){
  const span = day.axisEnd - day.axisStart;
  return `<div class="axis" aria-hidden="true">${day.ticks.filter(t => !new Date(t).getMinutes())
    .map(t => `<span style="left:${((t - day.axisStart) / span * 100).toFixed(2)}%">${esc(fmt(t).replace(/:00/, ''))}</span>`).join('')}</div>`;
}
function rangeText(merged){ return merged.map(([a, b]) => `${fmt(a)}–${fmt(b)}`).join(', '); }

function renderReports(){
  const el = $('#tab-reports');
  const A = analyze();
  state.lastAnalysis = A;
  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  let h = '';
  if (state.returnTo) h += `<div class="backbar">From ${esc(state.returnTo.name)}’s report <button class="btn small" data-returnto>Back to ${esc(state.returnTo.name)}</button>
    <button class="linkish" data-dismissreturn>Stay here</button></div>`;
  if (!A.sched.roster.length) h += `<div class="notice">Add your class schedule on the <button class="linkish" data-goto="schedule">Schedule tab</button> so each student can be checked against the hours they’re expected.</div>`;
  if (A.fileErrors.length) h += `<div class="notice"><b>Some files couldn’t be read:</b><ul>${A.fileErrors.map(f => `<li>${esc(f.name)}: ${esc(f.error)}</li>`).join('')}</ul></div>`;
  if (!A.days.length){
    el.innerHTML = h + `<div class="start"><h2>No Zoom reports in this folder yet</h2><p class="muted">Save a participant report from Zoom into <b>${esc(state.folderName || 'your folder')}</b>, then click Refresh.</p>${zoomHelp()}</div>`;
    return;
  }
  const days = daysInRange(A.days), period = periodOf(A);
  h += `<div class="toolbar">${rangeBar()}
    <input class="search" data-search type="search" placeholder="Find a student" value="${esc(state.query)}" aria-label="Find a student">
    <button class="btn small ghost" id="exportDays"${days.length ? '' : ' disabled'}>Export CSV</button><span class="grow"></span>

  h += missingNotice(A, period);

  const cards = [...days.map(d => ({ dk: d.dk, day: d })), ...noClassDays.map(dk => ({ dk }))].sort((a, b) => b.dk.localeCompare(a.dk));

}
function noClassCard(dk){

/* ---------------- Date range (shared by Reports and Students) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
function daysInRange(days){
  const { from, to } = rangeBounds();
  return days.filter(d => (!from || d.dk >= from) && (!to || d.dk <= to));
}
// The dates a person reads: an open start becomes the oldest report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const oldest = A.days.length ? A.days[A.days.length - 1].dk : [today, ...Object.keys(state.data.extraDays)].sort()[0];
  const from = b.from || oldest, to = b.to || (A.days.length && A.days[0].dk > today ? A.days[0].dk : today);
  return { from, to, calcTo: to < today ? to : today, open: to >= today };
}
// Three presets and a "Custom dates…" menu, in one control. Once dates are chosen, the menu's label shows them.
// The menu stays open (state.rangeMenu) through the redraw each complete date makes.
function rangeBar(){
  const p = state.range.preset, b = rangeBounds(), on = p === 'custom' && !!(b.from || b.to);
  const shown = !on ? 'Custom dates…' : b.from && b.to ? `${monDay(b.from)} – ${monDay(b.to)}` : b.from ? `From ${monDay(b.from)}` : `Until ${monDay(b.to)}`;
  const said = !on ? 'Custom dates' : `Custom dates, ${b.from && b.to ? `${monDay(b.from)} to ${monDay(b.to)}` : b.from ? `from ${monDay(b.from)}` : `until ${monDay(b.to)}`}`;
  return `<div class="seg range" role="group" aria-label="Dates"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
    <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
    <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button>
    <details class="menu rangemenu" data-rangemenu${state.rangeMenu ? ' open' : ''}><summary${on ? ` class="on" title="${esc(shown)}"` : ''} aria-label="${esc(said)}">${esc(shown)}</summary>
      <div class="pop" role="group" aria-label="Custom dates"><label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
        <label>to <input type="date" data-rto value="${esc(b.to)}"></label></div></details></div>`;

/* ---------------- Days with no report, and "no class" marks ---------------- */
function weekdayScheduled(A, dk){

// A closed day only draws its heading; its rows are drawn when it's opened (see the toggle listener), which keeps
// the Reports tab quick with a whole year of reports.
function renderDay(day){
  // Late includes missing the instruction hour, left early includes leaving the support hour early, and absent includes
  // excused absences. Present is everyone else who came. A student who was late and left early is in both boxes.
  const n = { full: 0, fin: 0, late: 0, early: 0, drop: 0, absent: 0 }; let exc = 0;
  for (const s of day.students){
    const k = new Set(s.flags.map(f => f.k));
    if (s.isAbsent){ n.absent++; if (k.has('exc')) exc++; continue; }
    const fin = k.has('fin'), late = k.has('late') || k.has('missed'), early = k.has('early') || k.has('soft'), drop = k.has('drop');
    if (fin) n.fin++; if (late) n.late++; if (early) n.early++; if (drop) n.drop++; if (!fin && !late && !early && !drop) n.full++;
  }
  const title = longDate(day.date);
  // Who came (counted as the open day counts it) and when, so a closed day can be read without opening it.
  const sch = day.students.filter(s => !s.unsched), extra = day.students.length - sch.length;
  const expected = sch.filter(s => s.flags[0].k !== 'exc').length, came = sch.filter(s => !s.isAbsent).length;
  const sub = day.secs.length
    ? `${came} of ${expected} attended${extra ? ` (+${extra} not scheduled)` : ''} · ${[...new Set(day.secs.map(s => s.type === 'instruction' ? 'Instruction' : 'support'))].join(' + ').replace(/^s/, 'S')}, ${shortRange(Math.min(...day.secs.map(s => s.startMin)), Math.max(...day.secs.map(s => s.endMin)))}`
    : `Not on the schedule · ${day.extras.length} joined`;
  const xd = !!state.data.extraDays[day.dk], open = state.openDays.has(day.dk), subAll = sub + (xd ? ` · day you added, ${addedLabel(state.lastAnalysis, day.dk)}` : '');
  return `<details class="day" data-dk="${day.dk}"${open ? ' open' : ''}>
    <summary><h2>${esc(title)}</h2><span class="sub" title="${esc(subAll)}">${esc(subAll)}</span>
      <span class="counts">${day.students.length ? DAY_BOXES.map(([k, l]) => `<span class="count k-${k}${n[k] ? '' : ' zero'}"${k === 'absent' && exc ? ` title="${exc} of them excused"` : ''}>${n[k]} ${l}</span>`).join('') : ''}
      ${day.unmatched.length ? `<span class="count k-extra">${day.unmatched.length} unmatched Zoom name${day.unmatched.length > 1 ? 's' : ''}</span>` : ''}</span>
    </summary><div class="day-body">${open ? dayBody(day) : ''}</div></details>`;
}
// A row's status in the same words as the day's boxes (present, let go early, late, left early, out mid-class, absent), with the minutes.
function rowChip(f){

function fillDayBody(el){

}
function dayBody(day){

          <span class="meta">${esc(meta.join(', '))}</span>

          ${s.zoomNames.length ? `<span class="meta">In Zoom as ${s.zoomNames.map(z => `“${esc(z)}”`).join(', ')}</span>` : ''}

        <div class="tlc">${timeline(day, s.merged, s.secs)}</div>

    for (const e of extras) h += `<div class="mini"><div class="who"><b>${esc(e.name)}</b></div><div>${timeline(day, e.merged)}</div><div class="small muted">${esc(rangeText(e.merged))}</div></div>`;

/* ---------------- Students: computation ---------------- */
const hasFlag = (s, k) => s.flags.some(f => f.k === k);
const isWhole = s => !s.isAbsent && s.flags.every(f => f.k === 'full' || f.k === 'fin');
const worstFlag = s => s.flags.reduce((w, x) => SEVERITY[x.k] > SEVERITY[w.k] ? x : w);
const isExcused = s => s.flags[0].k === 'exc';
// Minutes a student left early after finishing their work. They come out of the "scheduled" total.
function finSplit(s){
  if (s._fin) return s._fin;
  let r = { fin: 0, finI: 0, finS: 0 };
  if (s.flags.some(x => x.k === 'fin')){
    // Everything missed after leaving, less what was missed before joining or mid-class, so the rounded minutes always add up.
    const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
    let iOther = 0, sOther = 0;
    for (const g of segsOf(s)) if (g.k !== 'in' && g.k !== 'fin'){ const i = overlap(iIv, g.a, g.b); iOther += i; sOther += (g.b - g.a) - i; }
    const finI = Math.max(0, s.instrReqMin - s.instrMin - mins(iOther)), finS = Math.max(0, s.suppReqMin - s.suppMin - mins(sOther));
    r = { fin: finI + finS, finI, finS };
  }
  return (s._fin = r);
}
const finMinOf = s => finSplit(s).fin;

// A student's scheduled sections on one date, from the schedule version in effect that day, days added by hand included.
// With `at`, the regular weekly plan for that weekday in the version in effect on `at` (days added by hand left out).
const planCache = new WeakMap();
function planFor(A, key, dk, at){
  const sched = at ? A.weekSched(at) : A.schedFor(dk), w = DAYS[parseDk(dk).getDay()], len = state.data.settings.sectionLen;
  let m = planCache.get(sched); if (!m) planCache.set(sched, m = new Map());
  const ck = `${w}|${key}|${len}`;
  if (!m.has(ck)) m.set(ck, planOfSecs((sched.days[w] || []).filter(s => s.students.some(n => normKey(n) === key))));
  return m.get(ck);
}
// The plan for a set of sections: their times, and how many minutes of each kind.
function planOfSecs(list){
  const len = state.data.settings.sectionLen;
  const secs = list.map(s => ({ type: s.type, startMin: s.startMin, endMin: s.endMin ?? s.startMin + len })).sort((a, b) => a.startMin - b.startMin);
  if (!secs.length) return null;
  const iv = mergeIntervals(secs.map(s => [s.startMin, s.endMin]));
  const instrMin = sumIv(mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.startMin, s.endMin])));
  const minutes = sumIv(iv);
  return { secs, minutes, instrMin, suppMin: minutes - instrMin, startMin: iv[0][0], endMin: iv[iv.length - 1][1] };
}

// Every date in the period the student was scheduled, with what happened (oldest first).
function studentDates(A, key, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && i < 1500; dk = addDays(dk, 1), i++){
    const day = A.dayByDk.get(dk), rec = day ? day.students.find(s => s.key === key) : null;
    const plan = planFor(A, key, dk) || (rec && rec.unsched ? planOfSecs(rec.sections) : null);   // a day they came unscheduled
    if (!plan && !rec) continue;
    const status = rec ? 'held' : day ? 'off' : state.data.noClass[dk] ? 'noclass' : dk === today ? 'pending' : dk > today ? 'upcoming' : 'missing';
    if (status === 'off') continue;
    out.push({ dk, status, plan, rec, day });
  }
  return out;
}


/* Where each scheduled minute of a class day went: in Zoom, before joining, out of Zoom mid-class, after leaving,
   or a whole day absent. The report's bars and strips are drawn from this; the numbers on the page come from summarize(). */
const clockMinF = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };   // clock time, safe across daylight saving
const hm = t => fmt(t).replace(/\s?[AP]M$/, '');
const dayLetters = s => [...new Set(s.flags.map(f => f.k === 'soft' ? 'early' : f.k))].filter(k => k !== 'full').sort((a, b) => SEVERITY[b] - SEVERITY[a]).slice(0, 2);
// Spans in ms, inside the scheduled time only. Finished-work and excused time are their own kinds and aren't counted.
function segsOf(s){
  const R = mergeIntervals(s.secs.map(x => [x.a, x.b])), out = [];
  if (isExcused(s)) return R.map(([a, b]) => ({ k: 'exc', a, b }));
  if (s.isAbsent) return R.map(([a, b]) => ({ k: 'absent', a, b }));
  const fin = hasFlag(s, 'fin');
  const kind = (a, b) => b <= s.firstJoin ? 'before' : a >= s.lastLeave ? (fin ? 'fin' : 'after') : 'out';
  for (const [A, B] of R){
    let cur = A;
    for (const [a, b] of s.merged){
      if (b <= cur || a >= B) continue;
      if (a > cur) out.push({ k: kind(cur, a), a: cur, b: a });
      out.push({ k: 'in', a: Math.max(a, cur), b: Math.min(b, B) });
      cur = Math.min(b, B); if (cur >= B) break;
    }
    if (cur < B) out.push({ k: kind(cur, B), a: cur, b: B });
  }
  return out;
}
// Splits a whole-minute total by weights (largest remainder), so the parts always add up to the total.
function apportion(total, W){
  const K = ['before', 'out', 'after'], r = { before: 0, out: 0, after: 0 }, sum = K.reduce((t, k) => t + W[k], 0);
  if (total <= 0) return r;
  if (!sum){ r.after = total; return r; }   // a rounding minute with no gap to show it in
  const raw = K.map(k => total * W[k] / sum);
  K.forEach((k, i) => { r[k] = Math.floor(raw[i]); });
  let left = total - K.reduce((t, k) => t + r[k], 0);
  K.map((k, i) => [k, raw[i] - Math.floor(raw[i]), i]).sort((x, y) => y[1] - x[1] || x[2] - y[2])
    .forEach(([k]) => { if (left > 0){ r[k]++; left--; } });
  return r;
}
// One held, not-excused day in whole minutes, anchored to the day's own rounded numbers.
function dayParts(s){
  const { fin, finI, finS } = finSplit(s), z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const P = { instruction: z(), support: z(), fin, clamped: 0 };
  P.instruction.in = s.instrMin; P.support.in = s.suppMin;
  if (s.isAbsent){
    const sa = s.suppReqMin - s.suppMin;
    P.instruction.absent = s.instrReqMin - s.instrMin; P.support.absent = Math.max(0, sa);
    if (sa < 0) P.clamped = -sa;
    return P;
  }
  const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
  const W = { instruction: { before: 0, out: 0, after: 0 }, support: { before: 0, out: 0, after: 0 } };
  for (const g of segsOf(s)){
    if (g.k === 'in' || g.k === 'fin') continue;   // finished-work minutes aren't counted
    const iMs = overlap(iIv, g.a, g.b), sMs = (g.b - g.a) - iMs;
    W.instruction[g.k] += iMs; W.support[g.k] += sMs;
  }
  let sT = s.suppReqMin - s.suppMin - finS;
  if (sT < 0){ P.clamped = -sT; sT = 0; }   // a rounding minute between presentMin and instrMin
  Object.assign(P.instruction, apportion(s.instrReqMin - s.instrMin - finI, W.instruction));
  Object.assign(P.support, apportion(sT, W.support));
  return P;
}
function partTotals(ctx){
  const z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const T = { instruction: z(), support: z(), excDays: 0, excMin: 0, finDays: 0, finMin: 0, clamped: 0 };
  for (const d of ctx.dates){
    if (d.status !== 'held') continue;

This is an update regarding ${name}'s attendance ${when}.

function studentSummary(days){
  const map = new Map();
  for (const day of [...days].reverse()) for (const s of day.students){   // oldest first
    if (!map.has(s.key)) map.set(s.key, { key: s.key, name: s.name, rec: [] });
    map.get(s.key).rec.push({ day, s });

// Plain counts for one student. The page reports these; it doesn't judge them.
function summarize(p){
  const c = { sessions: 0, excused: 0, attended: 0, absent: 0, late: 0, missed: 0, early: 0, soft: 0, drop: 0, full: 0,
    pres: 0, req: 0, finMin: 0, iPres: 0, iReq: 0, sPres: 0, sReq: 0 };
  for (const { s } of p.rec){
    c.sessions++;
    if (isExcused(s)){ c.excused++; continue; }
    const { fin, finI, finS } = finSplit(s);
    c.req += s.reqMin - fin; c.pres += s.presentMin; c.finMin += fin;
    c.iReq += s.instrReqMin - finI; c.iPres += s.instrMin; c.sReq += s.suppReqMin - finS; c.sPres += s.suppMin;

    if (hasFlag(s, 'soft')) c.soft++;
    if (hasFlag(s, 'drop')) c.drop++;

}

// Weekly totals for the chart and the calendar rows. Upcoming days are left out, so this week is "so far".
function weekRows(dates, period, hasPlan = () => true){
  const map = new Map(), today = todayDk(), thisWeek = weekKey(today);
  // A week is complete when none of the student's scheduled days in it fall outside the period
  // (so a period ending on a Friday still counts its last week).
  const inside = wk => { for (let i = 0; i < 7; i++){ const dk = addDays(wk, i); if ((dk < period.from || dk > period.to) && hasPlan(dk)) return false; } return true; };
  for (const d of dates){
    const wk = weekKey(d.dk);
    if (!map.has(wk)) map.set(wk, { wk, received: 0, missed: 0, excFin: 0, notHeld: 0, noReport: 0, cameDays: 0, heldDays: 0,
      waiting: 0, iRec: 0, iReq: 0, absentDks: [], dates: [] });
    const w = map.get(wk); w.dates.push(d);
    if (d.status === 'held'){
      const s = d.rec;

      const fin = finMinOf(s);
      w.received += s.presentMin; w.missed += s.reqMin - s.presentMin - fin; w.excFin += fin;
      w.heldDays++; if (!s.isAbsent) w.cameDays++; else w.absentDks.push(d.dk);

    counted: w.received + w.missed,
    complete: !w.waiting && inside(w.wk),
    current: w.wk === thisWeek }));
}

// Whether a schedule version starting on `from` changed this student's days or times

function planChanged(A, key, from){
  const p = dk => JSON.stringify(planFor(A, key, dk, dk));

  const P = periodOf(state.lastAnalysis), end = P.open ? addDays(weekKey(todayDk()), 6) : P.to, what = `${state.data.extraDays[dk] ? 'Added' : 'Changed'} ${esc(shortDate(dk))}.`;
  say(P.open && dk > end ? `${what} It shows on the Overview when its week comes.`
    : state.range.preset !== 'all' && (dk < P.from || dk > end) ? `${what} It isn’t in the dates shown. <button class="linkish" data-range="all" data-ovday="${dk}">Show all dates</button>` : what);
}

// "Show dropped" appears only when someone has been dropped.
function droppedToggle(A){

}

/* ---------------- Support hour tab ----------------
   A quick check during a support hour: who was let go early this week for finishing their work
   (the days you marked "Finished work"). Always the current week. */
function supportWeek(A){
  const today = todayDk(), wk = weekKey(today), days = [], people = new Map();
  for (let i = 0; i < 7; i++){
    const dk = addDays(wk, i), secs = (A.schedFor(dk).days[DAYS[parseDk(dk).getDay()]] || []).filter(x => x.type === 'support' && x.students.length);
    if (!secs.length) continue;
    days.push(dk);
    const rep = A.dayByDk.get(dk);
    for (const x of secs) for (const n of x.students){
      const k = normKey(n); if (!k) continue;
      if (!people.has(k)) people.set(k, { key: k, name: A.nameOf[k] || n, days: [] });
      const P = people.get(k); if (P.days.some(e => e.dk === dk)) continue;
      const rec = rep ? rep.students.find(r => r.key === k) : null;
      const kind = rec ? (hasFlag(rec, 'fin') ? 'fin' : hasFlag(rec, 'soft') || (rec.canFinish && leftInSupport(rec)) ? 'soft' : rec.isAbsent ? (isExcused(rec) ? 'exc' : 'absent') : hasFlag(rec, 'early') ? 'early' : 'full')
        : state.data.excused[`${dk}|${k}`] ? 'fin' : state.data.noClass[dk] ? 'noclass' : dk < today ? 'missing' : dk === today ? 'today' : 'later';   // marked before the report
      P.days.push({ dk, kind, rec, xk: `${dk}|${k}` });
    }
  }
  return { today, wk, days, people: [...people.values()].sort((a, b) => a.name.localeCompare(b.name)) };
}
// Whether the student's last time in Zoom ended during a support hour (for a day that was only a moment in Zoom, too).
function leftInSupport(rec){
  const inWin = rec.merged.filter(([a, b]) => b > rec.winStart && a < rec.winEnd), t = rec.lastLeave ?? (inWin.length ? inWin[inWin.length - 1][1] : null);
  return t !== null && rec.secs.some(x => x.type === 'support' && t > x.a && t <= x.b);
}
const supDay = dk => `${shortDate(dk).replace(/,.*/, '')} ${parseDk(dk).getDate()}`;
const supLeft = d => { const r = d.rec; if (!r) return ''; const iw = r.merged.filter(([a, b]) => b > r.winStart && a < r.winEnd), t = r.lastLeave ?? (iw.length ? iw[iw.length - 1][1] : null); return t ? `left ${hm(t)}` : ''; };
// One support day with its mark button. Marking (or undoing) changes the row in place, so nothing moves under the pointer.
// In the lists under a column header (with the student's name as `who`), the box stands alone and its label is for screen readers.
function supItem(d, who){
  const on = d.kind === 'fin', label = 'Finished work, let go early';
  const box = who ? `<button class="tgl" data-supmark="${esc(d.xk)}" aria-pressed="${on}"><span class="tbox" aria-hidden="true"></span><span class="sr">${esc(`${label}, ${who}, ${supDay(d.dk)}`)}</span></button>`
    : tgl('data-supmark', d.xk, on, label);
  return `<span class="sup-item"><span>${esc(supDay(d.dk))}${supLeft(d) ? `, ${esc(supLeft(d))}` : ''}</span>${box}</span>`;
}
const supColHead = '<div class="sup-colh" aria-hidden="true"><span>Student</span><span><span>Day</span><span>Finished work, let go early</span></span></div>';
function supportResults(W){
  const q = normKey(state.supQuery || ''), of = (p, k) => p.days.filter(d => d.kind === k);
  const chip = d => `<span class="sdc">${esc(supDay(d.dk))} ${d.kind === 'today' ? '<span class="muted">today</span>' : d.kind === 'later' ? '<span class="muted">later</span>' : letterCell(d.kind, '')}</span>`;
  if (q){
    const hits = W.people.filter(p => normKey(p.name).includes(q));
    if (!hits.length) return `<p class="muted">No one with a support hour this week matches “${esc(state.supQuery)}”.</p>`;
    const kinds = new Set(hits.flatMap(p => p.days.map(d => d.kind)));
    return `<ul class="sup-list sup-found">${hits.map(p => {
      const fin = of(p, 'fin'), soft = of(p, 'soft'), miss = of(p, 'missing'), lines = [];
      if (fin.length) lines.push(`<div class="sup-yes">${letterCell('fin', '')} Let go early this week: ${fin.map(d => supItem(d)).join('')}</div>`);
      if (soft.length) lines.push(`<div class="sup-soft">${letterCell('soft', '')} Left the support hour early, not marked: ${soft.map(d => supItem(d)).join('')}</div>`);
      if (!fin.length && !soft.length) lines.push(`<div class="sup-no">${miss.length ? `Not marked as let go early. ${esc(miss.map(d => supDay(d.dk)).join(', '))}: no Zoom report yet.` : 'Not let go early this week.'}</div>`);
      return `<li><b>${esc(p.name)}</b>${lines.join('')}<span class="sup-days">${p.days.map(chip).join('')}</span></li>`; }).join('')}</ul>
      <div class="legend-line" aria-hidden="true">${LETTER_ORDER.filter(k => kinds.has(k) && LETTER_SUPPORT[k]).map(k => `<span>${letterCell(k, '')} ${esc(LETTER_SUPPORT[k])}</span>`).join('')}</div>`;
  }
  const yes = W.people.filter(p => of(p, 'fin').length);
  const unm = W.people.flatMap(p => of(p, 'soft').map(d => ({ p, d })));
  return `<h3 class="sup-h">Let go early this week <span class="muted">(finished work)</span></h3>
    ${yes.length ? `${supColHead}<ul class="sup-list sup-cols">${yes.map(p => `<li><b>${esc(p.name)}</b><span>${of(p, 'fin').map(d => supItem(d, p.name)).join('')}</span></li>`).join('')}</ul>` : '<p class="muted">No one yet.</p>'}
    ${unm.length ? `<details class="sup-unm" data-supunm${state.supUnmOpen ? ' open' : ''}><summary>Left the support hour early, not marked (${unm.length})</summary>
      ${supColHead}<ul class="sup-list sup-cols">${unm.map(({ p, d }) => `<li><b>${esc(p.name)}</b><span>${supItem(d, p.name)}</span></li>`).join('')}</ul></details>` : ''}`;

function renderSupport(){

/* ---------------- Students tab: the list ---------------- */
function meter(v){
  if (v === null) return '<span class="zero">—</span>';
  return `<span class="meter"><span class="track"><span class="fill" style="width:${v}%"></span></span><b>${v}%</b></span>`;
}
const cnt = n => `<span class="${n ? '' : 'zero'}">${n}</span>`;
// Leaving the support hour early reads as leaving early here (only the Support hour tab tells them apart).
function cellKind(d){ const k = d.status === 'held' ? worstFlag(d.rec).k : d.status; return k === 'soft' ? 'early' : k; }
function cellTitle(d){
  if (d.status === 'held') return `${shortDate(d.dk)}: ${d.rec.flags.map(f => f.label).join(', ')}`;
  if (d.status === 'noclass') return `${shortDate(d.dk)}: No class (${NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other'})`;
  if (d.status === 'missing') return `${shortDate(d.dk)}: No Zoom report`;
  return shortDate(d.dk);
}
const letterCell = (k, title) => `<span class="lc ${k === 'noclass' || k === 'missing' ? 'lc-' + k : 'k-' + k}" title="${esc(title)}" aria-hidden="true">${LETTER[k]}</span>`;
function lastTen(dates){
  const xs = dates.filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing').slice(-10);
  if (!xs.length) return '<span class="zero">—</span>';
  const counts = {}; for (const d of xs){ const k = cellKind(d); counts[k] = (counts[k] || 0) + 1; }
  const absentDks = xs.filter(d => cellKind(d) === 'absent').map(d => d.dk);
  const label = `Last ${plural(xs.length, 'class day')}: ` + LETTER_ORDER.filter(k => counts[k])
    .map(k => `${counts[k]} ${LETTER_TEAM[k]}${k === 'absent' ? ` (${listJoin(absentDks.map(monDay), 4)})` : ''}`).join(', ');
  return `<div class="last10" role="img" aria-label="${esc(label)}">${xs.map(d => letterCell(cellKind(d), cellTitle(d))).join('')}</div>`;
}
function letterLegend(kinds, words = LETTER_TEAM){
  const ks = LETTER_ORDER.filter(k => kinds.has(k) && words[k]);
  return ks.length ? `<div class="legend-line" aria-hidden="true">${ks.map(k => `<span>${letterCell(k, '')} ${esc(words[k])}</span>`).join('')}</div>` : '';
}
function studentList(A){

// The weekly schedule as a picture: one row per class day on a shared clock, with the instruction and
// support-hour blocks drawn where they fall. Screen readers get the same schedule as a sentence.
// Support time that overlaps instruction counts as instruction, so only the support pieces outside it are drawn.
// Each piece keeps its section's full times (startMin/endMin) for labels; a/b are what's drawn.
function drawnSecs(secs){
  const I = mergeIntervals(secs.filter(x => x.type === 'instruction').map(x => [x.startMin, x.endMin]));
  const out = secs.filter(x => x.type === 'instruction').map(x => ({ ...x, type: 'instruction', a: x.startMin, b: x.endMin }));
  for (const x of secs.filter(x => x.type !== 'instruction')){
    let cur = x.startMin;
    for (const [a, b] of I){ if (b <= cur || a >= x.endMin) continue; if (a > cur) out.push({ ...x, type: 'support', a: cur, b: a }); cur = Math.max(cur, b); }
    if (cur < x.endMin) out.push({ ...x, type: 'support', a: cur, b: x.endMin });
  }
  return out.sort((p, q) => p.a - q.a);

        const mn = isExcused(s) || s.isAbsent ? '' : s.presentMin;
        const title = `${shortDate(dk)}: ${s.flags.map(x => x.label).join(', ')}${mn !== '' ? ` · ${s.presentMin} of ${s.reqMin - finMinOf(s)} min` : ''}`;
        body += cell(`k-${worst}`, dk, `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${L.map(k => LETTER[k]).join('')}</span><span class="mn" aria-hidden="true">${mn}</span>`, title);
      } else if (d && (d.status === 'noclass' || d.status === 'missing')){
        kinds.add(d.status);
        body += cell(`c-${d.status}`, dk, `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER[d.status]}</span>`, cellTitle(d));
      } else if (d) body += `<td class="c-pending"><span class="dn">${num}</span><span class="sr">${esc(shortDate(dk))}: not yet</span></td>`;
      else if (dk >= period.from && dk <= period.to) body += `<td class="c-off"><span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER.off}</span><span class="sr">${esc(shortDate(dk))}: not on the schedule</span></td>`;
      else body += '<td></td>';
    }
    body += '</tr>';
  }
  const came = wds.map(wd => {
    const held = dates.filter(d => d.status === 'held' && !isExcused(d.rec) && parseDk(d.dk).getDay() === wd), att = held.filter(d => !d.rec.isAbsent);
    return held.length ? `${att.length} of ${held.length}` : '—';
  });
  const heldN = dates.filter(d => d.status === 'held').length;
  return `<div class="calwrap" style="max-width:${wds.length * 104 + 90}px"><table class="cal"><caption class="sr">Calendar of ${plural(heldN, 'class day')}. Letters show what happened each day.</caption>
    <thead><tr><th class="wk"><span class="sr">Week of</span></th>${wds.map(w => `<th scope="col">${cap(DAYS[w]).slice(0, 3)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody><tfoot><tr><th scope="row">Came</th>${came.map(x => `<td>${esc(x)}</td>`).join('')}</tr></tfoot></table></div>
    ${letterLegend(kinds, LETTER_FAMILY)}<p class="caption">The number is minutes in class.</p>`;
}

// The day picked on the calendar, shown under its week: the class drawn large, the times, the note and the actions.
function dayDetail(ctx){
  const d = state.selDay && ctx.dates.find(x => x.dk === state.selDay);
  if (!d || !['held', 'noclass', 'missing'].includes(d.status)) return '';
  const nav = ctx.dates.filter(x => ['held', 'noclass', 'missing'].includes(x.status)), i = nav.findIndex(x => x.dk === d.dk);
  const prev = nav[i - 1], next = nav[i + 1];
  const navs = `<span class="dd-nav">${prev ? `<button class="linkish" data-selday="${prev.dk}" data-selnav="prev" aria-label="Previous class day, ${esc(longDate(prev.dk))}">‹ ${esc(shortDate(prev.dk))}</button>` : '<span></span>'}${next ? `<button class="linkish" data-selday="${next.dk}" data-selnav="next" aria-label="Next class day, ${esc(longDate(next.dk))}">${esc(shortDate(next.dk))} ›</button>` : '<span></span>'}</span>`;
  const head = `<b>${esc(longDate(d.dk))}</b>`, close = `<button class="linkish" data-selday="">Close</button>`;
  if (d.status === 'noclass') return `<div class="daydetail" data-dk="${d.dk}"><div class="dd-head">${head}
    <span class="muted">No class: ${esc(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other')}</span>
    <span class="dd-links"><button class="linkish" data-undonoclass="${d.dk}">Undo</button>${close}${navs}</span></div></div>`;
  if (d.status === 'missing') return `<div class="daydetail" data-dk="${d.dk}"><div class="dd-head">${head}<span class="dd-links">${close}${navs}</span></div>
    <p class="small" style="margin:0">No Zoom report for this day. If class met, save the report into the folder and click Refresh. If not: ${reasonSelect()}
    <button class="btn small ghost" data-noclass="${d.dk}">Mark no class</button></p></div>`;
  const s = d.rec, fin = finMinOf(s), win = winOf(d), lo = win[0], hi = win[1];
  const X = t => (clockMinF(t) - lo) / Math.max(1, hi - lo) * 100, Xm = m => (m - lo) / Math.max(1, hi - lo) * 100;
  // Labels over the schedule ribbon.
  // The picture is about 760px wide or more on a computer screen.
  const ribbon = drawnSecs(d.plan ? d.plan.secs : []).map(x => {
    const wPct = Xm(x.b) - Xm(x.a), px = wPct / 100 * 760, full = `${secName(x)} ${shortRange(x.startMin, x.endMin)}`;
    return { x: Xm(x.a), w: wPct, type: x.type, text: full.length * 6.8 + 10 <= px ? full : shortRange(x.startMin, x.endMin).length * 6.8 + 10 <= px ? shortRange(x.startMin, x.endMin) : '' };
  });
  // Times worth naming: when they joined late, each time out of Zoom, when they left early. Labels that would collide move to the line below.
  const segs = segsOf(s), L = [];
  if (!s.isAbsent && segs.some(g => g.k === 'before')) L.push({ x: X(s.firstJoin), text: 'joined ' + hm(s.firstJoin) });
  const outs = segs.filter(g => g.k === 'out' && g.b - g.a >= 60000);
  for (const g of outs) L.push({ x: X((g.a + g.b) / 2), text: `out ${hm(g.a)}–${hm(g.b)}`, center: true });
  if (!s.isAbsent && segs.some(g => g.k === 'after' || g.k === 'fin')) L.push({ x: X(s.lastLeave), text: 'left ' + hm(s.lastLeave) });
  L.forEach(l => { l.align = l.center ? (l.x < 15 ? 'start' : l.x > 85 ? 'end' : 'center') : l.x < 50 ? 'start' : 'end'; });
  const fits = Wpx => { const kept = new Set(); let lastEnd = -Infinity;
    for (const l of [...L].sort((a, b) => a.x - b.x)){
      const w = l.text.length * 6.6 + 6, px = l.x / 100 * Wpx;
      const a = l.align === 'start' ? px : l.align === 'end' ? px - w : px - w / 2, b = a + w;
      if (a < 0 || b > Wpx || a < lastEnd + 8) continue;
      kept.add(l); lastEnd = b;
    }
    return kept; };
  const kept = fits(760);
  const ev = L.filter(l => kept.has(l)).map(l => `<span class="a-${l.align}" style="left:${l.x.toFixed(2)}%">${esc(l.text)}</span>`).join('');
  const extra = L.filter(l => !kept.has(l)).map(l => ` · ${esc(l.text)}`).join('');
  const mline = (s.unsched ? `Not on ${ctx.first}’s schedule this day · ` : '') + (isExcused(s) ? `Excused, not counted (${s.reqMin} min)`
    : `${s.presentMin} of ${s.reqMin - fin} min${s.instrReqMin - finSplit(s).finI > 0 && s.suppReqMin - finSplit(s).finS > 0 ? ` · instruction ${s.instrMin} of ${s.instrReqMin - finSplit(s).finI} · support hour ${s.suppMin} of ${s.suppReqMin - finSplit(s).finS}` : ''}${fin ? ` · ${fin} min finished work early, not counted` : ''}`);
  // The old facts sentence becomes the picture's text for screen readers.
  const facts = [];
  if (s.firstJoin) facts.push(`Joined ${fmt(s.firstJoin)}`, `Left ${fmt(s.lastLeave)}`);
  if (!isExcused(s)) facts.push(`${s.presentMin} of ${s.reqMin - fin} minutes`);
  for (const g of outs) facts.push(`Out of Zoom ${fmt(g.a)}–${fmt(g.b)}`);
  return `<div class="daydetail" data-dk="${d.dk}">
    <div class="dd-head">${head}<span class="chips">${s.flags.map(f => `<span class="chip k-${f.k}">${esc(f.label)}</span>`).join('')}</span>
      <span class="dd-links"><button class="linkish" data-goday="${d.dk}" data-xkey="${esc(s.xkey)}">Open on Reports</button>${close}${navs}</span></div>
    <div class="ddpic" role="img" aria-label="${esc(facts.join('. ') || 'Not in Zoom')}">
      <div class="ribl" aria-hidden="true">${ribbon.map(r => `<span style="left:${(r.x + r.w / 2).toFixed(2)}%">${esc(r.text)}</span>`).join('')}</div>
      <div class="rib" aria-hidden="true">${ribbon.map(r => `<span class="${r.type}" style="left:${r.x.toFixed(2)}%;width:${r.w.toFixed(2)}%"></span>`).join('')}</div>
      ${stripHTML(d, lo, hi)}
      ${ev ? `<div class="ev" aria-hidden="true">${ev}</div>` : ''}</div>
    <p class="small dd-min">${esc(mline)}${extra}</p>
    ${s.zoomNames.length ? `<p class="small muted dd-min">In Zoom as ${esc(s.zoomNames.map(z => `“${z}”`).join(', '))}</p>` : ''}
    ${(() => { const f = formOf(ctx.A, ctx.key, d.dk); return f ? `<p class="small dd-min">Formative: ${!f.inFile ? 'not in the export' : f.total ? `answered ${f.answered} of ${plural(f.total, 'question')}${f.pct !== null ? `, score ${f.pct}%` : ''}` : f.pct !== null ? `score ${f.pct}%` : 'no score'}</p>` : ''; })()}
    <div class="ddact">${s.canFinish || state.data.excused[s.xkey] ? tgl('data-excuse', s.xkey, state.data.excused[s.xkey], 'Finished work, let go early') : ''}
      ${s.isAbsent ? tgl('data-excabs', s.xkey, state.data.excusedAbsent[s.xkey], 'Excused absence') : ''}
      <label class="ddnote"><span class="small muted">Note</span><input type="text" data-ovnote="${esc(s.xkey)}" value="${esc(s.note)}" placeholder="Optional"></label></div></div>`;
}
// Every class day as a table: printed on request, and on screen under "Show every day as a table".
function dayTableHTML(ctx, notes){
  const rows = ctx.dates.filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing');

  return `<table class="hist"><thead><tr><th>Date</th><th>Status</th><th>Joined</th><th>Left</th><th>Instruction</th><th>Support</th>${notes ? '<th>Note</th>' : ''}</tr></thead><tbody>
    ${rows.map(d => {

    }).join('')}</tbody></table>`;
}
function printDayTable(ctx, o){

/* Follow-up log: what has been done about it */

const fuSorted = key => [...(state.data.followUps[key] || [])].sort((a, b) => b.date.localeCompare(a.date));

const fuLine = (f, prefix = '') => `<li><span class="when">${esc(prefix + monDay(f.date))}</span><b>${esc(fuHow(f))}</b><span class="txt">${esc(f.text)}</span></li>`;

      : `<li><span class="when">${esc(monDay(f.date))}</span><b>${esc(fuHow(f))}</b><span class="txt">${esc(f.text)}</span>
          <button class="linkish" data-fuedit="${esc(f.id)}">Edit</button><button class="linkish" data-fudel="${esc(f.id)}">Delete</button></li>`).join('')}</ul>`
      : '<p class="small muted">No follow-ups logged yet.</p>'}
    <div class="fuform" data-fuform>${fuInputs(pre)}<button class="btn small" data-fuadd>Add</button></div></section>`;

/* Note to the family: fixed, warm sentences with the student's numbers slotted in. Never notes, follow-ups or Zoom names. */
const draftKey = ctx => ctx.key;   // one draft per student; it remembers which dates it was written for
function familySchedule(ctx){
  const groups = [];
  for (const { w, plan } of ctx.info.byW){
    const g = groups.find(x => x.s === plan.startMin && x.e === plan.endMin);
    if (g) g.ws.push(w); else groups.push({ s: plan.startMin, e: plan.endMin, ws: [w] });
  }
  if (!groups.length) return '';
  const parts = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)}, ${fmtRange(g.s, g.e)}`);
  return `Class meets on ${parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(', ')}, and ${parts[parts.length - 1]}`}.`;
}
// A short, warm note with the student's numbers. You edit it before sending; it never includes notes or follow-ups.
function familyNote(ctx){
  const { p, period, first: F } = ctx, S = state.data.settings;
  const L = [`Hello, ${F}’s family,`, '', `This is an update on ${F}’s attendance in ${S.className || 'our intervention class'} from ${monthDay(period.from)} to ${monthDay(period.calcTo)}.`];
  if (!p || !p.n) L.push('There were no class days to count in this time.');
  else {
    const R = p.rec.filter(r => !isExcused(r.s)), n = p.n, x = p.attended, lastR = R[R.length - 1], prevR = R[R.length - 2];
    let saidAll = false;
    if (p.absent === 0){ saidAll = true; L.push(n >= 3 ? `${F} came to all ${n} classes. Thank you!` : n === 2 ? `${F} came to both classes. Thank you!` : `${F} came to class on ${longDate(R[0].day.dk)}. Thank you!`); }
    else if (x >= 1 && p.full === x) L.push(`When ${F} came to class, ${F} stayed the whole time.`);
    else if (prevR && !lastR.s.isAbsent && prevR.s.isAbsent) L.push(`It was great to see ${F} back in class on ${longDate(lastR.day.dk)}.`);
    else if (x >= 1) L.push(`We were glad to see ${F} in class.`);   // the next line gives the count
    else L.push(`We miss ${F} in class. ${F} is always welcome.`);
    if (!saidAll && x > 0) L.push(`${F} came to ${x} of ${plural(n, 'class', 'classes')}.`);
    if (p.dose !== null && p.rate !== null && p.dose <= p.rate - 10) L.push(`${F} was in class for ${nf(p.pres)} of ${nf(p.req)} minutes.`);
  }
  const sch = familySchedule(ctx); if (sch) L.push(sch);
  L.push('', 'Thank you,');
  if (S.teacherName) L.push(S.teacherName);
  if (S.contactLine) L.push(S.contactLine);
  return L.join('\n');
}
function familyText(ctx){
  const d = state.familyDraft[draftKey(ctx)];
  return d ? d.text : familyNote(ctx);
}
function familySection(ctx){
  return `<section class="rsec noprint"><details data-familybox${state.familyOpen ? ' open' : ''}><summary><h3 style="display:inline">Write a note to the family</h3></summary>
    ${(() => { const d = state.familyDraft[draftKey(ctx)];
      return d && (d.from !== ctx.period.from || d.to !== ctx.period.to) && isDk(d.from) && isDk(d.to)
        ? `<p class="small" style="color:var(--late)">You edited this note for ${esc(fmtPeriod(d))}. Click Start over to write it for these dates.</p>` : ''; })()}
    <textarea class="family" rows="10" data-familydraft="${esc(draftKey(ctx))}" data-familyfrom="${esc(ctx.period.from)}" data-familyto="${esc(ctx.period.to)}" aria-label="Note to the family">${esc(familyText(ctx))}</textarea>
    <div class="actions"><button class="btn small" data-copyfamily>Copy note</button><button class="btn small ghost" data-familyreset>Start over</button>

    <p class="small muted">Never includes your day notes or follow-up log. Read it before you send it.</p></details></section>`;
}
const tile = (label, value, sub) => `<div class="tile"><div class="l">${esc(label)}</div><div class="n">${esc(value)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;

// How the numbers are counted, on paper only.
function footerSection(ctx, o){

  const S = state.data.settings, held = ctx.dates.filter(d => d.status === 'held').map(d => d.dk);

  return `<footer class="rsec small muted"><p style="margin:0">${esc(src + def)} <b>Confidential student information.</b></p>
    <h3 style="margin-top:14px">Team notes</h3><div class="ruled"></div><div class="ruled"></div><div class="ruled"></div></footer>`;
}

/* Copy summary (plain text for an email or a form) and the one-student CSV */
function teamSummary(ctx, inc){
  const { p, period, info, dates } = ctx, S = state.data.settings;
  const L = [`${ctx.name}: intervention attendance`,
    `${fmtPeriod(period)} · ${plural(p ? p.sessions : 0, 'class day')} with Zoom reports`,
    `Scheduled: ${info.line ? `${info.line} · ${info.weekMin} minutes a week` : 'not on the schedule'}`];
  if (p){

      `Minutes received: ${p.pres} of ${p.req}${p.dose === null ? '' : ` (${p.dose}%)`}${p.iReq && p.sReq ? `; instruction ${p.iPres} of ${p.iReq}, support ${p.sPres} of ${p.sReq}` : ''}`,

  L.push('', `Class days: ${held + nc.length + ms.length} scheduled, ${held} held${nc.length ? `, ${nc.length} not held (${nc.map(d => `${monDay(d.dk)}: ${(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'other').toLowerCase()}`).join(', ')})` : ''}${ms.length ? `, ${ms.length} without a Zoom report (${ms.map(d => monDay(d.dk)).join(', ')})` : ''}.`);
  if (inc.log){

    L.push('Follow-up:'); if (!fs.length) L.push('- None logged.');

  return L.join('\n');
}
function exportStudent(ctx){

function versionLabel(i){
  const vs = state.data.scheduleVersions, v = vs[i], next = vs[i + 1], today = todayDk();
  if (v.from && v.from > today) return `Starts ${monDay(v.from)}`;
  const end = next ? monDay(addDays(next.from, -1)) : '';
  if (!next || next.from > today) return `${v.from ? `Current, since ${monDay(v.from)}` : 'Current'}${next ? ` (until ${end})` : ''}`;

// A corrected spelling keeps the student's notes, marks and follow-ups.
function renameStudentKey(oldK, newK){
  if (!oldK || !newK || oldK === newK) return;
  const D = state.data;
  for (const bag of [D.notes, D.excused, D.excusedAbsent]) for (const k of Object.keys(bag)){
    const i = k.indexOf('|');
    if (k.slice(i + 1) === oldK){ const nk = k.slice(0, i + 1) + newK; if (!(nk in bag)) bag[nk] = bag[k]; delete bag[k]; }
  }
  if (D.followUps[oldK]){ D.followUps[newK] = [...(D.followUps[newK] || []), ...D.followUps[oldK]]; delete D.followUps[oldK]; }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}
const respellText = (text, a, b) => text.split('\n').map(r => r.split('\t').map(c => normKey(c) === normKey(a) ? b : c).join('\t')).join('\n');
function applySchedule(mode, from){
  const vs = state.data.scheduleVersions, text = state.draft;
  if (mode === 'start' && !schedStartOk({ mode, date: from })) return;
  if (mode === 'start'){
    const i = vs.findIndex(v => v.from === from);
    if (i >= 0) vs[i].text = text; else { vs.push({ from, text }); vs.sort((a, b) => a.from.localeCompare(b.from)); }
  } else {
    for (const [a, b] of scheduleDiff(state.data.scheduleText, text).respelled){
      for (const v of vs.slice(0, -1)) v.text = respellText(v.text, a, b);
      renameStudentKey(normKey(a), normKey(b));
    }
    vs[vs.length - 1].text = text;
  }
  vs[0].from = '';
  state.data.scheduleText = vs[vs.length - 1].text;
  state.draft = null; state.schedChange = null; state.viewVersion = null;
  changed(); renderSchedule();
}

function ingest(files, dataText, folderName){

  else if (dataText){
    try {

    } catch (e){ msg = `${DATA_FILE} couldn’t be read, so the schedule and settings weren’t loaded.`; }
  }

  else if (state.loaded && !same) state.data = defaultData();
  state.files = files.sort((a, b) => a.name.localeCompare(b.name));
  state.folderName = folderName; state.loaded = true; state.dirty = keep; state.draft = null; state.noteEdit = null;
  state.fuEdit = null; state.fuEditDraft = null; state.schedChange = null; state.viewVersion = null;

}

    if (b){ b.scrollIntoView({ block: 'center' }); focusOvCell(xk); } else focusStudentLink(leaving);
  }
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
let closedForPrint = [];
window.addEventListener('beforeprint', () => {
  if (state.tab === 'overview' && state.loaded){
    // The Overview prints in landscape, so a whole class and about six weeks fit on each page.
    let ps = $('#ovPage'); if (!ps){ ps = document.createElement('style'); ps.id = 'ovPage'; document.head.append(ps); }
    ps.textContent = '@page{size:landscape;margin:.4in}';
    document.body.classList.add('print-ov'); state.ovPrintAll = true; renderOverview();
  }
  if (state.tab === 'reports' && !document.body.classList.contains('print-reports')){
    closedForPrint = [...document.querySelectorAll('#tab-reports details.day:not([open])')];
    closedForPrint.forEach(d => { fillDayBody(d); d.open = true; });
  }
  // Ctrl+P on a student report prints the report, not the screen.
  if (state.tab === 'students' && state.student && !document.body.classList.contains('print-reports')){
    const A = state.lastAnalysis || analyze();
    $('#printArea').innerHTML = studentReportHTML(ctxFor(A, state.student, periodOf(A)), { print: true, include: state.include });
    document.body.classList.add('print-reports');
  }
});
window.addEventListener('afterprint', () => {
  if (state.ovPrintAll){ state.ovPrintAll = false; renderOverview(); }
  const ps = $('#ovPage'); if (ps) ps.remove();
  document.body.classList.remove('print-ov');
  document.body.classList.remove('print-reports');
  closedForPrint.forEach(d => { d.open = false; }); closedForPrint = [];
});
window.addEventListener('beforeunload', e => { if (state.dirty && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; render();   // the start screen now offers this folder
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){}
})();
</script>
</body>
