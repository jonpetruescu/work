  // Header: weekday, its schedule as a thin ribbon, and the clock at each end.
  const head = cols.map(c => {
    const X = m => ((m - c.lo) / Math.max(1, c.hi - c.lo) * 100).toFixed(2);
    const px = c.weight / W * (showWk ? .69 : .93) * 720 - 40, lw = t => t.length * 7 + 6;
    const sL = clockLabel(c.lo), eL = clockLabel(c.hi), showE = lw(sL) + lw(eL) <= px;
    const mids = [];
    for (let m = Math.ceil((c.lo + 1) / 60) * 60; m < c.hi; m += 60){
      const x = (m - c.lo) / Math.max(1, c.hi - c.lo) * px, w2 = lw(clockLabel(m)) / 2;
      if (x - w2 >= lw(sL) && x + w2 <= px - (showE ? lw(eL) : 0)) mids.push(m);
    }
    return `<th scope="col" class="wdh">${cap(DAYS[c.wd]).slice(0, 3)}<span class="sr">, ${esc(shortRange(c.lo, c.hi))}</span>
      <div class="colaxis" aria-hidden="true"><div class="rib">${drawnSecs(c.ribbon).map(x => `<span class="${x.type}" style="left:${X(x.a)}%;width:${(X(x.b) - X(x.a)).toFixed(2)}%"></span>`).join('')}</div>
      <div class="ticks"><span class="s">${sL}</span>${mids.map(m => `<span class="mid" style="left:${X(m)}%">${clockLabel(m)}</span>`).join('')}${showE ? `<span class="e">${eL}</span>` : ''}</div></div></th>`;
  }).join('');
  const notesOn = !o.print || o.include.notes;
  let body = '', prevMonth = null, ci = 0, row = 0;
  for (const w of weeks){
    while (ci < chg.length && w.dates.some(d => d.dk >= chg[ci])){ body += `<tr class="chg"><td colspan="${nCols}">New times from ${esc(shortDate(chg[ci]))}</td></tr>`; ci++; }
    const month = parseDk(w.wk).getMonth(), first = prevMonth === null, moChange = !first && month !== prevMonth;
    const label = roomy || first || moChange ? monDay(w.wk) : String(parseDk(w.wk).getDate());
    prevMonth = month; row++;
    body += `<tr${moChange && !roomy ? ' class="mo"' : ''}><th scope="row" class="lab"><span class="sr">Week of ${esc(monDay(w.wk))}</span><span aria-hidden="true">${esc(label)}</span></th>`;
    cols.forEach((c, n) => {
      const dk = addDays(w.wk, (c.wd + 6) % 7), d = w.dates.find(x => x.dk === dk);
      if (!d){ body += dk >= period.from && dk <= period.to ? `<td class="c-off"><span class="sr">${esc(shortDate(dk))}: not on the schedule</span></td>` : '<td></td>'; return; }
      if (d.status === 'pending' || d.status === 'upcoming'){
        body += `<td><div class="scell" title="${esc(shortDate(dk))}"><span class="gut"></span>${stripHTML(d, c.lo, c.hi)}<span></span><span class="sr">${esc(shortDate(dk))}: not yet</span></div></td>`; return;
      }
      let gut = '', inner = '';
      if (d.status === 'held'){
        const L = dayLetters(d.rec).slice(0, g2on ? 2 : 1);
        gut = L.map((k, m) => `<span class="g k-${k}${m ? ' g2' : ''}">${LETTER[k]}</span>`).join('');
        inner = stripHTML(d, c.lo, c.hi);
      } else gut = `<span class="g lc-${d.status}">${LETTER[d.status]}</span>`, inner = '<span class="ds"></span>';
      const dot = d.rec && d.rec.note && notesOn ? '<span class="nd"></span>' : '<span></span>';
      const sentence = daySentence(d);
      const kids = `<span class="gut" aria-hidden="true">${gut}</span>${inner}${dot.replace('<span', '<span aria-hidden="true"')}`;
      body += o.print ? `<td><div class="scell">${kids}<span class="sr">${esc(sentence)}</span></div></td>`
        : `<td><button class="sbtn" data-selday="${dk}" data-r="${row}" data-c="${n}" aria-pressed="${selD && selD.dk === dk}" tabindex="${dk === focusDk ? 0 : -1}" aria-label="${esc(sentence)}" title="${esc(sentence)}">${kids}</button></td>`;
    });
    if (showWk) body += weekBar(w, max, fusByWk.get(w.wk), o);
    body += '</tr>';
    if (selD && weekKey(selD.dk) === w.wk) body += `<tr class="ddrow"><td colspan="${nCols}">${dayDetail(ctx)}</td></tr>`;
  }
  // Per weekday, over every week: how many classes they came to, and how many of those on time.
  const came = [], ontime = [];
  for (const c of cols){
    const held = dates.filter(d => d.status === 'held' && !isExcused(d.rec) && parseDk(d.dk).getDay() === c.wd), att = held.filter(d => !d.rec.isAbsent);
    came.push(held.length ? `${att.length} of ${held.length}` : '—');
    const grace = state.data.settings.lateGrace * 60000;
    ontime.push(att.length ? `${att.filter(d => d.rec.firstJoin <= d.rec.winStart + grace).length} of ${att.length}` : '—');
  }
  const frow = (label, xs) => `<tr><th scope="row">${label}</th>${xs.map(x => `<td>${esc(x)}</td>`).join('')}${showWk ? '<td class="swk"></td>' : ''}</tr>`;
  const glyphs = [];
  if (dates.some(d => d.status === 'noclass')) glyphs.push(`<span>${letterCell('noclass', '')} no class</span>`);
  if (dates.some(d => d.status === 'missing')) glyphs.push(`<span>${letterCell('missing', '')} no Zoom report</span>`);
  if (notesOn && dates.some(d => d.rec && d.rec.note)) glyphs.push('<span><span class="nd"></span> has a note</span>');
  if (fusByWk.size && (!o.print || o.include.log)) glyphs.push('<span><span class="fuk">◆</span> follow-up logged that week</span>');
  if (!o.print) glyphs.push('<span class="cal-hint">Click a day for details.</span>');
  const cls = ['scal', roomy && 'roomy', dprint && 'dprint', g2on && 'g2on', wds.length >= 3 && 'wd3', wds.length >= 4 && 'wd4', !showWk && 'nowk'].filter(Boolean).join(' ');
  const held = dates.filter(d => d.status === 'held').length;
  const caption = 'Each bar is one class, start to end, colored as above. Light gray: not counted (finished work early, excused) or not yet.'
    + (o.print ? ' Each week: minutes in Zoom of the minutes counted that week.' : '');
  return `<p class="caption cal-cap">${caption}</p>${glyphs.length ? `<div class="legend-line" aria-hidden="true">${glyphs.join('')}</div>` : ''}
    <table class="${cls}"><caption class="sr">Calendar of ${plural(held, 'class day')}, one row per week.${o.print ? '' : ' Each day is a button; use the arrow keys to move between days.'}</caption>
    <colgroup><col class="c-lab">${cols.map(c => `<col class="c-wd" style="--wa:${(c.weight / W * (showWk ? 69 : 93)).toFixed(2)}%;--wb:${(c.weight / W * (!showWk || wds.length >= 4 ? 86 : 64)).toFixed(2)}%">`).join('')}${showWk ? '<col class="c-wk">' : ''}</colgroup>
    <thead><tr><th class="lab"><span class="sr">Week of</span></th>${head}${showWk ? `<th scope="col" class="swk">Each week<div class="colaxis wkax" aria-hidden="true"><div class="ticks"><span class="s">0</span><span class="e">${max} min</span></div></div></th>` : ''}</tr></thead>
    <tbody>${body}</tbody><tfoot>${frow('Came', came)}${frow('On time', ontime)}</tfoot></table>
    ${o.print ? '' : `<details class="daytable" data-daytable${state.dayTableOpen ? ' open' : ''}><summary>Show every day as a table</summary>${dayTableHTML(ctx, true)}</details>`}`;
}

// The family version keeps the simple letter calendar.
function calendarHTML(ctx){
  const { weeks, period, dates } = ctx;
  const wds = [...new Set(dates.map(d => parseDk(d.dk).getDay()))].sort(byWeekOrder);
  if (!wds.length) return '<p class="muted small">No scheduled days in these dates.</p>';
  const kinds = new Set();
  const cell = (cls, dk, inner, title) => `<td class="${cls}" data-dk="${dk}">${inner}<span class="sr">${esc(title)}</span></td>`;
  let body = '';
  for (const w of weeks){
    body += `<tr><th class="wk" scope="row">${esc(monDay(w.wk))}</th>`;
    for (const wd of wds){
      const dk = addDays(w.wk, (wd + 6) % 7), d = w.dates.find(x => x.dk === dk), num = parseDk(dk).getDate();
      if (d && d.status === 'held'){
        const s = d.rec, worst = worstFlag(s).k;
        let L = [...new Set(s.flags.map(x => x.k))].sort((a, b) => SEVERITY[b] - SEVERITY[a]).filter(k => k !== 'full');
        if (!L.length) L = ['full'];
        L = L.slice(0, 2); L.forEach(k => kinds.add(k));
        const mn = isExcused(s) || s.isAbsent ? '' : s.presentMin;
        const title = `${shortDate(dk)}: ${s.flags.map(x => x.label).join(', ')}${mn !== '' ? ` · ${s.presentMin} of ${s.reqMin - finMinOf(s)} min` : ''}`;
        body += cell(`k-${worst}`, dk, `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${L.map(k => LETTER[k]).join('')}</span><span class="mn" aria-hidden="true">${mn}</span>`, title);
      } else if (d && (d.status === 'noclass' || d.status === 'missing')){
        kinds.add(d.status);
        body += cell(`c-${d.status}`, dk, `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER[d.status]}</span>`, cellTitle(d));
      } else if (d) body += `<td class="c-pending"><span class="dn">${num}</span><span class="sr">${esc(shortDate(dk))}: not yet</span></td>`;
      else if (dk >= period.from && dk <= period.to) body += `<td class="c-off"><span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER.off}</span><span class="sr">${esc(shortDate(dk))}: not on the schedule</span></td>`;
      else body += '<td></td>';
    }
    body += '</tr>';
  }
  const came = wds.map(wd => {
    const held = dates.filter(d => d.status === 'held' && !isExcused(d.rec) && parseDk(d.dk).getDay() === wd), att = held.filter(d => !d.rec.isAbsent);
    return held.length ? `${att.length} of ${held.length}` : '—';
  });
  const heldN = dates.filter(d => d.status === 'held').length;
  return `<div class="calwrap" style="max-width:${wds.length * 104 + 90}px"><table class="cal"><caption class="sr">Calendar of ${plural(heldN, 'class day')}. Letters show what happened each day.</caption>
    <thead><tr><th class="wk"><span class="sr">Week of</span></th>${wds.map(w => `<th scope="col">${cap(DAYS[w]).slice(0, 3)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody><tfoot><tr><th scope="row">Came</th>${came.map(x => `<td>${esc(x)}</td>`).join('')}</tr></tfoot></table></div>
    ${letterLegend(kinds, LETTER_FAMILY)}<p class="caption">The number is minutes in class.</p>`;
}

// The day picked on the calendar, shown under its week: the class drawn large, the times, the note and the actions.
function dayDetail(ctx){
  const d = state.selDay && ctx.dates.find(x => x.dk === state.selDay);
  if (!d || !['held', 'noclass', 'missing'].includes(d.status)) return '';
  const nav = ctx.dates.filter(x => ['held', 'noclass', 'missing'].includes(x.status)), i = nav.findIndex(x => x.dk === d.dk);
  const prev = nav[i - 1], next = nav[i + 1];
  const navs = `<span class="dd-nav">${prev ? `<button class="linkish" data-selday="${prev.dk}" data-selnav="prev" aria-label="Previous class day, ${esc(longDate(prev.dk))}">‹ ${esc(shortDate(prev.dk))}</button>` : '<span></span>'}${next ? `<button class="linkish" data-selday="${next.dk}" data-selnav="next" aria-label="Next class day, ${esc(longDate(next.dk))}">${esc(shortDate(next.dk))} ›</button>` : '<span></span>'}</span>`;
  const head = `<b>${esc(longDate(d.dk))}</b>`, close = `<button class="linkish" data-selday="">Close</button>`;
  if (d.status === 'noclass') return `<div class="daydetail" data-dk="${d.dk}"><div class="dd-head">${head}
    <span class="muted">No class: ${esc(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other')}</span>
    <span class="dd-links"><button class="linkish" data-undonoclass="${d.dk}">Undo</button>${close}${navs}</span></div></div>`;
  if (d.status === 'missing') return `<div class="daydetail" data-dk="${d.dk}"><div class="dd-head">${head}<span class="dd-links">${close}${navs}</span></div>
    <p class="small" style="margin:0">No Zoom report for this day. If class met, save the report into the folder and click Refresh. If not: ${reasonSelect()}
    <button class="btn small ghost" data-noclass="${d.dk}">Mark no class</button></p></div>`;
  const s = d.rec, fin = finMinOf(s), win = winOf(d), lo = win[0], hi = win[1];
  const X = t => (clockMinF(t) - lo) / Math.max(1, hi - lo) * 100, Xm = m => (m - lo) / Math.max(1, hi - lo) * 100;
  // Labels over the schedule ribbon.
  // The picture is about 760px wide or more on a computer screen.
  const ribbon = drawnSecs(d.plan ? d.plan.secs : []).map(x => {
    const wPct = Xm(x.b) - Xm(x.a), px = wPct / 100 * 760, full = `${secName(x)} ${shortRange(x.startMin, x.endMin)}`;
    return { x: Xm(x.a), w: wPct, type: x.type, text: full.length * 6.8 + 10 <= px ? full : shortRange(x.startMin, x.endMin).length * 6.8 + 10 <= px ? shortRange(x.startMin, x.endMin) : '' };
  });
  // Times worth naming: when they joined late, each time out of Zoom, when they left early. Labels that would collide move to the line below.
  const segs = segsOf(s), L = [];
  if (!s.isAbsent && segs.some(g => g.k === 'before')) L.push({ x: X(s.firstJoin), text: 'joined ' + hm(s.firstJoin) });
  const outs = segs.filter(g => g.k === 'out' && g.b - g.a >= 60000);
  for (const g of outs) L.push({ x: X((g.a + g.b) / 2), text: `out ${hm(g.a)}–${hm(g.b)}`, center: true });
  if (!s.isAbsent && segs.some(g => g.k === 'after' || g.k === 'fin')) L.push({ x: X(s.lastLeave), text: 'left ' + hm(s.lastLeave) });
  L.forEach(l => { l.align = l.center ? (l.x < 15 ? 'start' : l.x > 85 ? 'end' : 'center') : l.x < 50 ? 'start' : 'end'; });
  const fits = Wpx => { const kept = new Set(); let lastEnd = -Infinity;
    for (const l of [...L].sort((a, b) => a.x - b.x)){
      const w = l.text.length * 6.6 + 6, px = l.x / 100 * Wpx;
      const a = l.align === 'start' ? px : l.align === 'end' ? px - w : px - w / 2, b = a + w;
      if (a < 0 || b > Wpx || a < lastEnd + 8) continue;
      kept.add(l); lastEnd = b;
    }
    return kept; };
  const kept = fits(760);
  const ev = L.filter(l => kept.has(l)).map(l => `<span class="a-${l.align}" style="left:${l.x.toFixed(2)}%">${esc(l.text)}</span>`).join('');
  const extra = L.filter(l => !kept.has(l)).map(l => ` · ${esc(l.text)}`).join('');
  const mline = (s.unsched ? `Not on ${ctx.first}’s schedule this day · ` : '') + (isExcused(s) ? `Excused, not counted (${s.reqMin} min)`
    : `${s.presentMin} of ${s.reqMin - fin} min${s.instrReqMin - finSplit(s).finI > 0 && s.suppReqMin - finSplit(s).finS > 0 ? ` · instruction ${s.instrMin} of ${s.instrReqMin - finSplit(s).finI} · support hour ${s.suppMin} of ${s.suppReqMin - finSplit(s).finS}` : ''}${fin ? ` · ${fin} min finished work early, not counted` : ''}`);
  // The old facts sentence becomes the picture's text for screen readers.
  const facts = [];
  if (s.firstJoin) facts.push(`Joined ${fmt(s.firstJoin)}`, `Left ${fmt(s.lastLeave)}`);
  if (!isExcused(s)) facts.push(`${s.presentMin} of ${s.reqMin - fin} minutes`);
  for (const g of outs) facts.push(`Out of Zoom ${fmt(g.a)}–${fmt(g.b)}`);
  return `<div class="daydetail" data-dk="${d.dk}">
    <div class="dd-head">${head}<span class="chips">${s.flags.map(f => `<span class="chip k-${f.k}">${esc(f.label)}</span>`).join('')}</span>
      <span class="dd-links"><button class="linkish" data-goday="${d.dk}" data-xkey="${esc(s.xkey)}">Open in Days</button>${close}${navs}</span></div>
    <div class="ddpic" role="img" aria-label="${esc(facts.join('. ') || 'Not in Zoom')}">
      <div class="ribl" aria-hidden="true">${ribbon.map(r => `<span style="left:${(r.x + r.w / 2).toFixed(2)}%">${esc(r.text)}</span>`).join('')}</div>
      <div class="rib" aria-hidden="true">${ribbon.map(r => `<span class="${r.type}" style="left:${r.x.toFixed(2)}%;width:${r.w.toFixed(2)}%"></span>`).join('')}</div>
      ${stripHTML(d, lo, hi)}
      ${ev ? `<div class="ev" aria-hidden="true">${ev}</div>` : ''}</div>
    <p class="small dd-min">${esc(mline)}${extra}</p>
    ${s.zoomNames.length ? `<p class="small muted dd-min">In Zoom as ${esc(s.zoomNames.map(z => `“${z}”`).join(', '))}</p>` : ''}
    ${(() => { const g = ctx.A.dmByDk.get(d.dk), x = g && dmOf(ctx.A, ctx.key, d.dk); return g ? `<p class="small dd-min">DeltaMath: ${!x ? `not in the export${!s.isAbsent && s.suppMin > 0 ? ', counted as no work' : ''}` : `${esc(dmWork(x))}${!s.isAbsent && !(s.suppMin > 0) ? ` (not counted: ${dmWhy(s)})` : ''}${dmEach(x).map(y => `<br>· ${esc(y)}`).join('')}`}</p>` : ''; })()}
    ${(() => { const f = formOf(ctx.A, ctx.key, d.dk); return f ? `<p class="small dd-min">Formative: ${!f.inFile ? 'not in the export' : f.parts.length > 1 ? `${f.parts.length} together, ${fAnswered(f, true)}${fEach(f).map(x => `<br>· ${esc(x)}`).join('')}` : f.total ? `${fAnswered(f, true)}${f.pct !== null ? `, score ${f.pct}%` : ''}` : f.pct !== null ? `score ${f.pct}%` : 'no score'}</p>` : ''; })()}
    <div class="ddact">${s.canFinish || state.data.excused[s.xkey] ? tgl('data-excuse', s.xkey, state.data.excused[s.xkey], 'Finished work, let go early') : ''}
      ${s.isAbsent ? tgl('data-excabs', s.xkey, state.data.excusedAbsent[s.xkey], 'Excused absence') : ''}
      <label class="ddnote"><span class="small muted">Note</span><input type="text" data-ovnote="${esc(s.xkey)}" value="${esc(s.note)}" placeholder="Optional"></label></div></div>`;
}
// Every class day as a table: printed on request, and on screen under "Show every day as a table".
function dayTableHTML(ctx, notes){
  const rows = ctx.dates.filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing');
  if (!rows.length) return '';
  const blank = notes ? '<td></td>' : '';
  return `<table class="hist"><thead><tr><th>Date</th><th>Status</th><th>Joined</th><th>Left</th><th>Instruction</th><th>Support</th>${notes ? '<th>Note</th>' : ''}</tr></thead><tbody>
    ${rows.map(d => {
      if (d.status !== 'held') return `<tr><td>${esc(shortDate(d.dk))}</td><td>${d.status === 'noclass' ? `No class: ${esc(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other')}` : 'No Zoom report'}</td><td>—</td><td>—</td><td>—</td><td>—</td>${blank}</tr>`;
      const s = d.rec, ex = isExcused(s);
      const part = (got, of) => !of ? '—' : ex ? `— of ${of}` : `${got} of ${of}`;
      return `<tr><td>${esc(shortDate(d.dk))}</td><td>${esc(s.flags.map(f => f.label).join(', '))}</td><td>${esc(fmt(s.firstJoin))}</td><td>${esc(fmt(s.lastLeave))}</td>
        <td>${part(s.instrMin, s.instrReqMin)}</td><td>${part(s.suppMin, s.suppReqMin)}</td>${notes ? `<td>${esc(s.note)}</td>` : ''}</tr>`;
    }).join('')}</tbody></table>`;
}
function printDayTable(ctx, o){
  const t = dayTableHTML(ctx, o.include.notes);
  return t ? `<section class="rsec"><h3>Every class day</h3>${t}</section>` : '';
}

/* Follow-up log: what has been done about it */
const fuHow = f => FU_HOW[f.how] || 'Other';
const fuSorted = key => [...(state.data.followUps[key] || [])].sort((a, b) => b.date.localeCompare(a.date));
const fuInputs = f => `<input type="date" data-fudate value="${esc(f.date)}" aria-label="Date">
  <select data-fuhow aria-label="How">${Object.entries(FU_HOW).map(([k, l]) => `<option value="${k}"${f.how === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
  <input type="text" data-futext maxlength="300" placeholder="What happened" value="${esc(f.text)}" aria-label="What happened">`;
const fuLine = (f, prefix = '') => `<li><span class="when">${esc(prefix + monDay(f.date))}</span><b>${esc(fuHow(f))}</b><span class="txt">${esc(f.text)}</span></li>`;
function followUpSection(ctx, o){
  const all = fuSorted(ctx.key);
  if (o.print){
    const inP = all.filter(f => f.date >= ctx.period.from && f.date <= ctx.period.to), earlier = all.find(f => f.date < ctx.period.from);
    const items = [...inP.map(f => fuLine(f)), ...(earlier ? [fuLine(earlier, 'Earlier: ')] : [])];
    return `<section class="rsec"><h3>Follow-up</h3>${items.length ? `<ul class="fu">${items.join('')}</ul>` : '<p class="small">No follow-ups logged.</p>'}</section>`;
  }
  const pre = state.fuPrefill && state.fuPrefill.key === ctx.key ? state.fuPrefill : { date: todayDk(), how: 'call', text: '' };
  return `<section class="rsec" data-fusection><h3>Follow-up log</h3>
    ${all.length ? `<ul class="fu">${all.map(f => state.fuEdit === f.id
      ? `<li class="fuform" data-fuform data-fuid="${esc(f.id)}">${fuInputs(state.fuEditDraft && state.fuEditDraft.id === f.id ? state.fuEditDraft : f)}<button class="btn small" data-fusave="${esc(f.id)}">Save</button><button class="btn small ghost" data-fucancel>Cancel</button></li>`
      : `<li><span class="when">${esc(monDay(f.date))}</span><b>${esc(fuHow(f))}</b><span class="txt">${esc(f.text)}</span>
          <button class="linkish" data-fuedit="${esc(f.id)}">Edit</button><button class="linkish" data-fudel="${esc(f.id)}">Delete</button></li>`).join('')}</ul>`
      : '<p class="small muted">No follow-ups logged yet.</p>'}
    <div class="fuform" data-fuform>${fuInputs(pre)}<button class="btn small" data-fuadd>Add</button></div></section>`;
}

/* Note to the family: fixed, warm sentences with the student's numbers slotted in. Never notes, follow-ups or Zoom names. */
const draftKey = ctx => ctx.key;   // one draft per student; it remembers which dates it was written for
function familySchedule(ctx){
  const groups = [];
  for (const { w, plan } of ctx.info.byW){
    const g = groups.find(x => x.s === plan.startMin && x.e === plan.endMin);
    if (g) g.ws.push(w); else groups.push({ s: plan.startMin, e: plan.endMin, ws: [w] });
  }
  if (!groups.length) return '';
  const parts = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)}, ${fmtRange(g.s, g.e)}`);
  return `Class meets on ${parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(', ')}, and ${parts[parts.length - 1]}`}.`;
}
// A short, warm note with the student's numbers. You edit it before sending; it never includes notes or follow-ups.

    let saidAll = false;
    if (p.absent === 0){ saidAll = true; L.push(n >= 3 ? `${F} came to all ${n} classes. Thank you!` : n === 2 ? `${F} came to both classes. Thank you!` : `${F} came to class on ${longDate(R[0].day.dk)}. Thank you!`); }
    else if (x >= 1 && p.full === x) L.push(`When ${F} came to class, ${F} stayed the whole time.`);
    else if (prevR && !lastR.s.isAbsent && prevR.s.isAbsent) L.push(`It was great to see ${F} back in class on ${longDate(lastR.day.dk)}.`);

    else L.push(`We miss ${F} in class. ${F} is always welcome.`);
    if (!saidAll && x > 0) L.push(`${F} came to ${x} of ${plural(n, 'class', 'classes')}.`);

    for (const who of new Set([...ins, ...sup])){
      const s = ins.includes(who) ? 13 * 60 : 14 * 60, e = sup.includes(who) ? 15 * 60 : 14 * 60, r = rnd();

  const qs = ['1. Solve 3x + 4 = 19', '2. Solve 5x - 2 = 3x + 8', '3. Graph y = 2x + 1', '4. Slope through (1, 2) and (3, 8)', '5. Write 0.75 as a fraction', '6. Exit ticket'];

/* ---------------- Tour ----------------

   or a way to walk others through the page. A step with nothing to point at (no support hour, no reports yet) is skipped. */
const TOUR = [

let tourAt = -1;
const tourSteps = () => TOUR.map((x, i) => i).filter(i => !TOUR[i].tab || !tabHidden(TOUR[i].tab));
function startTour(){ const d = $('#helpDlg'); if (d.open) d.close(); endTour(); tourStep(1); }
function tourStep(dir){
  for (let i = tourAt + dir; i >= 0 && i < TOUR.length; i += dir){
    const x = TOUR[i];
    if (x.tab){
      if (tabHidden(x.tab)) continue;
      if (state.tab !== x.tab || state.student || state.ovMark || state.ovSel || state.ovDay){
        tourAt = i; Object.assign(state, { tab: x.tab, student: null, ovMark: null, ovSel: null, ovDay: null }); render(); navReplace();
      }
    }
    const el = x.at(); if (!el) continue;
    tourAt = i; showTour(el); return;
  }
  if (dir > 0) endTour();
}
function showTour(el){
  document.querySelectorAll('.tour-on').forEach(x => x.classList.remove('tour-on'));
  el.classList.add('tour-on');
  const r = el.getBoundingClientRect();
  if (r.height > innerHeight * .55) window.scrollBy(0, r.top - 120); else el.scrollIntoView({ block: 'center', inline: 'nearest' });
  const list = tourSteps(), n = list.indexOf(tourAt), x = TOUR[tourAt], last = n === list.length - 1;
  let card = $('#tour');
  if (!card){ card = document.createElement('div'); card.id = 'tour'; card.className = 'tour'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-labelledby', 'tourTitle'); document.body.append(card); }
  card.innerHTML = `<p class="tour-n">Tour · step ${n + 1} of ${list.length}</p><h2 id="tourTitle">${esc(x.title)}</h2><p>${esc(x.text)}</p>
    <div class="tour-b"><button class="linkish" data-tourend>End tour</button>${n > 0 ? '<button class="btn small ghost" data-tourstep="-1">Back</button>' : ''}<button class="btn small" data-tourstep="1">${last ? 'Done' : 'Next'}</button></div>`;
  placeTour();
  card.querySelector('[data-tourstep="1"]').focus({ preventScroll: true });   // Enter goes on to the next step
}
// The card sits beside what it points at (to the right, below, above or to the left, whichever fits), or else in the corner.
function placeTour(){
  if (tourAt < 0) return;
  const x = TOUR[tourAt], card = $('#tour');
  if (x.tab && x.tab !== state.tab) return endTour();   // you went somewhere else
  let el = $('.tour-on');
  if (!el && card && (el = x.at())) el.classList.add('tour-on');   // a redraw replaced it
  if (!el || !card || innerWidth <= 600) return;
  const r = el.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight, m = 14, W = innerWidth, H = innerHeight;
  const fitY = y => Math.max(m, Math.min(y, H - h - m)), fitX = v => Math.max(m, Math.min(v, W - w - m));
  let left = m, top = H - h - m;
  if (r.right + m + w <= W - m && r.width < W * .6){ left = r.right + m; top = fitY(r.top); }
  else if (r.bottom + m + h <= H - m){ left = fitX(r.left); top = r.bottom + m; }
  else if (r.top - m - h >= m){ left = fitX(r.left); top = r.top - m - h; }
  else if (r.left - m - w >= m){ left = r.left - m - w; top = fitY(r.top); }
  card.style.left = left + 'px'; card.style.top = top + 'px';
}
function endTour(){
  if (tourAt < 0) return;
  tourAt = -1; document.querySelectorAll('.tour-on').forEach(x => x.classList.remove('tour-on'));
  const card = $('#tour'), had = card && card.contains(document.activeElement);
  if (card) card.remove();

}

/* ---------------- Google Sheet ----------------
   "Update Google Sheet" sends the Overview grid to a spreadsheet in your school Google account, to share with other teachers. It goes through the small script in that spreadsheet (Settings has it to copy),
   and only when the button is clicked. The script's link and key are kept in this browser, never in the folder.
   Notes, follow-ups, messages to families, Zoom names and grades are never sent. */
const SHEET_URL = /^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.-]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
const SHEET_KEY = /^[0-9a-f]{64}$/, SHEET_VERSION = 2;   // SHEET_VERSION: the script's version this page talks to
const sheetLinkOk = u => /^https:\/\/docs\.google\.com\/spreadsheets\/d\/[A-Za-z0-9_-]+(\/|$)/.test(String(u || ''));
// The tabs are named for the class, as in Settings (or the folder, while that's still the default).
const sheetClass = () => { const n = (state.data.settings.className || '').trim(); return n && n !== defaultData().settings.className ? n : state.folderName || 'My class'; };
// One request to the spreadsheet's script. No cookies or address of this page go with it; the key goes in the body, over HTTPS.
async function sheetCall(conn, msg){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ v: SHEET_VERSION, key: conn.key, ...msg }),
      credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', signal: ctl.signal });
    try { const j = await r.json(); return j && typeof j === 'object' ? j : { ok: false, error: 'not-script' }; } catch (e){ return { ok: false, error: 'not-script' }; }
  } catch (e){ return { ok: false, error: e && e.name === 'AbortError' ? 'timeout' : 'offline' }; }
  finally { clearTimeout(timer); }
}
function sheetError(j){
  return j.error === 'bad-key' ? 'Your Google Sheet didn’t accept the key. In the spreadsheet, click Attendance → Show connection key, and paste it again on the Settings tab.'
    : j.error === 'tab-taken' ? `The spreadsheet already has a tab named “${j.tab}” that this page didn’t make, so nothing was changed. Rename that tab, or change “What families call this class” in Settings.`
    : j.error === 'version' ? 'The script in your spreadsheet is a different version. On the Settings tab, copy the script again, paste it over the old one in Apps Script, and deploy it again.'
    : j.error === 'not-script' ? 'That link didn’t answer like the attendance script. In Apps Script, click Deploy → Manage deployments, and copy the Web app link (it ends in /exec).'
    : j.error === 'timeout' ? 'Google took too long to answer. Try again in a minute.'
    : j.error === 'offline' ? 'Couldn’t reach your Google Sheet. Check that this computer is online. If it is, open Apps Script, click Deploy → Manage deployments, and check that “Who has access” is “Anyone”. (Some schools turn that off; your Google admin can tell you.)'
    : `The Google Sheet couldn’t be updated.${j.message ? ` (${String(j.message).slice(0, 200)})` : ''}`;
}
// The letters a day shows on the Overview.
const sheetLetters = c => [c.cat === 'noclass' ? '–' : c.early ? 'fin' : c.cat === 'missing' ? '?' : '', ...['L', 'C'].filter(l => c[l]), c.msg ? '✓' : ''].filter(Boolean).join(' ');
// What's sent: the Overview grid for every class day (whatever dates are picked on screen), dropped students too,
// as letters, colors and the words for each day (its hover text).
function sheetPayload(){
  const keep = state.range; state.range = { preset: 'all', from: '', to: '' };
  try {
    const A = analyze(), period = periodOf(A), cls = sheetClass(), now = new Date();
    const when = `${monthDay(todayDk())}, ${now.getFullYear()} at ${fmt(now)}`, dropped = key => dropOf(key) ? `Dropped ${monDay(dropOf(key))}` : '';
    const dates = overviewDates(A, period), recs = new Map(A.days.map(d => [d.dk, new Map(d.students.map(x => [x.key, x]))]));
    const rows = A.roster.map(r => ({ r, cells: dates.map(dk => cellState(A, r.key, dk, recs)) })).filter(x => x.cells.some(c => c.cat !== 'nosched' || c.ov.cat));
    const overview = { title: `${cls}: attendance`, note: `Updated ${when}. Point at a day to see what happened.`,
      head: ['Student', ...dates.map(dk => `${dtf({ weekday: 'short' }).format(parseDk(dk))}\n${parseDk(dk).getMonth() + 1}/${parseDk(dk).getDate()}`)],
      rows: rows.map(({ r, cells }) => ({ name: r.name + (dropped(r.key) ? ` (${dropped(r.key).toLowerCase()})` : ''), cells: cells.map(c => [c.cat, sheetLetters(c), cellWords(c)]) })) };
    return { cls, overview, students: rows.length };
  } finally { state.range = keep; }
}
const sheetTitle = () => { const t = state.sheet && state.sheet.sent && state.sheet.sent[sheetClass()];
  return t ? `Last sent ${monDay(dkOf(new Date(t)))} at ${fmt(t)}` : 'Send the Overview to your Google Sheet'; };
const sheetButton = () => state.sheet && !state.demo ? `<button class="btn small ghost gsbtn" data-sheetsend title="${esc(sheetTitle())}"${state.sheetBusy ? ' disabled' : ''}>${state.sheetBusy ? 'Updating…' : 'Update Google Sheet'}</button>` : '';
// The buttons change in place while sending, so nothing on the page moves.
function sheetButtons(){ document.querySelectorAll('[data-sheetsend]').forEach(b => { b.disabled = state.sheetBusy; b.textContent = state.sheetBusy ? 'Updating…' : 'Update Google Sheet'; b.title = sheetTitle(); }); }
async function sendToSheet(){
  const conn = state.sheet;
  if (!conn || state.sheetBusy) return;
  if (state.demo) return setStatus('The sample class is never sent to a Google Sheet. Open your own folder first.');
  const p = sheetPayload();
  if (!p.overview.rows.length) return setStatus('There’s nothing to send yet. Add your schedule and Zoom reports first.');
  state.sheetBusy = true; sheetButtons(); setStatus('Updating your Google Sheet…', 'info');
  const j = await sheetCall(conn, { cls: p.cls, overview: p.overview });
  state.sheetBusy = false;
  if (j.ok){
    conn.sent = { ...conn.sent, [p.cls]: Date.now() }; if (sheetLinkOk(j.url)) conn.link = j.url; idbSet('sheet', conn);
    setStatus(`Google Sheet updated: the Overview for ${plural(p.students, 'student')}, in the tab “${j.tab}”.`, 'info', conn.link ? { label: 'Open the sheet', act: 'opensheet' } : null);
  } else setStatus(sheetError(j));
  sheetButtons();
}
// Connecting checks the link and key with the script before keeping them.
async function connectSheet(){
  const u = $('#gs-url').value.trim(), k = $('#gs-key').value.trim().toLowerCase(), say = (m, f) => { $('#gs-msg').textContent = m; if (f) $(f).focus(); };
  if (!SHEET_URL.test(u)) return say('That isn’t a web app link. In Apps Script, click Deploy → Manage deployments and copy the Web app link. It starts with https://script.google.com/ and ends in /exec.', '#gs-url');
  if (!SHEET_KEY.test(k)) return say('That isn’t the whole connection key. In the spreadsheet, click Attendance → Show connection key and copy all of it.', '#gs-key');
  say('Checking…'); $('[data-sheeton]').disabled = true;
  const j = await sheetCall({ url: u, key: k }, { ping: true });
  $('[data-sheeton]').disabled = false;
  if (!j.ok) return say(sheetError(j));
  if (j.version !== SHEET_VERSION) return say(sheetError({ error: 'version' }));
  state.sheet = { url: u, key: k, name: String(j.name || '').slice(0, 120), link: sheetLinkOk(j.url) ? j.url : '', sent: {} };
  await idbSet('sheet', state.sheet);
  render(); setStatus(`Connected to “${state.sheet.name || 'your spreadsheet'}”. Click Update Google Sheet on the Overview tab to send it.`, 'info');
}
function sheetPanel(){
  const c = state.sheet;
  const sends = '<p class="small muted">Sends the Overview grid (colors, letters, and what happened each day) for every class day. Never sends your notes, follow-ups, messages to families, Zoom names or grades.</p>';
  if (c) return `<div class="panel"><h2>Google Sheet</h2>
    <p class="small">Connected to <b>${esc(c.name || 'your spreadsheet')}</b>. ${state.demo ? 'The sample class is never sent to it.' : 'Click <b>Update Google Sheet</b> on the Overview tab to send the latest.'}</p>
    ${sends}
    <p class="small muted">The link and key are kept in this browser only, not in your folder. Share the spreadsheet with other teachers as <b>Viewer</b>: an editor could open its script and see the key.</p>
    <div class="actions">${state.demo ? '' : `<button class="btn" data-sheetsend title="${esc(sheetTitle())}">Update Google Sheet</button>`}${sheetLinkOk(c.link) ? '<button class="btn ghost" data-statusact="opensheet">Open the sheet</button>' : ''}<button class="linkish" data-sheetoff>Disconnect</button></div></div>`;
  return `<div class="panel"><h2>Google Sheet</h2>

  const p = state.schPop, day = $('#sc-day').value, type = $('#sc-type').value, st = minOf($('#sc-start').value), en = minOf($('#sc-end').value);
  if (st === null || en === null) return schedMsg('Fill in both times.', $(st === null ? '#sc-start' : '#sc-end'));
  if (en <= st) return schedMsg('The class has to end after it starts.', $('#sc-end'));
  const P = boardSched(), cur = p.id ? P.days[p.id.split('|')[0]][+p.id.split('|')[1]] : null, curDay = p.id ? p.id.split('|')[0] : null;
  if (cur && curDay === day && cur.type === type && cur.startMin === st && secEnd(cur) === en){ state.schPop = null; renderSchedule(); return schedFocus(`[data-schclass="${p.id}"]`); }
  const clash = !(cur && curDay === day && cur.type === type && cur.startMin === st) && (P.days[day] || []).some((x, i) => `${day}|${i}` !== p.id && x.type === type && x.startMin === st);
  if (clash) return schedMsg(`There’s already a ${cap(day)} ${type === 'instruction' ? 'instruction class' : 'support hour'} at ${fmtMin(st)}.`, $('#sc-start'));
  state.schPop = null;
  editSchedule(Q => {
    let x = { type, startMin: st, endMin: en, students: [] };
    if (p.id){ const [d0, i0] = p.id.split('|'); x = Q.days[d0].splice(+i0, 1)[0]; Object.assign(x, { type, startMin: st, endMin: en }); }
    x.label = cur && cur.type === type ? keepHeading(x.label, x) : secLabel(x); (Q.days[day] = Q.days[day] || []).push(x);
  });
  schedFocus(`[data-schclass="${day}|${(boardSched().days[day] || []).findLastIndex(x => x.type === type && x.startMin === st && secEnd(x) === en)}"]`);
}
// A heading like "Instruction group B 2-3pm" with new times: "Instruction group B 2:00–3:30 PM" (or the plain heading, if that
// wouldn't read back the same).
function keepHeading(label, x){
  const t = String(label || '').replace(/(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?:\s*(?:-|–|—|to)\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?)?/i, fmtRange(x.startMin, x.endMin)), h = parseSectionHeader(t);
  return h && h.type === x.type && h.startMin === x.startMin && h.endMin === x.endMin ? t : secLabel(x);
}

function schedStudentDone(){
  const p = state.schPop, P = boardSched();
  const name = $('#ss-name').value.replace(/\s+/g, ' ').trim(), k = normKey(name), A = state.lastAnalysis || analyze();
  const bad = schedNameProblem(name); if (bad) return schedMsg(bad, $('#ss-name'));
  const on = new Set([...document.querySelectorAll('#schDlg [data-ssclass]')].filter(c => c.checked).map(c => c.dataset.ssclass));
  const pending = liveRenames().find(([a, b]) => normKey(a) === k && k !== p.key && normKey(b) !== p.key);
  if (pending) return schedMsg(`“${pending[0]}” is spelled “${pending[1]}” in this change. Save it first, then add the other student.`, $('#ss-name'));
  if (!p.key){
    if (P.nameOf[k]) return schedMsg(`${P.nameOf[k]} is already on the schedule. Click their name on the board to change their classes.`, $('#ss-name'));
    if (!on.size) return schedMsg('Check the classes they come to.');
  }
  // Renaming to a student already on the schedule makes them one student (asked once, with Done again).
  const merge = !!p.key && k !== p.key && !!P.nameOf[k];
  if (merge && p.merge !== k){ p.merge = k; return schedMsg(`${P.nameOf[k]} is already on the schedule. Click Done again to make them one student, spelled ${P.nameOf[k]}.`); }
  const was = p.key ? P.nameOf[p.key] : null, spell = merge ? P.nameOf[k] : p.key ? name : A.nameOf[k] && normKey(A.nameOf[k]) === k ? A.nameOf[k] : name;
  state.schPop = null;
  let renames = null;
  if (was && was !== spell){
    const r = state.schRenames.find(z => normKey(z[1]) === p.key);   // renamed twice: one rename, from the first spelling
    renames = [...state.schRenames.filter(z => z !== r), [r ? r[0] : was, spell]].filter(([a, b]) => a !== b);
  }
  editSchedule(Q => {
    for (const d of SCHED_ORDER) (Q.days[d] || []).forEach((x, i) => {
      const others = x.students.filter(n => normKey(n) !== (p.key || k) && normKey(n) !== k), had = merge && x.students.some(n => normKey(n) === k);

}
// A corrected spelling keeps the student's notes, marks and follow-ups.
function renameStudentKey(oldK, newK){
  if (!oldK || !newK || oldK === newK) return;
  const D = state.data;
  for (const bag of [D.notes, D.excused, D.excusedAbsent, D.dayStatus]) for (const k of Object.keys(bag)){
    const i = k.indexOf('|');
    if (k.slice(i + 1) === oldK){ const nk = k.slice(0, i + 1) + newK; if (!(nk in bag)) bag[nk] = bag[k]; else if (bag === D.notes && bag[nk] !== bag[k]) bag[nk] += ` · ${bag[k]}`; delete bag[k]; }
  }
  if (D.followUps[oldK]){ D.followUps[newK] = [...(D.followUps[newK] || []), ...D.followUps[oldK]]; delete D.followUps[oldK]; }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
  for (const bag of [D.drops, D.deleted, D.plans, D.ml]) if (bag[oldK]){ if (!bag[newK]) bag[newK] = bag[oldK]; delete bag[oldK]; }
}
function applySchedule(mode, from){
  const vs = state.data.scheduleVersions, text = state.draft;
  if (mode === 'start' && !schedStartOk({ mode, date: from })) return;
  state.schRenames = liveRenames();
  const A0 = state.schRenames.length ? analyze() : null;   // who each Zoom name matched, before any spelling changes
  let written;
  if (mode === 'start'){
    const i = vs.findIndex(v => v.from === from);
    if (i >= 0) (written = vs[i]).text = text; else { vs.push(written = { from, text }); vs.sort((a, b) => a.from.localeCompare(b.from)); }
  } else (written = vs[vs.length - 1]).text = text;
  // A spelling fixed (on the board, or a pasted name checked as the same student) is fixed in every other schedule too, all at
  // once, so two fixes can't run into each other. The student's notes and marks move with them (through a placeholder, so a
  // student given another's old spelling doesn't pick up theirs), and the Zoom names that were theirs stay linked to them.
  if (state.schRenames.length){
    const D = state.data, to = new Map(state.schRenames.map(([a, b]) => [normKey(a), b]));
    for (const v of vs) if (v !== written) v.text = v.text.split('\n').map(r => r.split('\t').map(c => to.has(normKey(c)) ? to.get(normKey(c)) : c).join('\t')).join('\n');
    state.schRenames.forEach(([a], n) => renameStudentKey(normKey(a), `\u0000${n}`));
    state.schRenames.forEach(([, b], n) => renameStudentKey(`\u0000${n}`, normKey(b)));
    const now = new Set(vs.flatMap(v => parseSchedule(v.text).roster.map(r => r.key))), byName = buildMatcher(A0.roster, {});
    for (const [a, b] of state.schRenames){
      const ok = normKey(a), nk = normKey(b), zoom = new Set([ok]);
      for (const d of A0.days) for (const st of d.students) if (st.key === ok) for (const g of st.segs || []) if ((byName(g.name, '') || {}).key === ok) zoom.add(normKey(g.name));
      for (const z of zoom) if (z && z !== nk && !now.has(z) && !D.aliases[z]) D.aliases[z] = nk;
      if (D.deleted[nk]) D.deleted[nk].name = b;
    }
  }
  vs[0].from = '';
  state.data.scheduleText = vs[vs.length - 1].text;
  state.draft = null; state.schedChange = null; state.viewVersion = null; state.schRenames = []; state.draftUndo = []; state.pasteWarn = null;
  changed(); renderSchedule(); schedFocus();
  setStatus(mode === 'start' ? `Saved. The change starts ${monDay(from)}; days before it keep the schedule they had.` : 'Saved.', 'info', { label: 'Undo', act: 'undo' });
}

async function reopen(){

  const typing = t.closest && t.closest('input:not([type=checkbox]):not([type=radio]), textarea, select, [contenteditable], .planform'), dlg = document.querySelector('dialog[open]');
  if (!typing && !dlg && (e.ctrlKey || e.metaKey) && !e.altKey && /^[zy]$/i.test(e.key)){ e.preventDefault(); undo(e.key.toLowerCase() === 'y' || e.shiftKey); return; }
  if (d.schadd !== undefined && !t.value && (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'z' && state.draftUndo.length){
    e.preventDefault(); const id = d.schadd; undo(false); const nb = $(`#tab-schedule [data-schadd="${CSS.escape(id)}"]`); if (nb) nb.focus(); return;
  }
  if (!typing && !dlg && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.key === '?'){ e.preventDefault(); openHelp(); return; }
    if (e.key === '/'){ const s0 = visible(`#tab-${state.tab} [data-search], #tab-${state.tab} [data-supsearch]`); if (s0){ e.preventDefault(); s0.focus(); s0.select(); } return; }
  }
  if (e.key === 'Escape' && tourAt >= 0 && !typing && !dlg && !hadMenu && !state.ovSel && !state.ovDay && !state.ovMark && !(state.selDay && t.closest && t.closest('.daydetail'))){ endTour(); return; }
  // The tabs: the arrow keys move between them (and open them), Home and End go to the first and last.
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)){
    const tabs = [...document.querySelectorAll('nav.tabs [role=tab]')].filter(b => !b.hidden), i = tabs.indexOf(t);
    const to = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1] : tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    e.preventDefault(); to.click(); to.focus(); return;
  }
  if (t.classList && t.classList.contains('sbtn') && !e.altKey && !e.metaKey && !(e.key === 'Escape' && hadMenu)) return calendarKey(e, t);
  if (t.classList && t.classList.contains('ovb') && !e.altKey && !e.metaKey && !(e.key === 'Escape' && hadMenu)) return overviewKey(e, t);
  if (e.key === 'Escape' && state.ovDay && t.closest && t.closest('.ovdpop, .ovdh')) return closeOvDay(true);
  if (e.key === 'Escape' && state.ovSel && t.closest && t.closest('.ovpop')){
    if (d.ovnote !== undefined) t.blur();   // saves the note first, so the redrawn day shows its note mark
    const was = state.ovSel; state.ovSel = null; renderOverview(); focusOvCell(was); return;
  }
  if (e.key === 'Enter' && d.ovnote !== undefined){ e.preventDefault(); t.blur(); focusOvCell(state.ovSel); return; }
  if (e.key === 'Enter' && d.adddate !== undefined){ e.preventDefault(); state.addDay.date = t.value; addDay(); return; }
  if (e.key === 'Enter' && d.schadd !== undefined){ e.preventDefault(); schedAdd(d.schadd); return; }
  if (e.key === 'Enter' && state.schPop && t.closest && t.closest('#schDlg') && t.tagName === 'INPUT'){ e.preventDefault(); (state.schPop.kind === 'class' ? schedClassDone : schedStudentDone)(); return; }
  if (e.key === 'Enter' && (t.id === 'gs-url' || t.id === 'gs-key')){ e.preventDefault(); connectSheet(); return; }
  if (e.key === 'Escape') document.querySelectorAll('details.menu[open]').forEach(m => {
    const inside = m.contains(document.activeElement); closeMenu(m); if (inside) m.querySelector('summary').focus();
  });
  if (d.note){
    const k = d.note;
    if (e.key === 'Enter'){ e.preventDefault(); commitNote(t); }
    if (e.key === 'Escape'){ state.noteEdit = null; renderCurrent(); }
    if (e.key === 'Enter' || e.key === 'Escape'){ const b = visible(`[data-noteedit="${CSS.escape(k)}"]`); if (b) b.focus({ preventScroll: true }); }
    return;
  }
  const form = t.closest && t.closest('[data-fuform]');
  if (form && t.tagName === 'INPUT'){
    if (e.key === 'Enter'){ e.preventDefault(); const b = form.querySelector('[data-fuadd],[data-fusave]'); if (b) b.click(); }
    if (e.key === 'Escape' && form.dataset.fuid){ state.fuEdit = null; state.fuEditDraft = null; renderStudents(); }
    return;
  }
  // Escape inside the open day closes it and puts focus back on that day.
  if (e.key === 'Escape' && !hadMenu && state.tab === 'students' && state.student && state.selDay && t.closest && t.closest('.daydetail')){
    const was = state.selDay; state.selDay = null; state.noteEdit = null; renderStudents(); focusDayCell(was);
  }
});
// Arrow keys move around the overview grid (one Tab stop for the whole grid); Enter opens a day, Escape closes it.
function overviewKey(e, t){
  const r = +t.dataset.r, c = +t.dataset.c, at = (rr, cc) => $(`#tab-overview .ovb[data-r="${rr}"][data-c="${cc}"]`);
  const all = [...document.querySelectorAll('#tab-overview .ovb')];
  let to = null;
  if (e.key === 'Escape' && state.ovSel){ const was = state.ovSel; state.ovSel = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  if (e.key === 'Escape' && state.ovMark){ const was = t.dataset.ovcell; state.ovMark = null; renderOverview(); focusOvCell(was); e.preventDefault(); return; }
  const step = (dr, dc) => { for (let rr = r + dr, cc = c + dc, n = 0; n < 400; rr += dr, cc += dc, n++){ const b = at(rr, cc); if (b) return b; if (rr < 0 || cc < 0 || rr > 2000 || cc > 2000) break; } return null; };
  if (e.key === 'ArrowRight') to = step(0, 1);
  else if (e.key === 'ArrowLeft') to = step(0, -1);
  else if (e.key === 'ArrowDown') to = step(1, 0);
  else if (e.key === 'ArrowUp') to = step(-1, 0);
  else if (e.key === 'Home' || e.key === 'End'){
    // Earliest or latest day shown in the student's row (Ctrl: in the whole grid).
    const pool = (e.ctrlKey ? all : all.filter(b => +b.dataset.r === r)).sort((x, y) => (+x.dataset.r - +y.dataset.r) || (+x.dataset.c - +y.dataset.c));
    to = e.key === 'Home' ? pool[0] : pool[pool.length - 1];
  }
  else return;
  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus({ preventScroll: true }); to.scrollIntoView({ block: 'nearest', inline: 'nearest' }); revealOvCell(to);
  // Keep the day clear of the date header that sticks to the top of the window.
  const hb = to.closest('table').tHead.rows[1].cells[0].getBoundingClientRect().bottom, top = to.getBoundingClientRect().top;
  if (top < hb) window.scrollBy(0, top - hb - 4);
}
// Arrow keys move between days in the calendar (one Tab stop for the whole calendar).
function calendarKey(e, t){
  const all = [...document.querySelectorAll('#tab-students .scal .sbtn')], row = t.closest('tr');
  const inRow = [...row.querySelectorAll('.sbtn')], c = +t.dataset.c, r = +t.dataset.r;
  let to = null;
  if (e.key === 'Escape'){ if (!$('#tab-students .daydetail')) return; const was = state.selDay; state.selDay = null; renderStudents(); focusDayCell(was); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') to = inRow[inRow.indexOf(t) + 1];
  else if (e.key === 'ArrowLeft') to = inRow[inRow.indexOf(t) - 1];
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const down = e.key === 'ArrowDown', cands = all.filter(b => down ? +b.dataset.r > r : +b.dataset.r < r);
    const same = cands.filter(b => +b.dataset.c === c);
    to = down ? (same[0] || null) : (same[same.length - 1] || null);
  }
  else if (e.key === 'Home') to = e.ctrlKey ? all[0] : inRow[0];
  else if (e.key === 'End') to = e.ctrlKey ? all[all.length - 1] : inRow[inRow.length - 1];
  else return;
  e.preventDefault();
  if (!to) return;
  all.forEach(b => { b.tabIndex = b === to ? 0 : -1; });
  to.focus();
}
let schDown = null;
document.addEventListener('pointerdown', e => { schDown = e.target; }, true);
// Charts: the week-by-week crosshair follows the pointer (or the arrow keys); a bar or row shows its numbers on hover or focus.
document.addEventListener('pointermove', e => {
  const svg = e.target.closest && e.target.closest('svg.vline');
  if (svg){ const D = vizData.get(svg.dataset.vizid), r = svg.getBoundingClientRect(); if (!D) return;
    const vx = (e.clientX - r.left) / r.width * svg.viewBox.baseVal.width; let best = 0; D.x.forEach((x, i) => { if (Math.abs(x - vx) < Math.abs(D.x[best] - vx)) best = i; });
    return vizLineAt(svg, best); }
  const m = e.target.closest && e.target.closest('.vmark, .vrows li');
  if (m) vizTip(m.dataset.tip.split('\n'), e.clientX, e.clientY);
});
document.addEventListener('pointerout', e => {
  const svg = e.target.closest && e.target.closest('svg.vline'); if (svg && !svg.contains(e.relatedTarget)) vizLineOff(svg);
  const m = e.target.closest && e.target.closest('.vmark, .vrows li'); if (m && !m.contains(e.relatedTarget)) vizTip(null);
});
function vizFocus(t){
  if (t.matches('svg.vline')) return vizLineAt(t, t.dataset.at ? +t.dataset.at : vizData.get(t.dataset.vizid).W.length - 1);
  if (t.matches('.vmark, .vrows li')){ const r = t.getBoundingClientRect(); vizTip(t.dataset.tip.split('\n'), r.left + r.width / 2, r.top); }
}
document.addEventListener('focusin', e => { if (e.target.matches) vizFocus(e.target); });
// On scroll, a box for a chart part picked with the keyboard moves with it; one from the pointer closes (pointing again shows it).
addEventListener('scroll', () => {
  if ($('#vizTip').hidden) return;
  const t = document.activeElement;
  if (t && t.matches && t.matches(':focus-visible') && t.matches('svg.vline, .vmark, .vrows li')) return vizFocus(t);
  document.querySelectorAll('svg.vline').forEach(vizLineOff); vizTip(null);
}, { passive: true });
document.addEventListener('focusout', e => { const t = e.target; if (t.matches && t.matches('svg.vline')) vizLineOff(t); else if (t.matches && t.matches('.vmark, .vrows li')) vizTip(null); });
document.addEventListener('close', e => {
  if (e.target.id !== 'schDlg') return;
  state.schPop = null; const b = state.schFrom && visible(state.schFrom); if (b) b.focus();
}, true);
document.addEventListener('toggle', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('day')){
    if (el.open){ state.openDays.add(el.dataset.dk); fillDayBody(el); } else state.openDays.delete(el.dataset.dk);
  }
  if (el.dataset && 'familybox' in el.dataset) state.familyOpen = el.open;
  if (el.dataset && 'supunm' in el.dataset) state.supUnmOpen = el.open;
  if (el.dataset && 'schpaste' in el.dataset) state.pasteOpen = el.open;
  if (el.dataset && 'daytable' in el.dataset) state.dayTableOpen = el.open;
  if (el.dataset && 'addday' in el.dataset){ state.addDay.open = el.open; if (!el.open) el.querySelector('.addmsg').textContent = ''; }
  if (el.dataset && 'rangemenu' in el.dataset) state.rangeMenu = el.open;
  if (el.dataset && 'dropmenu' in el.dataset){ state.dropEdit = el.open ? el.dataset.dropmenu : null; if (el.open) el.querySelector('[data-dropdate]').focus(); }
  if (el.dataset && 'showmenu' in el.dataset) state.showMenu = el.open;
  if (el.dataset && 'planmenu' in el.dataset){ state.planEdit = el.open ? el.dataset.planmenu : null; if (el.open){ const r = el.querySelector('[data-plantype]:checked'); if (r) r.focus(); } }
  // A menu opens rightward unless that would run off the window. The drop menu always opens leftward, inside the report.
  if (el.classList && el.classList.contains('menu') && el.open && !('dropmenu' in el.dataset)){
    const pop = el.querySelector('.pop'); pop.style.left = '0'; pop.style.right = 'auto';
    if (pop.getBoundingClientRect().right > innerWidth - 8){ pop.style.left = 'auto'; pop.style.right = '0'; }
  }
}, true);
// Scrolling the grid sideways: remember where it is (for the next redraw), and keep an open day editor beside its day.
document.addEventListener('scroll', e => {
  if (!e.target.classList || !e.target.classList.contains('ovblock') || state.ovPrintAll) return;
  state.ovScroll = e.target.scrollLeft; pinMonths(e.target); placeOvEditor(); placeOvDay();
}, true);
// A month whose days have mostly scrolled under the names hides its name, so only whole names show at the left edge.
function pinMonths(sc){
  const left = sc.querySelector('th.ovname').getBoundingClientRect().right;
  for (const th of sc.querySelectorAll('th.ovmo')){ const sp = th.firstElementChild; sp.style.visibility = th.getBoundingClientRect().right - left < sp.offsetWidth + 8 ? 'hidden' : ''; }
}
// The grid's blocks for printing fit the page width, so redraw it after the window changes size.
let ovResize = null;
window.addEventListener('resize', () => { clearTimeout(ovResize); ovResize = setTimeout(() => { if (state.tab === 'overview' && state.loaded) renderOverview(); placeTour(); }, 150); });
// The tour's card follows what it points at as the page or the grid scrolls.
document.addEventListener('scroll', () => { if (tourAt >= 0) requestAnimationFrame(placeTour); }, { capture: true, passive: true });
// A click outside Help (on the dimmed page) closes it, as in most apps.
document.querySelectorAll('dialog.dlg').forEach(dl => dl.addEventListener('click', e => {
  const r = dl.getBoundingClientRect();
  if (e.target === dl && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dl.close();
}));
// The skip link moves focus to the page without changing the address (which would count as a step back).
$('.skip').addEventListener('click', e => { e.preventDefault(); $('#main').focus(); });
window.addEventListener('popstate', e => {
  const s = e.state || {}, leaving = state.student;
  navSeq = s.seq || 0;
  state.tab = s.tab || 'overview'; state.student = s.student || null; state.studentFrom = s.from || null; state.studentTab = s.via || null;
  if (s.range) state.range = s.range;
  state.returnTo = s.returnTo || null; state.highlight = s.highlight || null; state.selDay = s.selDay || null;
  state.noteEdit = null; state.fuEdit = null; state.fuEditDraft = null; state.rangeMenu = false; state.dropEdit = null;
  render();
  if (state.student){ const h = $('#tab-students h2[tabindex]'); if (h) h.focus({ preventScroll: true }); }
  else if (leaving){
    // Back from a report opened from a day's editor puts focus back on that day.
    const xk = state.tab === 'overview' && state.ovFrom && state.ovFrom.slice(11) === leaving ? state.ovFrom : null;
    const b = xk && $(`#tab-overview .ovb[data-ovcell="${CSS.escape(xk)}"]`);
    if (b){ b.scrollIntoView({ block: 'center' }); focusOvCell(xk); } else focusStudentLink(leaving);
  }
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
let closedForPrint = [];
window.addEventListener('beforeprint', () => {
  if (state.tab === 'overview' && state.loaded){
    // The Overview prints in landscape, so a whole class and about six weeks fit on each page.
    let ps = $('#ovPage'); if (!ps){ ps = document.createElement('style'); ps.id = 'ovPage'; document.head.append(ps); }
    ps.textContent = '@page{size:landscape;margin:.4in}';
    document.body.classList.add('print-ov'); state.ovPrintAll = true; renderOverview();
  }
  if (state.tab === 'reports' && !document.body.classList.contains('print-reports')){
    closedForPrint = [...document.querySelectorAll('#tab-reports details.day:not([open])')];
    closedForPrint.forEach(d => { fillDayBody(d); d.open = true; });
  }
  // Ctrl+P on a student report prints the report, not the screen.
  if (state.tab === 'students' && state.student && !document.body.classList.contains('print-reports')){
    const A = state.lastAnalysis || analyze();
    $('#printArea').innerHTML = studentReportHTML(ctxFor(A, state.student, periodOf(A)), { print: true, include: state.include });
    document.body.classList.add('print-reports');
  }
});
window.addEventListener('afterprint', () => {
  if (state.ovPrintAll){ state.ovPrintAll = false; renderOverview(); }
  const ps = $('#ovPage'); if (ps) ps.remove();
  document.body.classList.remove('print-ov');
  document.body.classList.remove('print-reports');
  closedForPrint.forEach(d => { d.open = false; }); closedForPrint = [];
});
window.addEventListener('beforeunload', e => { if ((state.dirty && !state.demo && !(state.dirHandle && state.canWrite)) || (!state.demo && schedDirty())){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  const sh = await idbGet('sheet');
  if (sh && SHEET_URL.test(sh.url) && SHEET_KEY.test(sh.key)){ state.sheet = sh; render(); }
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; render();   // the start screen now offers this folder
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){}
})();
