/* ---------------- Spreadsheets (.xlsx) ----------------
   An .xlsx file is a zip of XML files. This reads the first sheet's cells as text with the browser's own unzipping,
   so nothing is uploaded and no library is needed. */
async function readXlsx(blob){
  if (typeof DecompressionStream === 'undefined') throw new Error('no-unzip');
  const buf = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength), dec = new TextDecoder();
  let e = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('not-zip');
  const entries = new Map();
  for (let k = 0, p = dv.getUint32(e + 16, true), n = dv.getUint16(e + 10, true); k < n; k++){
    if (p + 46 > buf.length || dv.getUint32(p, true) !== 0x02014b50) throw new Error('bad-zip');
    const nl = dv.getUint16(p + 28, true);
    entries.set(dec.decode(buf.subarray(p + 46, p + 46 + nl)), { method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) });
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  const read = async path => {
    const x = entries.get(path); if (!x) return null;
    const start = x.off + 30 + dv.getUint16(x.off + 26, true) + dv.getUint16(x.off + 28, true), data = buf.subarray(start, start + x.size);
    if (x.method === 0) return dec.decode(data);
    if (x.method !== 8) throw new Error('bad-zip');
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = async path => { const t = await read(path); return t === null ? null : new DOMParser().parseFromString(t, 'application/xml'); };
  const tags = (doc, n) => doc ? [...doc.getElementsByTagNameNS('*', n)] : [];
  // The first sheet, found through the workbook (it isn't always sheet1.xml).
  const wb = await xml('xl/workbook.xml'), rels = await xml('xl/_rels/workbook.xml.rels'), sh = tags(wb, 'sheet')[0];
  const rid = sh && (sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
  const rel = tags(rels, 'Relationship').find(r => r.getAttribute('Id') === rid), target = rel ? rel.getAttribute('Target') : '';
  const sheet = (target && await xml(target.startsWith('/') ? target.slice(1) : `xl/${target.replace(/^\.\//, '')}`)) || await xml('xl/worksheets/sheet1.xml');
  if (!sheet) throw new Error('no-sheet');
  const strings = tags(await xml('xl/sharedStrings.xml'), 'si').map(si => tags(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
  const rows = [];
  for (const row of tags(sheet, 'row')){
    const out = []; let ci = 0;
    for (const c of [...row.children].filter(x => x.localName === 'c')){
      const ref = (c.getAttribute('r') || '').match(/^[A-Z]+/);
      if (ref) ci = [...ref[0]].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), v = tags(c, 'v')[0], vt = v ? v.textContent : '';
      out[ci++] = t === 's' ? strings[+vt] ?? '' : t === 'inlineStr' ? tags(c, 't').map(x => x.textContent).join('') : t === 'b' ? (vt === '1' ? 'TRUE' : 'FALSE') : vt;
    }
    rows[(+row.getAttribute('r') || rows.length + 1) - 1] = Array.from(out, x => x ?? '');
  }
  const created = tags(await xml('docProps/core.xml'), 'created')[0];
  return { rows: Array.from(rows, r => r || []), created: created ? created.textContent.trim() : '' };
}
// An .xlsx in the folder is unzipped while the folder is read, then read like the other files.
async function sheetFile(name, file){
  let sheet;
  try { sheet = await readXlsx(file); }
  catch (e){ sheet = { error: e && e.message === 'no-unzip' ? 'This browser can’t open .xlsx files. Open it in Excel or Google Sheets and save it as a CSV with the same name.'
    : 'This spreadsheet couldn’t be opened. If it’s a DeltaMath export, open it in Excel or Google Sheets and save it as a CSV with the same name.' }; }
  return { name, text: '', sheet, modified: file.lastModified };
}

// DeltaMath's grades export (.xlsx as it downloads, or saved as a CSV): First, Last, Class (like "IM1AInt Monday"), Grade,
// Complete, then a column for each assignment with the student's score on it, 0 to 100. A Last that's an email is kept as the
// email. The rows under the students (AVERAGE, Q1, MEDIAN, Q3) aren't students. The class day: a full date in the file name
// (like 11-16-26), else the day it was exported, else the day the file was saved; those two go back to the weekday in the
// class name ("Monday") when it's earlier in that week.
function parseDeltaMath(name, rows, created, modified){
  rows = rows.map(r => Array.from(r || [], c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  const named = /delta ?math/i.test(name);
  const hi = rows.slice(0, 8).findIndex(r => r.some(c => /^(student )?first( name)?$/i.test(c)) && r.some(c => /^complete$/i.test(c)));
  if (hi < 0) return named ? { error: 'This looks like a DeltaMath export, but its “First”, “Last” and “Complete” columns weren’t found.' } : null;
  const h = rows[hi].map(hNorm), col = re => h.findIndex(c => re.test(c));
  const first = col(/^(student )?first( name)?$/), last = col(/^(student )?last( name)?$/), cls = col(/^(class|section|period)( name)?$/), email = col(/^(student )?e-?mail( address)?$/);
  const meta = new Set([first, last, cls, email, col(/^grade$/), col(/^complete$/)].filter(i => i >= 0));
  const aCols = h.map((c, i) => i).filter(i => h[i] && !meta.has(i)), titles = [];
  for (const i of aCols){ let t = rows[hi][i]; while (titles.includes(t)) t += ' (2)'; titles.push(t); }   // two assignments with one name stay apart
  const num = v => { const x = parseFloat(String(v).replace('%', '')); return Number.isFinite(x) ? Math.max(0, Math.min(100, x)) : null; };
  const out = [], wds = new Map();
  for (const r of rows.slice(hi + 1)){
    const fn = r[first] || '', ln = last >= 0 ? r[last] || '' : '', mail = /@/.test(ln);
    const nm = (mail ? fn : `${fn} ${ln}`).replace(/\s+/g, ' ').trim();
    if (!nm || /^(average|q[1-4]|median|mean|total)s?:?$/i.test(nm)) continue;
    const scores = new Map(); aCols.forEach((i, k) => { const v = num(r[i]); if (v !== null) scores.set(titles[k], v); });
    if (!aCols.length){ const v = num(r[col(/^complete$/)]); if (v !== null) scores.set('Complete', v); }   // no assignment columns: how much is complete
    const wd = cls >= 0 ? sectionWeekday(r[cls]) : null; if (wd) wds.set(wd, (wds.get(wd) || 0) + 1);
    out.push({ name: nm, email: mail ? ln : email >= 0 ? r[email] || '' : '', scores, wd });
  }
  if (!out.length) return { error: 'This looks like a DeltaMath export, but no student rows were found in it.' };
  const wd = [...wds].sort((a, b) => b[1] - a[1])[0]?.[0] || null, back = dk => { if (!wd) return dk; while (DAYS[parseDk(dk).getDay()] !== wd) dk = addDays(dk, -1); return dk; };
  const exp = created && !isNaN(new Date(created)) ? dkOf(new Date(created)) : null, nd = dateInName(name, new Date(modified || Date.now()).getFullYear());
  const how = w => wd ? `${w} and the class day in the class name` : w;
  const [dk, dated] = nd.num ? [nd.num, 'the file name'] : exp ? [back(exp), how('the day it was exported')] : nd.month ? [nd.month, 'the file name']
    : modified ? [back(dkOf(new Date(modified))), how('the day the file was saved')] : [];
  if (!dk) return { error: 'This DeltaMath export has no date. Put the class date in the file name, like deltamath-11-16-2026.xlsx.' };
  // One export can hold several groups (a class name per row, like "Monday" and "Wednesday"): each counts for its own weekday
  // in that week, and not for a day after the export was made.
  const made = exp || nd.num || (modified ? dkOf(new Date(modified)) : dk), groups = new Map();
  for (const r of out){ const g = r.wd || wd; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); }
  const parts = [...groups].map(([g, rows]) => g === wd ? { dk, dated, rows } : { dk: addDays(weekKey(dk), (DAYS.indexOf(g) + 6) % 7), dated: 'the class day in the class name', rows })
    .filter(p => p.dk === dk || p.dk <= made);
  return { deltamath: true, dk, dated, assignments: titles, rows: out, parts };
}

// A gradebook export (a CSV with "grades" and the date in its name): each student's current grade.
// The grade comes from the first column found, in this order: current/overall/final grade or score, then grade, percent,
// score, average. A cell like "87%", "87" or "B+ (87%)" gives 87% (as written, not rounded); a letter alone is kept as written.
const G_COLS = [/^current (grade|score|percent(age)?)( ?\(%\)| ?%)?$/, /^(overall|final|course|total)( grade| score| percent(age)?| %)?( ?\(%\)| ?%)?$/,
  /^(grade|percent(age)?|%|score|average|avg)( ?\(%\)| ?%)?$/, /percent|%|grade(?! level)|score|average/];
function parseGradesFile(name, text, modified){
  const rows = parseCSV(String(text).replace(/^\ufeff/, '')).filter(r => r.some(c => c.trim()));
  const hi = rows.slice(0, 8).findIndex(r => r.some(c => F_NAME.test(c.trim().toLowerCase())));
  if (hi < 0) return { error: 'This looks like a grades file, but no student name column (like “Student Name” or “First Name”) was found in it.' };
  const h = rows[hi].map(c => c.trim().toLowerCase()), col = re => h.findIndex(c => re.test(c));
  const first = col(/^(student )?first( name)?$|^first$/), last = col(/^(student )?last( name)?$|^last$/), full = col(/^(student( full)?( name)?|name|full name)$/);
  const email = col(/^(student )?e-?mail( address)?$/), names = new Set([first, last, full, email]);
  let g = -1; for (const re of G_COLS){ g = h.findIndex((c, i) => !names.has(i) && re.test(c)); if (g >= 0) break; }
  if (g < 0) return { error: 'This looks like a grades file, but no grade column (like “Grade”, “Percent” or “Current Score”) was found in it.' };
  const out = [];
  for (const r of rows.slice(hi + 1)){
    const nm = (full >= 0 && r[full] ? r[full] : [first >= 0 ? r[first] : '', last >= 0 ? r[last] : ''].join(' ')).trim(), v = String(r[g] || '').trim();
    if (!nm || !v || /^(average|class average|total|mean|median|points possible|due date)s?$/i.test(nm)) continue;
    const m = v.match(/(\d+(?:\.\d+)?)\s*%/) || v.match(/^(\d+(?:\.\d+)?)$/);
    out.push({ name: nm, email: email >= 0 ? (r[email] || '').trim() : '', grade: m ? `${m[1]}%` : v });
  }
  if (!out.length) return { error: 'This looks like a grades file, but no student grades were found in it.' };
  const nd = dateInName(name, new Date(modified || Date.now()).getFullYear()), dk = nd.num || nd.month || (modified ? dkOf(new Date(modified)) : '');
  return { grades: true, dk, column: rows[hi][g].trim(), rows: out };
}

// Each file is read once: a Zoom participant report or a Formative export, or else an error. A file named for Formative
// is read as one first, so a question that mentions joining or leaving can't make it look like a Zoom report.
// A spreadsheet (.xlsx) is read only as a DeltaMath export; any other one is set aside without a message.
function parsedFile(f){
  if (!f.parsed && f.sheet) f.parsed = f.sheet.error ? { error: f.sheet.error } : parseDeltaMath(f.name, f.sheet.rows, f.sheet.created, f.modified) || { skip: true };
  if (!f.parsed){
    const form = () => parseFormativeFile(f.name, f.text, f.modified);
    let p = /\bcomplete\b/i.test(String(f.text).slice(0, 3000)) ? parseDeltaMath(f.name, parseCSV(String(f.text).replace(/^\ufeff/, '')), '', f.modified) : null;
    if (!p || (p.error && !p.deltamath)) p = (/formative/i.test(f.name) ? form() : /grade/i.test(f.name) ? parseGradesFile(f.name, f.text, f.modified) : null) || p;
    if (!p || (p.error && !p.deltamath)){ const z = parseZoomFile(f.name, f.text); p = !z.error ? z : p || form() || z; }
    f.parsed = p;
  }
  return f.parsed;
}

function analyze(){
  const S = state.data.settings;
  // Each schedule version covers the days from its start date until the next version starts.
  const versions = state.data.scheduleVersions.map(v => ({ from: v.from || '', text: v.text, sched: parsedSchedule(v.text) }));
  const sched = versions[versions.length - 1].sched;
  const nameOf = {};
  for (const v of versions) for (const r of v.sched.roster) nameOf[r.key] = r.name;   // latest spelling wins
  const deleted = new Set(Object.keys(state.data.deleted));
  const roster = Object.keys(nameOf).filter(key => !deleted.has(key)).map(key => ({ key, name: nameOf[key] })).sort((a, b) => a.name.localeCompare(b.name));
  const verFor = dk => { let s = versions[0]; for (const v of versions) if (v.from <= dk) s = v; return s; };
  // A student dropped from the class is taken off every schedule from the drop date on; their earlier days stay as they were.
  // A deleted student is taken off every schedule on every date.
  const drops = Object.entries(state.data.drops).map(([k, v]) => [k, v.date]), dropCache = new Map();
  const weekSched = dk => {
    const v = verFor(dk), gone = [...new Set([...deleted, ...drops.filter(([, d]) => d <= dk).map(([k]) => k)])].sort();
    if (!gone.length) return v.sched;
    const ck = `${v.from}|${gone.join(',')}`;
    if (!dropCache.has(ck)){
      const out = new Set(gone), days = {};
      for (const [w, secs] of Object.entries(v.sched.days)) days[w] = secs.map(x => ({ ...x, students: x.students.filter(n => !out.has(normKey(n))) }));
      dropCache.set(ck, { ...v.sched, days, roster: v.sched.roster.filter(r => !out.has(r.key)) });
    }
    return dropCache.get(ck);
  };
  // A day added by hand has the students and times of the weekday picked for it, in the schedule in effect that day.
  const extra = state.data.extraDays, extraCache = new Map(), delDays = state.data.deletedDays;
  const schedFor = dk => {
    const base = weekSched(dk), x = extra[dk];
    if (delDays[dk]){   // a deleted day has no class
      if (!extraCache.has(dk)) extraCache.set(dk, { ...base, days: { ...base.days, [DAYS[parseDk(dk).getDay()]]: [] } });
      return extraCache.get(dk);
    }
    if (!x) return base;
    const secs = x.like === 'none' ? [] : x.like === 'all' ? allClasses(base) : base.days[x.like] || [];
    if (x.like !== 'none' && !secs.some(sec => sec.students.length)) return base;   // no such class in that day's schedule: it keeps its own
    if (!extraCache.has(dk)) extraCache.set(dk, { ...base, days: { ...base.days, [DAYS[parseDk(dk).getDay()]]: secs } });
    return extraCache.get(dk);
  };
  // Zoom names are matched against that day's schedule first, so adding "Ben Carter" later can't make "ben c" ambiguous
  // on days Ben Carter wasn't scheduled. Everyone from every version is the fallback, for students who joined but weren't scheduled.
  const anyone = buildMatcher(roster, state.data.aliases);
  const matchFor = dk => { const v = verFor(dk); if (!v.match){ const m = buildMatcher(v.sched.roster, state.data.aliases); v.match = (r, e) => m(r, e) || anyone(r, e); } return v.match; };
  const ignored = new Set(state.data.ignored);
  const fileErrors = [], byDate = new Map(), forms = [], gradeFiles = [], dms = [];
  for (const f of state.files){
    const z = parsedFile(f);
    if (z.error){ fileErrors.push({ name: f.name, error: z.error }); continue; }
    if (z.skip) continue;
    if (z.deltamath){ for (const part of z.parts || [z]) dms.push({ name: f.name, ...z, ...part }); continue; }
    if (z.formative){ for (const part of z.parts || [z]) forms.push({ name: f.name, ...z, ...part }); continue; }
    if (z.grades){ gradeFiles.push({ name: f.name, ...z }); continue; }
    for (const r of z.rows){
      const dk = dkOf(r.join);
      if (state.data.deletedDays[dk]) continue;   // a deleted day's Zoom report is set aside
      if (!byDate.has(dk)) byDate.set(dk, { dk, files: new Set(), rows: [] });
      const g = byDate.get(dk); g.files.add(f.name); g.rows.push(r);
    }
  }
  const days = [...byDate.values()].sort((a, b) => b.dk.localeCompare(a.dk))
    .map(g => analyzeDay(g, schedFor(g.dk), nameOf, matchFor(g.dk), ignored, S, deleted, new Set(drops.filter(([, d]) => d <= g.dk).map(([k]) => k))));
  // Formative results by class day: per student, questions answered of the questions they were given. Files with the same
  // questions are one Formative (a second export, or one file per group), where a student counts once, with their best file.
  // A student's total adds up only the Formatives whose files list them.
  // A results export counts points, out of the most any student has in that Formative in any of its files.
  const formByDk = new Map(), most = new Map();
  for (const F of forms) if (F.unit === 'point') most.set(F.qs[0], Math.max(most.get(F.qs[0]) || 0, F.questions));
  for (const F of forms){
    if (state.data.deletedDays[F.dk]) continue;
    if (!formByDk.has(F.dk)) formByDk.set(F.dk, { dk: F.dk, files: [], dated: new Set(), questions: 0, units: new Set(), sets: new Map(), byKey: new Map(), unmatched: new Map() });
    const g = formByDk.get(F.dk), match = matchFor(F.dk), qk = F.qs.join('\u0001'), questions = F.unit === 'point' ? most.get(qk) : F.questions;
    if (!g.files.includes(F.name)) g.files.push(F.name);
    g.dated.add(F.dated); g.units.add(F.unit || 'question');
    if (!g.sets.has(qk)){ g.sets.set(qk, { questions, unit: F.unit || 'question', title: F.title || F.name.replace(/\.csv$/i, ''), byKey: new Map() }); g.questions += questions; }
    const seen = g.sets.get(qk).byKey;
    for (const r of F.rows){
      const m = match(r.name, r.email);
      if (!m){ const rk = normKey(r.name); if (rk && !ignored.has(rk)) g.unmatched.set(rk, { rk, raw: r.name, email: r.email }); continue; }
      if (deleted.has(m.key)) continue;
      const e = seen.get(m.key) || { answered: 0, pct: null, some: false };
      e.answered = Math.max(e.answered, r.answered); if (r.pct !== null) e.pct = Math.max(e.pct ?? 0, r.pct); e.some = e.some || !!r.some;
      seen.set(m.key, e);
    }
  }
  for (const g of formByDk.values()) for (const set of g.sets.values()) for (const [k, e] of set.byKey){
    const t = g.byKey.get(k) || { answered: 0, total: 0, pcts: [], some: false, parts: [] };
    t.answered += e.answered; t.total += set.questions; if (e.pct !== null) t.pcts.push(e.pct); t.some = t.some || e.some;
    t.parts.push({ title: set.title, answered: e.answered, total: set.questions, unit: set.unit, pct: e.pct === null ? null : Math.round(e.pct), some: e.some && !e.answered, inFile: true });
    g.byKey.set(k, t);
  }
  // DeltaMath practice by class day. Each assignment is out of 100% complete, and its score adds up over time, so a student's
  // work on a day is how far each score went up since the last earlier export that listed them on it, out of what they had
  // left on it then (all 100% the first time it shows up). Files from one day count together, with each student's best score.
  // A day where no one did any work (an export made before class, or the same one again) isn't counted.
  const dmByDk = new Map(), dmDays = new Map(), last = new Map(), dmUnmatched = new Map(), dmSkipped = new Set();
  for (const D of dms){
    if (!dmDays.has(D.dk)) dmDays.set(D.dk, { files: [], dated: new Set(), byKey: new Map(), unmatched: new Map() });
    const g = dmDays.get(D.dk), match = matchFor(D.dk);
    if (!g.files.includes(D.name)) g.files.push(D.name);
    g.dated.add(D.dated);
    for (const r of D.rows){
      // A first name with an email (DeltaMath's Last held the email) keeps the email in its name, so two students with the
      // same first name stay apart. A name that matches no one keeps its own scores ("?name"), so linking it changes only its days.
      const raw = r.email && !r.name.includes(' ') ? `${r.name} (${r.email})` : r.name, m = match(raw, r.email), rk = normKey(raw);
      if (m ? deleted.has(m.key) : !rk || ignored.has(rk)) continue;
      if (!m) g.unmatched.set(rk, { rk, raw, email: r.email });
      const key = m ? m.key : `?${rk}`, sc = g.byKey.get(key) || new Map();
      for (const [t, v] of r.scores) sc.set(t, Math.max(sc.get(t) ?? 0, v));
      g.byKey.set(key, sc);
    }
  }
  for (const [dk, g] of [...dmDays].sort((a, b) => a[0].localeCompare(b[0]))){
    const byKey = new Map(); let any = false;
    for (const [key, sc] of g.byKey){
      const parts = [...sc].map(([title, score]) => { const p = last.get(`${title}|${key}`), before = p ? p.score : 0;
        return { title, score, gain: Math.max(0, score - before), left: Math.max(0, 100 - before), since: p ? p.dk : null }; });
      const work = parts.reduce((a, p) => a + p.gain, 0), left = parts.reduce((a, p) => a + p.left, 0);
      if (key[0] !== '?') byKey.set(key, { work, left, parts });
      any = any || work > 0;
    }
    const before = [...last.values()].some(x => x.dk < dk);
    for (const [key, sc] of g.byKey) for (const [title, score] of sc) last.set(`${title}|${key}`, { dk, score });
    if (state.data.deletedDays[dk]) continue;   // a deleted day isn't a class day, but its scores are still where the next export starts from
    for (const u of g.unmatched.values()) dmUnmatched.set(u.rk, u);
    if (any) dmByDk.set(dk, { dk, files: g.files, dated: g.dated, byKey });
    else { dmSkipped.add(dk); for (const name of g.files) fileErrors.push({ name, error: `No one has DeltaMath work in it${before ? ' since the export before it' : ' yet'}, so it isn’t counted for ${shortDate(dk)}.` }); }
  }
  // Grades: each student's grade from the newest grades file that lists them (newest by the date in its name).
  const grades = new Map(), gradeUnmatched = new Map();
  gradeFiles.sort((a, b) => b.dk.localeCompare(a.dk) || b.name.localeCompare(a.name));
  for (const G of gradeFiles){
    const match = matchFor(G.dk || todayDk()), newest = G === gradeFiles[0];   // names that didn't match are listed from the newest file only
    for (const r of G.rows){
      const m = match(r.name, r.email);
      if (!m){ const rk = normKey(r.name); if (rk && !ignored.has(rk) && newest) gradeUnmatched.set(rk, { rk, raw: r.name, email: r.email }); continue; }
      if (!deleted.has(m.key) && !grades.has(m.key)) grades.set(m.key, { grade: r.grade, file: G.name, dk: G.dk });
    }
  }
  return { sched, versions, schedFor, weekSched, roster, nameOf, days, dayByDk: new Map(days.map(d => [d.dk, d])), fileErrors, formByDk, dmByDk, dmUnmatched, dmSkipped,
    grades, gradeUnmatched, gradeFiles };
}

// Every class in a week's schedule as one day: sections with the same kind and times are one section with all their students.
function allClasses(sched){
  const by = new Map();
  for (const w of DAYS) for (const sec of sched.days[w] || []){
    const k = `${sec.type}|${sec.startMin}|${sec.endMin ?? ''}`;
    if (!by.has(k)) by.set(k, { ...sec, students: [] });
    const m = by.get(k); for (const n of sec.students) if (!m.students.some(x => normKey(x) === normKey(n))) m.students.push(n);
  }
  return [...by.values()].sort((a, b) => a.startMin - b.startMin || a.type.localeCompare(b.type));
}
function analyzeDay(g, sched, nameOf, matcher, ignored, S, deleted, dropped){
  const date = parseDk(g.dk);
  // Built from calendar fields so a 23- or 25-hour daylight-saving day still puts 2 PM at 2 PM.
  const at = m => new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m).getTime();
  const dayName = DAYS[date.getDay()];
  const secs = (sched.days[dayName] || []).map(s => ({ ...s, endMin: s.endMin ?? s.startMin + S.sectionLen }));
  const plan = new Map();
  for (const s of secs) for (const n of s.students){
    const k = normKey(n); if (!k) continue;
    if (!plan.has(k)) plan.set(k, { key: k, name: nameOf[k] || n, sections: [] });
    plan.get(k).sections.push(s);
  }
  const seen = new Map(), unmatched = new Map();
  for (const r of g.rows){
    const rk = normKey(r.name);
    if (ignored.has(rk)) continue;
    const iv = [r.join.getTime(), r.leave.getTime()];
    const m = matcher(r.name, r.email);
    if (m && deleted.has(m.key)) continue;   // a deleted student's Zoom rows aren't listed anywhere
    if (m){
      if (!seen.has(m.key)) seen.set(m.key, { key: m.key, name: m.name, intervals: [], zoom: new Set(), segs: [] });
      const e = seen.get(m.key); e.intervals.push(iv); e.zoom.add(r.name); e.segs.push({ a: iv[0], b: iv[1], name: r.name });
    } else {
      if (!unmatched.has(rk)) unmatched.set(rk, { rk, raw: r.name, email: r.email, intervals: [] });
      unmatched.get(rk).intervals.push(iv);
    }
  }
  let axisStart, axisEnd;
  if (secs.length){
    axisStart = at(Math.min(...secs.map(s => s.startMin)) - 10);
    axisEnd = at(Math.max(...secs.map(s => s.endMin)) + 10);
  } else {
    const all = g.rows.map(r => [r.join.getTime(), r.leave.getTime()]);
    axisStart = Math.min(...all.map(x => x[0])) - 5 * 60000;
    axisEnd = Math.max(...all.map(x => x[1])) + 5 * 60000;
  }
  // A student on the class list who came to a class hour they aren't scheduled for (at least 5 minutes in it) is counted
  // for the hours they were there, and marked as not scheduled that day.
  for (const e of seen.values()){
    if (plan.has(e.key) || dropped.has(e.key)) continue;
    const mine = secs.filter(sec => e.intervals.reduce((t, [a, b]) => t + Math.max(0, Math.min(b, at(sec.endMin)) - Math.max(a, at(sec.startMin))), 0) >= 5 * 60000);
    if (mine.length) plan.set(e.key, { key: e.key, name: nameOf[e.key] || e.name, sections: mine, unsched: true });
  }
  const students = [...plan.values()].map(p => {
    const e = seen.get(p.key);
    const xkey = `${g.dk}|${p.key}`;
    const res = evaluate(e ? e.intervals : [], p.sections, at, S, !!state.data.excused[xkey]);
    const isAbsent = res.flags[0].k === 'absent';
    if (isAbsent && state.data.excusedAbsent[xkey]) res.flags[0] = { k: 'exc', label: 'Excused absence' };
    const sev = Math.max(...res.flags.map(f => SEVERITY[f.k]));
    const kinds = new Set(p.sections.map(s => s.type));
    const schedLabel = p.unsched ? `Not scheduled, came to ${kinds.size > 1 ? 'both hours' : kinds.has('instruction') ? 'instruction' : 'the support hour'}`
      : kinds.has('instruction') && kinds.has('support') ? 'Instruction + support' : kinds.has('instruction') ? 'Instruction' : 'Support hour only';
    const zoomNames = e ? [...e.zoom].filter(z => normKey(z) !== p.key) : [];
    const segs = e ? [...e.segs].sort((x, y) => x.a - y.a) : [];
    return { ...p, ...res, dk: g.dk, xkey, sev, schedLabel, zoomNames, segs, isAbsent,
      note: state.data.notes[xkey] || '' };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const extras = [...seen.values()].filter(e => !plan.has(e.key)).map(e => ({ ...e, merged: mergeIntervals(e.intervals) }))
    .sort((a, b) => a.name.localeCompare(b.name));
  const unm = [...unmatched.values()].map(u => ({ ...u, merged: mergeIntervals(u.intervals) })).sort((a, b) => a.raw.localeCompare(b.raw));
  const ticks = [];
  for (let t = Math.ceil(axisStart / 1800000) * 1800000; t <= axisEnd; t += 1800000) ticks.push(t);
  return { dk: g.dk, date, dayName, files: [...g.files].sort(), secs, students, extras, unmatched: unm, axisStart, axisEnd, ticks,
    roster: sched.roster };
}

/* ---------------- Rendering ---------------- */
function timeline(day, merged, secs){
  const span = day.axisEnd - day.axisStart, pct = t => ((t - day.axisStart) / span * 100).toFixed(3);
  let h = '';
  for (const s of secs || []) h += `<span class="band ${s.type}" style="left:${pct(s.a)}%;width:${(pct(s.b) - pct(s.a)).toFixed(3)}%"></span>`;
  for (const t of day.ticks) h += `<span class="tick${new Date(t).getMinutes() ? ' half' : ''}" style="left:${pct(t)}%"></span>`;
  const label = [];
  for (const [a, b] of merged){
    const A = Math.max(a, day.axisStart), B = Math.min(b, day.axisEnd); label.push(`${fmt(a)} to ${fmt(b)}`);
    if (B <= A) continue;
    h += `<span class="bar" title="In Zoom ${esc(fmt(a))}–${esc(fmt(b))}" style="left:${pct(A)}%;width:${Math.max(0.5, pct(B) - pct(A)).toFixed(3)}%"></span>`;
  }
  return `<div class="tl" role="img" aria-label="${esc(label.length ? 'In Zoom ' + label.join(', ') : 'Not in Zoom')}">${h}</div>`;
}
function axis(day){
  const span = day.axisEnd - day.axisStart;
  return `<div class="axis" aria-hidden="true">${day.ticks.filter(t => !new Date(t).getMinutes())
    .map(t => `<span style="left:${((t - day.axisStart) / span * 100).toFixed(2)}%">${esc(fmt(t).replace(/:00/, ''))}</span>`).join('')}</div>`;
}
function rangeText(merged){ return merged.map(([a, b]) => `${fmt(a)}–${fmt(b)}`).join(', '); }

function renderReports(){
  const el = $('#tab-reports');
  const A = analyze();
  state.lastAnalysis = A;
  if (!state.loaded){ el.innerHTML = startScreen(); return; }
  let h = '';
  if (state.returnTo) h += `<div class="backbar">From ${esc(state.returnTo.name)}’s report <button class="btn small" data-returnto>Back to ${esc(state.returnTo.name)}</button>
    <button class="linkish" data-dismissreturn>Stay here</button></div>`;
  if (A.fileErrors.length) h += `<div class="notice"><b>Some files weren’t used:</b><ul>${A.fileErrors.map(f => `<li>${esc(f.name)}: ${esc(f.error)}</li>`).join('')}</ul></div>`;
  if (!A.days.length){ el.innerHTML = h + setupCard(A); return; }
  if (!A.sched.roster.length) h += `<div class="notice">Add your class schedule on the <button class="linkish" data-goto="schedule">Schedule tab</button> so each student can be checked against the hours they’re expected.</div>`;
  const days = daysInRange(A.days), period = periodOf(A);
  h += `<div class="toolbar">${rangeBar()}
    <input class="search" data-search type="search" placeholder="Find a student" value="${esc(state.query)}" aria-label="Find a student">
    <button class="btn small ghost" id="exportDays"${days.length ? '' : ' disabled'}>Export CSV</button><span class="grow"></span>
    <div class="legend"><span><i class="sw i"></i>Instruction hour</span><span><i class="sw s"></i>Support hour</span><span><i class="sw p"></i>In Zoom</span></div>
  </div>`;
  h += missingNotice(A, period);
  const noClassDays = Object.keys(state.data.noClass).filter(dk => !A.dayByDk.has(dk) && !state.data.deletedDays[dk] && dk >= period.from && dk <= period.to);
  if (!days.length && !noClassDays.length){ el.innerHTML = h + `<div class="notice info">No Zoom reports fall in these dates. ${A.days.length} report day${A.days.length === 1 ? ' is' : 's are'} outside the range. <button class="linkish" data-range="all">Show all dates</button></div>`; return; }
  if (!state.autoOpened && days.length){ state.openDays.add(days[0].dk); state.autoOpened = true; }
  const cards = [...days.map(d => ({ dk: d.dk, day: d })), ...noClassDays.map(dk => ({ dk }))].sort((a, b) => b.dk.localeCompare(a.dk));
  for (const c of cards) h += c.day ? renderDay(c.day) : noClassCard(c.dk);
  el.innerHTML = h;
  focusNoteInput(el);
}
function noClassCard(dk){
  const r = state.data.noClass[dk] || {};
  return `<div class="noclasscard" data-dk="${esc(dk)}"><b>${esc(longDate(dk))}</b> <span>No class: ${esc(NOCLASS_REASONS[r.reason] || 'Other')}</span>
    <button class="linkish" data-undonoclass="${esc(dk)}">Undo</button></div>`;
}
function focusNoteInput(el){
  if (!state.noteEdit) return;
  const n = el.querySelector('input.note'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
}

/* ---------------- Date range (shared by Reports and Students) ---------------- */
function rangeBounds(){
  const r = state.range;
  if (r.preset === 'all') return { from: '', to: '' };
  if (r.preset === 'custom') return { from: r.from || '', to: r.to || '' };
  const d = new Date(); d.setDate(d.getDate() - (+r.preset - 1));
  return { from: dkOf(d), to: '' };
}
function daysInRange(days){
  const { from, to } = rangeBounds();
  return days.filter(d => (!from || d.dk >= from) && (!to || d.dk <= to));
}
// The dates a person reads: an open start becomes the oldest report, an open end becomes today.
function periodOf(A){
  const b = rangeBounds(), today = todayDk();
  const oldest = A.days.length ? A.days[A.days.length - 1].dk : [today, ...Object.keys(state.data.extraDays)].sort()[0];
  const from = b.from || oldest, to = b.to || (A.days.length && A.days[0].dk > today ? A.days[0].dk : today);
  return { from, to, calcTo: to < today ? to : today, open: to >= today };
}
// Three presets and a "Custom dates…" menu, in one control. Once dates are chosen, the menu's label shows them.
// The menu stays open (state.rangeMenu) through the redraw each complete date makes.
function rangeBar(){
  const p = state.range.preset, b = rangeBounds(), on = p === 'custom' && !!(b.from || b.to);
  const shown = !on ? 'Custom dates…' : b.from && b.to ? `${monDay(b.from)} – ${monDay(b.to)}` : b.from ? `From ${monDay(b.from)}` : `Until ${monDay(b.to)}`;
  const said = !on ? 'Custom dates' : `Custom dates, ${b.from && b.to ? `${monDay(b.from)} to ${monDay(b.to)}` : b.from ? `from ${monDay(b.from)}` : `until ${monDay(b.to)}`}`;
  return `<div class="seg range" role="group" aria-label="Dates"><button data-range="all" aria-pressed="${p === 'all'}">All dates</button>
    <button data-range="14" aria-pressed="${p === '14'}">Past 2 weeks</button>
    <button data-range="30" aria-pressed="${p === '30'}">Past 30 days</button>
    <details class="menu rangemenu" data-rangemenu${state.rangeMenu ? ' open' : ''}><summary${on ? ` class="on" title="${esc(shown)}"` : ''} aria-label="${esc(said)}">${esc(shown)}</summary>
      <div class="pop" role="group" aria-label="Custom dates"><label>From <input type="date" data-rfrom value="${esc(b.from)}"></label>
        <label>to <input type="date" data-rto value="${esc(b.to)}"></label></div></details></div>`;
}
function stamp(){ const { from, to } = rangeBounds(); return from || to ? `${from || 'start'}_to_${to || 'latest'}` : 'all-dates'; }

/* ---------------- Days with no report, and "no class" marks ---------------- */
function weekdayScheduled(A, dk){
  const s = A.schedFor(dk); return (s.days[DAYS[parseDk(dk).getDay()]] || []).some(sec => sec.students.length);
}
function missingDates(A, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && dk < today && i < 1500; dk = addDays(dk, 1), i++)
    if (!A.dayByDk.has(dk) && !state.data.noClass[dk] && weekdayScheduled(A, dk)) out.push(dk);
  return out;
}
const reasonSelect = () => `<select data-ncreason aria-label="Why there was no class">${Object.entries(NOCLASS_REASONS)
  .map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select>`;
function noClassItems(dks){
  const shown = dks.slice(0, 5), rest = dks.slice(5);
  return `<ul class="nclist">${shown.map(dk => `<li><span>${esc(shortDate(dk))}</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclass="${dk}">Mark no class</button></li>`).join('')}
    ${rest.length ? `<li><span>and ${rest.length} more (${esc(monDay(rest[0]))} – ${esc(monDay(rest[rest.length - 1]))})</span> ${reasonSelect()}
      <button class="btn small ghost" data-noclassall="${rest.join(',')}">Mark all ${rest.length} as no class</button></li>` : ''}</ul>`;
}
function missingNotice(A, period){
  const miss = missingDates(A, period);
  let h = '';
  // One date is one line, with its select and button. Several get a row each, under one sentence.
  if (miss.length === 1) h += `<div class="notice nc1"><span>No Zoom report for <b>${esc(shortDate(miss[0]))}</b>. If class met, save its report in the folder and click Refresh. If not:</span>
    ${reasonSelect()} <button class="btn small ghost" data-noclass="${miss[0]}">Mark no class</button></div>`;
  else if (miss.length) h += `<div class="notice"><p style="margin:0">No Zoom report for ${plural(miss.length, 'day')}. If class met, save those reports in the folder and click Refresh. If not, mark each one:</p>${noClassItems(miss)}</div>`;
  return h + conflictNotices(A, period);
}
function conflictNotices(A, period, key){
  return Object.keys(state.data.noClass).filter(dk => A.dayByDk.has(dk) && dk >= period.from && dk <= period.to
      && (!key || A.dayByDk.get(dk).students.some(s => s.key === key))).sort()
    .map(dk => `<div class="notice">${esc(monDay(dk))} is marked “No class” but has a Zoom report. The report is used. <button class="linkish" data-undonoclass="${dk}">Remove the mark</button></div>`).join('');
}

// The action links under a student's status, shared by Reports and the student report.
const tgl = (attr, xk, on, label, extra = '') => `<button class="tgl" ${attr}="${esc(xk)}" aria-pressed="${!!on}"${extra}><span class="tbox" aria-hidden="true"></span>${esc(label)}</button>`;
function rowActions(s){
  const editing = state.noteEdit === s.xkey;
  return `<span class="acts">${s.canFinish || state.data.excused[s.xkey] ? tgl('data-excuse', s.xkey, state.data.excused[s.xkey], 'Finished work, let go early') : ''}
    ${s.isAbsent ? tgl('data-excabs', s.xkey, state.data.excusedAbsent[s.xkey], 'Excused absence') : ''}
    <button class="linkish" data-noteedit="${esc(s.xkey)}"${editing ? ' disabled' : ''}>Note</button></span>`;
}
function noteBlock(s){
  return state.noteEdit === s.xkey
    ? `<input class="note" data-note="${esc(s.xkey)}" value="${esc(s.note)}" placeholder="Note, then press Enter" aria-label="Note for ${esc(s.name)}, ${esc(shortDate(s.dk))}">`
    : s.note ? `<span class="note-txt">${esc(s.note)}</span>` : '';
}

// A closed day only draws its heading; its rows are drawn when it's opened (see the toggle listener), which keeps
// the Reports tab quick with a whole year of reports.
function renderDay(day){
  // Late includes missing the instruction hour, left early includes leaving the support hour early, and absent includes
  // excused absences. Present is everyone else who came. A student who was late and left early is in both boxes.
  const n = { full: 0, fin: 0, late: 0, early: 0, drop: 0, absent: 0 }; let exc = 0;
  for (const s of day.students){
    const k = new Set(s.flags.map(f => f.k));
    if (s.isAbsent){ n.absent++; if (k.has('exc')) exc++; continue; }
    const fin = k.has('fin'), late = k.has('late') || k.has('missed'), early = k.has('early') || k.has('soft'), drop = k.has('drop');
    if (fin) n.fin++; if (late) n.late++; if (early) n.early++; if (drop) n.drop++; if (!fin && !late && !early && !drop) n.full++;
  }
  const title = longDate(day.date);
  // Who came (counted as the open day counts it) and when, so a closed day can be read without opening it.
  const sch = day.students.filter(s => !s.unsched), extra = day.students.length - sch.length;
  const expected = sch.filter(s => s.flags[0].k !== 'exc').length, came = sch.filter(s => !s.isAbsent).length;
  const sub = day.secs.length
    ? `${came} of ${expected} attended${extra ? ` (+${extra} not scheduled)` : ''} · ${[...new Set(day.secs.map(s => s.type === 'instruction' ? 'Instruction' : 'support'))].join(' + ').replace(/^s/, 'S')}, ${shortRange(Math.min(...day.secs.map(s => s.startMin)), Math.max(...day.secs.map(s => s.endMin)))}`
    : `Not on the schedule · ${day.extras.length} joined`;
  const xd = !!state.data.extraDays[day.dk], open = state.openDays.has(day.dk), subAll = sub + (xd ? ` · day you added, ${addedLabel(state.lastAnalysis, day.dk)}` : '');
  return `<details class="day" data-dk="${day.dk}"${open ? ' open' : ''}>
    <summary><h2>${esc(title)}</h2><span class="sub" title="${esc(subAll)}">${esc(subAll)}</span>
      <span class="counts">${day.students.length ? DAY_BOXES.map(([k, l]) => `<span class="count k-${k}${n[k] ? '' : ' zero'}"${k === 'absent' && exc ? ` title="${exc} of them excused"` : ''}>${n[k]} ${l}</span>`).join('') : ''}
      ${day.unmatched.length ? `<span class="count k-extra">${day.unmatched.length} unmatched Zoom name${day.unmatched.length > 1 ? 's' : ''}</span>` : ''}</span>
    </summary><div class="day-body">${open ? dayBody(day) : ''}</div></details>`;
}
// A row's status in the same words as the day's boxes (present, let go early, late, left early, out mid-class, absent), with the minutes.
function rowChip(f){
  const m = f.min ? `${f.min} min` : '';
  return f.k === 'fin' ? ['fin', `Let go early (${m})`] : f.k === 'late' ? ['late', `Late (${m})`] : f.k === 'missed' ? ['late', 'Late (missed instruction)']
    : f.k === 'soft' || f.k === 'early' ? ['early', `Left early (${m})`]
    : f.k === 'drop' ? ['drop', `Out mid-class (${m})`] : f.k === 'exc' ? ['exc', 'Absent (excused)'] : f.k === 'absent' ? ['absent', 'Absent'] : [f.k, f.label];
}
function fillDayBody(el){
  const body = el.querySelector(':scope > .day-body'), day = state.lastAnalysis && state.lastAnalysis.dayByDk.get(el.dataset.dk);
  if (body && day && !body.childElementCount) body.innerHTML = dayBody(day);
}
function dayBody(day){
  const q = normKey(state.query);
  const rows = day.students.filter(s => !q || s.key.includes(q));
  let h = '';
  const xd = day.secs.length && state.data.extraDays[day.dk];   // a day added with another weekday's class
  if (day.students.length){
    h += `<div class="grid-head"><span>Student</span>${axis(day)}<span>Joined</span><span>Left</span><span>Status</span></div>`;
    if (!rows.length) h += `<p class="muted small" style="padding:10px 0">No students match that search. <button class="linkish" data-clearsearch>Clear search</button></p>`;
    for (const s of rows){
      const meta = [s.schedLabel === 'Instruction + support' ? 'Both hours' : s.schedLabel];   // on screen only; the CSV keeps the longer label
      if (!s.isAbsent) meta.push(`${s.presentMin} of ${s.reqMin} min`);
      const hl = state.highlight === s.xkey;
      h += `<div class="row${hl ? ' hl' : ''}" data-xkey="${esc(s.xkey)}">
        <div class="who"><button class="name-btn" data-openstudent="${esc(s.key)}" data-from="${day.dk}" title="Open ${esc(s.name)}’s student report">${esc(s.name)}</button>
          <span class="meta">${esc(meta.join(', '))}</span>
          ${hl && state.returnTo ? `<span class="meta">↳ from ${esc(state.returnTo.name)}’s report</span>` : ''}
          ${s.zoomNames.length ? `<span class="meta">In Zoom as ${s.zoomNames.map(z => `“${esc(z)}”`).join(', ')}</span>` : ''}
          ${noteBlock(s)}</div>
        <div class="tlc">${timeline(day, s.merged, s.secs)}</div>
        <div class="time${s.firstJoin ? '' : ' none'}" data-label="Joined">${esc(fmt(s.firstJoin))}</div>
        <div class="time${s.lastLeave ? '' : ' none'}" data-label="Left">${esc(fmt(s.lastLeave))}</div>
        <div class="chips">${s.flags.length === 1 && s.flags[0].k === 'full' ? '<span class="quiet">Present</span>'
          : s.flags.map(f => { const [k, t] = rowChip(f); return `<span class="chip k-${k}">${esc(t)}</span>`; }).join('')} ${rowActions(s)}</div>

    }
  }
  const extras = day.extras.filter(e => !q || e.key.includes(q));
  if (extras.length){
    h += `<h3 class="subhead">${xd ? `Joined but not in ${xd.like === 'all' ? 'any class' : `${cap(xd.like)}’s class`}` : day.secs.length ? `Joined but not on the ${cap(day.dayName)} schedule` : 'Joined'}</h3>`;
    for (const e of extras) h += `<div class="mini"><div class="who"><b>${esc(e.name)}</b></div><div>${timeline(day, e.merged)}</div><div class="small muted">${esc(rangeText(e.merged))}</div></div>`;
  }
  if (day.unmatched.length){
    const opts = day.roster.map(r => `<option value="${esc(r.key)}">${esc(r.name)}</option>`).join('');
    h += `<h3 class="subhead">Unmatched Zoom names</h3>
      <p class="small muted" style="margin:0 0 4px">Link a name once and it’s matched automatically from then on. Ignore names that aren’t students, like your own.</p>`;
    for (const u of day.unmatched) h += `<div class="mini" data-rk="${esc(u.rk)}">
      <div class="who"><b>${esc(u.raw)}</b>${u.email ? `<span class="meta">${esc(u.email)}</span>` : ''}</div>
      <div>${timeline(day, u.merged)}</div>

        ${opts ? `<select aria-label="Student for ${esc(u.raw)}"><option value="">Choose student…</option>${opts}</select>
        <button class="btn small" data-link>Link</button>` : ''}
        <button class="btn small ghost" data-ignore>Ignore</button></div></div>`;
  }
  h += `<div class="files">From ${day.files.map(esc).join(', ')}</div>`;

}

/* ---------------- Students: computation ---------------- */
const hasFlag = (s, k) => s.flags.some(f => f.k === k);
const isWhole = s => !s.isAbsent && s.flags.every(f => f.k === 'full' || f.k === 'fin');
const worstFlag = s => s.flags.reduce((w, x) => SEVERITY[x.k] > SEVERITY[w.k] ? x : w);
const isExcused = s => s.flags[0].k === 'exc';
// Minutes a student left early after finishing their work. They come out of the "scheduled" total.
function finSplit(s){
  if (s._fin) return s._fin;
  let r = { fin: 0, finI: 0, finS: 0 };
  if (s.flags.some(x => x.k === 'fin')){
    // Everything missed after leaving, less what was missed before joining or mid-class, so the rounded minutes always add up.
    const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
    let iOther = 0, sOther = 0;
    for (const g of segsOf(s)) if (g.k !== 'in' && g.k !== 'fin'){ const i = overlap(iIv, g.a, g.b); iOther += i; sOther += (g.b - g.a) - i; }
    const finI = Math.max(0, s.instrReqMin - s.instrMin - mins(iOther)), finS = Math.max(0, s.suppReqMin - s.suppMin - mins(sOther));
    r = { fin: finI + finS, finI, finS };
  }
  return (s._fin = r);
}
const finMinOf = s => finSplit(s).fin;

// A student's scheduled sections on one date, from the schedule version in effect that day, days added by hand included.
// With `at`, the regular weekly plan for that weekday in the version in effect on `at` (days added by hand left out).
const planCache = new WeakMap();
function planFor(A, key, dk, at){
  const sched = at ? A.weekSched(at) : A.schedFor(dk), w = DAYS[parseDk(dk).getDay()], len = state.data.settings.sectionLen;
  let m = planCache.get(sched); if (!m) planCache.set(sched, m = new Map());
  const ck = `${w}|${key}|${len}`;
  if (!m.has(ck)) m.set(ck, planOfSecs((sched.days[w] || []).filter(s => s.students.some(n => normKey(n) === key))));
  return m.get(ck);
}
// The plan for a set of sections: their times, and how many minutes of each kind.
function planOfSecs(list){
  const len = state.data.settings.sectionLen;
  const secs = list.map(s => ({ type: s.type, startMin: s.startMin, endMin: s.endMin ?? s.startMin + len })).sort((a, b) => a.startMin - b.startMin);
  if (!secs.length) return null;
  const iv = mergeIntervals(secs.map(s => [s.startMin, s.endMin]));
  const instrMin = sumIv(mergeIntervals(secs.filter(s => s.type === 'instruction').map(s => [s.startMin, s.endMin])));
  const minutes = sumIv(iv);
  return { secs, minutes, instrMin, suppMin: minutes - instrMin, startMin: iv[0][0], endMin: iv[iv.length - 1][1] };
}

// Every date in the period the student was scheduled, with what happened (oldest first).
function studentDates(A, key, period){
  const out = [], today = todayDk();
  for (let dk = period.from, i = 0; dk <= period.to && i < 1500; dk = addDays(dk, 1), i++){
    const day = A.dayByDk.get(dk), rec = day ? day.students.find(s => s.key === key) : null;
    const plan = planFor(A, key, dk) || (rec && rec.unsched ? planOfSecs(rec.sections) : null);   // a day they came unscheduled
    if (!plan && !rec) continue;
    const status = rec ? 'held' : day ? 'off' : state.data.noClass[dk] ? 'noclass' : dk === today ? 'pending' : dk > today ? 'upcoming' : 'missing';
    if (status === 'off') continue;
    out.push({ dk, status, plan, rec, day });
  }
  return out;
}


/* Where each scheduled minute of a class day went: in Zoom, before joining, out of Zoom mid-class, after leaving,
   or a whole day absent. The report's bars and strips are drawn from this; the numbers on the page come from summarize(). */
const clockMinF = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };   // clock time, safe across daylight saving
const hm = t => fmt(t).replace(/\s?[AP]M$/, '');
const dayLetters = s => [...new Set(s.flags.map(f => f.k === 'soft' ? 'early' : f.k))].filter(k => k !== 'full').sort((a, b) => SEVERITY[b] - SEVERITY[a]).slice(0, 2);
// Spans in ms, inside the scheduled time only. Finished-work and excused time are their own kinds and aren't counted.
function segsOf(s){
  const R = mergeIntervals(s.secs.map(x => [x.a, x.b])), out = [];
  if (isExcused(s)) return R.map(([a, b]) => ({ k: 'exc', a, b }));
  if (s.isAbsent) return R.map(([a, b]) => ({ k: 'absent', a, b }));
  const fin = hasFlag(s, 'fin');
  const kind = (a, b) => b <= s.firstJoin ? 'before' : a >= s.lastLeave ? (fin ? 'fin' : 'after') : 'out';
  for (const [A, B] of R){
    let cur = A;
    for (const [a, b] of s.merged){
      if (b <= cur || a >= B) continue;
      if (a > cur) out.push({ k: kind(cur, a), a: cur, b: a });
      out.push({ k: 'in', a: Math.max(a, cur), b: Math.min(b, B) });
      cur = Math.min(b, B); if (cur >= B) break;
    }
    if (cur < B) out.push({ k: kind(cur, B), a: cur, b: B });
  }
  return out;
}
// Splits a whole-minute total by weights (largest remainder), so the parts always add up to the total.
function apportion(total, W){
  const K = ['before', 'out', 'after'], r = { before: 0, out: 0, after: 0 }, sum = K.reduce((t, k) => t + W[k], 0);
  if (total <= 0) return r;
  if (!sum){ r.after = total; return r; }   // a rounding minute with no gap to show it in
  const raw = K.map(k => total * W[k] / sum);
  K.forEach((k, i) => { r[k] = Math.floor(raw[i]); });
  let left = total - K.reduce((t, k) => t + r[k], 0);
  K.map((k, i) => [k, raw[i] - Math.floor(raw[i]), i]).sort((x, y) => y[1] - x[1] || x[2] - y[2])
    .forEach(([k]) => { if (left > 0){ r[k]++; left--; } });
  return r;
}
// One held, not-excused day in whole minutes, anchored to the day's own rounded numbers.
function dayParts(s){
  const { fin, finI, finS } = finSplit(s), z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const P = { instruction: z(), support: z(), fin, clamped: 0 };
  P.instruction.in = s.instrMin; P.support.in = s.suppMin;
  if (s.isAbsent){
    const sa = s.suppReqMin - s.suppMin;
    P.instruction.absent = s.instrReqMin - s.instrMin; P.support.absent = Math.max(0, sa);
    if (sa < 0) P.clamped = -sa;
    return P;
  }
  const iIv = mergeIntervals(s.secs.filter(x => x.type === 'instruction').map(x => [x.a, x.b]));
  const W = { instruction: { before: 0, out: 0, after: 0 }, support: { before: 0, out: 0, after: 0 } };
  for (const g of segsOf(s)){
    if (g.k === 'in' || g.k === 'fin') continue;   // finished-work minutes aren't counted
    const iMs = overlap(iIv, g.a, g.b), sMs = (g.b - g.a) - iMs;
    W.instruction[g.k] += iMs; W.support[g.k] += sMs;
  }
  let sT = s.suppReqMin - s.suppMin - finS;
  if (sT < 0){ P.clamped = -sT; sT = 0; }   // a rounding minute between presentMin and instrMin
  Object.assign(P.instruction, apportion(s.instrReqMin - s.instrMin - finI, W.instruction));
  Object.assign(P.support, apportion(sT, W.support));
  return P;
}
function partTotals(ctx){
  const z = () => ({ in: 0, before: 0, out: 0, after: 0, absent: 0 });
  const T = { instruction: z(), support: z(), excDays: 0, excMin: 0, finDays: 0, finMin: 0, clamped: 0 };
  for (const d of ctx.dates){
    if (d.status !== 'held') continue;
    const s = d.rec;
    if (isExcused(s)){ T.excDays++; T.excMin += s.reqMin; continue; }
    const P = dayParts(s);
    for (const t of ['instruction', 'support']) for (const k in P[t]) T[t][k] += P[t][k];
    if (P.fin){ T.finDays++; T.finMin += P.fin; }
    T.clamped += P.clamped;
  }
  const sum = o => o.in + o.before + o.out + o.after + o.absent, p = ctx.p;
  if (p) console.assert(T.instruction.in === p.iPres && sum(T.instruction) === p.iReq && T.support.in === p.sPres
    && sum(T.support) - T.clamped === p.sReq && T.finMin === p.finMin, 'partTotals does not match summarize()', T, p);
  return T;
}

// The weekly message for a family, in the teacher's own words: this week's class days so far (or last week's, early in a
// week before any class has a Zoom report). Excused absences and finished-work time aren't counted, as everywhere else,
// and a class they came to without being scheduled is mentioned as an extra class.
function weeklyMessage(A, key){
  const today = todayDk(), held = wk => studentDates(A, key, { from: wk, to: addDays(wk, 6) < today ? addDays(wk, 6) : today })
    .filter(d => d.status === 'held' && !isExcused(d.rec));
  let when = 'this week', ds = held(weekKey(today));
  if (!ds.length){ when = 'last week'; ds = held(addDays(weekKey(today), -7)); }
  // A day they came without being scheduled is an extra class: it's mentioned, but it isn't part of x/y and its minutes aren't missed time.
  const sch = ds.filter(d => !d.rec.unsched), extra = ds.length - sch.length;
  let late = 0, out = 0, early = 0;
  for (const d of sch){
    if (d.rec.isAbsent) continue;
    const P = dayParts(d.rec);
    for (const t of ['instruction', 'support']){ late += P[t].before; out += P[t].out; early += P[t].after; }
  }
  const name = A.nameOf[key] || key, first = firstName(name), m = n => `${plural(Math.round(n), 'minute')} of instruction`;   // the full name once, then the first name
  const parts = [late >= 0.5 && `${m(late)} due to being tardy`, out >= 0.5 && `${m(out)} due to being out in the middle of class`,
    early >= 0.5 && `${m(early)} due to leaving early`].filter(Boolean);
  const and = xs => xs.length < 3 ? xs.join(' and ') : `${xs.slice(0, -1).join(', ')}, and ${xs[xs.length - 1]}`, missed = and(parts);
  // Engagement: the Overview's color for each scheduled class they attended (a color chosen by hand counts), and camera off.
  const recs = new Map(sch.map(d => [d.dk, new Map([[key, d.rec]])]));
  const eng = sch.filter(d => !d.rec.isAbsent).map(d => cellState(A, key, d.dk, recs)).filter(c => ['engaged', 'idle', 'away'].includes(c.cat));
  const nCat = k => eng.filter(c => c.cat === k).length, cam = eng.filter(c => c.C).length;
  // Only the colors they had, the first one "in x of y classes": "present and engaged in 2 of 3 classes and likely present but not engaging in 1".
  const engBits = [['engaged', 'present and engaged'], ['idle', 'likely present but not engaging'], ['away', 'likely not actually present']]
    .filter(([k]) => nCat(k)).map(([k, w], i) => `${w} in ${nCat(k)}${i ? '' : ` of ${plural(eng.length, 'class', 'classes')}`}`);
  const engaged = eng.length ? `\n${first} was ${and(engBits)}${cam ? `, and had their camera off in ${plural(cam, 'class', 'classes')}` : ''}.` : '';
  return { when, n: ds.length, name, text: `Hello,

This is an update regarding ${name}'s attendance ${when}.
${first} attended ${sch.length ? `${sch.filter(d => !d.rec.isAbsent).length}/${sch.length} classes ${when}${extra ? `, plus ${plural(extra, 'extra class', 'extra classes')}` : ''}` : `${plural(extra, 'extra class', 'extra classes')} ${when}`}${parts.length ? `, and missed ${missed}` : ''}.${engaged}

${first}'s current grade in ${state.data.settings.className || 'our intervention class'} is ${(A.grades.get(key) || {}).grade || '00%'}.` , grade: A.grades.get(key) || null };
}
function studentSummary(days){
  const map = new Map();
  for (const day of [...days].reverse()) for (const s of day.students){   // oldest first
    if (!map.has(s.key)) map.set(s.key, { key: s.key, name: s.name, rec: [] });
    map.get(s.key).rec.push({ day, s });
  }
  return [...map.values()].map(summarize);
}
// Plain counts for one student. The page reports these; it doesn't judge them.
function summarize(p){
  const c = { sessions: 0, excused: 0, attended: 0, absent: 0, late: 0, missed: 0, early: 0, soft: 0, drop: 0, full: 0,
    pres: 0, req: 0, finMin: 0, iPres: 0, iReq: 0, sPres: 0, sReq: 0 };
  for (const { s } of p.rec){
    c.sessions++;
    if (isExcused(s)){ c.excused++; continue; }
    const { fin, finI, finS } = finSplit(s);
    c.req += s.reqMin - fin; c.pres += s.presentMin; c.finMin += fin;
    c.iReq += s.instrReqMin - finI; c.iPres += s.instrMin; c.sReq += s.suppReqMin - finS; c.sPres += s.suppMin;
    if (s.isAbsent) c.absent++; else c.attended++;
    if (hasFlag(s, 'late')) c.late++;
    if (hasFlag(s, 'missed')) c.missed++;
    if (hasFlag(s, 'early')) c.early++;
    if (hasFlag(s, 'soft')) c.soft++;
    if (hasFlag(s, 'drop')) c.drop++;
    if (isWhole(s)) c.full++;
  }
  const n = c.sessions - c.excused;
  let run = [];
  for (const { day, s } of p.rec){ if (isExcused(s)) continue; if (s.isAbsent) run.push(day.dk); else run = []; }
  return { ...p, ...c, n, rate: pct(c.attended, n), dose: pct(c.pres, c.req), instrDose: pct(c.iPres, c.iReq), suppDose: pct(c.sPres, c.sReq),
    streak: run.length, streakDates: run };
}
function sortStudents(list){
  const by = state.sort, v = x => x ?? 101, name = (a, b) => a.name.localeCompare(b.name);
  return list.sort((a, b) =>
    by === 'rate' ? v(a.rate) - v(b.rate) || name(a, b)
    : by === 'dose' ? v(a.dose) - v(b.dose) || name(a, b)
    : by === 'absent' ? b.absent - a.absent || name(a, b)
    : name(a, b));
}

// Weekly totals for the chart and the calendar rows. Upcoming days are left out, so this week is "so far".
function weekRows(dates, period, hasPlan = () => true){
  const map = new Map(), today = todayDk(), thisWeek = weekKey(today);
  // A week is complete when none of the student's scheduled days in it fall outside the period
  // (so a period ending on a Friday still counts its last week).
  const inside = wk => { for (let i = 0; i < 7; i++){ const dk = addDays(wk, i); if ((dk < period.from || dk > period.to) && hasPlan(dk)) return false; } return true; };
  for (const d of dates){
    const wk = weekKey(d.dk);
    if (!map.has(wk)) map.set(wk, { wk, received: 0, missed: 0, excFin: 0, notHeld: 0, noReport: 0, cameDays: 0, heldDays: 0,
      waiting: 0, iRec: 0, iReq: 0, absentDks: [], dates: [] });
    const w = map.get(wk); w.dates.push(d);
    if (d.status === 'held'){
      const s = d.rec;
      if (isExcused(s)){ w.excFin += s.reqMin; continue; }
      const fin = finMinOf(s);
      w.received += s.presentMin; w.missed += s.reqMin - s.presentMin - fin; w.excFin += fin;
      w.heldDays++; if (!s.isAbsent) w.cameDays++; else w.absentDks.push(d.dk);
      w.iRec += s.instrMin; w.iReq += s.instrReqMin;
    } else if (d.status === 'noclass') w.notHeld += d.plan.minutes;
    else if (d.status === 'missing') w.noReport += d.plan.minutes;
    else w.waiting++;
  }
  return [...map.values()].sort((a, b) => a.wk.localeCompare(b.wk)).map(w => ({ ...w,
    counted: w.received + w.missed,
    complete: !w.waiting && inside(w.wk),
    current: w.wk === thisWeek }));
}

// Whether a schedule version starting on `from` changed this student's days or times
// (the same weekday is compared the week before and the week of the change).
function planChanged(A, key, from){
  const p = dk => JSON.stringify(planFor(A, key, dk, dk));
  for (let i = 0; i < 7; i++) if (p(addDays(from, i - 7)) !== p(addDays(from, i))) return true;
  return false;
}
// The student's weekly schedule as of the end of the period, e.g. "Mondays 2–4 PM (instruction 2–3, support hour 3–4)".
function scheduleInfo(A, key, period){
  // Every weekday is read from the one schedule in effect at the end of the period (for a dropped student, their last day).
  const end0 = isDk(period.to) ? period.to : todayDk(), drop = dropOf(key);
  const end = drop && drop <= end0 ? addDays(drop, -1) : end0, endW = parseDk(end).getDay(), byW = [];
  for (const w of [1, 2, 3, 4, 5, 6, 0]){
    const plan = planFor(A, key, addDays(end, -((endW - w + 7) % 7)), end);
    if (plan) byW.push({ w, plan });
  }
  const desc = plan => {
    const types = new Set(plan.secs.map(s => s.type));
    const span = shortRange(plan.startMin, plan.endMin);
    if (types.size === 2) return `${span} (${plan.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support hour'} ${shortRange(s.startMin, s.endMin).replace(/ [AP]M$/, '')}`).join(', ')})`;
    return `${span} (${types.has('instruction') ? 'instruction' : 'support hour'})`;
  };
  const groups = [];
  for (const x of byW){ const d = desc(x.plan), g = groups.find(y => y.d === d); if (g) g.ws.push(x.w); else groups.push({ d, ws: [x.w] }); }
  const line = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)} ${g.d}`).join(' · ');
  const weekMin = byW.reduce((t, x) => t + x.plan.minutes, 0);
  // Did this student's plan change inside the period? (The last change wins.)
  let changedOn = null;
  for (const v of A.versions) if (v.from && v.from > period.from && v.from <= period.to && planChanged(A, key, v.from)) changedOn = v.from;
  // The first schedule version with the student, and whether today's schedule has them.
  let firstFrom = null; const inLatest = A.schedFor(todayDk()).roster.some(r => r.key === key);
  for (const v of A.versions) if (v.sched.roster.some(r => r.key === key)){ firstFrom = v.from; break; }
  // Joining the schedule is reported on its own line, so it isn't also called a change.
  if (changedOn && changedOn === firstFrom) changedOn = null;
  return { byW, line, weekMin, changedOn, addedOn: firstFrom || null, inLatest };
}

/* ---------------- Overview: the attendance grid ----------------
   One row per student, one column per class day, filled in from the Zoom and Formative reports in the folder
   and colored the way the teacher's own spreadsheet was. Any cell can be changed by hand. */
// A student's Formative results for one class day, if there was a Formative export that day.
function formOf(A, key, dk){
  const g = A.formByDk.get(dk); if (!g) return null;
  const t = g.byKey.get(key), pct = t && t.pcts.length ? Math.round(t.pcts.reduce((a, b) => a + b, 0) / t.pcts.length) : null;
  const answered = t ? t.answered : 0, total = t ? t.total : g.questions, some = !!(t && t.some && !t.answered);
  // Share of the questions answered. With no question columns, any score (0% too) counts as taking part, and no score doesn't.
  // Answers with no points yet (a results export) count as some, but less than the engaged share.
  const share = !t ? 0 : total ? Math.min(1, answered / total) || (some ? 1e-6 : 0) : pct !== null || some ? 1 : 0;
  return { answered, total, pct, inFile: !!t, share, some, unit: g.units.size === 1 && g.units.has('point') ? 'point' : 'question', files: g.files, parts: t ? t.parts : [] };
}

/* ---------------- Support hour tab ----------------
   A quick check during a support hour: who was let go early this week for finishing their work
   (the days you marked "Finished work"). Always the current week. */
function supportWeek(A){
  const today = todayDk(), wk = weekKey(today), days = [], people = new Map();
  for (let i = 0; i < 7; i++){
    const dk = addDays(wk, i), secs = (A.schedFor(dk).days[DAYS[parseDk(dk).getDay()]] || []).filter(x => x.type === 'support' && x.students.length);
    if (!secs.length) continue;
    days.push(dk);
    const rep = A.dayByDk.get(dk);
    for (const x of secs) for (const n of x.students){
      const k = normKey(n); if (!k) continue;
      if (!people.has(k)) people.set(k, { key: k, name: A.nameOf[k] || n, days: [] });
      const P = people.get(k); if (P.days.some(e => e.dk === dk)) continue;
      const rec = rep ? rep.students.find(r => r.key === k) : null;
      const kind = rec ? (hasFlag(rec, 'fin') ? 'fin' : hasFlag(rec, 'soft') || (rec.canFinish && leftInSupport(rec)) ? 'soft' : rec.isAbsent ? (isExcused(rec) ? 'exc' : 'absent') : hasFlag(rec, 'early') ? 'early' : 'full')
        : state.data.excused[`${dk}|${k}`] ? 'fin' : state.data.noClass[dk] ? 'noclass' : dk < today ? 'missing' : dk === today ? 'today' : 'later';   // marked before the report
      P.days.push({ dk, kind, rec, xk: `${dk}|${k}` });
    }
  }
  return { today, wk, days, people: [...people.values()].sort((a, b) => a.name.localeCompare(b.name)) };
}
// Whether the student's last time in Zoom ended during a support hour (for a day that was only a moment in Zoom, too).
function leftInSupport(rec){
  const inWin = rec.merged.filter(([a, b]) => b > rec.winStart && a < rec.winEnd), t = rec.lastLeave ?? (inWin.length ? inWin[inWin.length - 1][1] : null);
  return t !== null && rec.secs.some(x => x.type === 'support' && t > x.a && t <= x.b);
}
const supDay = dk => `${shortDate(dk).replace(/,.*/, '')} ${parseDk(dk).getDate()}`;

  if (d.status === 'noclass') return `${shortDate(d.dk)}: No class (${NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'Other'})`;

}

// The weekly schedule as a picture: one row per class day on a shared clock, with the instruction and

  const I = mergeIntervals(secs.filter(x => x.type === 'instruction').map(x => [x.startMin, x.endMin]));
  const out = secs.filter(x => x.type === 'instruction').map(x => ({ ...x, type: 'instruction', a: x.startMin, b: x.endMin }));
  for (const x of secs.filter(x => x.type !== 'instruction')){

  const hi = Math.ceil(Math.max(...info.byW.map(x => x.plan.endMin)) / 60) * 60;

  const types = new Set(info.byW.flatMap(x => x.plan.secs.map(s => s.type === 'instruction' ? 'instruction' : 'support')));
  // The track is about 520px wide; each block gets the longest label that fits inside it (the full text is in its title).
  const fit = (t, px) => t.length * 7 + 12 <= px;

// The numbers, and where every scheduled minute went: one bar per kind of class time on a shared scale,
// dark for minutes in Zoom, colored by where the other minutes went. Every value is also written out.
const nf = n => Number(n).toLocaleString('en-US');

  const p = ctx.p, S = state.data.settings;

  const T = partTotals(ctx), sum = o => o.in + o.before + o.out + o.after + o.absent;
  const types = [['instruction', 'Instruction', p.iPres, p.iReq], ['support', 'Support hour', p.sPres, p.sReq]].filter(x => x[3] > 0);
  const maxC = Math.max(1, ...types.map(([t]) => sum(T[t])));

        `<i class="s-${k}" style="flex:${T[t][k]} 0 0" title="${esc(`${label} · ${PART[k]}: ${nf(T[t][k])} min`)}"></i>`).join('')}</div></div>`;
  }).join('');
  const tot = k => T.instruction[k] + T.support[k];

/* The class-strip calendar: weeks down, weekdays across. Each class is a small bar on that weekday's own clock,

// One class as a bar: the scheduled time is the track, colored by where each minute went.
function stripHTML(d, lo, hi){
  const X = m => (m - lo) / Math.max(1, hi - lo) * 100, f = n => n.toFixed(2);
  const held = d.status === 'held';
  const secs = held ? d.rec.secs.map(x => ({ type: x.type, a: clockMinF(x.a), b: clockMinF(x.b) }))
    : d.plan ? d.plan.secs.map(x => ({ type: x.type, a: x.startMin, b: x.endMin })) : [];
  const segs = held ? segsOf(d.rec).map(g => ({ k: g.k, a: clockMinF(g.a), b: clockMinF(g.b) })) : [];
  const sorted = [...secs].sort((x, y) => x.a - y.a);
  let h = '';
  for (const [A, B] of mergeIntervals(secs.map(x => [x.a, x.b]))){

    });

  if (d.status === 'missing') return `${longDate(d.dk)}: No Zoom report.`;
