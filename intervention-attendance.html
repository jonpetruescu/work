  const missing = missingDates(A, period).length;
  h += `<p class="printonly small">Students · ${esc(period.name ? period.name + ' · ' : '')}${esc(fmtPeriod(period))}${state.studentFilter === 'flag' ? ' · Only students who need a look' : ''}${state.query ? ` · Search: “${esc(state.query)}”` : ''} · Printed ${esc(monDay(todayDk()))}, ${new Date().getFullYear()}</p>
    <div class="tiles">
    <div class="tile"><div class="n">${days.length}</div><div class="l">class day${days.length === 1 ? '' : 's'} with reports</div>${missing ? `<div class="s">${plural(missing, 'scheduled day has', 'scheduled days have')} no Zoom report</div>` : ''}</div>
    <div class="tile"><div class="n">${all.length}</div><div class="l">students with class days in these dates</div></div>
    <div class="tile"><div class="n">${avg(rates, 'rate')}</div><div class="l">average days attended</div></div>
    <div class="tile"><div class="n">${avg(doses, 'dose')}</div><div class="l">average minutes received</div></div>
    <button class="tile tilebtn${flagged ? ' warn' : ''}" data-sfilter="${state.studentFilter === 'flag' ? 'all' : 'flag'}" aria-pressed="${state.studentFilter === 'flag'}">
      <span class="n">${flagged}</span><span class="l">need a look</span><span class="s">below ${T}% with ${FEW_DAYS}+ class days, or absent 2+ in a row</span></button>
  </div>`;
  const datesOf = new Map(all.map(s => [s.key, studentDates(A, s.key, period)]));
  const kinds = new Set();
  for (const s of list) for (const d of datesOf.get(s.key).filter(d => d.status === 'held' || d.status === 'noclass' || d.status === 'missing').slice(-10)) kinds.add(cellKind(d));
  h += letterLegend(kinds);
  h += `<div class="tablewrap"><table class="sum"><thead><tr><th>Student</th><th>Days attended</th><th>Minutes received</th>
    <th class="num">Late</th><th class="num">Missed instr.</th><th class="num">Left early</th><th class="num">Out mid-class</th>
    <th class="num">Absent</th><th>Last 10 class days</th></tr></thead><tbody>`;
  if (!list.length) h += `<tr><td colspan="9" class="muted">${state.studentFilter === 'flag' && !state.query ? 'Nobody needs a look in these dates.' : 'No students match that search.'}</td></tr>`;
  let dividerShown = false;
  for (const s of list){
    if (state.sort === 'concern' && state.studentFilter === 'all' && !s.concern && !dividerShown && list.some(x => x.concern)){
      h += `<tr class="divider"><td colspan="9">Not flagged (${list.filter(x => !x.concern).length})</td></tr>`; dividerShown = true;
    }
    const info = scheduleInfo(A, s.key, period);
    const chips = [];
    if (s.streak >= 2) chips.push(`<span class="chip k-absent">Absent last ${s.streak}</span>`);
    if (s.excused) chips.push(`<span class="chip k-exc">${s.excused} excused</span>`);
    if (info.addedOn && info.addedOn > period.from) chips.push(`<span class="chip k-extra">Added to the schedule ${esc(monDay(info.addedOn))}</span>`);
    if (!info.inLatest) chips.push(`<span class="chip k-extra">Not on the current schedule</span>`);
    let sub = '';
    if (s.concern){
      const f = lastFollowUp(s.key);
      sub = `<span class="reasons">Needs a look: ${esc(s.reasons.map(r => r.short).join(' · '))}</span>
        <span class="subnote">${f ? `Last follow-up: ${esc(monDay(f.date))}, ${esc(FU_HOW[f.how] ? FU_HOW[f.how].charAt(0).toLowerCase() + FU_HOW[f.how].slice(1) : 'other')}` : 'No follow-up logged'}</span>`;
    } else if (s.few) sub = `<span class="subnote">${esc(fewText(s, period.open))}</span>`;
    else if (s.near) sub = `<span class="subnote">Close to the ${T}% line</span>`;
    const split = s.iReq && s.sReq ? `<span class="subnote">${s.few ? `Instruction ${s.iPres} of ${s.iReq} · Support ${s.sPres} of ${s.sReq}` : `Instruction ${s.instrDose}% · Support ${s.suppDose}%`}</span>` : '';
    const leftEarly = s.early + s.soft;
    h += `<tr class="${s.concern ? 'flagged' : ''}">
      <td class="c-name"><button class="name-btn" data-openstudent="${esc(s.key)}">${esc(s.name)}</button>
        ${chips.length ? `<div class="chips" style="margin-top:3px">${chips.join('')}</div>` : ''}${sub}
        <span class="cardcounts">Late ${s.late} · Missed instr. ${s.missed} · Left early ${leftEarly} · Out ${s.drop} · Absent ${s.absent}</span></td>
      <td data-label="Days attended">${meter(s.rate, s.few)}<span class="small muted">${s.attended} of ${s.n}</span></td>
      <td data-label="Minutes received">${meter(s.dose, s.few)}<span class="small muted">${s.pres} of ${s.req} min</span>${split}</td>
      <td class="num">${cnt(s.late)}</td><td class="num">${cnt(s.missed)}</td>
      <td class="num">${cnt(leftEarly)}${s.soft ? `<span class="subnote">${s.soft} from support hour</span>` : ''}</td>
      <td class="num">${cnt(s.drop)}</td><td class="num">${cnt(s.absent)}</td>
      <td class="c-last" data-label="Last 10 class days">${lastTen(datesOf.get(s.key))}</td></tr>`;
  }
  h += `</tbody></table></div>
    <p class="small muted" style="margin-top:10px">Excused absences and finished-work time don’t count against a student. “Minutes received” is time in Zoom during the hours the student was scheduled. Click a name for the full student report.
    <span class="noprint">Change the ${T}% line on the <button class="linkish" data-goto="settings">Settings tab</button>.</span></p>`;
  el.innerHTML = h;
}

/* ---------------- Student report ---------------- */
function ctxFor(A, key, period, sums){
  const all = sums || studentSummary(daysInRange(A.days));
  const p = all.find(x => x.key === key) || null;
  const name = p ? p.name : (A.nameOf[key] || key);
  const dates = studentDates(A, key, period);
  let allN = 0; for (const d of A.days) for (const s of d.students) if (s.key === key && !isExcused(s)) allN++;
  const ctx = { A, period, key, name, first: firstName(name), p, dates, weeks: weekRows(dates, period, dk => !!planFor(A, key, dk)), info: scheduleInfo(A, key, period) };
  ctx.desc = p ? describeStudent(p, allN, period.open) : null;
  return ctx;
}
function renderStudentReport(A, el){
  const period = periodOf(A), { list } = studentList(A);
  const ctx = ctxFor(A, state.student, period);
  el.innerHTML = studentReportHTML(ctx, { include: state.include, order: list.map(s => ({ key: s.key, name: s.name })) });
  focusNoteInput(el);
}
function studentReportHTML(ctx, o){
  if (o.family) return familyReportHTML(ctx, o);
  let h = `<article class="sreport" data-student="${esc(ctx.key)}">`;
  if (!o.print) h += reportBar(ctx, o);
  h += reportHeader(ctx);
  if (!ctx.p){
    h += `<section class="rsec"><p>No class days with Zoom reports for ${esc(ctx.name)} in these dates.${o.print ? '' : ` <button class="linkish" data-range="all">Show all dates</button>`}</p></section>`;
    if (!o.print) h += followUpSection(ctx, o);
    return h + '</article>';
  }
  if (!o.print) h += checksSection(ctx);
  h += statusSection(ctx) + factsSection(ctx, o) + weekSection(ctx, o) + `<section class="rsec"><h3>Calendar</h3>${calendarHTML(ctx, o)}</section>`;
  if (!o.print) h += dayRowsSection(ctx);
  else if (o.include.table) h += printDayTable(ctx, o);
  if (!o.print || o.include.log) h += followUpSection(ctx, o);
  if (!o.print) h += familySection(ctx);
  return h + footerSection(ctx, o) + '</article>';
}

function reportBar(ctx, o){
  const order = o.order || [], i = order.findIndex(x => x.key === ctx.key);
  const prev = i > 0 ? order[i - 1] : null, next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
  const back = state.studentFrom ? `← Back to ${longDate(state.studentFrom)}` : '← All students';
  return `<div class="rbar">
    <div class="r1"><button class="btn small ghost" data-studentback>${esc(back)}</button>
      ${i >= 0 && order.length > 1 ? `<nav class="pn" aria-label="Other students">${prev ? `<button class="btn small ghost" data-stepstudent="${esc(prev.key)}" title="Previous: ${esc(prev.name)}">‹ ${esc(prev.name)}</button>` : ''}
        <span>${i + 1} of ${order.length}</span>
        ${next ? `<button class="btn small ghost" data-stepstudent="${esc(next.key)}" title="Next: ${esc(next.name)}">${esc(next.name)} ›</button>` : ''}</nav>` : ''}</div>
    ${rangeBar()}
    <div class="r3"><details class="menu"><summary class="btn small">Print…</summary><div class="pop" role="group" aria-label="Print">
        <button class="item" data-printone>Print this report</button><button class="item" data-printfamily>Print family version</button></div></details>
      <button class="btn small ghost" data-copysummary>Copy summary</button>
      <button class="btn small ghost" data-exportstudent title="Saves a file with this student’s name to your Downloads folder.">Download CSV</button></div>
    <div class="incrow">Include on print, summary and CSV: ${includeBoxes()}</div></div>`;
}

function reportHeader(ctx){
  const { period, info, p } = ctx, S = state.data.settings;
  const nWeeks = Math.round((parseDk(weekKey(period.to)) - parseDk(weekKey(period.from))) / 6048e5) + 1;
  return `<header class="rhead"><div class="eyebrow">Intervention attendance report</div>
    <h2 tabindex="-1">${esc(ctx.name)}</h2>
    <p>Report period: ${period.name ? `${esc(period.name)} · ` : ''}${esc(fmtPeriod(period))} · ${plural(nWeeks, 'week')}</p>
    <p>Scheduled: ${info.line ? `${esc(info.line)} · ${info.weekMin} minutes a week` : 'not on the schedule at the end of these dates'}${info.changedOn ? ` (changed ${esc(monDay(info.changedOn))})` : ''}</p>
    ${info.addedOn && info.addedOn > period.from ? `<p>On the schedule since ${esc(monDay(info.addedOn))}, ${parseDk(info.addedOn).getFullYear()}</p>` : ''}
    ${info.inLatest ? '' : '<p>Not on the current schedule</p>'}
    <p class="small muted">Based on ${plural(p ? p.sessions : 0, 'class day')} with Zoom reports · Printed ${esc(monDay(todayDk()))}, ${new Date().getFullYear()} · Prepared by ${esc(S.teacherName || '______')}</p></header>`;
}

function checksSection(ctx){
  const { A, p, period, dates, first } = ctx, out = [];
  const miss = dates.filter(d => d.status === 'missing').map(d => d.dk);
  if (miss.length) out.push(`No Zoom report for ${esc(dateList(miss, 3))}. If class met, save that report into the folder and click Refresh. If there was no class:${noClassItems(miss)}`);
  const unm = dates.filter(d => d.status === 'held' && d.rec.isAbsent && !isExcused(d.rec) && d.day.unmatched.length);
  for (const d of unm.slice(0, 3)) out.push(`${esc(first)} is marked absent on ${esc(shortDate(d.dk))}, but ${plural(d.day.unmatched.length, 'Zoom name')} that day didn’t match anyone: ${esc(listJoin(d.day.unmatched.map(u => `“${u.raw}”`), 3))}. If it was ${esc(first)}, link it. <button class="linkish" data-goday="${d.dk}" data-xkey="${esc(d.rec.xkey)}">Go to that day</button>`);
  if (unm.length > 3) out.push(`${unm.length - 3} more absent days also have Zoom names that didn’t match anyone.`);
  if (p.n && p.few) out.push(period.open ? `Only ${plural(p.n, 'class day')} so far. Percentages can change a lot with one more day.`
    : `Only ${plural(p.n, 'class day')} in these dates, so the percentages rest on very few days.`);
  for (const v of A.versions) if (v.from && v.from > period.from && v.from <= period.to && planChanged(A, ctx.key, v.from))
    out.push(`${esc(first)}’s schedule changed on ${esc(monDay(v.from))}. Days before then are checked against the earlier schedule.`);
  for (const d of dates.filter(d => d.status === 'held' && d.rec.groupLate).slice(0, 3))
    out.push(`On ${esc(shortDate(d.dk))} most of the ${esc(fmt(d.rec.secs[0].a).replace(':00', ''))} group joined late. That day isn’t used for lateness patterns.`);
  const conf = conflictNotices(A, period, ctx.key);
  if (!out.length && !conf) return `<div class="notice info"><b>Before you share:</b> checked. Every scheduled day has a Zoom report or a no-class mark, and every absent day has all Zoom names matched.</div>`;
  return (out.length ? `<div class="notice"><b>Before you share</b><ul class="checks">${out.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '') + conf;
}

const tile = (label, value, sub) => `<div class="tile"><div class="l">${esc(label)}</div><div class="n">${esc(value)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>`;
function statusSection(ctx){
  const { p, dates, period, A } = ctx, T = state.data.settings.concernRate, so = p.few && period.open ? ' so far' : '';
  let st;
  if (p.concern) st = `<div class="status bad"><b>Needs a look</b><ul>${p.reasons.map(r => `<li>${esc(r.long)}</li>`).join('')}</ul></div>`;
  else if (p.few) st = `<div class="status few"><b>${esc(fewText(p, period.open))}</b><span class="small muted">${p.n ? `Not flagged by percent until there are ${FEW_DAYS} class days.` : 'Excused days don’t count for or against a student.'}</span></div>`;
  else st = `<div class="status"><b>On track</b><span class="small">Attended ${ofN(p.attended, p.n, 'class day')} and ${p.dose}% of scheduled minutes.${p.near ? ` Close to your ${T}% line.` : ''}</span></div>`;
  const brief = p.missed - p.suppOnly;
  if (p.suppOnly) st += `<p class="small">Came only for the support hour on ${plural(p.suppOnly, 'day')}. Those days count as attended.</p>`;
  if (brief) st += `<p class="small">Was in Zoom for less than 5 minutes of instruction on ${plural(brief, 'day')}. Those days count as attended.</p>`;
  const tiles = [tile('Days attended', `${p.attended} of ${p.n}`, `${p.rate === null ? 'none counted' : `${p.rate}%${so}`}${p.excused ? ` · ${p.excused} excused, not counted` : ''}`)];
  if (p.iReq) tiles.push(tile('Instruction minutes', `${p.iPres} of ${p.iReq}`, `${p.instrDose}%${so}`));
  if (p.sReq || p.finMin) tiles.push(tile('Support-hour minutes', `${p.sPres} of ${p.sReq}`,
    `${p.suppDose === null ? '—' : `${p.suppDose}%${so}`}${p.finMin ? ` · ${p.finMin} min finished work early, not counted` : ''}`));
  const held = dates.filter(d => d.status === 'held').length, nc = dates.filter(d => d.status === 'noclass'), ms = dates.filter(d => d.status === 'missing');
  const reason = dk => (NOCLASS_REASONS[(state.data.noClass[dk] || {}).reason] || 'other').toLowerCase();
  tiles.push(tile('Class days held', `${held} of ${held + nc.length + ms.length}`, nc.length || ms.length
    ? [nc.length ? `${nc.length} no class (${listJoin(nc.map(d => `${monDay(d.dk)}, ${reason(d.dk)}`), 2)})` : '',
       ms.length ? `${ms.length} missing a report (${listJoin(ms.map(d => monDay(d.dk)), 2)})` : ''].filter(Boolean).join(' · ')
    : 'Every scheduled day had a Zoom report'));
  tiles.push(tile('Absent in a row', `${p.streak} now`, p.streak ? dateList(p.streakDates, 3)
    : p.longest.len ? `Longest: ${p.longest.len} (${listJoin(p.longest.dates.map(monDay), 3)})` : 'No absences'));
  let cmp = '';
  const prev = state.data.periods.filter(x => x.to < period.from).sort((a, b) => b.to.localeCompare(a.to))[0];
  if (prev && !p.few){
    const q = studentSummary(A.days.filter(d => d.dk >= prev.from && d.dk <= prev.to)).find(x => x.key === p.key);
    if (q && !q.few){
      const useI = p.iReq && q.iReq;
      const pc = v => v === null || v === undefined ? '—' : `${v}%`;
      const mins2 = useI ? `instruction minutes ${pc(q.instrDose)} → ${pc(p.instrDose)}`
        : q.suppDose !== null && p.suppDose !== null ? `support-hour minutes ${pc(q.suppDose)} → ${pc(p.suppDose)}` : `minutes received ${pc(q.dose)} → ${pc(p.dose)}`;
      cmp = `<p class="small">Compared with ${esc(prev.name)} (${esc(monDay(prev.from))} – ${esc(monDay(prev.to))}): days attended ${pc(q.rate)} → ${pc(p.rate)}, ${esc(mins2)}.</p>`;
    }
  }
  return `<section class="rsec"><h3>Summary</h3>${st}<div class="rtiles">${tiles.join('')}</div>${cmp}</section>`;
}

function factsSection(ctx, o){
  const d = ctx.desc;
  return `<section class="rsec"><h3>What the attendance shows</h3><p style="margin:0 0 6px">${esc(d.lead.join(' '))}</p><ul class="facts">
    ${d.items.map(it => `<li>${esc(it.text)}${o.print || !it.dks.length ? '' : ` <button class="linkish" data-showdays="${it.dks.join(',')}">Show these days</button>`}</li>`).join('')}
    ${d.empty ? `<li>${esc(d.empty)}</li>` : ''}${d.strength ? `<li>${esc(d.strength)}</li>` : ''}</ul></section>`;
}

/* Minutes each week: a light column for the minutes expected while class met, the dark column for what the student got. */
function barPath(cls, x, y, w, h){
  if (h <= 0.4) return '';
  const r = Math.min(4, w / 2, h), f = v => v.toFixed(1);
  return `<path class="${cls}" d="M${f(x)},${f(y + h)}V${f(y + r)}Q${f(x)},${f(y)} ${f(x + r)},${f(y)}H${f(x + w - r)}Q${f(x + w)},${f(y)} ${f(x + w)},${f(y + r)}V${f(y + h)}Z"/>`;
}
function weekTip(w){
  const parts = [`Week of ${monDay(w.wk)}${w.current && !w.complete ? ' (so far)' : ''}: received ${w.received} of ${w.counted} expected minutes.`];
  if (w.missed) parts.push(`Missed ${w.missed}${w.absentDks.length ? ` (absent ${listJoin(w.absentDks.map(shortDate), 3)})` : ''}.`);
  if (w.iReq && w.iReq !== w.counted) parts.push(`Instruction ${w.iRec} of ${w.iReq}.`);
  if (w.excFin) parts.push(`${w.excFin} min excused or finished early.`);
  if (w.notHeld) parts.push(`${w.notHeld} min no class.`);
  if (w.noReport) parts.push(`${w.noReport} min with no Zoom report.`);
  if (w.heldDays) parts.push(`Came ${w.cameDays} of ${plural(w.heldDays, 'day')}.`);
  return parts.join(' ');
}
function weekChart(ctx, o, full){
  const W = ctx.weeks, idx = ++state.renderIdx;
  const host = $('#tab-students'), avail = host && host.clientWidth ? host.clientWidth - 64 : 640;
  const width = o.print ? 680 : Math.round(Math.max(300, Math.min(680, avail)));
  const H = 182, x0 = 40, x1 = width - 6, yTop = 14, yBase = 128;
  const n = W.length, slot = (x1 - x0) / n, colW = Math.max(6, Math.min(24, slot * .55));
  const yMax = Math.max(10, Math.ceil(Math.max(full, ...W.map(w => w.counted)) * 1.12 / 10) * 10);
  const y = v => yBase - v / yMax * (yBase - yTop), f = v => v.toFixed(1);
  let g = '';
  for (const v of [...new Set([0, Math.round(full / 2), full])])
    g += `<line class="${v && v === full ? 'wk-full' : 'wk-grid'}" x1="${x0}" x2="${x1}" y1="${f(y(v))}" y2="${f(y(v))}"/><text class="wk-txt" x="${x0 - 6}" y="${f(y(v) + 4)}" text-anchor="end">${v}</text>`;
  const every = Math.max(1, Math.ceil(54 / slot)), showL2 = slot >= 66;   // about 54px per date label
  let lowest = -1;
  W.forEach((w, i) => { if (w.counted && (lowest < 0 || w.received / w.counted < W[lowest].received / W[lowest].counted)) lowest = i; });
  const fus = (state.data.followUps[ctx.key] || []).filter(x => x.date >= ctx.period.from && x.date <= ctx.period.to);
  W.forEach((w, i) => {
    const hasFu = fus.some(x => weekKey(x.date) === w.wk), cx = x0 + slot * (i + .5), bx = cx - colW / 2, tip = weekTip(w) + (hasFu ? ' Follow-up logged.' : '');
    g += `<g class="wkcol"${o.print ? '' : ` tabindex="0" data-tip="${esc(tip)}"`} role="img" aria-label="${esc(tip)}">`;
    g += `<rect class="wk-hit" x="${f(x0 + slot * i + 1)}" y="${yTop - 8}" width="${f(Math.max(1, slot - 2))}" height="${yBase - yTop + 48}" rx="4"/>`;
    g += barPath('wk-plan', bx, y(w.counted), colW, yBase - y(w.counted)) + barPath('wk-rec', bx, y(w.received), colW, yBase - y(w.received));
    if (w.counted && (slot >= 24 || i === n - 1 || i === lowest))
      g += `<text class="wk-val" x="${f(cx)}" y="${f(y(w.received) - 5)}" text-anchor="middle">${w.received}</text>`;
    if ((i % every === 0 && n - 1 - i >= every) || i === n - 1){   // the last week is always labeled, so skip a label right before it
      // Labels near the chart's edges are anchored to the edge so they never spill past it.
      const [lx, anchor] = cx - 20 < x0 - 4 ? [x0 - 4, 'start'] : cx + 20 > width - 2 ? [width - 2, 'end'] : [cx, 'middle'];
      g += `<text class="wk-txt" x="${f(lx)}" y="${yBase + 17}" text-anchor="${anchor}">${esc(monDay(w.wk))}</text>`;
      const l2 = w.current && !w.complete ? 'so far' : w.heldDays ? `${w.cameDays} of ${plural(w.heldDays, 'day')}` : w.noReport ? 'no report' : w.notHeld ? 'no class' : w.excFin ? 'excused' : '';
      if (l2 && (showL2 || !w.heldDays)) g += `<text class="wk-txt" x="${f(lx)}" y="${yBase + 30}" text-anchor="${anchor}">${esc(l2)}</text>`;
    }
    if (hasFu) g += `<path class="wk-fu" d="M${f(cx - 5)},${yBase + 48}L${f(cx)},${yBase + 40}L${f(cx + 5)},${yBase + 48}Z"/>`;
    g += `</g>`;
  });
  return `<figure class="wkchart" style="margin:0"><svg viewBox="0 0 ${width} ${H}" role="group" aria-labelledby="wkT-${idx}"><title id="wkT-${idx}">Minutes each week for ${esc(ctx.name)}</title>${g}</svg></figure>`;
}
function weekSection(ctx, o){
  const W = ctx.weeks, full = ctx.info.weekMin || Math.max(0, ...W.map(w => w.counted + w.excFin + w.notHeld + w.noReport));
  if (!W.some(w => w.counted > 0)) return `<section class="rsec"><h3>Minutes each week</h3><p class="muted small">No class met in these dates.</p></section>`;
  const comp = W.filter(w => w.complete && w.counted > 0), sr = comp.reduce((t, w) => t + w.received, 0), sc = comp.reduce((t, w) => t + w.counted, 0);
  const head = comp.length ? `Averaged ${Math.round(sr / comp.length)} of ${Math.round(sc / comp.length)} expected minutes a week (${pct(sr, sc)}%) over ${plural(comp.length, 'full week')}.` : 'No full week yet in these dates.';
  const anyFu = (state.data.followUps[ctx.key] || []).some(x => x.date >= ctx.period.from && x.date <= ctx.period.to);
  const legend = `<div class="chartlegend"><span><i class="rec"></i>Minutes received</span><span><i class="pl"></i>Minutes expected when class met</span>
    <span><i class="ln"></i>Full week: ${full} minutes</span>${anyFu ? '<span>▲ Follow-up logged</span>' : ''}</div>`;
  const table = `<details class="noprint"><summary class="small">Show as a table</summary><div style="overflow-x:auto"><table class="plain"><thead><tr><th>Week of</th><th>Expected</th><th>Received</th><th>Missed</th><th>Excused or finished early</th><th>No class</th><th>No report</th><th>Days came</th></tr></thead><tbody>
    ${W.map(w => `<tr><td>${esc(monDay(w.wk))}${w.current && !w.complete ? ' (so far)' : ''}</td><td>${w.counted}</td><td>${w.received}</td><td>${w.missed}</td><td>${w.excFin}</td><td>${w.notHeld}</td><td>${w.noReport}</td><td>${w.heldDays ? `${w.cameDays} of ${w.heldDays}` : '—'}</td></tr>`).join('')}</tbody></table></div></details>`;
  return `<section class="rsec"><h3>Minutes each week</h3><p class="wkhead">${esc(head)}</p>${legend}${weekChart(ctx, o, full)}
    <p class="caption">${esc(ctx.desc.trendCaption)}</p>${o.print ? '' : table}</section>`;
}

function calendarHTML(ctx, o){
  const fam = !!o.family, { weeks, period, dates } = ctx;
  const wds = [...new Set(dates.map(d => parseDk(d.dk).getDay()))].sort(byWeekOrder);
  if (!wds.length) return '<p class="muted small">No scheduled days in these dates.</p>';
  const total = weeks.length, rows = !o.print && !state.calAll && total > 12 ? weeks.slice(-12) : weeks;
  const kinds = new Set();
  let body = '';
  for (const w of rows){
    body += `<tr><th class="wk" scope="row">${esc(monDay(w.wk))}</th>`;
    for (const wd of wds){
      const dk = addDays(w.wk, (wd + 6) % 7), d = w.dates.find(x => x.dk === dk), num = parseDk(dk).getDate();
      if (d && d.status === 'held'){
        const s = d.rec, worst = worstFlag(s).k;
        let L = [...new Set(s.flags.map(x => x.k))].sort((a, b) => SEVERITY[b] - SEVERITY[a]).filter(k => k !== 'full');
        if (!L.length) L = ['full'];
        L = L.slice(0, 2); L.forEach(k => kinds.add(k));
        const mn = isExcused(s) || s.isAbsent ? '' : s.presentMin;
        const title = `${shortDate(dk)}: ${s.flags.map(x => x.label).join(', ')}${mn !== '' ? ` · ${s.presentMin} of ${s.reqMin - finMinOf(s)} min` : ''}`;
        const inner = `<span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${L.map(k => LETTER[k]).join('')}</span><span class="mn" aria-hidden="true">${mn}</span>`;
        body += o.print ? `<td class="k-${worst}" data-dk="${dk}">${inner}<span class="sr">${esc(title)}</span></td>`
          : `<td class="k-${worst}" data-dk="${dk}"><button class="calbtn" data-goday="${dk}" data-xkey="${esc(s.xkey)}" title="${esc(title)}. See this day on Reports.">${inner}</button></td>`;
      } else if (d && (d.status === 'noclass' || d.status === 'missing')){
        kinds.add(d.status);
        const t = cellTitle(d);
        body += `<td class="c-${d.status}" data-dk="${dk}" title="${esc(t)}"><span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER[d.status]}</span><span class="sr">${esc(t)}</span></td>`;
      } else if (d) body += `<td class="c-pending" title="${esc(shortDate(dk))}"><span class="dn">${num}</span><span class="sr">${esc(shortDate(dk))}: not yet</span></td>`;
      else if (dk >= period.from && dk <= period.to) body += `<td class="c-off"><span class="dn" aria-hidden="true">${num}</span><span aria-hidden="true">${LETTER.off}</span><span class="sr">${esc(shortDate(dk))}: not on the schedule</span></td>`;
      else body += '<td></td>';
    }
    body += '</tr>';
  }
  // Per-weekday summary rows, over every week in the period.
  const foot = { came: [], ontime: [], joined: [], left: [] };
  for (const wd of wds){
    const held = dates.filter(d => d.status === 'held' && !isExcused(d.rec) && parseDk(d.dk).getDay() === wd), att = held.filter(d => !d.rec.isAbsent);

    foot.came.push(held.length ? `${att.length} of ${held.length}` : '—');
    foot.ontime.push(att.length ? `${att.filter(d => !hasFlag(d.rec, 'late') && !hasFlag(d.rec, 'missed')).length} of ${att.length}` : '—');
    foot.joined.push(att.length ? fmtMin(median(att.map(d => clockOf(d.rec.firstJoin)))) + one : '—');
    foot.left.push(att.length ? fmtMin(median(att.map(d => clockOf(d.rec.lastLeave)))) + one : '—');
  }
  const frow = (label, xs) => `<tr><th scope="row">${label}</th>${xs.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`;
  const heldN = dates.filter(d => d.status === 'held').length;
  return `<div class="calwrap"><table class="cal"><caption class="sr">Calendar of ${plural(heldN, 'class day')}. Letters show what happened each day.</caption>
    <thead><tr><th class="wk"><span class="sr">Week of</span></th>${wds.map(w => `<th scope="col">${cap(DAYS[w]).slice(0, 3)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody><tfoot>${frow('Came', foot.came)}${fam ? '' : frow('On time', foot.ontime) + frow('Usually joined', foot.joined) + frow('Usually left', foot.left)}</tfoot></table></div>
    ${letterLegend(kinds, fam ? LETTER_FAMILY : LETTER_TEAM)}<p class="caption">${fam ? 'The number is minutes in class.' : 'Number = minutes in Zoom during scheduled time.'}</p>
    ${!o.print && total > 12 ? `<button class="linkish noprint" data-calall>${state.calAll ? 'Show the latest 12 weeks' : `Show all ${total} weeks`}</button>` : ''}`;
}

function dayRowsSection(ctx){

  if (!shown.length) return '';

  for (const wd of [...groups.keys()].sort(byWeekOrder)){

    const sMin = Math.min(...plans.map(x => x.startMin)), eMin = Math.max(...plans.map(x => x.endMin));
    const summary = latest ? latest.secs.map(s => `${s.type === 'instruction' ? 'instruction' : 'support hour'} ${shortRange(s.startMin, s.endMin)}`).join(', ') : '';

}

  const s = d.rec, lines = [];

    <div class="who"><button class="name-btn" data-goday="${d.dk}" data-xkey="${esc(s.xkey)}" title="See this day on Reports">${esc(shortDate(d.dk))}</button>
      ${lines.map(l => `<span class="meta">${esc(l)}</span>`).join('')}

    <div class="tlc">${timeline(axisFor(d.dk, sMin, eMin), s.merged, s.secs)}</div>
    <div class="time${s.firstJoin ? '' : ' none'}" data-label="Joined">${esc(fmt(s.firstJoin))}</div>

    <div class="chips">${s.flags.map(f => `<span class="chip k-${f.k}">${esc(f.label)}</span>`).join('')} ${rowActions(s)}</div></div>`;
}
function printDayTable(ctx, o){

    ${rows.map(d => {

/* Follow-up log: what has been done about it */
const fuHow = f => FU_HOW[f.how] || 'Other';
const fuSorted = key => [...(state.data.followUps[key] || [])].sort((a, b) => b.date.localeCompare(a.date));

/* Note to the family: fixed, warm sentences with the student's numbers slotted in. Never notes, follow-ups or Zoom names. */
const draftKey = ctx => ctx.key;   // one draft per student; it remembers which dates it was written for
// At most one thing to work on. Lateness, leaving early and time out of Zoom are only raised when the team report
// finds them as a pattern, or the student needs a look, so a family never hears about something the report calls minor.
function familyConcern(ctx){
  const { p, A, first: F } = ctx; if (!p || !p.n) return null;
  const att = p.rec.filter(r => !isExcused(r.s) && !r.s.isAbsent);
  const found = id => (ctx.desc && ctx.desc.found || []).find(x => x.id === id);
  const raise = id => !!found(id) || p.concern;
  // "On Mondays" only when the pattern itself is about Mondays; otherwise a count of days.
  const on = (id, rs) => { const it = found(id), w = it && it.w !== null && it.w !== undefined ? it.w : null;
    return w !== null ? { w, txt: `On ${wdPlural(w)}`, tail: ` on ${wdPlural(w)}` } : { w: null, txt: `On ${rs.length} days`, tail: '' }; };
  const planOn = w => { const r = [...att].reverse().find(x => x.day.date.getDay() === w); return r ? planFor(A, ctx.key, r.day.dk) : null; };
  if (p.streak >= 2){
    const dl = dateList(p.streakDates, 4, longDate);
    return { concern: `${F} missed the last ${p.streak} classes, ${dl.startsWith('from ') ? '' : 'on '}${dl}.`, ask: 'Is anything making it hard to join? I would like to help.' };
  }
  const suppOnlyR = att.filter(r => hasFlag(r.s, 'missed') && r.s.suppMin >= 5);
  if (suppOnlyR.length >= 2 && raise('E')){
    const starts = new Set(suppOnlyR.map(r => Math.min(...r.s.secs.filter(x => x.type === 'instruction').map(x => clockOf(x.a)))));
    return { concern: `On ${suppOnlyR.length} days, ${F} missed the teaching part of class.`,
      ask: starts.size === 1 ? `The teaching part starts at ${fmtMin([...starts][0])}. Could ${F} join by then?` : `Could ${F} join at the start of the teaching part?` };
  }
  const lateR = att.filter(r => !r.s.groupLate && hasFlag(r.s, 'late'));
  if (lateR.length >= 2 && raise('A')){
    const o = on('A', lateR), pl = o.w !== null ? planOn(o.w) : null, med = Math.round(median(lateR.map(r => r.s.flags.find(f => f.k === 'late').min)));
    return { concern: `${o.txt}, ${F} joined about ${med} minutes late.`,
      ask: pl ? `Class starts at ${fmtMin(pl.startMin)}. Could ${F} log in by ${fmtMin(pl.startMin - 5)}${o.tail}?` : `Could ${F} log in about 5 minutes before class starts?` };
  }
  const leftR = att.filter(r => !hasFlag(r.s, 'fin') && (hasFlag(r.s, 'early') || hasFlag(r.s, 'soft')));
  if (leftR.length >= 2 && raise('B')){
    const o = on('B', leftR), pl = o.w !== null ? planOn(o.w) : null;
    return { concern: `${o.txt}, ${F} left before the end of class.`,
      ask: pl ? `Class ends at ${fmtMin(pl.endMin)}. Could ${F} stay until then${o.tail}?` : `Could ${F} stay until the end of class?` };
  }
  const dropR = att.filter(r => hasFlag(r.s, 'drop'));
  if (dropR.length >= 2 && raise('C')) return { concern: `${F} was out of Zoom for part of class on ${dropR.length} days.`, ask: 'If the internet or a device is a problem, please let me know. I can help.' };
  return null;
}
function familySchedule(ctx){
  const groups = [];
  for (const { w, plan } of ctx.info.byW){
    const g = groups.find(x => x.s === plan.startMin && x.e === plan.endMin);
    if (g) g.ws.push(w); else groups.push({ s: plan.startMin, e: plan.endMin, ws: [w] });
  }
  if (!groups.length) return '';
  const parts = groups.map(g => `${listJoin(g.ws.map(wdPlural), 7)}, ${fmtRange(g.s, g.e)}`);
  return `Class meets on ${parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(', ')}, and ${parts[parts.length - 1]}`}.`;
}
function familyNote(ctx, withConcern){
  const { p, period, first: F } = ctx, S = state.data.settings;
  const L = [`Hello, ${F}’s family,`, '', `This is an update on ${F}’s attendance in ${S.className || 'our intervention class'}.`,
    `It covers ${monthDay(period.from)} to ${monthDay(period.calcTo)}.`];
  if (!p || !p.n) L.push('There were no class days to count in this time.');
  else {
    const R = p.rec.filter(r => !isExcused(r.s)), n = p.n, x = p.attended, lastR = R[R.length - 1], prevR = R[R.length - 2];
    let saidAll = false;
    if (p.absent === 0){ saidAll = true; L.push(n >= 3 ? `${F} came to all ${n} classes. Thank you!` : n === 2 ? `${F} came to both classes. Thank you!` : `${F} came to class on ${longDate(R[0].day.dk)}. Thank you!`); }
    else if (x >= 1 && p.full === x) L.push(`When ${F} came to class, ${F} stayed the whole time.`);
    else if (prevR && !lastR.s.isAbsent && prevR.s.isAbsent) L.push(`It was great to see ${F} back in class on ${longDate(lastR.day.dk)}.`);
    else if (x >= 1) L.push(`${F} came to class on ${plural(x, 'day')}. We were glad to see ${F}.`);
    else L.push(`We miss ${F} in class. ${F} is always welcome.`);
    if (!saidAll && x > 0) L.push(`${F} came to ${x} of ${plural(n, 'class', 'classes')}.`);
    if (!p.few && p.dose !== null && p.rate !== null && p.dose <= p.rate - 10) L.push(`${F} was in class for ${p.pres} of ${p.req} minutes.`);
    const fc = withConcern ? familyConcern(ctx) : null;
    if (fc) L.push(fc.concern, fc.ask);
  }
  const sch = familySchedule(ctx); if (sch) L.push(sch);
  L.push('', 'Thank you,');
  if (S.teacherName) L.push(S.teacherName);
  if (S.contactLine) L.push(S.contactLine);
  return L.join('\n');
}
function familyText(ctx){

function footerSection(ctx, o){

/* Copy summary (plain text for an email or a form) and the one-student CSV */
function teamSummary(ctx, inc){

  const L = [`${ctx.name}: intervention attendance`,
    `${period.name ? `${period.name}: ` : ''}${fmtPeriod(period)} · ${plural(p ? p.sessions : 0, 'class day')} with Zoom reports`,
    `Scheduled: ${info.line ? `${info.line} · ${info.weekMin} minutes a week` : 'not on the schedule'}`];
  if (p){
    L.push(p.concern ? `Needs a look: ${p.reasons.map(r => r.short).join('; ')}.` : p.few ? `${fewText(p, period.open)}.` : 'On track.');
    L.push('', desc.lead.join(' '));
    for (const it of desc.items) L.push(`- ${it.text}`);
    if (desc.strength) L.push(`- ${desc.strength}`);
  }
  const held = dates.filter(d => d.status === 'held').length, nc = dates.filter(d => d.status === 'noclass'), ms = dates.filter(d => d.status === 'missing');
  L.push('', `Class days: ${held + nc.length + ms.length} scheduled, ${held} held${nc.length ? `, ${nc.length} not held (${nc.map(d => `${monDay(d.dk)}: ${(NOCLASS_REASONS[(state.data.noClass[d.dk] || {}).reason] || 'other').toLowerCase()}`).join(', ')})` : ''}${ms.length ? `, ${ms.length} without a Zoom report (${ms.map(d => monDay(d.dk)).join(', ')})` : ''}.`);
  if (inc.log){
    const fs = fuSorted(ctx.key).filter(f => f.date >= period.from && f.date <= period.to).reverse();
    L.push('Follow-up:'); if (!fs.length) L.push('- None logged.');

  }

  return L.join('\n');
}
function exportStudent(ctx){
  const notes = state.include.notes;
  const rows = [['Date', 'Day', 'Status', 'Joined', 'Left', 'Instruction minutes present', 'Instruction minutes scheduled', 'Support minutes present',

function versionLabel(i){
  const vs = state.data.scheduleVersions, v = vs[i], next = vs[i + 1], today = todayDk();

  if (!next || next.from > today) return `${v.from ? `Current, since ${monDay(v.from)}` : 'Current'}${next ? ` (until ${end})` : ''}`;
  return v.from ? `${monDay(v.from)} – ${end}` : `Until ${end}`;
}

function scheduleDiff(oldText, newText){

  const added = b.roster.filter(r => !ak.has(r.key)), removed = a.roster.filter(r => !bk.has(r.key));
  const respelled = [];
  for (const r of removed) for (const n of added) if (looksAlike(r.key, n.key)) respelled.push([r.name, n.name]);

}

// A corrected spelling keeps the student's notes, marks and follow-ups.
function renameStudentKey(oldK, newK){
  if (!oldK || !newK || oldK === newK) return;
  const D = state.data;
  for (const bag of [D.notes, D.excused, D.excusedAbsent]) for (const k of Object.keys(bag)){
    const i = k.indexOf('|');
    if (k.slice(i + 1) === oldK){ const nk = k.slice(0, i + 1) + newK; if (!(nk in bag)) bag[nk] = bag[k]; delete bag[k]; }
  }
  if (D.followUps[oldK]){ D.followUps[newK] = [...(D.followUps[newK] || []), ...D.followUps[oldK]]; delete D.followUps[oldK]; }
  for (const z of Object.keys(D.aliases)) if (D.aliases[z] === oldK) D.aliases[z] = newK;
}
const respellText = (text, a, b) => text.split('\n').map(r => r.split('\t').map(c => normKey(c) === normKey(a) ? b : c).join('\t')).join('\n');
function applySchedule(mode, from){
  const vs = state.data.scheduleVersions, text = state.draft;
  if (mode === 'start' && !schedStartOk({ mode, date: from })) return;
  if (mode === 'start'){
    const i = vs.findIndex(v => v.from === from);
    if (i >= 0) vs[i].text = text; else { vs.push({ from, text }); vs.sort((a, b) => a.from.localeCompare(b.from)); }
  } else {
    for (const [a, b] of scheduleDiff(state.data.scheduleText, text).respelled){
      for (const v of vs.slice(0, -1)) v.text = respellText(v.text, a, b);
      renameStudentKey(normKey(a), normKey(b));
    }
    vs[vs.length - 1].text = text;
  }
  vs[0].from = '';
  state.data.scheduleText = vs[vs.length - 1].text;
  state.draft = null; state.schedChange = null; state.viewVersion = null;
  changed(); renderSchedule();
}

document.addEventListener('toggle', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('day')){
    if (el.open){ state.openDays.add(el.dataset.dk); fillDayBody(el); } else state.openDays.delete(el.dataset.dk);
  }
  if (el.dataset && 'familybox' in el.dataset) state.familyOpen = el.open;
  if (el.classList && el.classList.contains('menu') && el.open){
    const pop = el.querySelector('.pop'); pop.style.left = '0'; pop.style.right = 'auto';
    if (pop.getBoundingClientRect().right > innerWidth - 8){ pop.style.left = 'auto'; pop.style.right = '0'; }
  }
}, true);
// The weekly chart is drawn for the width it has; redraw it after a resize or a phone rotation.
let chartTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(chartTimer);
  chartTimer = setTimeout(() => {
    const fig = $('#tab-students .wkchart'), host = $('#tab-students');
    if (!fig || !state.student || !host.clientWidth) return;
    const want = Math.round(Math.max(300, Math.min(680, host.clientWidth - 64))), svg = fig.querySelector('svg');
    if (svg && svg.viewBox.baseVal.width === want) return;
    const ctx = currentCtx(), W = ctx.weeks;
    fig.outerHTML = weekChart(ctx, {}, ctx.info.weekMin || Math.max(0, ...W.map(w => w.counted + w.excFin + w.notHeld + w.noReport)));
  }, 150);
});

// One tooltip for the chart, shown on hover and on keyboard focus. Text goes in with textContent.
function showTip(el){
  const tip = $('#tip'); tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + 'px';
}
const tipOf = t => t && t.closest ? t.closest('[data-tip]') : null;
document.addEventListener('pointerover', e => { const el = tipOf(e.target); if (el) showTip(el); });
document.addEventListener('pointerout', e => { const el = tipOf(e.target); if (el && !el.contains(e.relatedTarget)) $('#tip').hidden = true; });
document.addEventListener('focusin', e => { const el = tipOf(e.target); if (el) showTip(el); });
document.addEventListener('focusout', e => { if (tipOf(e.target)) $('#tip').hidden = true; });
window.addEventListener('scroll', () => { $('#tip').hidden = true; }, { passive: true });

window.addEventListener('popstate', e => {
  const s = e.state || {}, leaving = state.student;
  navSeq = s.seq || 0;
  state.tab = s.tab || 'reports'; state.student = s.student || null; state.studentFrom = s.from || null;
  if (s.range) state.range = s.range;
  state.returnTo = s.returnTo || null; state.highlight = s.highlight || null;
  state.noteEdit = null; state.fuEdit = null; state.fuEditDraft = null;
  render();
  if (state.student){ const h = $('#tab-students h2[tabindex]'); if (h) h.focus({ preventScroll: true }); }
  else if (leaving) focusStudentLink(leaving);
});
$('#folderInput').addEventListener('change', e => { if (e.target.files.length) loadFromInput(e.target.files); });
let closedForPrint = [];
window.addEventListener('beforeprint', () => {
  if (state.tab === 'reports' && !document.body.classList.contains('print-reports')){
    closedForPrint = [...document.querySelectorAll('#tab-reports details.day:not([open])')];
    closedForPrint.forEach(d => { fillDayBody(d); d.open = true; });
  }
  // Ctrl+P on a student report prints the report, not the screen.
  if (state.tab === 'students' && state.student && !document.body.classList.contains('print-reports')){
    const A = state.lastAnalysis || analyze();
    $('#printArea').innerHTML = studentReportHTML(ctxFor(A, state.student, periodOf(A)), { print: true, include: state.include });
    document.body.classList.add('print-reports');
  }
});
window.addEventListener('afterprint', () => {
  document.body.classList.remove('print-reports');
  closedForPrint.forEach(d => { d.open = false; }); closedForPrint = [];
});
window.addEventListener('beforeunload', e => { if (state.dirty && !(state.dirHandle && state.canWrite)){ e.preventDefault(); e.returnValue = ''; } });

(async function init(){
  render(); navReplace();
  if (!HAS_FSA) return;
  const h = await idbGet('dir');
  if (!h) return;
  state.savedHandle = h; renderFolderBar();
  try { if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted'){ state.dirHandle = h; await loadFromHandle(); } } catch (e){}
})();
</script>
</body>
</html>
